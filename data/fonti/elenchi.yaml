    link_bando: ^https://www\.as\.camcom\.it/(notizie/)?bando-[a-z0-9-]+$
    allegato: ['^bando\b', '\bbando\b', '^avviso\b', 'regolamento', 'allegato (a|1)\b', 'determin']
# Camera di commercio Como-Lecco: tra le 20 da sistemare a mano non c'era, ma camere.yaml non la trovava. Pagina
