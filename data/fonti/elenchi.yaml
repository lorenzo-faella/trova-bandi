# Pagine elenco dei bandi, una per fonte. Le legge pipeline/fonti/elenchi.py.
# pagine: indirizzo dell'elenco; {n} = numero di pagina, se l'elenco è diviso in pagine.
# link_bando: espressione regolare che riconosce i link alle pagine dei singoli bandi.
# escludi: link che corrispondono a link_bando ma non sono bandi (pagine di servizio).
# allegato: testo del link al PDF ufficiale del bando, nella pagina del bando.
fonti:
  - id: toscana
    ente: Regione Toscana
    livello: regionale
    regione: Toscana
    pagine: https://www.regione.toscana.it/bandi-aperti?delta=20&start={n}
    link_bando: ^https://www\.regione\.toscana\.it/-/
    escludi: /-/(bandi-di-concorso|accessibilita|posta-elettronica|atti-di-notifica|privacy|cookie|note-legali|dichiarazione|social|urp|contatti)
    allegato: ^(allegato (1|a)\b.*bando|bando\b|testo del bando|avviso\b|allegato a\b|allegato 1\b)
  # Piemonte: filtri del sito per stato (19 = Aperto) e destinatari (1 = Cittadini, 2 = Imprese, 3 = Enti, 4 = Terzo settore).
  - id: piemonte-cittadini
    ente: Regione Piemonte
    livello: regionale
    regione: Piemonte
    pubblico: persone
    pagine: https://bandi.regione.piemonte.it/contributi-finanziamenti?field_stato_target_id=19&field_target_target_id=1&page={n}
    prima_pagina: 0
    link_bando: ^https://bandi\.regione\.piemonte\.it/contributi-finanziamenti/[a-z0-9-]+$
    allegato: ['^bando\b', '^avviso\b', 'testo (del|dell)', '^allegato (a|1)\b', 'determina|deliberazione|d\.d\.|d\.g\.r\.']
  - id: piemonte-imprese
    ente: Regione Piemonte
    livello: regionale
    regione: Piemonte
    pubblico: imprese
    pagine: https://bandi.regione.piemonte.it/contributi-finanziamenti?field_stato_target_id=19&field_target_target_id=2&page={n}
    prima_pagina: 0
    link_bando: ^https://bandi\.regione\.piemonte\.it/contributi-finanziamenti/[a-z0-9-]+$
    allegato: ['^bando\b', '^avviso\b', 'testo (del|dell)', '^allegato (a|1)\b', 'determina|deliberazione|d\.d\.|d\.g\.r\.']
  # Sicilia: f[0]=expired:0 (non scaduti), f[1]=category:22 (avvisi pubblici: niente gare d'appalto né concorsi).
  - id: sicilia
    ente: Regione Siciliana
    livello: regionale
    regione: Sicilia
    pagine: https://www.regione.sicilia.it/istituzioni/servizi-informativi/bandi?f%5B0%5D=expired%3A0&f%5B1%5D=category%3A22&page={n}
    prima_pagina: 0
    link_bando: ^https://www\.regione\.sicilia\.it/istituzioni/servizi-informativi/bandi/[a-z0-9-]+$
    allegato: ['^bando\b', '^avviso\b', '^d\.?d\.?g\.?\b', 'decreto', '^allegato (a|1)\b', '^scarica allegato']  # in Sicilia tutti i link agli allegati si chiamano così: si prende il primo
  # Friuli-Venezia Giulia: la pagina bandi_avvisi elenca solo avvisi sulle concessioni d'acqua (7/11): i contributi
  # stanno nelle pagine di settore, da trovare.
  # Umbria: la pagina "Bandi" del sito mostra in una cornice l'applicazione applicazioni.regione.umbria.it, che elenca
  # i bandi aperti (24 il 7/11). Gli indirizzi hanno un codice di sessione che va tolto; il titolo sta nella pagina.
  - id: umbria
    ente: Regione Umbria
    livello: regionale
    regione: Umbria
    pagine: https://applicazioni.regione.umbria.it/widget/bandi1?p_p_id=bandi_WAR_bandiportlet&p_p_lifecycle=0&p_p_state=maximized&p_p_mode=view&_bandi_WAR_bandiportlet_delta=75
    link_bando: codBando=\d{4}-\d+-\d+
    pulisci_url: ;jsessionid=[^?]+
    titolo_dalla_pagina: true
    allegato: ['bando', 'avviso', '^allegato a\b', 'determinazione|d\.d\.']
  # Calabria: pagina "Bandi e avvisi di gara" filtrata sul tipo "avvisi" (12 voci il 7/11, nessuna gara).
  # Il feed RSS (/feed/?post_type=rc-procedure) dà solo le ultime 10 procedure: utile per vedere le novità.
  # I bandi dei fondi europei stanno anche su calabriaeuropa.regione.calabria.it: da aggiungere.
  - id: calabria
    ente: Regione Calabria
    livello: regionale
    regione: Calabria
    pagine: https://www.regione.calabria.it/bandi-e-avvisi-di-gara/?filter_type=rc_procedure_type_notify
    link_bando: ^https://www\.regione\.calabria\.it/bandi/[a-z0-9-]+/?$
    allegato: ['^bando\b', '^avviso\b', 'avviso', '^allegato (a|1)\b', 'decreto|d\.d\.']
  # Liguria: regione.liguria.it vieta i programmi in robots.txt. Alternative pubbliche: ALFA (agenzia regionale per
  # formazione e lavoro). I bonus per le persone (nidi, caregiver, centri estivi...) li gestisce FILSE, ma il suo
  # portale bandifilse.regione.liguria.it è solo per fare domanda con SPID/CIE: l'elenco sta sul sito della Regione.
  - id: liguria-alfa
    ente: ALFA - Agenzia regionale per il lavoro, la formazione e l'accreditamento (Liguria)
    livello: regionale
    regione: Liguria
    pagine: https://www.alfaliguria.it/bandi-e-avvisi/bandi,-avvisi-e-concorsi/avvisi-pubblici.html
    link_bando: ^https://www\.alfaliguria\.it/bandi-e-avvisi/bandi,-avvisi-e-concorsi/avvisi-pubblici/avvisi-pubblici/.+\.html$
    allegato: ['^avviso\b', 'avviso', '^bando\b', 'allegato (a|1)\b', 'decreto']
  # Marche: tutto regione.marche.it (anche bandi.regione.marche.it) è dietro un captcha anti-robot.
  # Alternativa pubblica: Fondazione Marche Cultura (bandi della Regione per la cultura).
  - id: marche-fmc
    ente: Fondazione Marche Cultura
    livello: regionale
    regione: Marche
    pagine: https://www.fondazionemarchecultura.it/bandi-aperti/
    link_bando: ^https://www\.fondazionemarchecultura\.it/bandi/[a-z0-9-]+/$
    allegato: ['^bando\b', 'bando', '^avviso\b', 'allegato (a|1)\b', 'decreto']
