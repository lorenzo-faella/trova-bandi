    allegato_nome_file: true
    allegato: ['bando', 'avviso', 'regolamento', 'allegato[-_ ]?(a|1)\b']
# Trento e Bolzano (decisione 42): il catalogo dei servizi passa da indirizzi vietati da robots.txt (/opendata, /api,
# /_services), le pagine dei singoli servizi no. Si parte dai bandi aperti che il portale incentivi.gov.it collega a
# questi siti (`dal_portale`): così non si vedono i bandi che il portale non conosce. Il Bollettino regionale
# (bollettino.regione.taa.it/pdf) è vietato da robots.txt; delibere e pagine di ricerca non sono pagine di un bando.
  - id: trento-portale
    ente: Provincia autonoma di Trento
    livello: regionale
    regione: Trentino-Alto Adige
    dal_portale: ^https?://www\.provincia\.tn\.it/(Servizi|Amministrazione)/.
    pausa: 10  # robots.txt ha "Crawl-delay: 10" commentato: lo si rispetta lo stesso
    allegato: ['^bando\b', '\bbando\b', '^avviso\b', 'criteri', 'deliberazione']
  - id: bolzano-portale
    ente: Provincia autonoma di Bolzano
    livello: regionale
    regione: Trentino-Alto Adige
    dal_portale: ^https?://(civis\.bz\.it|mycivis\.civis\.bz\.it|finanze\.provincia\.bz\.it|ambiente\.provincia\.bz\.it|scuola-italiana\.provincia\.bz\.it|mobilitaet\.provinz\.bz\.it|www\.provincia\.bz\.it|giunta-provinciale\.provincia\.bz\.it/it/news)/.
    escludi: /home$|delibere\.asp|/delibere\?
    allegato: ['^bando\b', '\bbando\b', 'criteri', '\bkriterien\b', 'richtlinien']
