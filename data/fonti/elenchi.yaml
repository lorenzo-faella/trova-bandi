# Pagine elenco dei bandi, una per fonte. Le legge pipeline/fonti/elenchi.py.
# pagine: indirizzo dell'elenco; {n} = numero di pagina, se l'elenco è diviso in pagine.
# link_bando: espressione regolare che riconosce i link alle pagine dei singoli bandi.
# escludi: link che corrispondono a link_bando ma non sono bandi (pagine di servizio).
# allegato: testo del link al PDF ufficiale del bando, nella pagina del bando.
fonti:
  - id: toscana
    ente: Regione Toscana
    livello: regionale
    regione: Toscana
    pagine: https://www.regione.toscana.it/bandi-aperti?delta=20&start={n}
    link_bando: ^https://www\.regione\.toscana\.it/-/
    escludi: /-/(bandi-di-concorso|accessibilita|posta-elettronica|atti-di-notifica|privacy|cookie|note-legali|dichiarazione|social|urp|contatti)
    allegato: ^(allegato (1|a)\b.*bando|bando\b|testo del bando|avviso\b|allegato a\b|allegato 1\b)
  # Piemonte: filtri del sito per stato (19 = Aperto) e destinatari (1 = Cittadini, 2 = Imprese, 3 = Enti, 4 = Terzo settore).
  - id: piemonte-cittadini
    ente: Regione Piemonte
    livello: regionale
    regione: Piemonte
    pubblico: persone
    pagine: https://bandi.regione.piemonte.it/contributi-finanziamenti?field_stato_target_id=19&field_target_target_id=1&page={n}
    prima_pagina: 0
    link_bando: ^https://bandi\.regione\.piemonte\.it/contributi-finanziamenti/[a-z0-9-]+$
    allegato: ['^bando\b', '^avviso\b', 'testo (del|dell)', '^allegato (a|1)\b', 'determina|deliberazione|d\.d\.|d\.g\.r\.']
  - id: piemonte-imprese
    ente: Regione Piemonte
    livello: regionale
    regione: Piemonte
    pubblico: imprese
    pagine: https://bandi.regione.piemonte.it/contributi-finanziamenti?field_stato_target_id=19&field_target_target_id=2&page={n}
    prima_pagina: 0
    link_bando: ^https://bandi\.regione\.piemonte\.it/contributi-finanziamenti/[a-z0-9-]+$
    allegato: ['^bando\b', '^avviso\b', 'testo (del|dell)', '^allegato (a|1)\b', 'determina|deliberazione|d\.d\.|d\.g\.r\.']
  # Sicilia: f[0]=expired:0 (non scaduti), f[1]=category:22 (avvisi pubblici: niente gare d'appalto né concorsi).
  - id: sicilia
    ente: Regione Siciliana
    livello: regionale
    regione: Sicilia
    pagine: https://www.regione.sicilia.it/istituzioni/servizi-informativi/bandi?f%5B0%5D=expired%3A0&f%5B1%5D=category%3A22&page={n}
    prima_pagina: 0
    link_bando: ^https://www\.regione\.sicilia\.it/istituzioni/servizi-informativi/bandi/[a-z0-9-]+$
    allegato: ['^bando\b', '^avviso\b', '^d\.?d\.?g\.?\b', 'decreto', '^allegato (a|1)\b', '^scarica allegato']  # in Sicilia tutti i link agli allegati si chiamano così: si prende il primo
  # Friuli-Venezia Giulia: la pagina bandi_avvisi elenca solo avvisi sulle concessioni d'acqua (7/11): i contributi
  # stanno nelle pagine di settore, da trovare.
  # Umbria: la pagina "Bandi" del sito mostra in una cornice l'applicazione applicazioni.regione.umbria.it, che elenca
  # i bandi aperti (24 il 7/11). Gli indirizzi hanno un codice di sessione che va tolto; il titolo sta nella pagina.
  - id: umbria
    ente: Regione Umbria
    livello: regionale
    regione: Umbria
    pagine: https://applicazioni.regione.umbria.it/widget/bandi1?p_p_id=bandi_WAR_bandiportlet&p_p_lifecycle=0&p_p_state=maximized&p_p_mode=view&_bandi_WAR_bandiportlet_delta=75
    link_bando: codBando=\d{4}-\d+-\d+
    pulisci_url: ;jsessionid=[^?]+
    titolo_dalla_pagina: true
    allegato: ['bando', 'avviso', '^allegato a\b', 'determinazione|d\.d\.']
  # Calabria: pagina "Bandi e avvisi di gara" filtrata sul tipo "avvisi" (12 voci il 7/11, nessuna gara).
  # Il feed RSS (/feed/?post_type=rc-procedure) dà solo le ultime 10 procedure: utile per vedere le novità.
  # I bandi dei fondi europei stanno anche su calabriaeuropa.regione.calabria.it: da aggiungere.
  - id: calabria
    ente: Regione Calabria
    livello: regionale
    regione: Calabria
    pagine: https://www.regione.calabria.it/bandi-e-avvisi-di-gara/?filter_type=rc_procedure_type_notify
    link_bando: ^https://www\.regione\.calabria\.it/bandi/[a-z0-9-]+/?$
    allegato: ['^bando\b', '^avviso\b', 'avviso', '^allegato (a|1)\b', 'decreto|d\.d\.']
  # Liguria: regione.liguria.it vieta i programmi in robots.txt. Alternative pubbliche: ALFA (agenzia regionale per
  # formazione e lavoro). I bonus per le persone (nidi, caregiver, centri estivi...) li gestisce FILSE, ma il suo
  # portale bandifilse.regione.liguria.it è solo per fare domanda con SPID/CIE: l'elenco sta sul sito della Regione.
  - id: liguria-alfa
    ente: ALFA - Agenzia regionale per il lavoro, la formazione e l'accreditamento (Liguria)
    livello: regionale
    regione: Liguria
    pagine: https://www.alfaliguria.it/bandi-e-avvisi/bandi,-avvisi-e-concorsi/avvisi-pubblici.html
    link_bando: ^https://www\.alfaliguria\.it/bandi-e-avvisi/bandi,-avvisi-e-concorsi/avvisi-pubblici/avvisi-pubblici/.+\.html$
    allegato: ['^avviso\b', 'avviso', '^bando\b', 'allegato (a|1)\b', 'decreto']
  # Marche: tutto regione.marche.it (anche bandi.regione.marche.it) è dietro un captcha anti-robot.
  # Alternativa pubblica: Fondazione Marche Cultura (bandi della Regione per la cultura).
  - id: marche-fmc
    ente: Fondazione Marche Cultura
    livello: regionale
    regione: Marche
    pagine: https://www.fondazionemarchecultura.it/bandi-aperti/
    link_bando: ^https://www\.fondazionemarchecultura\.it/bandi/[a-z0-9-]+/$
    allegato: ['^bando\b', 'bando', '^avviso\b', 'allegato (a|1)\b', 'decreto']
  # Lazio: i contributi non stanno su regione.lazio.it ("Avvisi e bandi" ha solo gare e concorsi) ma su Lazio Europa
  # (fondi europei e regionali, anche per le persone) e Lazio Innova (imprese). Siti WordPress con filtro per stato.
  - id: lazio-europa
    ente: Regione Lazio - Lazio Europa
    livello: regionale
    regione: Lazio
    pagine: https://www.lazioeuropa.it/bandi/page/{n}/?stati=1
    link_bando: ^https://www\.lazioeuropa\.it/bandi/[a-z0-9-]+/$
    allegato: ['^bando\b', 'bando', '^avviso\b', 'avviso', 'allegato (a|1)\b', 'determinazione|decreto|d\.g\.r']
  - id: lazio-innova
    ente: Lazio Innova
    livello: regionale
    regione: Lazio
    pagine: https://www.lazioinnova.it/bandi/page/{n}/?stati=aperto
    link_bando: ^https://www\.lazioinnova\.it/bandi/[a-z0-9-]+/$
    allegato: ['^bando\b', 'bando', '^avviso\b', 'avviso', 'allegato (a|1)\b', 'determinazione|decreto|d\.g\.r']
  # Abruzzo: il sito della Regione non risponde con un certificato valido; i bandi dei fondi europei stanno su
  # Coesione Abruzzo, che mostra scadenza e stato nel testo del link ("Chiuso" si scarta).
  - id: abruzzo-coesione
    ente: Regione Abruzzo - Coesione Abruzzo
    livello: regionale
    regione: Abruzzo
    pagine: https://coesione.regione.abruzzo.it/avvisi-pubblici?page={n}
    prima_pagina: 0
    link_bando: ^https://coesione\.regione\.abruzzo\.it/avvisi-pubblici/(fse|fesr|fsc)/[^/?#]+$
    escludi_contesto: \bChiuso\b
    allegato: ['^avviso\b', 'avviso', '^bando\b', 'bando', 'allegato (a|1)\b', 'determinazione|d\.g\.r']
  # Campania: bandi del PR FESR 2021-2027 (sito WordPress, categoria "Opportunità e bandi"; senza stato: lo dirà l'estrazione).
  - id: campania-fesr
    ente: Regione Campania - PR FESR 2021-2027
    livello: regionale
    regione: Campania
    pagine: https://prfesr2127.regione.campania.it/category/opportunita-e-bandi/page/{n}/
    link_bando: ^https://prfesr2127\.regione\.campania\.it/20\d\d/\d\d/\d\d/[^/]+/$
    allegato: ['^avviso\b', 'avviso', '^bando\b', 'bando', 'allegato (a|1)\b', 'decreto|d\.d\.']
  # Puglia: regione.puglia.it non ha un elenco leggibile; i bandi stanno su Sistema Puglia, motore di ricerca con fase
  # 2 = "Aperti" (15 misure il 7/11). Risponde solo con l'intestazione Accept (documenti.py la manda sempre).
  - id: puglia
    ente: Regione Puglia - Sistema Puglia
    livello: regionale
    regione: Puglia
    pagine: https://www.sistema.puglia.it/portal/pls/portal/SISPUGLIA.RPT_MOTORE_RICERCA_BANDI.show?p_arg_names=p_testo&p_arg_values=&p_arg_names=p_fase&p_arg_values=2
    link_bando: ^https?://www\.sistema\.puglia\.it/(portal/page/portal/)?SistemaPuglia/[A-Za-z0-9_]+$
    allegato: ['^avviso\b', 'avviso', '^bando\b', 'bando', 'allegato (a|1)\b', 'determinazione|d\.g\.r']
  # Valle d'Aosta: il sito della Regione non ha un elenco unico; le misure per le imprese stanno su imprese.regione.vda.it.
  - id: valle-aosta-imprese
    ente: Regione Autonoma Valle d'Aosta
    livello: regionale
    regione: Valle d'Aosta
    pubblico: imprese
    pagine: [https://imprese.regione.vda.it/agevolazioni/misure-e-agevolazioni/bandi-a-scadenza, https://imprese.regione.vda.it/agevolazioni/misure-e-agevolazioni/misure-e-agevolazioni, https://imprese.regione.vda.it/]
    link_bando: ^https://imprese\.regione\.vda\.it/(bandi|agevolazioni/misure-e-agevolazioni)/[a-z0-9-]+$
    escludi: /(misure-e-agevolazioni|bandi-a-scadenza|archivio)$
    allegato: ['^bando\b', 'bando', '^avviso\b', 'avviso', 'allegato (a|1)\b', 'deliberazione|d\.g\.r']

# --- Finanziarie e agenzie regionali di sviluppo (decisione 37, 7/11) ---
# Gestiscono per conto della Regione molti bandi per le imprese; sul portale stanno quasi tutti a nome della Regione.
# Finlombarda, Trentino Sviluppo e Calabria Europa (dal catalogo di Fincalabra) caricano l'elenco con JavaScript: stanno
# in pipeline/fonti/api_regioni.py.
# Finpiemonte: filtro del sito per stato "Aperto" (20 misure su 222 il 7/11); gli altri stati (in scadenza, prorogato,
# in attivazione) erano vuoti. Ogni misura ha due link, il titolo e "DETTAGLI".
  - id: finpiemonte
    ente: Finpiemonte
    livello: regionale
    regione: Piemonte
    pagine: https://www.finpiemonte.it/agevolazioni?field_stato_value=aperto
    link_bando: ^https://www\.finpiemonte\.it/agevolazioni/[A-Za-z0-9_-]+$
    allegato: ['^bando\b', '^avviso pubblico', '^disposizioni', '^testo', 'd\.?g\.?r|deliberazione']
  # Finaosta: non pubblica bandi a scadenza ("Bandi e avvisi" ha solo un partenariato pubblico-privato), ma i mutui
  # agevolati della Regione, sempre aperti: prima casa, imprese, agricoltura... (15 il 7/11).
  - id: finaosta
    ente: Finaosta
    livello: regionale
    regione: Valle d'Aosta
    pagine: https://www.finaosta.com/servizi/
    link_bando: ^https://www\.finaosta\.com/servizi/[a-z0-9-]+/$
    allegato: ['^mutuo', 'regolamento', 'deliberazione|d\.g\.r']  # la scheda PDF del mutuo ha il suo nome
  # Veneto Sviluppo: dal 2026 l'area agevolazioni è passata a Veneto Innovazione (agevolazioni.venetoinnovazione.it).
  # Le misure attive stanno in cinque pagine (Joomla); "Misure sospese/chiuse" non si legge.
  - id: veneto-innovazione
    ente: Veneto Innovazione (ex Veneto Sviluppo, area agevolazioni)
    livello: regionale
    regione: Veneto
    pubblico: imprese
    pagine: [https://agevolazioni.venetoinnovazione.it/index.php/finanza-agevolata/finanziamenti, https://agevolazioni.venetoinnovazione.it/index.php/finanza-agevolata/contributi, https://agevolazioni.venetoinnovazione.it/index.php/finanza-agevolata/garanzie-agevolate, https://agevolazioni.venetoinnovazione.it/index.php/finanza-agevolata/fondo-di-partecipazione-pr-veneto-fesr-2021-2027, https://agevolazioni.venetoinnovazione.it/index.php/finanza-agevolata/accordo-per-la-coesione-regione-del-veneto-2021-2027, https://agevolazioni.venetoinnovazione.it/index.php/finanza-agevolata/altre-iniziative]
    link_bando: 'view=article&id=\d+:'
    escludi: accessibilita|privacy|cookie|catid=2$
    allegato: ['^bando\b', '\bbando\b', '^avviso\b', 'disciplinare|regolamento', 'd\.?g\.?r|deliberazione']
  # FILSE (Liguria): l'elenco "Bandi attivi" si carica con uno script in /components/, cartella vietata da robots.txt.
  # Si leggono i bandi in evidenza nella home e in "In apertura": è una copertura parziale (⚠ da-fare, sezione 5).
  - id: filse
    ente: FILSE - Finanziaria Ligure per lo Sviluppo Economico
    livello: regionale
    regione: Liguria
    pagine: [https://www.filse.it/, https://www.filse.it/in-apertura/]
    link_bando: ^https://www\.filse\.it/it/[a-z0-9-]+(/[a-z0-9-]+)*/publiccompetition/\d+:[^/]+\.html$
    titolo_dalla_pagina: true
    titolo_da: '^(.+?)\s*-\s*Filse$'  # nel <title>: la prima riga del testo è "Aggiungi al calendario"
    # I link agli allegati dicono tutti "Download": conta il nome del file.
    allegato_nome_file: true
    allegato: ['bando', 'avviso', 'allegato[-_ ]?(a|1)\b', 'decreto|delibera']
  # ART-ER (Emilia-Romagna): "Contributi e vantaggi economici", procedure in corso. "Altri avvisi" (sponsor, elenchi
  # di esperti) e "Acquisizione di beni e servizi" (gare) non si leggono. Gli avvisi stanno su Google Drive, che dà
  # una pagina di anteprima e non il PDF: per ora si tiene solo il testo della pagina.
  - id: art-er
    ente: ART-ER Attrattività Ricerca Territorio
    livello: regionale
    regione: Emilia-Romagna
    pagine: https://www.art-er.it/avvisi-e-gare/contributi-e-vantaggi-economici?procedure=incorso&page={n}
    prima_pagina: 0
    link_bando: ^https://www\.art-er\.it/avvisi-e-gare/contributi-e-vantaggi-economici/[^/?#]+$
    allegato: ['^avviso\b', '\bavviso\b', '^bando\b', '\bbando\b', 'regolamento', 'determina']
  # Sviluppo Toscana: filtro del sito per stato "aperto" (40 il 7/11, 12 per pagina). Più della metà sono fasi di bandi
  # già chiusi, aperte solo per chi ha già il contributo (varianti, rendicontazione): si scartano dal titolo.
  - id: sviluppo-toscana
    ente: Sviluppo Toscana
    livello: regionale
    regione: Toscana
    pubblico: imprese
    pagine: https://www.sviluppo.toscana.it/bandi/?_stato=aperto&_paged={n}
    link_bando: ^https://www\.sviluppo\.toscana\.it/bando/[^/]+/$
    escludi_testo: varianti|rendicontaz|esecutivi
    allegato: ['^bando\b', '\bbando\b', '^avviso\b', '\bavviso\b', 'allegato (a|1)\b', 'decreto']
  # Gepafin (Umbria): una sola pagina con tutti i bandi, anche vecchi, senza stato; i link dicono solo "Per maggiori
  # informazioni", il titolo si prende dal <title> della pagina del bando ("BANDO STEP 2026 - Gepafin").
  - id: gepafin
    ente: Gepafin
    livello: regionale
    regione: Umbria
    pubblico: imprese
    pagine: https://gepafin.it/servizi/prestiti-diretti/
    link_bando: ^https://gepafin\.it/servizi/(prestiti-diretti/)?[A-Za-z0-9-]+/+$
    escludi: /servizi/(prestiti-diretti|attivita-a-valere-su-fondi-(propri|di-terzi))/$
    titolo_dalla_pagina: true
    titolo_da: '^(.+?) - Gepafin$'
    allegato: ['^bando\b', '\bbando\b', '^avviso\b', '\bavviso\b', 'regolamento']
  # Sviluppumbria: la pagina "Avvisi pubblici" si carica con JavaScript; la home mostra gli avvisi recenti (parziale).
  - id: sviluppumbria
    ente: Sviluppumbria
    livello: regionale
    regione: Umbria
    pagine: https://www.sviluppumbria.it/
    link_bando: ^https://www\.sviluppumbria\.it/-/avviso
    escludi: graduatori|selezione-pubblica|personale|consiglio-di-amministrazione
    allegato: ['^avviso\b', '\bavviso\b', '^bando\b', '\bbando\b', 'allegato (a|1)\b', 'determin']
  # Finmolise: gli "avvisi" sono gare e incarichi; le agevolazioni sono pagine di prodotto, sempre aperte. Si prendono
  # dal menu della home quelle in corso (non i fondi Covid né i programmi 2007-2020).
  - id: finmolise
    ente: Finmolise
    livello: regionale
    regione: Molise
    pubblico: imprese
    pagine: https://www.finmolise.it/
    link_bando: ^https://www\.finmolise\.it/(garanzia-diretta-finmolise|pr-molise-fesr-2021-2027|startup-in-progress|capitalizzazione-cooperative)\.html$
    allegato_nome_file: true  # i link agli allegati sono icone senza testo
    allegato: ['bando', 'avviso', 'regolamento', 'piano', 'fg-inf|foglio']
  # Puglia Sviluppo: una pagina per tipo di impresa (micro, piccole, medie, grandi, turistiche), più creazione d'impresa,
  # Just Transition Fund (Taranto) e misure straordinarie. Ogni pagina raccoglie 1-3 misure (PIA, MiniPIA, NIDI…)
  # con l'avviso più recente in cima. Molte non sono tra le misure "aperte" di Sistema Puglia.
  - id: puglia-sviluppo
    ente: Puglia Sviluppo
    livello: regionale
    regione: Puglia
    pubblico: imprese
    pagine: [https://www.pugliasviluppo.eu/, https://www.pugliasviluppo.eu/it/finanziamenti-per-lo-sviluppo-aziendale, https://www.pugliasviluppo.eu/it/finanziamenti-per-lo-sviluppo-aziendale-nel-settore-turistico]
    link_bando: ^https://www\.pugliasviluppo\.eu/(it/(finanziamenti-per-la-creazione-di-impresa|Just-Transition-Fund-Avvisi-per-la-provincia-di-Taranto|finanziamenti-straordinari)|sviluppo-aziendale-[a-z-]+)$
    allegato: ['^avviso e determina', '^avviso\b', '^determina e avviso', '\bavviso\b', '^scheda']
  # IRFIS FinSicilia: categoria WordPress "Avvisi aperti" (misure regionali per imprese e persone, anche il prestito
  # d'onore per gli studenti).
  - id: irfis
    ente: IRFIS FinSicilia
    livello: regionale
    regione: Sicilia
    pagine: https://www.irfis.it/category/articoli-misure-aperte/page/{n}/
    solo_contenuto: true
    link_bando: ^https://www\.irfis\.it/[a-z0-9-]+/$
    escludi: /(la-nostra-storia|organi-amministrativi|sostenibilita|agricoltura|fondo-sicilia|lavora-con-noi|albo-[a-z-]+|associazioni-di-categoria-e-confidi|richiesta-tirocini|long-list|atti-di-notifica-per-pubblici-proclami|accessibilita)/$
    # Il PDF dell'avviso è il link con il logo, che si legge "IRFIS FINSICILIA".
    allegato: ['^avviso\b', '\bavviso\b', '^bando\b', '\bbando\b', 'allegato (a|1)\b', 'decreto|d\.d\.', '^i?rfis finsicilia$']
  # SFIRS (Sardegna): "Bandi per le imprese" (WordPress), senza stato. "Bandi e concorsi" e "Gare" non si leggono.
  # Per i documenti ufficiali le pagine rimandano al sito della Regione, che raccogliamo già (api_regioni, sardegna).
  - id: sfirs
    ente: SFIRS
    livello: regionale
    regione: Sardegna
    pubblico: imprese
    pagine: https://www.sfirs.it/bandi/bandi-per-le-imprese/page/{n}/
    solo_contenuto: true
    link_bando: ^https://www\.sfirs\.it/[a-z0-9-]+(/[a-z0-9-]+)*/$
    escludi: /(bandi|bandi/bandi-per-le-imprese|category/[a-z-]+|notizie|sardinia-fintech|contratti-di-investimento-4|note-legali|glossario-dei-termini-tecnici|page/\d+)/$
    allegato: ['^avviso\b', '\bavviso\b', '^bando\b', '\bbando\b', 'regolamento', 'determin']
  # Sardegna Ricerche: bandi "in corso" (scaduti=0), 100 per pagina; il link dice "Visualizza i documenti (N)", il
  # titolo sta nella pagina dopo "Oggetto:" (opzione titolo_da). Le gare stanno in un altro elenco.
  - id: sardegna-ricerche
    ente: Sardegna Ricerche
    livello: regionale
    regione: Sardegna
    pagine: https://www.sardegnaricerche.it/index.php?xsl=558&tipodoc=3&esito=0&scaduti=0&v=9&s=13&c=4200&c1=4200&n=100&nc=1
    link_bando: ^https://www\.sardegnaricerche\.it/index\.php\?xsl=558&tipodoc=3&esito=0&scaduti=0&s=13&v=9&c=4200&c1=4200&id=\d+&va=$
    titolo_dalla_pagina: true
    titolo_da: '^Oggetto:\s*(.+)$'
    allegato: ['^bando\b', '^avviso pubblico', '\bavviso\b', '^disposizioni attuative', 'regolamento']

# --- Regioni senza raccolta (decisione 38) ---
# Friuli-Venezia Giulia: nessun elenco unico ("Bandi e avvisi" ha solo le concessioni d'acqua). Ogni settore del sito
# elenca le sue "foglie" (FOGLIAn): si leggono le pagine di settore di tutte le aree e si tengono le foglie il cui titolo
# nomina un bando, un avviso, un anno dal 2025 o il programma 2021-2027 (opzione testo_bando): le altre sono linee
# storiche o pagine informative ("Affittacamere"). Con il filtro largo ("contributi", "incentivi") erano 541 foglie:
# un'ora di download su un solo sito, troppo; le altre si possono aggiungere a lotti nei giorni successivi.
  - id: fvg
    ente: Regione Autonoma Friuli Venezia Giulia
    livello: regionale
    regione: Friuli-Venezia Giulia
    pagine:
      - https://www.regione.fvg.it/rafvg/cms/RAFVG/economia-imprese/artigianato/
      - https://www.regione.fvg.it/rafvg/cms/RAFVG/economia-imprese/commercio-terziario/
      - https://www.regione.fvg.it/rafvg/cms/RAFVG/economia-imprese/cooperative/
      - https://www.regione.fvg.it/rafvg/cms/RAFVG/economia-imprese/industria/
      - https://www.regione.fvg.it/rafvg/cms/RAFVG/economia-imprese/rilancimpresa/
      - https://www.regione.fvg.it/rafvg/cms/RAFVG/economia-imprese/sviluppoimpresa/
      - https://www.regione.fvg.it/rafvg/cms/RAFVG/economia-imprese/turismo/
      - https://www.regione.fvg.it/rafvg/cms/RAFVG/economia-imprese/agricoltura-foreste/
      - https://www.regione.fvg.it/rafvg/cms/RAFVG/economia-imprese/agricoltura-foreste/foreste/
      - https://www.regione.fvg.it/rafvg/cms/RAFVG/economia-imprese/agricoltura-foreste/psr-programma-sviluppo-rurale/
      - https://www.regione.fvg.it/rafvg/cms/RAFVG/economia-imprese/montagna/
      - https://www.regione.fvg.it/rafvg/cms/RAFVG/economia-imprese/pesca-acquacoltura/
      - https://www.regione.fvg.it/rafvg/cms/RAFVG/formazione-lavoro/formazione/
      - https://www.regione.fvg.it/rafvg/cms/RAFVG/formazione-lavoro/lavoro/
