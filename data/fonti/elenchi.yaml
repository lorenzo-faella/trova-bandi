    testo_bando: \bband[oi]\b|\bavvis[oi]\b|202[5-7]|2021-2027|pnrr|voucher|bonus|carta famiglia
    escludi_testo: 2014-2020|2007-2013|2014/2020|chius[oi]|graduatori|scadut
    allegato_nome_file: true
    allegato: ['^bando\b', '\bbando\b', '^avviso\b', '\bavviso\b', 'regolamento', 'allegato[-_ ]?(a|1)\b', 'decreto|delibera|dpreg']
# Marche: la Regione è dietro captcha; il Fondo Nuovo Credito ha un sito suo (Credito Futuro Marche, WordPress).
# Il 7/11 "Nessun bando attivo" (nuove domande sospese dal 26/03/2026): si tiene per accorgersi quando riapre.
  - id: marche-credito-futuro
    ente: Credito Futuro Marche (Fondo Nuovo Credito, Regione Marche)
    livello: regionale
    regione: Marche
    pubblico: imprese
    pagine: https://www.creditofuturomarche.it/category/bandi-attivi/
    solo_contenuto: true
    link_bando: ^https://www\.creditofuturomarche\.it/[a-z0-9-]+/$
    escludi: /(bandi-aperti|bandi-chiusi|news|contatti|chi-siamo|category/[a-z-]+)/$
    allegato: ['^bando\b', '\bbando\b', '^avviso\b', '\bavviso\b', 'allegato (a|1)\b', 'decreto']

# --- Agenzie per il lavoro e la formazione (decisione 38) ---
# Veneto Lavoro (ClicLavoro Veneto): bandi del Fondo regionale disabili e incentivi all'assunzione, per persone e imprese.
  - id: veneto-lavoro
    ente: Veneto Lavoro
    livello: regionale
    regione: Veneto
    # Senza solo_contenuto: i titoli brevi ("Voucher patente") resterebbero fuori dalla regola dei 20 caratteri.
    pagine: [https://www.cliclavoroveneto.it/bandi-fondo-regionale-disabili, https://www.cliclavoroveneto.it/incentivi-assunzione, https://www.cliclavoroveneto.it/incentivi-assunzione-persone-con-disabilita]
    link_bando: ^https://www\.cliclavoroveneto\.it/((bando|voucher|transizioni|incentiv)[a-z0-9-]*|-/[a-z0-9%-]+)$
    escludi: /(incentivi-assunzione|incentivi-assunzione-persone-con-disabilita)$
    allegato_nome_file: true
    allegato: ['^bando\b', '\bbando\b', '^avviso\b', '\bavviso\b', 'allegato[-_ ]?(a|1)\b', 'decreto|dgr']
# INAIL: incentivi alle imprese per la sicurezza sul lavoro. È un ente nazionale, ma il portale ripete il bando ISI
# una volta per regione (20 delle 41 voci "lavoro e formazione"): qui è un documento solo. Gli ISI fino al 2023 sono chiusi.
  - id: inail
    ente: INAIL - Istituto nazionale per l'assicurazione contro gli infortuni sul lavoro
    livello: nazionale
    pubblico: imprese
    pagine: https://www.inail.it/portale/prevenzione-e-sicurezza/it/prevenzione-e-sicurezza/finanziamenti-per-la-sicurezza/incentivi-alle-imprese.html
    link_bando: /incentivi-alle-imprese/[A-Za-z0-9-]+\.html$
    escludi: /([Bb]ando-isi-(20(1\d|2[0-3])|agricoltura-[\d-]+)|storico-bando-isi)\.html$
    allegato: ['^bando\b', '\bbando\b', '^avviso\b', '\bavviso\b', 'allegato (a|1)\b']
# ASPAL (Agenzia sarda per le politiche attive del lavoro): "Avvisi pubblici" è un archivio senza stato, dal più recente.
# Si leggono gli ultimi 40 (circa un anno); i più vecchi sono quasi tutti chiusi. Stesso programma di Sardegna Ricerche.
  - id: sardegna-aspal
    ente: ASPAL - Agenzia sarda per le politiche attive del lavoro
    livello: regionale
    regione: Sardegna
    pagine: https://agenziaregionaleperillavoro.regione.sardegna.it/j/v/2362?v=9&c=14207&c1=4920&n=40&o=&b=&s=44&p=0
    link_bando: ^https://agenziaregionaleperillavoro\.regione\.sardegna\.it/j/v/2362\?s=44&v=9&c=14207&c1=4920&id=\d+(&b=)?$
    escludi_testo: albo pretorio|indagine di mercato|cessione gratuita|autoscuol
    allegato: ['^avviso\b', '\bavviso\b', '^bando\b', '\bbando\b', 'allegato (a|1)\b', 'determinazione']
# Valle d'Aosta Lavoro: "Elenco bandi e avvisi" (solo quelli aperti, con la scadenza). I link hanno href="#" e
# l'indirizzo dentro onclick="ApriSchedaBando(event, 'iniziative-in-atto/...')" (opzione link_js). Lo stesso elenco
# ha concorsi e selezioni di personale: si scartano dal titolo.
  - id: valle-aosta-lavoro
    ente: Regione Autonoma Valle d'Aosta - Dipartimento politiche del lavoro e della formazione
    livello: regionale
    regione: Valle d'Aosta
    pagine: https://lavoro.regione.vda.it/bandi-e-avvisi/bandi-e-avvisi
    link_js: ApriSchedaBando\(event,\s*'([^']+)'\)
    link_bando: ^https://lavoro\.regione\.vda\.it/iniziative-in-atto/[a-z0-9-]+$
    escludi_testo: concors|selezion|graduatori|incaric|mobilit|personale|reclutament|assunzione a tempo|manifestazione di interesse per la copertura
    allegato: ['^avviso\b', '\bavviso\b', '^bando\b', '\bbando\b', 'allegato (a|1)\b', 'deliberazione|provvedimento']
# Camera di commercio Arezzo-Siena: non era tra le Camere ricavate dal portale (camere.yaml). I bandi stanno tra le
# notizie della categoria "Contributi e finanziamenti" (Drupal, una pagina per numero).
  - id: camera-as
    ente: Camera di Commercio Arezzo Siena
    livello: camera di commercio
    regione: Toscana
    pubblico: imprese
    pagine: https://www.as.camcom.it/notizie?combine=&field_notizia_categoria_tid=195&page={n}
