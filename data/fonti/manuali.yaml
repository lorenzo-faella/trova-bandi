# Bandi salvati a mano da una persona, per i siti che rifiutano i programmi (decisione 49): Comune di Milano,
# Milano Abitare, Regione Marche (captcha). Si apre il bando nel browser, si salva il PDF (o la pagina con
# "Salva come", formato HTML) in data/raw/manuali/, e si aggiunge una voce qui. Poi: python -m pipeline.fonti.manuali
# Esempio:
#  - id: milano-scegli-mi-2026
#    titolo: "scegliMI: contributo affitto per lavoratori under 35"
#    ente: Comune di Milano
#    livello: comunale
#    regione: Lombardia
#    comune: Milano
#    pubblico: persone
#    url: <indirizzo della pagina del bando>
#    file: milano-scegli-mi-2026.pdf
#    salvato: 2026-11-09
documenti:
  # Salvati da Edoardo il 20/11 (decisione 81). Gli indirizzi esatti delle pagine non si trovano con una ricerca:
  # il collegamento è il sito di Milano Abitare, da sostituire con la pagina del bando.
  - id: milano-sostegno-affitto-giovani-lavoratori-2026
    titolo: "Sostegno affitto per giovani lavoratori (Comune di Milano e Milano Abitare)"
    ente: Comune di Milano
    livello: comunale
    regione: Lombardia
    comune: Milano
    pubblico: persone
    url: https://www.milanoabitare.org/#sostegno-affitto-giovani-lavoratori
    file: milano-sostegno-affitto-giovani-lavoratori-2026.pdf
    salvato: '2026-11-20'
  - id: milano-morosita-incolpevole-2026
    titolo: "Contributi agli inquilini morosi incolpevoli nel libero mercato (Comune di Milano), scadenza 31/12/2026"
    ente: Comune di Milano
    livello: comunale
    regione: Lombardia
    comune: Milano
    pubblico: persone
    url: https://www.milanoabitare.org/#morosita-incolpevole-2026
    file: milano-morosita-incolpevole-2026.pdf
    salvato: '2026-11-20'
# Salvati il 20/11 ma non importati: "Sostegno affitto genitori 2023" (chiuso nel 2023), la guida "Salva Affitto" (non è un
# bando), l'avviso Demenze del Comune di Milano (per gli enti del Terzo settore), i tre PDF della Regione Marche (incentivi
# alle imprese che assumono: il ramo imprese della demo legge incentivi.gov.it, non i documenti; uno è del 2018).

# DA SALVARE A MANO (Edoardo; Claude te lo ricorda finché la lista non è vuota). Circa 25 file, 1-2 minuti l'uno.
# Per ognuno: apri il link nel browser, salva il PDF del bando (o la pagina con "Salva come" > HTML) in
# data/raw/manuali/, poi sposta la voce in `documenti:` qui sopra con id, titolo, ente, livello, regione,
# comune, pubblico, url, file e salvato (la data). Alla fine: python -m pipeline.fonti.manuali
da_salvare:
  # Comune di Milano (il sito rifiuta i programmi): sezione bandi e avvisi per i cittadini. Salva quelli APERTI per
  # le persone: scegliMI (contributo affitto under 35), altri contributi per l'affitto, bandi per alloggi, bonus.
  - {ente: Comune di Milano, url: 'https://www.comune.milano.it', cosa: 'bandi aperti per le persone (circa 10)'}
  - {ente: Milano Abitare, url: 'https://www.milanoabitare.org', cosa: 'avvisi aperti per affitto e casa'}
  # Grandi comuni che i programmi non possono leggere (decisione 82)
  - {ente: Roma Capitale, url: 'https://www.comune.roma.it/web/it/bandi-e-concorsi.page?tem=contintervsostabit&tem=casa&tipo=tipologia_bec_bando', cosa: 'contributo affitto (ultimo: 25/5-24/7/2026, ISEE fino a 14.000 euro) e altri bandi per le persone'}
