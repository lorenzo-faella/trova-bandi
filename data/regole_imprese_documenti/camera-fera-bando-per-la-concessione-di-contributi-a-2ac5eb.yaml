id: camera-fera-bando-per-la-concessione-di-contributi-a-2ac5eb
titolo: Bando per la concessione di contributi alle imprese localizzate o che intendano insediarsi nel perimetro dell'Hub
  di Prossimità – area GAD e via Bologna del Comune di Ferrara
ente: Camera di Commercio Industria Artigianato e Agricoltura di Ferrara e Ravenna
link: https://www.fera.camcom.it/bandi/bando-la-concessione-di-contributi-hub-prossimita-ferrara
apertura: '2026-11-06'
chiusura: '2027-01-22'
fonte: documento Camera di Commercio Industria Artigianato e Agricoltura di Ferrara e Ravenna, estrazione leggera per imprese
  ed enti con LLM (Claude Code, claude-opus-5-5), non rivista
pubblico: imprese
ultimo_controllo: '2026-11-21'
requisiti:
- campo: tipologia
  operatore: interseca
  valori:
  - Impresa
  citazione: Sono ammissibili alle agevolazioni di cui al presente bando le imprese che
  fonte: Camera di Commercio di Ferrara e Ravenna, documento
- campo: dimensione
  operatore: in
  valori:
  - Microimpresa
  - Piccola Impresa
  citazione: a) essere micro o piccole imprese secondo i criteri riportati nell’allegato I del Regolamento (UE) n. 651 del
    17 giugno 2014;
  fonte: Camera di Commercio di Ferrara e Ravenna, documento
- campo: regione
  operatore: in
  valori:
  - Emilia-Romagna
  citazione: per la costituzione degli hub del commercio e dei servizi del Comune di Ferrara
  fonte: Camera di Commercio di Ferrara e Ravenna, documento
- campo: comune
  operatore: in
  valori:
  - Ferrara
  citazione: per la costituzione degli hub del commercio e dei servizi del Comune di Ferrara
  fonte: Camera di Commercio di Ferrara e Ravenna, documento
- non_modellabile: Sede o unità locale oggetto dell'intervento nell'Hub di prossimità (area GAD e via Bologna)
  citazione: b) avere la sede legale operativa e/o unità locale operativa, oggetto dell’intervento, insediate all’interno
    dell’Hub interessato;
  fonte: Camera di Commercio di Ferrara e Ravenna, documento
- non_modellabile: Adesione all'accordo di partenariato dell'Hub
  citazione: La mancanza di tale adesione sarà ostativa alla concessione del contributo.
  fonte: Camera di Commercio di Ferrara e Ravenna, documento
- non_modellabile: In regola con i tributi comunali al 31/12/2025
  citazione: h) essere in regola, alla data del 31/12/2025, con il pagamento dei tributi comunali
  fonte: Camera di Commercio di Ferrara e Ravenna, documento
note:
- Ammesse anche imprese di nuovo insediamento o costituzione che avviano l'attività nell'Hub prima della rendicontazione.
