id: camera-bs-bandi-chiusi-ce0461
titolo: Bandi chiusi
ente: Camera di Commercio, Industria, Artigianato e Agricoltura di Brescia
link: https://bs.camcom.it/bandi-e-contributi/bandi-di-contributo-camerali/bandi-chiusi
apertura: '2026-01-01'
