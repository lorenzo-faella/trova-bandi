pubblico: imprese
ultimo_controllo: '2026-11-21'
requisiti:
- campo: tipologia
  operatore: interseca
  valori:
  - Impresa
  - Consorzio
  - Rete d'impresa
  citazione: giugno 2014 - i loro Consorzi e Cooperative (**), e le reti di imprese, costituite prevalentemente da
  fonte: Camera di Commercio, Industria, Artigianato e Agricoltura di Brescia, documento
- campo: dimensione
  operatore: in
  valori:
  - Microimpresa
  - Piccola Impresa
  - Media Impresa
  citazione: le micro, piccole e medie imprese bresciane di tutti i settori
  fonte: Camera di Commercio, Industria, Artigianato e Agricoltura di Brescia, documento
- campo: regione
  operatore: in
  valori:
  - Lombardia
  citazione: abbiano sede legale e/o unità operativa nella provincia di Brescia
  fonte: Camera di Commercio, Industria, Artigianato e Agricoltura di Brescia, documento
- non_modellabile: Sede legale o unità operativa in provincia di Brescia, iscritte al Registro Imprese e al REA della CCIAA
    di Brescia
  citazione: abbiano sede legale e/o unità operativa nella provincia di Brescia
  fonte: Camera di Commercio, Industria, Artigianato e Agricoltura di Brescia, documento
- non_modellabile: Contributo legato a fiere estere o servizi di internazionalizzazione con contratto di adesione a Pro Brixia
  citazione: L'impresa, per partecipare alla fiera e/o usufruire di servizi per l'internazionalizzazione organizzati da Pro
  fonte: Camera di Commercio, Industria, Artigianato e Agricoltura di Brescia, documento
note:
- Le date sono il periodo di validità del bando; la domanda va presentata entro 2 mesi prima della fiera o 30 giorni dal contratto
  con Pro Brixia.
