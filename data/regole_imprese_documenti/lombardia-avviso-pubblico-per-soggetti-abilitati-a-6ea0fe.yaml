  fonte: Regione Lombardia, documento
- campo: settore
  operatore: interseca
  valori:
  - Commercio
  citazione: 'Iscrizione nel Registro delle Imprese per attività riconducibili al commercio/intermediazione di veicoli individuati
    dai seguenti codici ATECO (anche solo come attività secondaria):'
  fonte: Regione Lombardia, documento
- campo: ateco_2025
  operatore: prefisso
  valori:
  - 45.11.01
  - 45.11.02
  citazione: 'Iscrizione nel Registro delle Imprese per attività riconducibili al commercio/intermediazione di veicoli individuati
    dai seguenti codici ATECO (anche solo come attività secondaria):'
  fonte: Regione Lombardia, documento
- non_modellabile: Esclusi venditori sanzionati in passato da Regione Lombardia per dichiarazioni non veritiere
  citazione: Non essere stati destinatari, nell’ambito delle precedenti misure di incentivazione per il rinnovo del parco
    veicolare, di provvedimenti sanzionatori da parte di Regione Lombardia per aver prodotto documenti/dichiarazioni non veritieri.
  fonte: Regione Lombardia, documento
note:
- Avviso di abilitazione dei venditori di veicoli agli incentivi regionali, non un contributo diretto
- Codici ATECO come scritti nel bando (classificazione 2007)
