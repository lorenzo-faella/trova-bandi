id: lazio-innova-atelier-dellimmaginario-11d8b6
titolo: Atelier dell’Immaginario
ente: Lazio Innova
link: https://www.lazioinnova.it/bandi/atelier-dellimmaginario/
apertura: '2026-11-03'
chiusura: '2026-12-03'
fonte: documento Lazio Innova, estrazione leggera per imprese ed enti con LLM (Claude Code, claude-opus-5-5), non rivista
pubblico: imprese
ultimo_controllo: '2026-11-21'
requisiti:
- campo: tipologia
  operatore: interseca
  valori:
  - Impresa
  - Cooperative/Associazioni Non Profit
  citazione: sono iscritti al Registro delle Imprese Italiano, al Registro Unico Nazionale del Terzo Settore o al Registro
    delle Persone Giuridiche Private nazionale o della Regione Lazio.
  fonte: Lazio Innova, documento
- campo: dimensione
  operatore: in
  valori:
  - Microimpresa
  - Piccola Impresa
  - Media Impresa
  citazione: 'I Beneficiari sono le PMI che alla data della domanda:'
  fonte: Lazio Innova, documento
- non_modellabile: Ricavi da organizzazione di attività culturali, esposizioni ed eventi di almeno 2 milioni di euro
  citazione: avere ricavi e proventi specifici per organizzazione di attività culturali, esposizioni ed eventi non inferiori
    a 2 milioni di euro
  fonte: Lazio Innova, documento
- non_modellabile: Dotati di un Organo di Controllo
  citazione: sono formalmente dotati di un Organo di Controllo.
  fonte: Lazio Innova, documento
- non_modellabile: Esclusi soggetti partecipati oltre il 25% da enti pubblici
  citazione: Sono in ogni caso esclusi soggetti partecipati direttamente o indirettamente, per oltre il 25% delle quote o
    dei diritti di voto, da uno o più Enti Pubblici.
  fonte: Lazio Innova, documento
note:
- Duplicato dello stesso avviso pubblicato da Lazio Europa
- Formulario disponibile dal 20 ottobre 2026, invio dal 3 novembre al 3 dicembre 2026
