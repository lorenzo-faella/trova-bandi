- non_modellabile: Imprese colpite dalla crisi legata all'aggressione russa all'Ucraina (se ATECO non nell'allegato F)
  citazione: 'l''Ucraina per aver subito, direttamente o indirettamente, almeno uno dei seguenti effetti:'
