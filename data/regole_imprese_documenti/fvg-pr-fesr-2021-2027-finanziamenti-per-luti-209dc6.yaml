  fonte: Regione Autonoma Friuli Venezia Giulia, documento
- campo: regione
  operatore: in
  valori:
  - Friuli-Venezia Giulia
  citazione: unità locale/sede secondaria attiva nel territorio regionale, anche costituite in forma di
