requisiti:
- campo: tipologia
  operatore: interseca
  valori:
  - Cooperative/Associazioni Non Profit
  - Impresa
  citazione: le organizzazioni imprenditoriali che possiedono i requisiti prescritti dal D.M. 4/8/2011 n. 156
  fonte: Camera di Commercio di Modena, documento
- non_modellabile: Organizzazioni imprenditoriali (o loro società di servizi) operanti per le imprese della provincia di Modena,
