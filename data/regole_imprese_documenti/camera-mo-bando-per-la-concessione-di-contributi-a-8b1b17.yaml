ente: Camera di Commercio, Industria, Artigianato e Agricoltura di Modena
link: https://www.mo.camcom.it/promozione/contributi-camerali/bandi/bando-per-la-concessione-di-contributi-a-iniziative-di-marketing-territoriale-anno-2026
