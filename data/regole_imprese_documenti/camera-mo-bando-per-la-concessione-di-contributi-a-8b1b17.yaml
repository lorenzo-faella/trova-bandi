  citazione: operanti a favore delle imprese della provincia di Modena;
  fonte: Camera di Commercio di Modena, documento
- non_modellabile: Esclusi persone fisiche, professionisti ed enti pubblici
  citazione: le persone fisiche, i professionisti e gli enti pubblici.
  fonte: Camera di Commercio di Modena, documento
- non_modellabile: Iniziative con spesa minima di 15.000 euro
  citazione: La spesa minima ammissibile da parte del soggetto organizzatore è pari ad € 15.000,00.
  fonte: Camera di Commercio di Modena, documento
note:
- Bando chiuso (febbraio 2026).
