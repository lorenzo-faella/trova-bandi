  fonte: Regione Toscana, documento
- campo: settore
  operatore: interseca
  valori:
  - Turismo
  - Commercio
  - Alberghiero
  - Agroalimentare
  - Chimica e Farmaceutica
  - Elettronica
  - Meccanica
  - Metallurgia
  - Mobili, Legno e Carta
  - Moda e Tessile
  - Autoveicoli e altri mezzi di trasporto
  citazione: I suddetti soggetti devono operare nei settori di attività del Manifatturiero o del
  fonte: Regione Toscana, documento
- non_modellabile: Codice ATECO 2025 primario tra quelli di Manifatturiero o Turismo e Commercio individuati dalle DGR 1155/2023
    e 704/2025
  citazione: 1155/2023, successivamente integrata dalla Deliberazione della Giunta Regionale
  fonte: Regione Toscana, documento
note:
- 'Il settore è una approssimazione dei comparti Manifatturiero e Turismo e Commercio: l''elenco esatto dei codici ATECO è
  nelle DGR citate.'
