id: fvg-bando-a1-3-1-strumento-di-incentivazione-b86118
titolo: Bando A1.3.1 - Strumento di incentivazione a fondo perduto per la realizzazione di Proof of Concept (PoC) Il Bando
  definisce i criteri e le modalità per la concessione di sovvenzioni a fondo perduto per la realizzazione di progetti rappresentati
  da Proof of Concept (PoC) al fine di consolidare e implementare il potenziale innovativo di risultati ottenuti da precedenti
  attività di ricerca e sviluppo nell’ambito delle aree della Strategia per la specializzazione intelligente della Regione
  Autonoma Friuli Venezia Giulia (S4), tramite l’innalzamento del livello di maturità tecnologica (TRL) per giungere a prodotti
  e servizi innovativi finalizzati all’ingresso sul mercato.
ente: Regione Autonoma Friuli Venezia Giulia
link: https://www.regione.fvg.it/rafvg/cms/RAFVG/ricerca/fare-ricerca/FOGLIA13/
apertura: null
chiusura: null
fonte: documento Regione Autonoma Friuli Venezia Giulia, estrazione leggera per imprese ed enti con LLM (Claude Code, claude-opus-5-5),
