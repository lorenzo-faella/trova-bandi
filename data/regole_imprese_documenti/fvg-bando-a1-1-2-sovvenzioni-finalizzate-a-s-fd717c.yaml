id: fvg-bando-a1-1-2-sovvenzioni-finalizzate-a-s-fd717c
titolo: Bando A1.1.2 - Sovvenzioni finalizzate a sviluppare progetti negoziali di ricerca, sviluppo e innovazione Il Bando
  definisce i criteri e le modalità per la concessione di sovvenzioni a fondo perduto per la realizzazione di progetti negoziali
  di ricerca, sviluppo e innovazione di processo e dell’organizzazione, nell’ambito dell’area di specializzazione delle Tecnologie
  Marittime della S4 regionale realizzati in forma collaborativa tra imprese regionali e sistema della ricerca e innovazione
  per contribuire alla realizzazione di prodotti, processi o servizi innovativi da introdurre sul mercato.
ente: Regione Autonoma Friuli Venezia Giulia
link: https://www.regione.fvg.it/rafvg/cms/RAFVG/ricerca/fare-ricerca/FOGLIA11/
apertura: '2023-06-05'
chiusura: '2023-08-31'
fonte: documento Regione Autonoma Friuli Venezia Giulia, estrazione leggera per imprese ed enti con LLM (Claude Code, claude-opus-5-5),
  non rivista
pubblico: imprese
ultimo_controllo: '2026-11-21'
