id: inps-assegno-ordinario-di-invalidita-per-persone-c
titolo: Assegno ordinario di invalidità per persone con capacità lavorativa ridotta
ente: INPS
link: https://www.inps.it/it/it/dettaglio-scheda.it.schede-servizio-strumento.schede-servizi.assegno-ordinario-di-invalidit-per-persone-con-capacit-lavorativa-ridotta-50294.assegno-ordinario-di-invalidit-per-persone-con-capacit-lavorativa-ridotta.html
apertura: null
chiusura: null
fonte: etichettatura a mano di edo
pubblico: persone
ultimo_controllo: '2026-11-05'
requisiti:
  - campo: condizione_lavorativa
    operatore: in
    valori: [occupato]
    fonte: scheda INPS, A chi è rivolto
    citazione: "dipendenti iscritti all’Assicurazione Generale Obbligatoria; autonomi (artigiani, commercianti, coltivatori diretti, coloni e mezzadri);"
  - campo: disabile
    operatore: vero
    fonte: scheda INPS, Domanda
    citazione: "a causa di infermità o difetto fisico o mentale, ha: una capacità lavorativa ridotta a meno di un terzo;"
