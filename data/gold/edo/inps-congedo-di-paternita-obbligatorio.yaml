id: inps-congedo-di-paternita-obbligatorio
titolo: Congedo di paternità obbligatorio
ente: INPS
link: https://www.inps.it/it/it/dettaglio-scheda.it.schede-servizio-strumento.schede-servizi.congedo-di-paternit-obbligatorio-58988.congedo-di-paternit-obbligatorio.html
apertura: null
chiusura: null
fonte: etichettatura a mano di edo
pubblico: persone
ultimo_controllo: '2026-11-05'
note:
  - "Rivista l'8/11/2026 dopo aver visto l'estrazione: tolta la cittadinanza italiana, la scheda non la chiede e non è implicita (basta lavorare in Italia)."
  - "Corretto il 18/11/2026 per la convenzione B (decisione 67): tolto `lavora_in_italia`, che la scheda non scrive. Rimozione meccanica fatta da Claude su richiesta di Edoardo; nessun altro cambiamento."
  - "Corretto il 20/11/2026 nella seconda passata (decisione 67), scelte di Edoardo trascritte da Claude: aggiunto tipo_lavoro in [dipendente] (convenzione A); requisito 2 tolto: ora lo dice tipo_lavoro (convenzione A)."
requisiti:
  - campo: condizione_lavorativa
    operatore: in
    valori: [occupato]
    fonte: scheda INPS, A chi è rivolto
    citazione: "padri lavoratori dipendenti, privati e pubblici, anche adottivi e affidatari"
  - campo: tipo_lavoro
    operatore: in
    valori: [dipendente]
    fonte: scheda INPS, A chi è rivolto
    citazione: "padri lavoratori dipendenti, privati e pubblici, anche adottivi e affidatari"
  - campo: mesi_da_evento_figlio
    operatore: "<"
    valore: 5
    fonte: scheda INPS, DECORRENZA E DURATA
    citazione: "fino ai cinque mesi successivi alla nascita"
