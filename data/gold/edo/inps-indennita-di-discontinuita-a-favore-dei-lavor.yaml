id: inps-indennita-di-discontinuita-a-favore-dei-lavor
titolo: Indennità di discontinuità a favore dei lavoratori dello spettacolo
ente: INPS
link: https://www.inps.it/it/it/dettaglio-scheda.it.schede-servizio-strumento.schede-servizi.indennit-di-discontinuit-a-favore-dei-lavoratori-dello-spettacolo.html
apertura: null
chiusura: null
fonte: etichettatura a mano di edo
pubblico: persone
ultimo_controllo: '2026-11-05'
note:
  - "Da ricordare: il beneficio riguarda anche le imprese (vocabolario imprese non controllato)."
  - "Corretto il 18/11/2026 per la convenzione B (decisione 67): tolto `lavora_in_italia`, che la scheda non scrive. Rimozione meccanica fatta da Claude su richiesta di Edoardo; nessun altro cambiamento."
  - "Corretto il 20/11/2026 nella seconda passata (decisione 67), scelte di Edoardo trascritte da Claude: aggiunto tipo_lavoro in [dipendente, autonomo] (convenzione A); requisito 2: reddito_richiedente <= 35000 invece del non modellabile (convenzione A)."
requisiti:
  - campo: condizione_lavorativa
    operatore: in
    valori: [occupato]
    fonte: scheda INPS, A chi è rivolto
    citazione: "subordinati a tempo determinato (che prestano attività artistica o tecnica connessa con la produzione e la realizzazione di spettacolo); subordinati a tempo determinato:"
  - campo: tipo_lavoro
    operatore: in
    valori: [dipendente, autonomo]
    fonte: scheda INPS, A chi è rivolto
    citazione: "subordinati a tempo determinato (che prestano attività artistica o tecnica connessa con la produzione e la realizzazione di spettacolo); subordinati a tempo determinato:"
  - campo: reddito_richiedente
    operatore: "<="
    valore: 35000
    fonte: scheda INPS, Requisiti
    citazione: "essere in possesso di un reddito IRPEF non superiore a 35.000 euro"
