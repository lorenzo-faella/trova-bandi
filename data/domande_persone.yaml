# Domande del questionario per le persone, nell'ordine in cui si possono fare, con la condizione che le apre
# (decisione 50). È il questionario adattivo: una domanda con `solo_se` compare solo se le risposte già date la
# soddisfano tutte. Ogni domanda ammette "non lo so" (l'esito diventa "mancano dati", mai un no).
# I campi sono quelli di schema/regola.schema.json, spiegati in docs/vocabolario-persone.md.
# `solo_se`: {campo: [valori]} per gli elenchi, {campo: true} per i sì/no, {campo: {">=": n}} per i numeri.
# `tipo: elenco multiplo`: si possono scegliere più risposte (chi studia e lavora), e il motore le accetta tutte (decisione 69).
# `chi`: richiedente (default) o componente (si chiede per ogni persona del nucleo). `ricavato`: non si chiede, si calcola.
domande:
  - {campo: regione, domanda: "In che regione hai la residenza?", tipo: elenco}
  - {campo: comune, domanda: "In che comune hai la residenza?", tipo: elenco}
  - {campo: domicilio_diverso, domanda: "Vivi abitualmente in un altro comune, per esempio per studio o lavoro?", tipo: sì/no}
  - {campo: regione_domicilio, domanda: "In che regione vivi abitualmente?", tipo: elenco, solo_se: {domicilio_diverso: true}}
  - {campo: comune_domicilio, domanda: "In che comune vivi abitualmente (domicilio)?", tipo: elenco, solo_se: {domicilio_diverso: true}}
  - {campo: anni_residenza_regione, domanda: "Da quanti anni risiedi nella tua regione?", tipo: numero}
  - {campo: residente_italia, domanda: "Risiedi in Italia?", tipo: sì/no}
  - {campo: anni_residenza_italia, domanda: "Da quanti anni risiedi in Italia, in totale?", tipo: numero}
  - {campo: anni_residenza_continuativa_italia, domanda: "Da quanti anni senza interruzioni?", tipo: numero}
  - {campo: cittadinanza, domanda: "Qual è la tua cittadinanza o il tuo titolo di soggiorno?", tipo: elenco,
     valori: [italiana, ue, familiare_con_diritto_soggiorno, extra_ue_lungo_periodo, protezione_internazionale, apolide, altro_titolo, nessun_titolo]}
  - {campo: permesso_casi_speciali, domanda: "Hai un permesso per \"casi speciali\" (art. 18, 18-bis, 18-ter TUI)?", tipo: sì/no,
     solo_se: {cittadinanza: [altro_titolo, nessun_titolo]}}
  - {campo: mesi_validita_permesso, domanda: "Per quanti mesi è valido il tuo permesso di soggiorno, in totale?", tipo: numero,
     solo_se: {cittadinanza: [familiare_con_diritto_soggiorno, extra_ue_lungo_periodo, protezione_internazionale, altro_titolo]}}
  - {campo: disabile, domanda: "Hai una disabilità?", tipo: sì/no}
  - {campo: percentuale_invalidita, domanda: "Percentuale di invalidità riconosciuta?", tipo: numero, solo_se: {disabile: true}}

  - {campo: condizione_lavorativa, domanda: "Qual è la tua situazione lavorativa?", tipo: elenco multiplo,
     valori: [occupato, disoccupato, studente, pensionato, inattivo]}
  - {campo: lavora_in_italia, domanda: "Lavori in Italia?", tipo: sì/no, solo_se: {condizione_lavorativa: [occupato]}}
  - {campo: tipo_lavoro, domanda: "Lavori come dipendente, autonomo o collaboratore (Gestione Separata)?", tipo: elenco multiplo,
     valori: [dipendente, autonomo, parasubordinato], solo_se: {condizione_lavorativa: [occupato]}}
  - {campo: reddito_richiedente, domanda: "Il tuo reddito complessivo IRPEF dell'anno scorso?", tipo: numero,
     solo_se: {condizione_lavorativa: [occupato, pensionato]}}
  - {campo: situazioni_particolari, domanda: "Ti riguarda una di queste situazioni?", tipo: elenco multiplo,
     valori: [dipendente_pubblico, genitore_dipendente_pubblico, poste_ipost, gestione_magistrale, superstite, forze_ordine, lavoro_domestico, lavoro_agricolo, malattia_tbc, nessuna]}
  - {campo: soggetto_irpef_italia, domanda: "Paghi le imposte sul reddito in Italia?", tipo: sì/no}  # senza solo_se: l'Assegno unico lo chiede anche a chi non lavora (decisione 53)
  - {campo: ultimo_lavoro_subordinato, domanda: "Il tuo ultimo lavoro era da dipendente?", tipo: sì/no, solo_se: {condizione_lavorativa: [disoccupato]}}
  - {campo: causa_fine_lavoro, domanda: "Come è finito?", tipo: elenco, solo_se: {condizione_lavorativa: [disoccupato]},
     valori: [licenziamento, fine_contratto, dimissioni, dimissioni_giusta_causa, dimissioni_periodo_tutelato, risoluzione_consensuale, risoluzione_consensuale_tutelata]}
  - {campo: giorni_da_cessazione_lavoro, domanda: "Quanti giorni fa è finito il lavoro?", tipo: numero, solo_se: {condizione_lavorativa: [disoccupato]}}
  - {campo: settimane_contributi_4_anni, domanda: "Quante settimane di contributi hai negli ultimi 4 anni?", tipo: numero,
     solo_se: {condizione_lavorativa: [disoccupato, occupato]}}

  - {campo: titolo_di_studio, domanda: "Il titolo di studio più alto che hai?", tipo: elenco,
     valori: [nessuno, licenza_media, diploma, laurea_triennale, laurea_magistrale, master, dottorato]}
  - {campo: iscrizione, domanda: "Sei iscritto (o ti stai iscrivendo) a un corso?", tipo: elenco,
     valori: [universita, afam, its, scuola_superiore, nessuna]}
  - {campo: regione_ateneo, domanda: "In che regione è la tua università o il tuo istituto?", tipo: elenco, solo_se: {iscrizione: [universita, afam, its]}}
  - {campo: anno_di_corso, domanda: "A che anno sei iscritto?", tipo: numero, solo_se: {iscrizione: [universita, afam, its]}}
  - {campo: fuori_corso_o_ripetente, domanda: "Sei fuori corso o ripetente?", tipo: sì/no, solo_se: {iscrizione: [universita, afam]}}
  - {campo: crediti_conseguiti, domanda: "Quanti crediti (CFU) hai conseguito finora?", tipo: numero,
     solo_se: {iscrizione: [universita, afam], anno_di_corso: {">=": 2}}}
  - {campo: isee_universitario, domanda: "Il tuo ISEE per il diritto allo studio universitario?", tipo: numero, solo_se: {iscrizione: [universita, afam]}}
  - {campo: ispe, domanda: "L'ISPE scritto sull'attestazione ISEE?", tipo: numero, solo_se: {iscrizione: [universita, afam]}}

  - {campo: abitazione, domanda: "La casa in cui vivi è…?", tipo: elenco, valori: [affitto, proprieta, altro]}
  - {campo: contratto_locazione_registrato, domanda: "Hai un contratto di affitto registrato a tuo nome o di un familiare?", tipo: sì/no,
     solo_se: {abitazione: [affitto]}}
  - {campo: canone_annuo, domanda: "Quanto paghi di affitto in un anno, senza le spese?", tipo: numero, solo_se: {abitazione: [affitto]}}
  - {campo: mutuo_prima_casa, domanda: "Hai un mutuo in corso per la prima casa?", tipo: sì/no, solo_se: {abitazione: [proprieta]}}
  - {campo: proprieta_altra_abitazione, domanda: "Tu o un familiare del nucleo possedete un'altra casa adatta al nucleo?", tipo: sì/no}

  - {campo: isee, domanda: "Qual è il tuo ISEE?", tipo: numero}
  - {campo: patrimonio_immobiliare, domanda: "Valore degli immobili, esclusa la casa di abitazione?", tipo: numero}  # senza solo_se: terreni e altri immobili contano anche senza "un'altra casa adatta" (decisione 53)
  - {campo: veicoli_esclusi, domanda: "Qualcuno in famiglia ha auto oltre 1.600 cc o moto oltre 250 cc immatricolate negli ultimi 36 mesi, oppure barche o aerei?", tipo: sì/no}

  - {campo: nucleo, domanda: "Chi fa parte del tuo nucleo familiare?", tipo: elenco di persone}
  - {campo: eta, domanda: "Età", tipo: numero, chi: componente}
  - {campo: eta, domanda: "(la tua età: quella del primo componente del nucleo)", tipo: numero, ricavato: true}
  - {campo: figlio, domanda: "È tuo figlio (anche adottivo o in affido)?", tipo: sì/no, chi: componente}
  - {campo: figlio_a_carico, domanda: "È un figlio a carico?", tipo: sì/no, chi: componente, solo_se: {figlio: true}}
  - {campo: disabile, domanda: "Ha una disabilità?", tipo: sì/no, chi: componente}
  - {campo: svantaggio_certificato, domanda: "È seguito da servizi socio-sanitari per una condizione di svantaggio?", tipo: sì/no, chi: componente}
  - {campo: reddito_annuo, domanda: "Reddito annuo", tipo: numero, chi: componente}
  - {campo: attivita, domanda: "Cosa fa?", tipo: elenco, chi: componente, valori: [studio, tirocinio_o_lavoro, disoccupato_cpi, servizio_civile, nessuna]}
  - {campo: numero_figli, domanda: "(si conta dai componenti con figlio = sì)", tipo: numero, ricavato: true}
  - {campo: giorni_da_evento_figlio, domanda: "Quando è nato o entrato in famiglia l'ultimo figlio? (una data)", tipo: numero,
     solo_se: {numero_figli: {">=": 1}}}
  - {campo: mesi_da_evento_figlio, domanda: "(dalla stessa data)", tipo: numero, ricavato: true}
