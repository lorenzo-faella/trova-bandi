# Domande del questionario per le persone, nell'ordine in cui si possono fare, con la condizione che le apre
# (decisione 50). È il questionario adattivo: una domanda con `solo_se` compare solo se le risposte già date la
# soddisfano tutte. Ogni domanda ammette "non lo so" (l'esito diventa "mancano dati", mai un no).
# I campi sono quelli di schema/regola.schema.json, spiegati in docs/vocabolario-persone.md.
# `solo_se`: {campo: [valori]} per gli elenchi, {campo: true} per i sì/no, {campo: {">=": n}} per i numeri.
# `tipo: elenco multiplo`: si possono scegliere più risposte (chi studia e lavora), e il motore le accetta tutte (decisione 69).
# `chi`: richiedente (default) o componente (si chiede per ogni persona del nucleo). `ricavato`: non si chiede, si calcola.
domande:
  - {campo: regione, domanda: "In che regione hai la residenza?", tipo: elenco}
  - {campo: comune, domanda: "In che comune hai la residenza?", tipo: elenco}
  - {campo: domicilio_diverso, domanda: "Vivi abitualmente in un altro comune, per esempio per studio o lavoro?", tipo: sì/no}
  - {campo: regione_domicilio, domanda: "In che regione vivi abitualmente?", tipo: elenco, solo_se: {domicilio_diverso: true}}
  - {campo: comune_domicilio, domanda: "In che comune vivi abitualmente (domicilio)?", tipo: elenco, solo_se: {domicilio_diverso: true}}
  - {campo: anni_residenza_regione, domanda: "Da quanti anni risiedi nella tua regione?", tipo: numero}
  - {campo: residente_italia, domanda: "Hai la residenza in Italia?", tipo: sì/no}
  # La demo chiede residenza e domicilio in due pagine (web/domande.py, pagina_persone; decisione 80). Nella prima c'è
  # anche "Sei nato in Italia e ci hai sempre vissuto?" (`sempre_in_italia`, non è un campo delle regole): chi risponde sì
  # risiede in Italia da quando è nato, e gli anni qui sotto si ricavano dalla sua età senza chiederli.
  - {campo: anni_residenza_continuativa_italia, domanda: "Da quanti anni vivi in Italia senza interruzioni?", tipo: numero,
     solo_se: {residente_italia: true}}
  - {campo: anni_residenza_italia, domanda: "E in tutto, contando anche i periodi precedenti, quanti anni hai vissuto in Italia?",
     tipo: numero, solo_se: {residente_italia: true}}
  - {campo: cittadinanza, domanda: "Qual è la tua cittadinanza o il tuo titolo di soggiorno?", tipo: elenco,
     valori: [italiana, ue, familiare_con_diritto_soggiorno, extra_ue_lungo_periodo, protezione_internazionale, apolide, altro_titolo, nessun_titolo]}
  - {campo: permesso_casi_speciali, domanda: "Hai un permesso per \"casi speciali\" (art. 18, 18-bis, 18-ter TUI)?", tipo: sì/no,
     solo_se: {cittadinanza: [altro_titolo, nessun_titolo]}}
  - {campo: mesi_validita_permesso, domanda: "Per quanti mesi è valido il tuo permesso di soggiorno, in totale?", tipo: numero,
     solo_se: {cittadinanza: [familiare_con_diritto_soggiorno, extra_ue_lungo_periodo, protezione_internazionale, altro_titolo]}}
  - {campo: disabile, domanda: "Hai una disabilità?", tipo: sì/no}
  - {campo: percentuale_invalidita, domanda: "Percentuale di invalidità riconosciuta?", tipo: numero, solo_se: {disabile: true}}

  - {campo: condizione_lavorativa, domanda: "Qual è la tua situazione lavorativa?", tipo: elenco multiplo,
     valori: [occupato, disoccupato, studente, pensionato, inattivo]}
  - {campo: lavora_in_italia, domanda: "Lavori in Italia?", tipo: sì/no, solo_se: {condizione_lavorativa: [occupato]}}
  - {campo: tipo_lavoro, domanda: "Lavori come dipendente, autonomo o collaboratore (Gestione Separata)?", tipo: elenco multiplo,
     valori: [dipendente, autonomo, parasubordinato], solo_se: {condizione_lavorativa: [occupato]}}
  # anche a studenti e disoccupati: le detrazioni per l'affitto guardano il reddito di chiunque (decisione 84)
  - {campo: reddito_richiedente, domanda: "Il tuo reddito complessivo IRPEF dell'anno scorso?", tipo: numero}
  - {campo: situazioni_particolari, domanda: "Ti riguarda una di queste situazioni?", tipo: elenco multiplo,
     valori: [dipendente_pubblico, genitore_dipendente_pubblico, poste_ipost, gestione_magistrale, superstite, forze_ordine, lavoro_domestico, lavoro_agricolo, malattia_tbc, nessuna]}
  - {campo: soggetto_irpef_italia, domanda: "Sei soggetto alle imposte sul reddito in Italia? (Sì anche se, con un reddito basso, non paghi nulla)", tipo: sì/no}  # senza solo_se: l'Assegno unico lo chiede anche a chi non lavora (decisione 53)
  - {campo: lavoro_terminato, domanda: "È terminato un tuo rapporto di lavoro? (Anche se studi o conservi un altro lavoro)", tipo: sì/no}
  - {campo: ultimo_lavoro_subordinato, domanda: "Il rapporto terminato era da dipendente?", tipo: sì/no, solo_se: {lavoro_terminato: true}}
  - {campo: causa_fine_lavoro, domanda: "Come è finito quel rapporto di lavoro?", tipo: elenco, solo_se: {lavoro_terminato: true},
     valori: [licenziamento, fine_contratto, dimissioni, dimissioni_giusta_causa, dimissioni_periodo_tutelato, risoluzione_consensuale, risoluzione_consensuale_tutelata]}
  - {campo: giorni_da_cessazione_lavoro, domanda: "Quanti giorni fa è finito quel rapporto di lavoro?", tipo: numero, solo_se: {lavoro_terminato: true}}
  - {campo: esclusione_naspi, domanda: "Il rapporto perso era pubblico a tempo indeterminato, operaio agricolo a termine o con permesso extra UE stagionale; oppure hai maturato la pensione di vecchiaia/anticipata o hai un assegno ordinario di invalidità senza optare per NASpI?", tipo: sì/no, solo_se: {lavoro_terminato: true}}
  - {campo: altri_lavori_in_essere, domanda: "Conservi altri rapporti di lavoro o un'attività autonoma?", tipo: sì/no, solo_se: {lavoro_terminato: true}}
  - {campo: disponibilita_lavoro_naspi, domanda: "Sei immediatamente disponibile a lavorare e a partecipare alle politiche attive (DID)?", tipo: sì/no, solo_se: {lavoro_terminato: true}}
  - {campo: dimissioni_indeterminato_12_mesi, domanda: "Nei 12 mesi prima della data di cessazione involontaria hai cessato volontariamente (dimissioni o risoluzione consensuale) un altro lavoro a tempo indeterminato?", tipo: sì/no, solo_se: {lavoro_terminato: true}}
  - {campo: eccezione_dimissioni_precedenti, domanda: "La precedente cessazione rientra in giusta causa (anche trasferimento senza comprovate ragioni), maternità/paternità tutelata, conciliazione art. 7 L. 604/1966 o rifiuto di trasferimento oltre 50 km o raggiungibile in almeno 80 minuti con mezzi pubblici?", tipo: sì/no, solo_se: {dimissioni_indeterminato_12_mesi: true}}
  - {campo: settimane_da_dimissioni, domanda: "Quante settimane utili di contributi contro la disoccupazione hai tra l’ultima cessazione volontaria da indeterminato e la cessazione involontaria?", tipo: numero, solo_se: {dimissioni_indeterminato_12_mesi: true}}
  - {campo: termine_naspi_particolare, domanda: "Il termine ha decorrenza o sospensioni particolari? Considera licenziamento per giusta causa, maternità, malattia/infortunio indennizzati, vertenza, mancato preavviso o liquidazione giudiziale.", tipo: sì/no, solo_se: {lavoro_terminato: true}}
  - {campo: settimane_contributi_4_anni, domanda: "Quante settimane di contributi hai negli ultimi 4 anni?", tipo: numero}

  - {campo: titolo_di_studio, domanda: "Il titolo di studio più alto che hai?", tipo: elenco,
     valori: [nessuno, licenza_media, diploma, laurea_triennale, laurea_magistrale, master, dottorato]}
  - {campo: iscrizione, domanda: "Sei iscritto (o ti stai iscrivendo) a un corso?", tipo: elenco,
     valori: [universita, afam, its, scuola_superiore, nessuna]}
  - {campo: livello_corso, domanda: "Che corso frequenti?", tipo: elenco, solo_se: {iscrizione: [universita, afam, its]},
     valori: [laurea_triennale, laurea_magistrale, ciclo_unico, dottorato, specializzazione, master, its, afam_primo_livello, afam_secondo_livello]}
  - {campo: comune_ateneo, domanda: "In che comune è la sede del tuo corso?", tipo: elenco, solo_se: {iscrizione: [universita, afam, its]}}
  - {campo: provincia_ateneo, domanda: "(si ricava dal comune della sede del corso)", tipo: elenco, ricavato: true}
  - {campo: regione_ateneo, domanda: "(si ricava dal comune della sede del corso)", tipo: elenco, ricavato: true}
  - {campo: tempo_parziale, domanda: "Sei iscritto a tempo parziale (part-time)?", tipo: sì/no, solo_se: {iscrizione: [universita, afam]}}
  - {campo: anno_di_corso, domanda: "A che anno sei iscritto?", tipo: numero, solo_se: {iscrizione: [universita, afam, its]}}
  - {campo: fuori_corso_o_ripetente, domanda: "Sei fuori corso o ripetente?", tipo: sì/no, solo_se: {iscrizione: [universita, afam]}}
  - {campo: crediti_conseguiti, domanda: "Quanti crediti (CFU) hai conseguito finora?", tipo: numero,
     solo_se: {iscrizione: [universita, afam], anno_di_corso: {">=": 2}}}
  - {campo: isee_universitario, domanda: "Il tuo ISEE per il diritto allo studio universitario?", tipo: numero, solo_se: {iscrizione: [universita, afam]}}
  - {campo: ispe, domanda: "Qual è il tuo ISPE per il diritto allo studio?", tipo: numero}

  - {campo: abitazione, domanda: "La casa in cui vivi è…?", tipo: elenco, valori: [affitto, proprieta, altro]}
  - {campo: contratto_locazione_registrato, domanda: "Hai un contratto di affitto registrato a tuo nome o di un familiare?", tipo: sì/no,
     solo_se: {abitazione: [affitto]}}
  - {campo: canone_annuo, domanda: "Quanto paghi di affitto in un anno, senza le spese?", tipo: numero, solo_se: {abitazione: [affitto]}}
  - {campo: mutuo_prima_casa, domanda: "Hai un mutuo in corso per la prima casa?", tipo: sì/no, solo_se: {abitazione: [proprieta]}}
  - {campo: proprieta_altra_abitazione, domanda: "Tu o un familiare del nucleo possedete un'altra casa adatta al nucleo?", tipo: sì/no}

  - {campo: isee_minorenni, domanda: "Qual è l’ISEE minorenni valido per il bambino interessato?", tipo: numero}
  - {campo: isee, domanda: "Qual è il tuo ISEE?", tipo: numero}
  - {campo: patrimonio_immobiliare, domanda: "Valore degli immobili, esclusa la casa di abitazione?", tipo: numero}  # senza solo_se: terreni e altri immobili contano anche senza "un'altra casa adatta" (decisione 53)
  - {campo: auto_moto_non_agevolati, domanda: "Nel nucleo ci sono auto oltre 1.600 cc o moto oltre 250 cc, immatricolate per la prima volta nei 36 mesi prima della domanda, SENZA agevolazione fiscale per disabilità?", tipo: sì/no}
  - {campo: barche_aerei, domanda: "Qualcuno nel nucleo ha navi o imbarcazioni da diporto oppure aeromobili di qualsiasi genere?", tipo: sì/no}
  - {campo: veicoli_esclusi, domanda: "Qualcuno in famiglia ha auto oltre 1.600 cc o moto oltre 250 cc immatricolate negli ultimi 36 mesi, oppure barche o aerei?", tipo: sì/no}

  - {campo: solo_veicoli_agevolati, domanda: "Si tratta soltanto di auto o moto con agevolazione fiscale per persone con disabilità, senza barche o aerei?", tipo: sì/no, solo_se: {veicoli_esclusi: true}}

  - {campo: nucleo, domanda: "Chi fa parte del tuo nucleo familiare?", tipo: elenco di persone}
  - {campo: eta, domanda: "Età", tipo: numero, chi: componente}
  - {campo: eta, domanda: "(la tua età: quella del primo componente del nucleo)", tipo: numero, ricavato: true}
  - {campo: figlio, domanda: "È tuo figlio (anche adottivo o in affido)?", tipo: sì/no, chi: componente}
  - {campo: figlio_a_carico, domanda: "È un figlio a carico?", tipo: sì/no, chi: componente, solo_se: {figlio: true}}
  - {campo: disabile, domanda: "Ha una disabilità?", tipo: sì/no, chi: componente}
  - {campo: svantaggio_certificato, domanda: "È seguito da servizi socio-sanitari per una condizione di svantaggio?", tipo: sì/no, chi: componente}
  - {campo: reddito_annuo, domanda: "Reddito annuo", tipo: numero, chi: componente}
  - {campo: attivita, domanda: "Cosa fa?", tipo: elenco, chi: componente, valori: [studio, tirocinio_o_lavoro, disoccupato_cpi, servizio_civile, nessuna]}
  - {campo: numero_figli, domanda: "(si conta dai componenti con figlio = sì)", tipo: numero, ricavato: true}
  - {campo: numero_componenti, domanda: "(si contano i componenti del nucleo, compreso chi risponde)", tipo: numero, ricavato: true}
  - {campo: giorni_da_evento_figlio, domanda: "Quando è nato o entrato in famiglia l'ultimo figlio? (una data)", tipo: numero}
  - {campo: mesi_da_evento_figlio, domanda: "(dalla stessa data)", tipo: numero, ricavato: true}

  # Dettagli NASpI: periodo contributivo distinto dal reddito presunto dell'anno in corso.
  - {campo: contributi_agricoli_presenti, domanda: "Nel quadriennio contributivo NASpI ci sono periodi di lavoro agricolo?", tipo: sì/no, solo_se: {lavoro_terminato: true}}
  - {campo: prevalenza_non_agricola_4_anni, domanda: "Nell'estratto contributivo dei quattro anni prima della cessazione prevale la contribuzione non agricola?", tipo: sì/no, solo_se: {contributi_agricoli_presenti: true}}
  - {campo: prevalenza_non_agricola_12_mesi, domanda: "Negli ultimi 12 mesi prima della cessazione prevale la contribuzione non agricola?", tipo: sì/no, solo_se: {contributi_agricoli_presenti: true, prevalenza_non_agricola_4_anni: false}}
  - {campo: lavori_rimasti_naspi, domanda: "Quali lavori conservi dopo la cessazione?", tipo: elenco, valori: [solo_autonomo, solo_part_time, altri_o_misti], solo_se: {altri_lavori_in_essere: true}}
  - {campo: reddito_autonomo_presunto_naspi, domanda: "Quale reddito annuo presumi dall'attività autonoma rimasta nell'anno in corso?", tipo: numero, solo_se: {lavori_rimasti_naspi: [solo_autonomo]}}

  - {campo: genitore_tutore_buoni_toscana, domanda: "Per i Buoni scuola Toscana 2026/27: sei genitore o tutore del bambino per cui chiedi il buono?", tipo: sì/no}
  - {campo: bambino_residente_toscana_buoni, domanda: "Quel bambino risiede in un Comune della Toscana?", tipo: sì/no, solo_se: {genitore_tutore_buoni_toscana: true}}
  - {campo: iscrizione_effettiva_buoni_toscana, domanda: "Quel bambino è effettivamente iscritto con posto disponibile a una scuola dell'infanzia paritaria privata o comunale in Toscana per il 2026/27?", tipo: sì/no, solo_se: {genitore_tutore_buoni_toscana: true}}
  - {campo: retta_buoni_toscana, domanda: "La scuola prevede una retta o tariffa di frequenza, oltre all'eventuale mensa?", tipo: sì/no, solo_se: {genitore_tutore_buoni_toscana: true}}

  - {campo: iscrizione_postlaurea_ergo, domanda: "Per gli assegni formativi ER.GO: sei regolarmente iscritto a Master, Alta Formazione o Specializzazione di almeno un anno che rilascia un titolo successivo alla laurea?", tipo: sì/no}

  - {campo: iscro_cococo_senza_iva, domanda: "Per la verifica ISCRO: sei collaboratore co.co.co senza partita IVA?", tipo: sì/no, solo_se: {tipo_lavoro: [parasubordinato]}}
