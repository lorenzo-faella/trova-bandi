id: inps-assegno-maternita-stato
titolo: Assegno di maternità dello Stato
ente: INPS
link: https://www.inps.it/it/it/dettaglio-scheda.it.schede-servizio-strumento.schede-servizi.assegno-di-maternit-dello-stato-50580.assegno-di-maternit-dello-stato.html
apertura: null
chiusura: null
fonte: scheda INPS, scritta a mano
pubblico: persone
ultimo_controllo: "2026-11-05"
requisiti:
  - campo: residente_italia
    operatore: vero
    fonte: scheda INPS, Domanda
    citazione: "la residenza in Italia al momento della nascita del bambino"
  - almeno_uno_di:
      - {campo: cittadinanza, operatore: in, valori: [italiana, ue, extra_ue_lungo_periodo]}
      - non_modellabile: "Altri titoli di soggiorno ammessi solo a precise condizioni."
    fonte: scheda INPS, Domanda
    citazione: "Il diritto è riconosciuto anche ai cittadini extracomunitari che siano:"
  - campo: mesi_da_evento_figlio
    operatore: "<"
    valore: 6
    fonte: scheda INPS, Domanda
    citazione: "La domanda deve essere presentata entro sei mesi:"
  - non_modellabile: "Contributi della madre o del padre: condizioni diverse per lavoratrici, disoccupate, adozioni, affidi."
    fonte: scheda INPS, Domanda
    citazione: "Per la madre sono previsti i seguenti requisiti:"
