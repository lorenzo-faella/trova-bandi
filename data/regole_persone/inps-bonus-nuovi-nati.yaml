id: inps-bonus-nuovi-nati
titolo: Bonus nuovi nati
ente: INPS
link: https://www.inps.it/it/it/dettaglio-scheda.it.schede-servizio-strumento.schede-servizi.bonus-nuovi-nati.html
apertura: null
chiusura: null
fonte: scheda INPS, scritta a mano
pubblico: persone
ultimo_controllo: "2026-11-05"
note:
  - "Il limite 'nato dal 1° gennaio 2025' è implicito finché vale il termine di 120 giorni."
requisiti:
  - campo: giorni_da_evento_figlio
    operatore: "<="
    valore: 120
    fonte: scheda INPS, Domanda
    citazione: "entro 120 giorni dalla data di nascita, ovvero dalla data di ingresso in famiglia del minore"
  - campo: isee
    operatore: "<="
    valore: 40000
    fonte: scheda INPS, A chi è rivolto
    citazione: "con un valore non superiore ai 40mila euro"
  - non_modellabile: "Cittadinanza e residenza: la scheda non le riporta, stanno nella circolare INPS 10 aprile 2026, n. 45."
    fonte: scheda INPS, assenza nel testo
