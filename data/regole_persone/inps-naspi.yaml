id: inps-naspi
titolo: "NASpI: indennità mensile di disoccupazione"
ente: INPS
link: https://www.inps.it/it/it/dettaglio-scheda.it.schede-servizio-strumento.schede-servizi.50593.naspi-indennit-mensile-di-disoccupazione.html
apertura: null
chiusura: null
fonte: scheda INPS, scritta a mano
pubblico: persone
ultimo_controllo: "2026-11-05"
requisiti:
  - campo: ultimo_lavoro_subordinato
    operatore: vero
    fonte: scheda INPS, Domanda
    citazione: "La NASpI è riconosciuta ai lavoratori subordinati"
  - almeno_uno_di:
      - {campo: condizione_lavorativa, operatore: in, valori: [disoccupato]}
      - non_modellabile: "Chi conserva altri rapporti part-time o un'attività autonoma a basso reddito può avere diritto: mancano i lavori rimasti in essere e il loro reddito."
        citazione: "se il titolare di due o più rapporti di lavoro subordinato a tempo parziale cessa da uno dei rapporti"
    fonte: scheda INPS, Domanda
    citazione: "Si considerano disoccupati i soggetti privi di impiego"
  - campo: causa_fine_lavoro
    operatore: in
    valori: [licenziamento, fine_contratto, dimissioni_giusta_causa, dimissioni_periodo_tutelato, risoluzione_consensuale_tutelata]
    fonte: scheda INPS, Domanda
    citazione: "Lo stato di disoccupazione deve essere involontario"
  - campo: settimane_contributi_4_anni
    operatore: ">="
    valore: 13
    fonte: scheda INPS, Domanda
    citazione: "almeno 13 settimane di contribuzione contro la disoccupazione nei quattro anni precedenti"
  - non_modellabile: "Chi ha contributi sia agricoli sia non agricoli deve avere prevalente la contribuzione non agricola: manca il settore dei contributi."
    portata: rara  # riguarda solo chi ha anche contributi agricoli: "purché" (decisione 52)
    fonte: scheda INPS, Domanda
    citazione: "purché nel quadriennio di osservazione risulti prevalente la contribuzione non agricola"
  - campo: giorni_da_cessazione_lavoro
    operatore: "<="
    valore: 68
    fonte: scheda INPS, Domanda
    citazione: "a pena di decadenza entro 68 giorni"
