note:
- Domanda online entro il 30 settembre 2026, con DSU e attestazione ISEE per il diritto allo studio universitario; la data
  di apertura non è nel testo ricevuto.
- Per gli studenti stranieri o italiani residenti all'estero vale l'ISEEU parificato calcolato dal CAF convenzionato.
- 'Il testo del PDF ha spazi spezzati dentro le parole: le citazioni riportano il testo così com''è.'
- Il requisito sul permesso di soggiorno riguarda solo gli studenti stranieri; ho tenuto fuori dall'obbligo italiani e cittadini
  UE, che il bando non menziona su questo punto.
