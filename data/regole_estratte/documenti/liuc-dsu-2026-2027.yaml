note:
- Domanda entro il 30 settembre 2026, completa di DSU e attestazione ISEE per il diritto allo studio universitario; la data
  di apertura non è indicata. Iscrizione alla LIUC entro il 30 settembre 2026 ed eventuali trasferimenti perfezionati entro
  il 15 novembre 2026.
- La sede della LIUC è resa con comune_ateneo Castellanza, ricavato dalla definizione di studente in sede del bando.
- 'L''"ultimo semestre" è reso come anno_di_corso 4 per la triennale e 3 per la magistrale. Per la magistrale la soglia sale
  dei crediti oltre i 180 riconosciuti all''iscrizione: non modellato.'
- Le soglie ridotte per il bonus usano il bonus massimo disponibile (5 al 2° anno della triennale, 12 dal 3°; 12 come tetto
  per la magistrale, che può usare il residuo della triennale).
- 'Matricole magistrali laureate: la laurea di primo livello deve consentire l''ammissione diretta, con eventuali carenze
  colmate entro il 15 ottobre 2026; resa solo con il titolo di studio. Per chi non è ancora laureato i 150 crediti si riferiscono
  alla laurea di primo livello.'
- I bandi LIUC citano solo i corsi di Economia e Ingegneria; i requisiti sono scritti per laurea triennale, laurea magistrale
  e dottorato.
