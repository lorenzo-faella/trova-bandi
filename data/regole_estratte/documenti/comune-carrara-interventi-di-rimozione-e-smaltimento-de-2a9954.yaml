note:
- 'Il documento ricevuto contiene solo le sezioni 1, 3 e 4: la sezione 2 e le parti su termini e importi mancano, quindi non
  risultano le date per presentare domanda né l''eventuale vincolo esplicito che l''immobile sia nel Comune di Carrara.'
- 'Il bando riguarda la collocazione dell''immobile, non la residenza del richiedente: per questo non è indicato il campo
  comune.'
- Per un intervento con più proprietari viene assegnato un unico contributo; i documenti (FIR, fattura quietanzata, verbale
  condominiale) sono richiesti a pena di inammissibilità ma sono documenti di domanda.
