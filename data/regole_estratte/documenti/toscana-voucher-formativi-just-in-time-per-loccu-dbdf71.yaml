id: toscana-voucher-formativi-just-in-time-per-loccu-dbdf71
titolo: 'Voucher formativi Just in Time per l’occupabilità 2.0: il bando 2025'
ente: Regione Toscana
link: https://www.regione.toscana.it/-/voucher-formativi-just-in-time-per-l-occupabilit%C3%A0-2-0-il-bando-2025
apertura: '2025-11-01'
chiusura: '2027-12-31'
fonte: documento Regione Toscana, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti:
- campo: eta
  operatore: '>='
  valore: 18
  fonte: Regione Toscana, pagina 1
  citazione: che abbiano compiuto i 18 anni di età;
- almeno_uno_di:
  - campo: condizione_lavorativa
    operatore: in
    valori:
    - disoccupato
    - inattivo
  - tutti_di:
    - campo: condizione_lavorativa
      operatore: in
      valori:
      - studente
      - pensionato
    - non_modellabile: 'Studenti o pensionati non occupati potrebbero rientrare tra gli inattivi: il bando non lo precisa.'
  fonte: Regione Toscana, pagina 1
  citazione: disoccupati, inoccupati, inattivi con o senza strumenti a sostegno del reddito
- almeno_uno_di:
  - campo: condizione_lavorativa
    operatore: in
    valori:
    - inattivo
  - non_modellabile: 'Iscrizione presso un Centro per l''impiego della Toscana per disoccupati e inoccupati: manca il campo.'
  fonte: Regione Toscana, pagina 1
  citazione: iscrizione non richiesta per gli inattivi
- almeno_uno_di:
  - campo: regione
    operatore: in
    valori:
    - Toscana
  - non_modellabile: 'Domicilio (non residenza) in un comune della Toscana: manca il campo.'
  fonte: Regione Toscana, pagina 1
  citazione: residenti o domiciliati in un Comune della regione Toscana
- almeno_uno_di:
  - campo: cittadinanza
    operatore: in
    valori:
    - italiana
    - ue
  - non_modellabile: 'Cittadini non comunitari con regolare permesso di soggiorno che consente attività lavorativa: il vocabolario
      non dice se il titolo consente di lavorare.'
  fonte: Regione Toscana, pagina 1
  citazione: se cittadini non comunitari devono essere anche in possesso di regolare permesso di soggiorno che consente attività
    lavorativa
- non_modellabile: 'Il destinatario deve essere individuato dal Centro per l''impiego e selezionato da un''impresa che intende
    assumerlo, con sottoscrizione del Progetto Formativo: non verificabile con il profilo.'
  fonte: Regione Toscana, pagina 1
  citazione: sono individuati esclusivamente dal Centri per l'impiego (Cpi) di riferimento
note:
- Gli inoccupati sono stati ricondotti a condizione_lavorativa 'disoccupato'.
- I requisiti devono essere posseduti alla data di presentazione della domanda di finanziamento del voucher.
- La domanda va presentata entro 15 giorni dalla data di sottoscrizione/protocollo del Progetto Formativo; domande a sportello
  con scadenze mensili (ultimo giorno di ogni mese), salvo chiusura anticipata per esaurimento risorse.
- Il corso deve essere scelto nel Catalogo dell'offerta formativa just in time; esclusi i corsi su sicurezza e pronto soccorso.
