apertura: '2025-11-01'
chiusura: '2027-12-31'
fonte: documento Regione Toscana, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-24'
requisiti:
- campo: eta
  operatore: '>='
  valore: 18
  fonte: Regione Toscana, pagina 1
  citazione: che abbiano compiuto i 18 anni di età;
- campo: condizione_lavorativa
  operatore: in
  valori:
  - disoccupato
  - inattivo
  - studente
  - pensionato
  fonte: Regione Toscana, pagina 1
  citazione: disoccupati, inoccupati, inattivi con o senza strumenti a sostegno del reddito
- almeno_uno_di:
  - campo: condizione_lavorativa
    operatore: in
    valori:
    - inattivo
    - studente
    - pensionato
  - non_modellabile: 'Iscrizione a un Centro per l''impiego della Toscana (richiesta a disoccupati e inoccupati): manca il
      campo.'
  fonte: Regione Toscana, pagina 1
  citazione: iscritti presso un Centro per l’impiego della Toscana (iscrizione non richiesta per gli inattivi)
- almeno_uno_di:
  - campo: regione
    operatore: in
    valori:
    - Toscana
  - campo: regione_domicilio
    operatore: in
    valori:
    - Toscana
  fonte: Regione Toscana, pagina 1
  citazione: residenti o domiciliati in un Comune della regione Toscana
- almeno_uno_di:
  - campo: cittadinanza
    operatore: in
    valori:
    - italiana
    - ue
  - tutti_di:
    - campo: cittadinanza
      operatore: in
      valori:
      - familiare_con_diritto_soggiorno
      - extra_ue_lungo_periodo
      - protezione_internazionale
      - apolide
      - altro_titolo
    - non_modellabile: 'Per i cittadini non comunitari, permesso di soggiorno regolare che consente attività lavorativa: il
        vocabolario non dice se il titolo consente di lavorare.'
  fonte: Regione Toscana, pagina 1
  citazione: se cittadini non comunitari devono essere anche in possesso di regolare permesso di soggiorno che consente attività
    lavorativa
- non_modellabile: 'Il destinatario deve essere individuato dal Centro per l''impiego e selezionato da un''impresa interessata
    ad assumerlo, con Progetto Formativo sottoscritto e domanda presentata entro 15 giorni dal suo protocollo: mancano i campi.'
  fonte: Regione Toscana, pagina 1
  citazione: I potenziali beneficiari del voucher Just in Time sono individuati esclusivamente dal Centri per l'impiego (Cpi)
    di riferimento.
note:
- 'Destinatari: disoccupati, inoccupati e inattivi; ''inoccupati'' è disoccupato e ''inattivi'' comprende studenti e pensionati,
  quindi sono ammessi tutti i non occupati.'
- I requisiti devono essere posseduti alla data di presentazione della domanda di finanziamento del voucher.
- Domande a sportello dal 01.11.2025 al 31 dicembre 2027, con scadenze mensili; il percorso va scelto nel Catalogo just in
  time (esclusi i corsi su sicurezza e pronto soccorso).
