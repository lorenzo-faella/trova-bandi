id: toscana-voucher-formativi-just-in-time-per-loccu-dbdf71
titolo: 'Voucher formativi Just in Time per l’occupabilità 2.0: il bando 2025'
ente: Regione Toscana
link: https://www.regione.toscana.it/-/voucher-formativi-just-in-time-per-l-occupabilit%C3%A0-2-0-il-bando-2025
apertura: '2025-11-01'
chiusura: '2027-12-31'
fonte: documento Regione Toscana, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti:
- campo: eta
  operatore: '>='
  valore: 18
  fonte: Regione Toscana, pagina web
  citazione: che abbiano compiuto i 18 anni di età;
- campo: condizione_lavorativa
  operatore: in
  valori:
  - disoccupato
  - inattivo
  fonte: Regione Toscana, pagina web
  citazione: 'Persone in cerca di occupazione: disoccupate/i, inoccupate/i, inattive/i'
- almeno_uno_di:
  - campo: condizione_lavorativa
    operatore: in
    valori:
    - inattivo
  - non_modellabile: 'Iscrizione presso un Centro per l''impiego della Toscana, richiesta a disoccupati e inoccupati: manca
      un campo.'
  fonte: Regione Toscana, pagina web
  citazione: Toscana (iscrizione non richiesta per gli inattivi);
- almeno_uno_di:
  - campo: regione
    operatore: in
    valori:
    - Toscana
  - campo: regione_domicilio
    operatore: in
    valori:
    - Toscana
  fonte: Regione Toscana, pagina web
  citazione: Residenti o domiciliate/i in un comune della Regione Toscana
- almeno_uno_di:
  - campo: cittadinanza
    operatore: in
    valori:
    - italiana
    - ue
    - familiare_con_diritto_soggiorno
    - extra_ue_lungo_periodo
    - protezione_internazionale
    - apolide
  - tutti_di:
    - campo: cittadinanza
      operatore: in
      valori:
      - altro_titolo
    - non_modellabile: 'Il permesso di soggiorno deve consentire l''attività lavorativa: il vocabolario non distingue i titoli
        che lo consentono.'
  fonte: Regione Toscana, pagina web
  citazione: se cittadini non comunitari devono essere anche in possesso di regolare permesso di soggiorno che consente attività
    lavorativa.
- non_modellabile: 'Essere individuati dal Centro per l''impiego e selezionati da un''impresa che intende assumere, con Progetto
    Formativo sottoscritto; la domanda va presentata entro 15 giorni dal protocollo del Progetto Formativo: mancano i campi.'
  fonte: Regione Toscana, pagina web
  citazione: I potenziali beneficiari del voucher Just in Time sono individuati esclusivamente dal Centri per l'impiego (Cpi)
    di riferimento.
note:
- 'Gli inoccupati sono ammessi come i disoccupati: si è usato il valore disoccupato, perché il vocabolario non distingue.'
- Sono ammessi anche i percettori di strumenti di sostegno al reddito, compreso il reddito di cittadinanza.
- Domande a sportello con scadenze mensili (l'ultimo giorno di ogni mese); l'Avviso può essere sospeso o chiuso prima per
  esaurimento delle risorse.
- Il percorso deve essere scelto nel Catalogo dell'offerta formativa just in time; sono esclusi i corsi su sicurezza e pronto
  soccorso.
