note:
- 'Il bando riguarda l''a.a. 2024/2025 ed è a sportello fino a esaurimento dei fondi: il testo non indica date di apertura
  e chiusura.'
- 'Il servizio mensa (un pasto gratuito al giorno) spetta indipendentemente dal reddito e da altri contributi. Per il solo
  servizio alloggio servono anche ISEE universitario non superiore a 25.000 euro, ISPE non superiore a 55.000 euro e nessun
  contributo per la frequenza del corso da altri enti: non li ho messi tra i requisiti generali perché il bando resta accessibile
  per la mensa senza di essi.'
- L'articolo 6, richiamato per il servizio alloggio, non è stato ricevuto.
- Per 'studenti stranieri' ho incluso tutte le cittadinanze diverse da quella italiana, comprese quelle UE.
- Per fare domanda non serve essere già iscritti, ma l'iscrizione al corso deve risultare prima di usare i servizi.
