note:
- Il servizio mensa spetta senza limiti di reddito; solo il servizio alloggio richiede ISEE per prestazioni universitarie
  non superiore a 25.000 euro, ISPE non superiore a 55.000 euro e nessun contributo per la frequenza da altri enti (art. 5).
  Non sono messi come requisiti generali perché non servono per la mensa.
- L'art. 6, richiamato per il servizio alloggio, non è nel testo ricevuto.
- Non è necessaria l'iscrizione al corso al momento della domanda, ma va effettuata prima di fruire dei servizi.
- 'Bando a sportello per l''a.a. 2024/2025, fino a esaurimento fondi: nessuna data indicata. Domanda solo online sul Portale
  studenti ADISU con SPID, CIE o CNS.'
