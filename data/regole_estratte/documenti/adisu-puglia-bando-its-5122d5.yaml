note:
- Il bando è per studenti ITS; il questionario chiede ISEE universitario e ISPE solo a chi è iscritto a università o AFAM,
  ma il bando richiede proprio l'ISEE per prestazioni universitarie e l'ISPE, quindi si usano quei campi.
- 'Gli studenti di nuclei residenti all''estero devono documentare redditi e patrimoni esteri con certificazioni delle autorità
  del Paese: è un adempimento documentale, non un requisito.'
- L'attestazione ISEE deve essere richiesta entro la scadenza della domanda di borsa.
- 'Benefici: borse di studio, ristorazione, alloggio (solo fuori sede), contributi per tirocinio all''estero.'
