note:
- Bando per l'A.A. 2025/2026 riservato agli iscritti a un corso biennale o triennale di uno degli ITS Academy pugliesi elencati;
  la lista dei comuni delle sedi è un'approssimazione del requisito, che riguarda gli istituti precisi.
- 'Il vocabolario chiede isee_universitario e ispe solo a chi è iscritto a università o AFAM: per gli studenti ITS la domanda
  potrebbe non essere posta e l''esito restare ''mancano dati''.'
- L'attestazione ISEE 2026 deve essere richiesta prima della scadenza della domanda e riportare la dicitura per il diritto
  allo studio universitario; gli studenti con nucleo all'estero devono allegare la documentazione dei redditi esteri entro
  la scadenza (procedura, non requisito).
- 'Il bando ammette studenti italiani e stranieri: nessun vincolo di cittadinanza.'
- Le cause di decadenza (debiti verso l'ADISU, dichiarazioni non veritiere) e la rinuncia agli studi entro il 31/10/2026 riguardano
  la perdita del beneficio e non sono state modellate.
