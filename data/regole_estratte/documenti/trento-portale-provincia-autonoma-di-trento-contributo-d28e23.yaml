id: trento-portale-provincia-autonoma-di-trento-contributo-d28e23
titolo: Provincia Autonoma di Trento - Contributo al maestro artigiano per tirocini - Int. 1.4 bis
ente: Provincia autonoma di Trento
link: https://www.provincia.tn.it/Servizi/Tirocini-Int.-1.4
apertura: null
chiusura: null
fonte: documento Provincia autonoma di Trento, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti:
- almeno_uno_di:
  - tutti_di:
    - campo: condizione_lavorativa
      operatore: in
      valori:
      - disoccupato
    - non_modellabile: 'Disoccupazione da più di 6 mesi con fragilità personale, valutata con la profilazione qualitativa:
        mancano i campi.'
    citazione: disoccupati da più di 6 mesi con fragilità personale
  - tutti_di:
    - campo: condizione_lavorativa
      operatore: in
      valori:
      - disoccupato
    - campo: eta
      operatore: '>'
      valore: 29
    - non_modellabile: 'Assenza dal mercato del lavoro da più di 12 mesi: manca il campo.'
    citazione: disoccupati di età superiore ai 29 anni e assenti dal mercato del lavoro da più di 12 mesi
  - non_modellabile: 'Giovani NEET: la scheda non ne dà la definizione (età, studio, formazione).'
    citazione: giovani NEET
  - tutti_di:
    - campo: condizione_lavorativa
      operatore: in
      valori:
      - disoccupato
    - campo: eta
      operatore: tra
      valore:
      - 16
      - 18
    citazione: disoccupati di età compresa tra i 16 e 18 anni
  - tutti_di:
    - campo: condizione_lavorativa
      operatore: in
      valori:
      - disoccupato
    - non_modellabile: 'Difficoltà occupazionale alta secondo la profilazione qualitativa: manca il campo.'
    citazione: disoccupati con difficoltà occupazionale alta in seguito alla profilazione qualitativa applicata
  - tutti_di:
    - campo: condizione_lavorativa
      operatore: in
      valori:
      - disoccupato
    - non_modellabile: 'Condizione di svantaggio del richiedente: `svantaggio_certificato` esiste solo per i componenti del
        nucleo e la scheda non definisce lo svantaggio.'
    citazione: disoccupati in condizione di svantaggio
  - campo: disabile
    operatore: vero
    citazione: persone con disabilità
  fonte: Provincia autonoma di Trento, pagina web
  citazione: '1) persona interessata a svolgere un tirocinio rientrante in almeno una delle seguenti categorie:'
note:
- Il contributo è erogato al maestro artigiano che ospita il tirocinio; la scheda indica come destinatari sia la persona tirocinante
  sia l'azienda ospitante. Qui si modellano le categorie di persone ammesse al tirocinio.
- 'La scheda non dice che serva la residenza o il domicilio in provincia di Trento: non è stato aggiunto un requisito territoriale.'
- La sezione Tempi e scadenze è vuota.
