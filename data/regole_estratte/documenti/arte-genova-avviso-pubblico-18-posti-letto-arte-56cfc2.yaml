  fonte: ARTE Genova - Azienda regionale territoriale per l'edilizia, pagina 4
  citazione: c) sono già titolari di un posto alloggio di A.R.T.E. per l'a.a. 2026/2027;
note:
- La domanda si invia via e-mail a info@arte.ge.it dalla pubblicazione dell'avviso (data non indicata nel testo) fino al 30/04/2027.
  I posti sono assegnati fino a esaurimento.
- '''Savana'' nel testo va letto come Savona.'
- I laureandi dell'a.a. 2025/2026 che si laureano entro il 26/2/2027 e hanno almeno l'80% dei crediti al 10 agosto 2026 (31
  ottobre 2026 per le Professioni sanitarie) possono chiedere il posto senza iscriversi al 2026/2027.
- Per gli ITS il requisito per gli anni successivi è non aver mai ripetuto un anno; il vocabolario chiede fuori_corso_o_ripetente
  solo a università e AFAM, quindi per gli ITS l'esito può restare 'mancano dati'.
- Il requisito h) è stato letto come esclusione dei minorenni e di chi vuole alloggiare con un figlio minore.
