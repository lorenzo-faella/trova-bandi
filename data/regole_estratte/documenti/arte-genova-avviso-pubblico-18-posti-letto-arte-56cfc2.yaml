note:
- Le domande si presentano dalla data di pubblicazione dell'avviso, che il testo non riporta, fino al 30/04/2027.
- 'I laureandi 2025/2026 con almeno l''80% dei crediti possono chiedere il posto senza iscriversi al 2026/2027: questa via
  alternativa non è modellata.'
- 'La frase sui minorenni ("sono minorenni o con figli minori e richiedono di alloggiare assieme al proprio figlio") è ambigua:
  non è chiaro se i minorenni siano esclusi in ogni caso, quindi non ho scritto un requisito sull''età.'
- 'Il posto ARTE è incompatibile con il posto alloggio gratuito di altri enti per il diritto allo studio: lo studente deve
  scegliere, quindi non è un requisito di accesso.'
- L'articolo 12 (requisiti per confermare il posto l'anno successivo) non riguarda l'accesso e non è modellato.
