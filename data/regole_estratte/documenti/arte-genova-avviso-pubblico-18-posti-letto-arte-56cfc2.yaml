    di studio per ciascun livello (niente secondo titolo dello stesso livello).
  fonte: ARTE Genova - Azienda regionale territoriale per l'edilizia, pagina 2
  citazione: b) iscritti a tempo pieno, limitatamente al conseguimento del primo titolo di studio per
- almeno_uno_di:
