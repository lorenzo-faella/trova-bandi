  - campo: fuori_corso_o_ripetente
    operatore: falso
  fonte: ARTE Genova - Azienda regionale territoriale per l'edilizia, pagina 2
  citazione: • non devono risultare iscritti a un fuori corso e/ o anno ripetente;
- almeno_uno_di:
  - campo: anno_di_corso
    operatore: <=
    valore: 1
  - campo: iscrizione
    operatore: in
    valori:
    - its
  - non_modellabile: 'Iscritti ad anni successivi al primo all''università o all''AFAM: almeno 20 CFU acquisiti dal 1° settembre
      2025 e registrati al 10 agosto 2026 (il vocabolario ha solo i crediti totali).'
  fonte: ARTE Genova - Azienda regionale territoriale per l'edilizia, pagina 2
  citazione: • devono aver sostenuto a partire dal 1° settembre 2025 almeno 20 CFU acquisti e registrati
- campo: eta
  operatore: '>='
  valore: 18
  fonte: ARTE Genova - Azienda regionale territoriale per l'edilizia, pagina 4
  citazione: h) sono minorenni o con figli minori e richiedono di alloggiare assieme al proprio figlio;
- non_modellabile: Esclusi chi ha figli minori e chiede di alloggiare con il figlio, chi ha già un posto alloggio ARTE o un
