id: fvg-ristori-ai-soggetti-privati-per-i-danni-6c6d61
titolo: Ristori ai soggetti privati per i danni occorsi al patrimonio edilizio abitativo e ai beni mobili dagli eventi meteorologici
  verificatisi dal 13 luglio 2023 al 6 agosto 2023 Da lunedì 15 dicembre 2025, la Protezione civile della Regione è individuata
  quale ente attuatore del procedimento contributivo. Informazioni aggiornate sono disponibili sul sito Internet della Protezione
  civile della Regione.
ente: Regione Autonoma Friuli Venezia Giulia
link: https://www.regione.fvg.it/rafvg/cms/RAFVG/infrastrutture-lavori-pubblici/lavori-pubblici/edilizia/FOGLIA5/
