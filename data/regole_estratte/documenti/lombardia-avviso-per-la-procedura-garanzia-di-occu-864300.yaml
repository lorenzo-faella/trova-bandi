requisiti:
- campo: condizione_lavorativa
  operatore: in
  valori:
  - disoccupato
  fonte: Regione Lombardia, pagina web
  citazione: Possono presentare domanda tutti i disoccupati residenti e/o domiciliati in Lombardia
- almeno_uno_di:
  - campo: regione
    operatore: in
    valori:
    - Lombardia
  - campo: regione_domicilio
    operatore: in
    valori:
    - Lombardia
  fonte: Regione Lombardia, pagina web
  citazione: residenti e/o domiciliati in Lombardia
note:
- Nessun limite di genere, età o durata della disoccupazione; sono inclusi i percettori di NASPI, DIS-COLL, Supporto per la
  formazione e il lavoro e Assegno di inclusione.
- La chiusura per i cittadini è il 30/06/2026 ore 12, salvo ulteriori proroghe; per gli operatori il termine è il 31/01/2027.
- La domanda si presenta tramite i Centri per l'Impiego o gli operatori accreditati ai servizi al lavoro di Regione Lombardia.
