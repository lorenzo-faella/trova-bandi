note:
- Nessun limite di genere, età o durata della disoccupazione; sono inclusi i beneficiari di NASPI, DIS-COLL, Supporto per
  la formazione e il lavoro e Assegno di inclusione.
- La domanda di dote si presenta tramite i Centri per l'Impiego o gli operatori accreditati ai servizi al lavoro di Regione
  Lombardia.
- Il documento non indica una data di apertura delle domande (solo la pubblicazione il 20/06/2022); per i cittadini la presentazione
  termina, salvo proroghe, il 30 giugno 2026 alle 12:00 (per gli operatori il 31 gennaio 2027).
