titolo: Avviso per la procedura "Garanzia di Occupabilità dei Lavoratori - GOL"
ente: Regione Lombardia
link: https://www.bandi.regione.lombardia.it/servizi/servizio/catalogo/dettaglio/istruzione-formazione-lavoro/lavoro-occupazione/garanzia-occupabilit-lavoratori-RLW12022024883
apertura: '2022-06-20'
chiusura: '2026-06-30'
fonte: documento Regione Lombardia, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
