note:
- Il contributo rimborsa tassa regionale, tasse universitarie o rette ITS dell'a.a. 2024/2025, fino a 3.150 euro (atenei,
  AFAM, SSML) o 4.809,50 euro (ITS).
- La soglia ISEE vale per l'ISEE universitario o l'ISEE corrente usato per le tasse dell'a.a. 2024-2025; il questionario chiede
  l'ISEE universitario solo a università e AFAM, quindi per gli studenti ITS il dato resterà mancante.
- 'Date in conflitto: l''avviso dice domande dal 4 al 25 giugno 2025, la pagina web indica la scadenza alle 16:00 del 4 luglio
  2025; si usa la data della pagina web, probabilmente aggiornata.'
- La documentazione sulle condizioni di vittima rimanda all'art. 3 dell'avviso, che non è tra le sezioni ricevute.
