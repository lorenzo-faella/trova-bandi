- non_modellabile: 'Iscrizione presso istituzioni piemontesi: il vocabolario non indica la sede del corso.'
  fonte: EDISU Piemonte, pagina 3
  citazione: scuole superiori per mediatori linguistici piemontesi
- non_modellabile: 'Appartenere a una delle categorie previste: figli di vittime del terrorismo e della criminalità organizzata
    (L. 407/1998), di vittime del dovere (L. 266/2005), soggetti della L. 206/2004, figli di vittime di violenza domestica
    o di genere (L.R. 4/2016), figli di vittime di infortuni sul lavoro mortali o invalidanti, e loro familiari e superstiti
    dove previsto.'
  fonte: EDISU Piemonte, pagina 3
  citazione: figlie o figli delle vittime di infortuni sul lavoro che hanno causato il decesso o la inabilità
- non_modellabile: 'Non aver compiuto 40 anni al momento della domanda: il vocabolario ha l''età solo per i componenti del
    nucleo, non per il richiedente.'
  fonte: EDISU Piemonte, pagina 5
  citazione: non devono aver compiuto quaranta anni al momento della domanda
- almeno_uno_di:
  - campo: anno_di_corso
    operatore: <
    valore: 2
  - campo: disabile
    operatore: vero
  - non_modellabile: 'Anni successivi al primo: per i corsi universitari, AFAM e mediatori linguistici almeno 20 CFU nell''anno
      accademico precedente (entro il 30 novembre 2024 per il 2° anno, dal 1 dicembre 2023 al 30 novembre 2024 per gli anni
      successivi); per gli ITS l''ammissione al secondo anno formativo.'
  fonte: EDISU Piemonte, pagina 5
  citazione: del conseguimento di almeno 20 CFU per l’anno accademico precedente a quello di iscrizione
- almeno_uno_di:
  - campo: titolo_di_studio
    operatore: in
    valori:
    - nessuno
    - licenza_media
    - diploma
    - laurea_triennale
  - non_modellabile: Chi ha già una laurea specialistica o magistrale, un diploma accademico di secondo livello o un diploma
      di specializzazione ITS è ammesso solo se iscritto a un corso per proseguire gli studi a un livello superiore; il master
      non è nominato.
  fonte: EDISU Piemonte, pagina 5
  citazione: non devono essere già in possesso di una laurea specialistica/magistrale, di un diploma accademico di
- campo: isee_universitario
  operatore: <=
  valore: 85500
  fonte: EDISU Piemonte, pagina 5
  citazione: è fissato in euro 85.500,00
note:
- 'Le date non coincidono: l''avviso (art. 7) dice che le domande si presentano dal 4 al 25 giugno 2025, la pagina web fissa
  la scadenza alle ore 16:00 del 4 luglio 2025. Si è scelta la data della pagina web, forse una proroga. Il bando si riferisce
  all''a.a. 2024/2025 e risulta scaduto.'
- 'L''esenzione dal requisito di merito vale per gli studenti con disabilità ai sensi della L. 104/1992: il campo disabilità
  lo approssima.'
- Al posto dell'ISEE universitario si può usare l'ISEE corrente; per gli studenti ITS il questionario potrebbe non chiedere
  l'ISEE universitario.
- Non è chiaro se l'aggettivo 'piemontesi' valga per tutte le istituzioni o solo per le scuole per mediatori linguistici;
  l'ente è regionale, quindi è stato scritto come requisito generale da verificare.
- Gli articoli 3 e 4 dell'avviso, citati per i requisiti, non sono tra le sezioni ricevute; la documentazione sulle categorie
  va allegata alla domanda.
