id: ersu-cagliari-pubblicato-il-bando-unico-di-concorso-pe-f00ac3
titolo: Pubblicato il bando unico di concorso per borse di studio e posto alloggio anno accademico 2026/2027
ente: ERSU Cagliari
link: https://www.ersucagliari.it/novita/pubblicato-il-bando-di-concorso-unico-per-borse-di-studio-e-posto-alloggio-anno-accademico-2026-2027/
apertura: '2026-07-15'
chiusura: '2026-08-28'
fonte: documento ERSU Cagliari, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-13'
requisiti:
- non_modellabile: Iscrizione (o futura iscrizione al primo anno) a uno dei corsi previsti dall'articolo 1 del bando, non
    riportato nel testo ricevuto.
  fonte: ERSU Cagliari, pagina web
  citazione: Le studentesse e gli studenti che intendono iscriversi al primo anno dei corsi previsti dall’articolo 1 del bando
    possono presentare la domanda di partecipazione al concorso anche se non ancora immatricolati.
- non_modellabile: Attestazione ISEE 2026 per le prestazioni per il diritto allo studio universitario senza annotazioni di
    omissioni o difformità (ISEEU parificato per gli stranieri); le soglie sono nel bando, non riportato.
  fonte: ERSU Cagliari, pagina web
  citazione: Per partecipare al concorso è necessario richiedere l’attestazione ISEE 2026
note:
- 'La pagina è un avviso di pubblicazione: requisiti di merito, economici e corsi ammessi sono nel bando unico, non ricevuto.'
- Possono partecipare anche gli iscritti al semestre filtro di Medicina e Odontoiatria dell'Università di Cagliari; chi lo
  conclude in un altro ateneo ha una finestra aggiuntiva dopo la graduatoria nazionale MUR.
- Domanda sul Portale dello Studente dal 15 luglio 2026 alle ore 13:00 del 28 agosto 2026.
