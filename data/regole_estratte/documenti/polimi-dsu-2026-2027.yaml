note:
- 'Termini perentori (ore 12:00): 21 luglio 2026 per chi si iscrive agli anni successivi (anche dottorato e specializzazione),
  5 agosto 2026 per i primi anni e per il semestre aperto. La chiusura indicata è la più tarda; l''apertura non è indicata
  nelle sezioni ricevute. Il bando risulta già chiuso.'
- 'Entro gli stessi termini va sottoscritta la DSU per l''ISEE Università (o consegnata al CAF convenzionato la documentazione
  per l''ISEEU parificato), a pena di inammissibilità: è procedura, non requisito.'
- 'I valori limite ISEE/ISPE, ISEEU/ISPEU e il reddito minimo dello studente indipendente saranno pubblicati con un''integrazione
  al bando: quando usciranno, il requisito economico potrà diventare una soglia su isee_universitario e ispe.'
- 'Per i primi anni il merito (35/40 CFU, 17 CFU per la magistrale dal II semestre, entro il 10 agosto 2027) serve solo a
  confermare la borsa dopo l''assegnazione: non è un requisito d''accesso e non è stato modellato.'
- 'Chi si reimmatricola dopo rinuncia, decadenza o trasferimento concorre con il profilo ''anni successivi'' per il principio
  di prima immatricolazione assoluta: anno_di_corso <= 1 può quindi far passare per primo anno chi in realtà deve rispettare
  i CFU degli anni successivi.'
- 'Titolo di studio: ''master'' è ammesso per chi si iscrive alla magistrale perché un master di I livello non supera la laurea
  magistrale, ma un master di II livello sì; il vocabolario non distingue.'
- 'Il servizio abitativo a tariffa agevolata (Art. 22) è riservato a chi non risiede in un comune di area urbana da cui si
  raggiunge la sede in 90 minuti con i mezzi pubblici: condizione propria dell''alloggio, non della borsa, e non modellata.'
- 'L''iscrizione va perfezionata entro i termini dello scadenzario accademico (pagamento della prima rata): non modellato
  perché procedura.'
- 'Le sezioni ricevute rimandano agli artt. 13, 14.1, 18.2 e 31, che non ho: il numero di borse, lo status di fuori sede e
  le revoche lì descritti non sono considerati.'
