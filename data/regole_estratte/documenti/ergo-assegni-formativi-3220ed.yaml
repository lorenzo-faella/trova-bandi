id: ergo-assegni-formativi-3220ed
titolo: Assegni formativi
ente: ER.GO - Azienda regionale per il diritto agli studi superiori
link: https://www.er-go.it/esplora-i-benefici/benefici-erogati-da-er.go/assegni-formativi
apertura: null
chiusura: '2026-12-10'
fonte: documento ER.GO - Azienda regionale per il diritto agli studi superiori, estratto con LLM (Claude Code, claude-opus-5-5),
  non rivisto
pubblico: persone
ultimo_controllo: '2026-11-19'
requisiti:
- campo: residente_italia
  operatore: vero
  fonte: ER.GO - Azienda regionale per il diritto agli studi superiori, pagina web
  citazione: Devi essere residente in Italia.
- campo: isee
  operatore: <=
  valore: 40000
  fonte: ER.GO - Azienda regionale per il diritto agli studi superiori, pagina web
  citazione: L'indicatore ISEE del tuo nucleo familiare non deve essere superiore a € 40.000.
- campo: ispe
  operatore: <=
  valore: 62000
  fonte: ER.GO - Azienda regionale per il diritto agli studi superiori, pagina web
  citazione: L'indicatore ISPE non deve essere superiore a € 62.000.
- almeno_uno_di:
  - campo: titolo_di_studio
    operatore: in
    valori:
    - laurea_triennale
    - laurea_magistrale
    - master
    - dottorato
  - non_modellabile: 'Diploma AFAM di primo o secondo livello: il vocabolario non ha i titoli AFAM.'
  fonte: ER.GO - Azienda regionale per il diritto agli studi superiori, pagina web
  citazione: Devi essere in possesso di un titolo di laurea oppure di un diploma di primo o secondo livello (nel caso degli
    AFAM)
- non_modellabile: Il titolo di laurea o il diploma AFAM deve essere stato conseguito in Emilia-Romagna, entro il primo anno
    fuori corso.
  fonte: ER.GO - Azienda regionale per il diritto agli studi superiori, pagina web
  citazione: conseguito in Emilia-Romagna, entro il primo anno fuori corso
- campo: iscrizione_postlaurea_ergo
  operatore: vero
  fonte: ER.GO - Azienda regionale per il diritto agli studi superiori, pagina web
  citazione: Devi essere regolarmente iscritto a Master, Corsi di Alta Formazione e Specializzazione di durata non inferiore
    ad un anno
- non_modellabile: 'Il corso postlaurea deve svolgersi all’estero, durare almeno un anno e rilasciare un titolo successivo
    alla laurea. Verificare programma e certificato di iscrizione con ER.GO: la sede legale dell’ateneo non dimostra il luogo
    del corso.'
  fonte: ER.GO - Azienda regionale per il diritto agli studi superiori, pagina web
  citazione: di durata non inferiore ad un anno, che rilasciano un titolo di studio successivo alla laurea
note:
- 'La pagina parla di indicatore ISEE senza dire se sia quello per il diritto allo studio universitario: ho usato isee.'
- Altri dettagli (modulo, modalità) sono nel bando, che non è nel testo ricevuto.
- 'Periodo e tipo dell’attestazione ISEE/ISPE vanno confermati sul bando completo: la pagina generale non li precisa. Non
  usare automaticamente un ISEE universitario diverso da quello richiesto.'
provenienza:
  rettifica_successiva:
