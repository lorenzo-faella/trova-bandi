note:
- 'Le istituzioni ammesse (Tabella 1) sono l''Università degli Studi di Messina e il Conservatorio "A. Corelli" di Messina;
  la sede è resa con provincia_ateneo Messina più i comuni delle sedi distaccate di Noto e Priolo citate all''art. 23 (ERSU
  Messina, pagina 34: "frequentano le sedi universitarie di Messina e distaccate di Noto e"). Il nome ISTAT ''Priolo Gargallo''
  è un''interpretazione di ''Priolo''.'
- 'Il requisito di merito degli anni successivi rimanda alle tabelle 5.1, 5.3 e 5.4 e alle Linee guida in appendice, che non
  sono nel testo ricevuto; è riportata solo la tabella 5.2 (studenti con disabilità o DSA, corsi con 60 CFU l''anno: laurea
  triennale 15/48/81/114, magistrale biennale 18/48/81, ciclo unico 15/48/81/114/147/180/213), non usata da sola perché la
  sua applicazione dipende dalla distribuzione dei CFU del corso. Per le matricole il merito (15 CFU entro il 10/08/2027 e
  20 entro il 30/11/2027) è verificato dopo e serve al saldo della borsa, quindi non è un requisito d''accesso. Gli iscritti
  al quarto anno della ''prosecuzione laurea triennale'' sono valutati come i primi anni.'
- 'Non modellati perché procedurali: essere in regola con la tassa regionale per il diritto allo studio, regolarizzare l''iscrizione
  entro il 21/04/2027, attestazione ISEE senza omissioni o difformità, ISEE parificato per gli studenti internazionali entro
  il 16/09/2026 (o il 30/11/2026), PEC personale. Chi ha rinunciato agli studi o è decaduto può partecipare pagando le tasse
  e restituendo i benefici entro il 21/04/2027.'
- Gli iscritti al TFA sono esclusi; i corsi di specializzazione e dottorato non hanno il bonus. L'incompatibilità con altre
  borse e collaborazioni (art. 5) è una regola di cumulo, non un requisito d'accesso. Le borse riservate (disabilità, paesi
  poveri, orfani di vittime del lavoro o di mafia, isole minori ecc.) riguardano la ripartizione, non l'idoneità.
- Per gli studenti che si immatricolano a Messina nel secondo semestre dopo il semestre filtro in altro ateneo è previsto
  un addendum non incluso.
