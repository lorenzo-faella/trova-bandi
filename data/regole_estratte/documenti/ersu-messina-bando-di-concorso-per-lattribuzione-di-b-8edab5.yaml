note:
- Il bando riguarda borsa di studio, servizio abitativo, contributo di locazione e altri benefici; i requisiti estratti sono
  quelli comuni per la borsa di studio. Apertura e chiusura sono il periodo di compilazione della domanda di borsa e servizio
  abitativo (1 luglio 2026 - 18 agosto 2026 ore 14:00); la manifestazione di interesse al posto letto e la dichiarazione di
  locazione vanno dal 16 ottobre 2026 all'8 gennaio 2027, il premio di laurea dal 1 al 30 aprile 2027.
- L'ISEE deve essere quello per le prestazioni per il diritto allo studio universitario, in corso di validità e senza omissioni/difformità
  (oppure con documentazione dell'intermediario); gli studenti internazionali con redditi o patrimonio all'estero usano l'ISEEU/ISPEU
  parificato, che il campo isee_universitario approssima.
- 'Per i primi anni il merito (15 CFU entro il 10/08/2027 e 20 entro il 30/11/2027, 9 e 12 per disabili e DSA) è verificato
  dopo: se non raggiunto si perdono saldo o benefici, quindi non è un requisito d''accesso.'
- Laureandi e iscritti con riserva alla magistrale possono partecipare con riserva; gli iscritti al 'semestre filtro' di Medicina,
  Odontoiatria e Veterinaria sono ammessi, con un addendum per chi si iscrive presso altro ateneo.
- 'Condizioni per mantenere i benefici, non modellate: regolarizzare l''iscrizione all''ateneo e pagare la tassa regionale
  entro il 21 aprile 2027, possedere una PEC personale, comunicare le variazioni.'
- 'Le borse ERSU sono incompatibili con altre borse e collaborazioni universitarie, ma è previsto il conguaglio: è una regola
  di cumulo, non un requisito.'
- Le borse riservate (disabili, studenti da paesi poveri, rifugiati, orfani di vittime del lavoro o di mafia, vittime dell'usura,
  residenti nelle isole minori, ospiti di strutture di accoglienza) sono quote all'interno della graduatoria, non requisiti
  aggiuntivi.
- 'Il contributo di locazione richiede inoltre lo status di fuori sede (vincitori di borsa che non ottengono il posto letto)
  e un contratto registrato di almeno 10 mesi: non modellato perché riguarda un beneficio accessorio.'
