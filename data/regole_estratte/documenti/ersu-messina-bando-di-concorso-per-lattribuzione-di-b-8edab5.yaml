note:
- 'Il testo ricevuto non contiene i termini per presentare la domanda: gli articoli 3 e 20 hanno solo il titolo, quindi apertura
  e chiusura restano null.'
- 'Mancano nel testo ricevuto il contenuto degli articoli sulla durata dei benefici (art. 7) e sulla revoca (art. 13), e le
  tabelle dei crediti in appendice: limiti sugli anni fuori corso e soglie di CFU non sono verificati.'
- 'Per gli iscritti al primo anno il merito è valutato ex post al saldo della borsa: non è un requisito di accesso.'
- L'iscrizione all'ateneo e il pagamento della tassa regionale vanno regolarizzati entro il 21 aprile 2027, pena l'esclusione
  dalle graduatorie.
- Le borse ERSU sono incompatibili con altre borse e collaborazioni universitarie, ma è previsto un conguaglio, quindi non
  è stato scritto come requisito.
- Possono partecipare con riserva i laureandi entro la sessione straordinaria 2025/26 e gli iscritti con riserva alla magistrale;
  gli studenti internazionali presentano ISEEU/ISPEU parificato.
