note:
- 'Date: domanda di borsa di studio e servizio abitativo dal 1 luglio 2026 alle ore 14:00 del 18 agosto 2026. La manifestazione
  di interesse per il posto letto e la dichiarazione di locazione vanno dal 16 ottobre 2026 all''8 gennaio 2027; il premio
  di laurea dal 1 al 30 aprile 2027.'
- 'Bisogna essere in regola con la tassa regionale per il diritto allo studio e regolarizzare l''iscrizione entro il 21 aprile
  2027: adempimento amministrativo, lasciato nelle note.'
- Le tabelle in appendice (1 istituzioni, 4 merito primo anno, 5.1-5.4 CFU anni successivi, 6 limiti economici) non sono nel
  testo ricevuto.
- Il merito del primo anno (tabella 4) è verificato ex post per mantenere la borsa e non è un requisito di accesso.
- 'L''incompatibilità con altre borse (art. 5) dà diritto al conguaglio degli importi: riguarda quanto si riceve, non l''accesso.'
- Studenti laureandi iscritti con riserva e semestre filtro hanno regole particolari (art. 6) non modellate.
