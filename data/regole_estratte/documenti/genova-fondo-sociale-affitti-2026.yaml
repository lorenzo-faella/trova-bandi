note:
- 'Il rimborso riguarda il canone pagato nel 2025: il campo canone_annuo è riferito all''affitto attuale, che può essere diverso
  da quello del 2025.'
- Il campo contratto_locazione_registrato accetta un contratto a nome di un familiare, mentre il bando vuole che il richiedente
  sia intestatario del contratto.
- Il valore immobiliare del bando è quello di riferimento IMU di tutti i componenti residenti; il campo patrimonio_immobiliare
  esclude la casa di abitazione e potrebbe essere calcolato in modo diverso.
- 'Tutti i residenti nell''alloggio devono essere in un''attestazione ISEE presentata entro il 15/04/2026, pena il rigetto:
  è un adempimento di domanda, non un requisito.'
- I requisiti vanno posseduti alla data di pubblicazione del bando e mantenuti fino al termine della procedura.
- Domanda sul Modello A, per raccomandata A.R., a mano all'Archivio Protocollo Generale o via PEC personale; in caso di coabitazione
  di più nuclei una sola domanda dal nucleo del titolare del contratto.
- Il riferimento a famiglie con più di cinque componenti per la superficie e la tabella dei metri quadri minimi per l'alloggio
  adeguato non sono esprimibili con i campi disponibili.
