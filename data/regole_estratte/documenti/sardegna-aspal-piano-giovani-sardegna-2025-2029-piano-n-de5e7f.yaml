note:
- 'Il tirocinio richiede anche un soggetto ospitante (datore di lavoro con sede in Sardegna) che presenti la richiesta di
  abbinamento sul portale SardegnaLavoro: è una condizione procedurale, non modellata.'
- 'Per il tirocinio High Competence (tipologia B) il tirocinante deve avere anche un titolo post-laurea (master, dottorato,
  scuola di specializzazione, master accreditati ASFOR/EQUIS/AACSB/AMBA, titoli AFAM): riguarda solo quella tipologia e non
  è espresso come requisito generale.'
- 'Le richieste di abbinamento si presentano in tre finestre: dal 01/09/2026 al 15/04/2027, dal 01/09/2027 al 15/04/2028,
  dal 01/09/2028 al 15/04/2029. Apertura e chiusura indicano l''inizio della prima e la fine dell''ultima; tra una finestra
  e l''altra le richieste sono chiuse.'
- La cittadinanza 'apolide' è inclusa supponendo un regolare titolo di soggiorno; il bando parla di cittadini comunitari o
  extra UE regolarmente soggiornanti.
