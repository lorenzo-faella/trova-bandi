note:
- 'Le soglie ISEE/ISPE (tab. 6) e le tabelle dei crediti (5.1-5.4 e 4) sono in appendice e non sono nel testo ricevuto: restano
  da verificare.'
- Il promemoria a pagina 6 sembra avere le date sfasate di una riga (accanto alla scadenza della domanda compare 11 settembre
  2026); l'art. 3 fissa la scadenza della domanda online alle ore 14:00 del 10 agosto 2026, usata come chiusura. La data di
  apertura non è indicata.
- 'Per gli iscritti al primo anno il merito è valutato ex post al saldo della borsa: non è un requisito di accesso.'
- Possono partecipare anche i laureandi che si laureano entro aprile 2027 e gli iscritti con riserva alla magistrale, con
  benefici assegnati con riserva; l'iscrizione deve avvenire entro il 23 aprile 2027.
- Gli studenti internazionali con redditi o patrimoni all'estero presentano ISEE/ISPE parificato tramite il CAF indicato dall'ERSU.
