note:
- 'Chiusura dall''art. 3: compilazione e validazione della richiesta entro le ore 14:00 del 10 agosto 2026. Nel promemoria
  di pagina 6 le date sembrano sfasate di una riga rispetto alle voci. La regolarizzazione (upload documenti) scade alle 14:00
  del 30 novembre 2026; l''apertura non è indicata.'
- 'Le tabelle 5.1-5.4 con i CFU richiesti agli anni successivi al primo non sono nel testo ricevuto: il merito degli anni
  successivi resta da verificare.'
- 'La soglia ISEE della tabella 6 è stampata come “€ 25.00,00”: probabilmente 25.000 euro, ma non è certo.'
- 'Sono esclusi anche gli studenti che si iscrivono dopo il 23 aprile 2027, salvo diverse disposizioni dell''ateneo: è un
  termine di iscrizione, non espresso.'
- 'Laureandi che non proseguono e iscritti con riserva alla magistrale in attesa della triennale possono partecipare in deroga
  (art. 6): non espresso.'
- Per chi frequenta il corso propedeutico (ex semestre filtro) in un altro ateneo e si immatricola a Catania nel secondo semestre
  è previsto un addendum al bando.
