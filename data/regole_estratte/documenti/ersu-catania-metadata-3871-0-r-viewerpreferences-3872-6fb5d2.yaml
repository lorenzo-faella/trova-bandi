note:
- La domanda online va compilata e validata entro le ore 14:00 del 10 agosto 2026; il testo ricevuto non indica la data di
  apertura.
- Le tabelle in appendice (1 istituzioni, 4 merito primo anno, 5.1-5.4 CFU, 6 limiti ISEE e ISPE) non sono nel testo ricevuto.
- 'Il merito del primo anno (tabella 4) è verificato ex post per mantenere la borsa. Per i primi anni e per l''AFAM serve
  il diploma di scuola media superiore: non l''ho scritto come requisito perché possono partecipare anche i diplomandi.'
- 'Escluso chi si iscrive all''istituzione universitaria dopo il 23 aprile 2027 e chi non comunica di aver fatto domanda presso
  altri organismi per il diritto allo studio: adempimenti lasciati nelle note.'
- L'incompatibilità con altre borse dell'art. 5 prevede il conguaglio degli importi; l'esclusione n. 14 dell'art. 10 riguarda
  invece chi già beneficia di borse di altre amministrazioni pubbliche.
- Laureandi, iscritti con riserva alla magistrale e studenti del semestre filtro hanno regole particolari (art. 6) non modellate.
