note:
- 'Il limite ISEE della tab. 6 è scritto in modo errato ("€ 25.00,00"): lasciato da verificare invece di indovinare la cifra.'
- 'Le tabelle 5.1-5.4 sui CFU minimi non sono nel testo ricevuto: il requisito di merito per gli anni successivi al primo
  resta da verificare.'
- 'Per gli iscritti al primo anno il merito (15/20 CFU, 9/12 con disabilità) si valuta dopo, per mantenere la borsa: non è
  un requisito d''accesso.'
- Possono partecipare in deroga anche i laureandi che si laureano entro aprile 2027 e gli iscritti con riserva alla magistrale
  biennale.
- 'Esclusi anche chi si iscrive dopo il 23 aprile 2027 e chi non comunica di aver fatto domanda presso altri enti per il diritto
  allo studio: condizioni procedurali non modellate.'
- Lo studente internazionale deve presentare l'ISEE/ISPE parificato tramite il CAF indicato dall'ERSU.
- Domanda online entro le ore 14:00 del 10 agosto 2026; la data di apertura non è indicata.
