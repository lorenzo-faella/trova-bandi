requisiti:
- non_modellabile: 'Il contributo è riservato alle donne: il vocabolario non ha un campo per il sesso.'
  fonte: Comune di Urbino, pagina 4
  citazione: Le destinatarie finali del contributo sono le donne familiari di persone in struttura (DFPIS), residenti
- campo: comune
  operatore: in
  valori:
  - Urbino
  - Petriano
  - Montecalvo in Foglia
  - Fermignano
  - Urbania
  - Peglio
  - Sant'Angelo in Vado
  - Borgo Pace
  - Mercatello sul Metauro
  fonte: Comune di Urbino, pagina 4
  citazione: residenza in un Comune dell’ ATS 4 al momento della presentazione dell’istanza
- campo: regione
  operatore: in
  valori:
  - Marche
  fonte: Comune di Urbino, pagina 4
  citazione: residenza in un Comune della regione Marche all’1/01/2026 e alla data di presentazione
- non_modellabile: 'Residenza in un comune delle Marche già all''1/01/2026: il vocabolario chiede solo la residenza attuale,
    non quella a una data passata.'
  fonte: Comune di Urbino, pagina 4
  citazione: residenza in un Comune della regione Marche all’1/01/2026 e alla data di presentazione
- campo: eta
  operatore: tra
  valore:
  - 18
  - 67
  fonte: Comune di Urbino, pagina 4
  citazione: maggiorenne in età attiva/lavorativa (fino a 67 anni) al momento di presentazione dell’istanza
- campo: condizione_lavorativa
  operatore: in
  valori:
  - occupato
  - disoccupato
  - inattivo
  - studente
  fonte: Comune di Urbino, pagina 4
  citazione: 'trovarsi in una delle seguenti condizioni lavorative (*):'
- non_modellabile: 'Rapporto di coniugio, convivenza, unione civile, parentela o affinità entro il 2° grado con una persona
    ospite di una struttura residenziale, di cui la richiedente sostiene in tutto o in parte la retta: mancano i campi.'
  fonte: Comune di Urbino, pagina 4
  citazione: 'Avere uno dei seguenti rapporti di parentela o affinità con la Persona in Struttura (PIS):'
- campo: isee
  operatore: <=
  valore: 25000
  fonte: Comune di Urbino, pagina 5
  citazione: validità non superiore ad euro 25.000,00.
- non_modellabile: 'La persona in struttura deve essere ospite di una struttura socio-sanitaria o sociale autorizzata in un
    comune delle Marche (aree anziani, disabilità, salute mentale): mancano i campi.'
  fonte: Comune di Urbino, pagina 5
  citazione: struttura collocata in un Comune della Regione Marche, autorizzata ai sensi della L.R. 21/2016
- non_modellabile: 'ISEE socio-sanitario residenze della persona in struttura non superiore a 25.000 euro: il vocabolario
    non ha questo ISEE né quello di un familiare in struttura.'
  fonte: Comune di Urbino, pagina 5
  citazione: possedere ISEE socio-sanitario residenze in corso di validità non superiore a € 25.000,00.
- non_modellabile: 'La quota sociale della retta non deve essere già finanziata, anche in parte, da altri contributi pubblici:
    manca il campo.'
  fonte: Comune di Urbino, pagina 7
  citazione: riferite a spese (quota sociale della retta) già finanziate anche solo in parte con altri contributi
note:
- Le condizioni lavorative ammesse sono occupate (dipendenti, parasubordinate, autonome), inoccupate, disoccupate e inattive;
  il bando esclude espressamente le pensionate, quindi pensionato è tolto dai valori.
- 'Le disoccupate devono presentare la DID e le inoccupate/inattive sottoscrivere il Patto di servizio al Centro per l''impiego:
  sono adempimenti, non riportati come requisiti.'
- Se la persona in struttura è affine di 1° o 2° grado, la richiedente deve pagare direttamente la retta; se la richiedente
  non lavora la retta può essere pagata da un altro componente del nucleo ISEE.
- In caso di più istanze per la stessa persona in struttura si ammette quella con ISEE più basso; la domanda va presentata
  entro il 16 novembre 2026 a pena di esclusione.
