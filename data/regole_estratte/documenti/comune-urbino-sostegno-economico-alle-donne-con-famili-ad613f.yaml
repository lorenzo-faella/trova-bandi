pubblico: persone
ultimo_controllo: '2026-11-19'
requisiti:
- non_modellabile: 'Il contributo è riservato alle donne: il vocabolario non ha un campo per il sesso della richiedente.'
  fonte: Comune di Urbino, pagina 4
  citazione: 'La donna familiare di persona in struttura (DFPIS) deve possedere i seguenti requisiti:'
- campo: regione
  operatore: in
  valori:
  - Marche
  fonte: Comune di Urbino, pagina 4
  citazione: residenza in un Comune della regione Marche all’1/01/2026 e alla data di presentazione
- campo: comune
  operatore: in
  valori:
  - Urbino
  - Petriano
  - Montecalvo in Foglia
  - Fermignano
  - Urbania
  - Peglio
  - Sant'Angelo in Vado
  - Borgo Pace
  - Mercatello sul Metauro
  fonte: Comune di Urbino, pagina 4
  citazione: residenza in un Comune dell’ ATS 4 al momento della presentazione dell’istanza;
- non_modellabile: 'La residenza in un comune delle Marche deve sussistere già all''1/01/2026, non solo alla data della domanda:
    manca un campo sulla data di inizio della residenza.'
  fonte: Comune di Urbino, pagina 4
  citazione: residenza in un Comune della regione Marche all’1/01/2026 e alla data di presentazione
- campo: eta
  operatore: tra
  valore:
  - 18
  - 67
  fonte: Comune di Urbino, pagina 4
  citazione: maggiorenne in età attiva/lavorativa (fino a 67 anni) al momento di presentazione dell’istanza
- campo: condizione_lavorativa
  operatore: in
  valori:
  - occupato
  - disoccupato
  - inattivo
  fonte: Comune di Urbino, pagina 4
  citazione: 'trovarsi in una delle seguenti condizioni lavorative (*):'
- non_modellabile: 'Sono escluse le donne pensionate, anche se rientrano in un''altra condizione: il vocabolario non permette
    di escludere un valore di condizione_lavorativa.'
  fonte: Comune di Urbino, pagina 4
  citazione: Sono quindi escluse le donne
- non_modellabile: 'Avere un familiare (coniuge, convivente o unito civilmente, parente o affine fino al 2° grado) ospite
    di una struttura residenziale socio-sanitaria o sociale autorizzata delle Marche, area anziani, disabilità o salute mentale,
    e pagarne in tutto o in parte la retta: mancano i campi sui familiari non conviventi e sulle rette.'
  fonte: Comune di Urbino, pagina 4
  citazione: 'Avere uno dei seguenti rapporti di parentela o affinità con la Persona in Struttura (PIS):'
- campo: isee
  operatore: <=
  valore: 25000
  fonte: Comune di Urbino, pagina 5
  citazione: validità non superiore ad euro 25.000,00.
- non_modellabile: 'La persona in struttura deve avere un ISEE socio-sanitario residenze non superiore a 25.000 euro: il vocabolario
    non ha l''ISEE di un familiare non convivente.'
  fonte: Comune di Urbino, pagina 5
  citazione: possedere ISEE socio-sanitario residenze in corso di validità non superiore a € 25.000,00.
- non_modellabile: La quota sociale della retta non deve essere già finanziata, anche solo in parte, da altri contributi pubblici.
  fonte: Comune di Urbino, pagina 7
  citazione: riferite a spese (quota sociale della retta) già finanziate anche solo in parte con altri contributi
note:
- La domanda va presentata all'ATS 4 (Comune di Urbino) entro il 16 novembre 2026, a mano o via PEC; non è ammessa la raccomandata.
  La rendicontazione va consegnata entro il 22.02.2027.
- Occupate comprende anche il lavoro saltuario/atipico e la cassa integrazione; le disoccupate dovranno presentare la DID
  e le inoccupate o inattive sottoscrivere il Patto di servizio presso il Centro per l'impiego (impegni successivi).
- 'Le inoccupate (mai lavorato) sono state ricondotte a ''disoccupato'' o ''inattivo''. Non è chiaro se le studentesse rientrino
  tra le inattive: il modulo parla di ''Inattivo diverso da student'', quindi ''studente'' non è stato incluso.'
- Se la persona in struttura è un affine di 1° o 2° grado, la donna deve pagare la retta direttamente.
