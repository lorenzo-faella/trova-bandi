id: comune-urbino-sostegno-economico-alle-donne-con-famili-ad613f
titolo: Sostegno economico alle donne con familiari ospiti in strutture residenziali socio-sanitarie e sociali
ente: Comune di Urbino
link: https://www.comune.urbino.pu.it/novita/n/avviso/sostegno-economico-alle-donne-con-familiari-ospiti-in-strutture-residenziali-socio-sanitarie-e-sociali-1093?cHash=dc805dab19f4569f8f7c3b8b1996ac24
apertura: '2026-10-26'
chiusura: '2026-11-16'
