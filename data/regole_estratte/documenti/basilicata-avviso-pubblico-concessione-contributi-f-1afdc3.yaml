requisiti:
- almeno_uno_di:
  - almeno_un_componente:
    - campo: figlio
      operatore: vero
    - campo: attivita
      operatore: in
      valori:
      - studio
  - non_modellabile: 'Richiedente tutore dello studente (artt. 343 e seguenti del Codice civile): il vocabolario non ha un
      campo per la tutela.'
  fonte: Regione Basilicata, pagina 5
  citazione: Il contributo può essere richiesto da chi esercita la responsabilità genitoriale
- non_modellabile: 'Lo studente deve essere iscritto e frequentare una scuola secondaria di 1° o 2° grado (statale o paritaria):
    il vocabolario non ha il tipo di scuola per i componenti del nucleo.'
  fonte: Regione Basilicata, pagina 5
  citazione: essere iscritto e frequentare le istituzioni scolastiche secondarie 1° e di 2° grado
- campo: isee
  operatore: <=
  valore: 15748.78
  fonte: Regione Basilicata, pagina 5
  citazione: ISEE ordinario o corrente in corso di validità fino a € 15.748,78
- almeno_uno_di:
  - campo: regione
    operatore: in
    valori:
    - Basilicata
  - non_modellabile: Studenti stranieri che dimorano o sono domiciliati in Basilicata e frequentano un istituto scolastico
      della Basilicata.
  fonte: Regione Basilicata, pagina 5
  citazione: avere la residenza in Basilicata
- non_modellabile: 'Lo studente non deve essere già in possesso di un diploma di scuola secondaria di II grado (per i corsi
    serali, di un titolo analogo): manca il titolo di studio dei componenti del nucleo.'
  fonte: Regione Basilicata, pagina 6
  citazione: Il contributo non può essere concesso qualora lo studente sia già in possesso di un diploma di
- non_modellabile: 'Studente ripetente nello stesso istituto o indirizzo: il contributo spetta solo per libri diversi dall''anno
    precedente o per cui non abbia già chiesto il contributo.'
  portata: rara
  fonte: Regione Basilicata, pagina 6
  citazione: Nel caso di studente ripetente che si iscrive allo stesso Istituto scolastico e/o allo stesso
note:
- La residenza richiesta è quella dello studente; il campo regione si riferisce al richiedente (genitore), usato come approssimazione.
- 'Le risorse di cui all''art. 3, comma 1, lett. b) (50.000 euro) sono riservate a studenti con dislessia o altri DSA: condizione
  solo per quella quota, non per il contributo ordinario.'
- Le famiglie presentano la domanda al Comune di residenza nei termini stabiliti dal Comune; le date di apertura e chiusura
  indicate sono quelle per l'invio delle istanze dei Comuni alla Regione (dal 15° al 35° giorno dalla pubblicazione sul BUR
  del 03/11/2026; scadenza indicata 09/12/2026).
- 'Il campo ''Destinatari: ENTE'' si riferisce ai Comuni che inoltrano le istanze; i beneficiari finali sono le famiglie degli
  studenti.'
