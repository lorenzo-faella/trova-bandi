- 'Al primo anno l''accesso dipende solo da ISEE e ISPE: il merito (almeno 20 crediti entro il 10/08/2027 o il 30/11/2027)
  si valuta dopo ed è una condizione di revoca, non di accesso.'
- 'Non ho ricevuto l''intestazione della seconda tabella di merito (pagina 50, soglie più basse e anni fuori corso): sembra
  riservata agli studenti con disabilità, che hanno anche un anno in più di durata.'
