note:
- 'Termini diversi per corso: lauree, lauree magistrali e ciclo unico dal 14/07/2026 al 13/08/2026; dottorati e scuole di
  specializzazione dal 01/10/2026 al 30/10/2026; studenti iscritti dopo il semestre filtro provenienti da altra regione dal
  02/02/2027 al 04/03/2027. In chiusura c''è la scadenza dei dottorati: chi è iscritto a una laurea deve fare domanda entro
  il 13/08/2026.'
- 'Istituzioni ammesse: l''elenco chiuso dell''art. 3 comma 2 (atenei, conservatori e accademie di Bari, Monopoli, Casamassima,
  Foggia, Lecce, Taranto). Con regione_ateneo = Puglia non escludiamo eventuali istituzioni pugliesi non elencate.'
- 'anno_di_corso va letto come anno convenzionale contato dalla prima immatricolazione (per la magistrale, dalla prima iscrizione
  alla magistrale). L''ulteriore semestre è l''anno dopo la durata legale: per la triennale il 4°, per la magistrale il 3°,
  per il ciclo unico il 6° o il 7°. Oltre questo limite si è esclusi, tranne gli studenti con disabilità, che hanno un anno
  in più.'
- 'Primo anno: per accedere bastano ISEE e ISPE. I 20 crediti entro il 10/08/2027 o il 30/11/2027 servono a mantenere la borsa
  e non sono requisito di accesso. Dottorato e specializzazione: agli anni successivi serve solo l''ammissione all''anno in
  corso.'
- 'La deroga per i corsi con organizzazione didattica più difficile (art. 12 comma 7) può abbassare le soglie di merito in
  proporzione: non è modellata.'
- 'I laureati triennali che si iscrivono a un ciclo unico possono concorrere solo dal 4° anno (art. 12 comma 3). Chi si laurea
  nella sessione straordinaria 2025/26 può fare domanda come iscritto al primo anno di magistrale: per questo, per la magistrale,
  è ammesso anche il titolo ''diploma''.'
- Gli studenti di corsi interateneo con sede amministrativa in un'altra regione fanno domanda all'ente di quella regione.
  Gli iscritti contemporaneamente all'Università del Salento e alla Scuola ISUFI hanno benefici limitati (quota in denaro
  e mensa).
- Le esclusioni documentali (ISEE non valido per il diritto allo studio, documenti dei redditi esteri, permesso di soggiorno
  per apolidi e rifugiati) riguardano la domanda e non sono modellate come requisiti.
