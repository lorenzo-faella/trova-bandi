- Possono partecipare studenti italiani e stranieri. Chi ha nucleo, redditi e patrimoni all'estero dichiara la condizione
  economica con la documentazione dell'art. 10 invece che con l'ISEE ordinario. Apolidi, rifugiati e richiedenti asilo devono
