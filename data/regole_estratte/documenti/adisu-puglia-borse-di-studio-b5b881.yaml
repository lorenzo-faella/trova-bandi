note:
- 'Domanda solo online sul Portale Studenti, pena l''inammissibilità. Date: lauree, lauree magistrali e a ciclo unico dalle
  8:00 del 14/07/2026 alle 12:00 del 13/08/2026 (riportate in apertura/chiusura); dottorati e scuole di specializzazione dal
  01/10/2026 al 30/10/2026; iscritti dopo il semestre filtro provenienti da altra regione dal 02/02/2027 al 04/03/2027.'
- 'Per gli iscritti al primo anno il merito si valuta dopo: servono almeno 20 crediti entro il 10/08/2027 per la borsa intera
  o entro il 30/11/2027 per metà, altrimenti la borsa è revocata. È una condizione per mantenere il beneficio, quindi non
  è tra i requisiti.'
- 'Serve un ISEE per le prestazioni per il diritto allo studio universitario riferito allo studente: un ISEE ordinario o parzialmente
  attestato porta all''esclusione. I dottorandi possono usare l''ISEE ordinario con nucleo ristretto; qui la soglia si applica
  comunque al campo isee_universitario.'
- 'Nel testo ci sono due tabelle di crediti: la seconda (15/48/81 crediti...) sembra quella per gli studenti con disabilità,
  ma il testo estratto non dice a chi si applica.'
- 'Non riportati: le regole sui passaggi di corso, trasferimenti e rinunce (domanda solo se non già presentata per lo stesso
  anno convenzionale, o dopo rinuncia e restituzione, al massimo tre volte); i corsi interateneo con sede amministrativa in
  un''altra regione, che seguono il bando dell''ente di quella regione; le cause di decadenza (debiti verso ADISU, espulsione
  dalle residenze, dichiarazioni non veritiere); lo status di fuori sede, che decide l''importo e non il diritto.'
- Gli studenti non residenti in Italia con nucleo e redditi all'estero dichiarano redditi e patrimoni esteri secondo l'art.
  10, che qui arriva solo in parte.
