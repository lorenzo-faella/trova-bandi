  fonte: ER.GO - Azienda regionale per il diritto agli studi superiori, pagina web
  citazione: studenti che partecipano a programmi di mobilità internazionale organizzati dalle Università
- non_modellabile: Soglie ISEE fissate nel bando dell'Ateneo per questo beneficio, che la pagina non riporta.
  fonte: ER.GO - Azienda regionale per il diritto agli studi superiori, pagina web
  citazione: verifica le soglie ISEE previste nel bando pubblicato dal tuo Ateneo relativo a questo beneficio
note:
- 'Non c''è una domanda specifica: basta compilare i moduli Dati Personali e Dati Economici nell''area riservata, con l''ISEE
