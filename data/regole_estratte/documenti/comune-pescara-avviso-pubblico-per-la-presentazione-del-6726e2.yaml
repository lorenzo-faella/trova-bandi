note:
- Avviso per l'ammissione agli asili nido comunali di Pescara che hanno ancora posti disponibili per l'a.e. 2026/2027; si
  presenta una sola domanda per bambino, per un solo nido.
- 'La residenza nel Comune di Pescara non è un requisito: i bambini non residenti sono ammessi solo dopo aver soddisfatto
  le richieste dei residenti.'
- Serve un ISEE ordinario o ISEE minori in corso di validità da indicare nella domanda; l'ISEE determina la retta, non l'accesso.
- Le fasce d'età delle sezioni e i criteri di graduatoria sono in parti del documento non ricevute.
- Domanda solo online con SPID o CIE dalle 10:00 del 2 novembre alle 23:59 del 20 novembre 2026.
