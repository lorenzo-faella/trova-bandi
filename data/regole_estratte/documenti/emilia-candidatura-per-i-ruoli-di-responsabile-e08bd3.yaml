id: emilia-candidatura-per-i-ruoli-di-responsabile-e08bd3
titolo: Candidatura per i ruoli di "Responsabile della formalizzazione e certificazione delle competenze" e di "Esperto dei
  processi valutativi" nell'ambito dell'IeFP
ente: Regione Emilia-Romagna
link: https://formazionelavoro.regione.emilia-romagna.it/leggi-atti-bandi/bandi-regionali/bandi-per-annualita/2014/avviso-per-la-presentazione-di-candidature-per-ricoprire-i-ruoli-professionali-di-responsabile-della-formalizzazione-e-certificazione-delle-competenze-e-di-esperto-dei-processi-valutativi-nellambito-delliefp
apertura: null
chiusura: null
fonte: documento Regione Emilia-Romagna, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti:
- almeno_uno_di:
  - non_modellabile: 'Essere dirigente scolastico di una scuola che ha attivato percorsi IeFP (ruolo di Responsabile della
      formalizzazione e certificazione delle competenze): manca il campo.'
    citazione: il ruolo può essere ricoperto dal dirigente scolastico della scuola che ha attivato percorsi di IeFP.
  - non_modellabile: 'Essere docente con almeno 5 anni di esperienza professionale (ruolo di Esperto dei processi valutativi):
      manca il campo.'
    citazione: il ruolo può essere ricoperto dal personale docente con un’esperienza professionale di almeno 5 anni.
  fonte: Regione Emilia-Romagna, pagina web
  citazione: 'Esperto dei processi valutativi: il ruolo può essere ricoperto dal personale docente'
note:
- Non è un beneficio economico ma una candidatura a due ruoli nel sistema IeFP; ciascun ruolo ha il proprio requisito.
- La sola data indicata (12 febbraio 2014) è quella di pubblicazione, non un periodo per le domande.
