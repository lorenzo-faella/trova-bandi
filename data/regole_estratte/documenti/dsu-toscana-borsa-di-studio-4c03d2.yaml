note:
- Le date valgono per gli iscritti a laurea triennale, magistrale e a ciclo unico (fino alle 13.00 del 7 settembre 2026).
  Per dottorato e specializzazione la domanda va dal 25 settembre al 16 novembre 2026; per chi viene dal semestre filtro in
  un'altra regione, dal 1° febbraio al 1° marzo 2027.
- 'L''anno di corso va inteso come anno convenzionale, cioè il numero di iscrizioni dalla prima immatricolazione, con le eccezioni
  dell''art. 2.3: può essere diverso dall''anno di corso dichiarato dall''ateneo.'
- 'L''art. 9 (studenti con disabilità) è arrivato solo in parte: mancano le regole sulla durata della borsa, cui rimandano
  anche gli artt. 10, 11 e 12. Per i loro crediti si usa la Tabella 2 (art. 9.3), dove gli anni ulteriori lasciano intendere
  una durata più lunga.'
- 'Figli minori: il bando parla di figli conviventi nati dal 1° gennaio 2020 e presenti nello stato di famiglia; l''età fino
  a 6 anni è un''approssimazione.'
- 'Gli studenti AFAM (conservatori, accademie) compaiono fra i destinatari del punto 1.3, ma l''art. 3.1 nomina solo corsi
  di laurea, specializzazione e dottorato: i livelli AFAM sono assimilati a triennale e magistrale.'
- 'Lo studente già iscritto ad anni successivi al primo può chiedere la borsa per una seconda iscrizione contemporanea solo
  se non ne ha mai usufruito nella prima carriera: non modellato.'
- Per il posto alloggio serve in più lo status di fuori sede (residenza a più di un'ora di mezzi pubblici dalla sede del corso),
  non modellato.
- La borsa decade in caso di cumulo con provvidenze dichiarate incompatibili, salvo opzione; restano escluse anche le domande
  di chi ha il nucleo o redditi all'estero e non invia la documentazione dell'art. 8 entro i termini, e serve una DSU 2026
  sottoscritta entro la scadenza della domanda.
- Il contributo per la mobilità internazionale spetta ai vincitori di borsa ammessi a un programma di mobilità per il 2026/2027.
