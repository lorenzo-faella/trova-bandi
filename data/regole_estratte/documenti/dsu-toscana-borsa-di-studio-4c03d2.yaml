note:
- Bando per borsa di studio e posto alloggio DSU Toscana a.a. 2026/2027; le regole riguardano la borsa di studio.
- Il posto alloggio richiede in più lo status di studente fuori sede (art. 3.6), che dipende dai tempi di percorrenza tra
  comune di residenza e sede del corso.
- 'Termini: laurea triennale, magistrale e ciclo unico dal 20 luglio 2026 alle ore 13 del 7 settembre 2026; dottorato e specializzazione
  dal 25 settembre al 16 novembre 2026; iscritti al semestre filtro in altra Regione dal 1° febbraio al 1° marzo 2027, purché
  abbiano fatto domanda anche all''ente DSU dell''altra Regione. In apertura e chiusura sono riportati i termini per i corsi
  di laurea.'
- La DSU per l'ISEE universitario va sottoscritta entro il 7 settembre 2026 (laurea) o il 16 novembre 2026 (dottorato e specializzazione),
  pena l'esclusione.
- 'Figli minori: la soglia nata dal 1° gennaio 2020 è resa con età fino a 6 anni, con una verifica della data di nascita e
  della convivenza.'
- Detenuti e atleti hanno requisiti di merito ridotti ma le soglie ISEE/ISPE ordinarie; la parte dell'art. 8 sugli studenti
  stranieri (punti 8.3) non è stata fornita.
- Per gli iscritti al primo anno il merito (20 crediti per triennale e ciclo unico, 15 per magistrale entro il 10 agosto 2027)
  serve a mantenere la borsa, non ad ottenerla.
