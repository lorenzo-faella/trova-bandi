note:
- 'Date: dal 20 luglio al 7 settembre 2026 (ore 13) per i corsi di laurea; dal 25 settembre al 16 novembre 2026 per dottorato
  e specializzazione; dal 1° febbraio al 1° marzo 2027 per chi viene dal semestre filtro in un''altra regione. La DSU ISEE
  va sottoscritta entro le stesse scadenze, pena l''esclusione.'
- 'La cittadinanza non limita l''accesso: possono concorrere anche studenti stranieri, italiani residenti all''estero, apolidi,
  rifugiati e richiedenti asilo (art. 8). Per chi ha nucleo, redditi o patrimonio all''estero la condizione economica si valuta
  con la documentazione dell''art. 8 (parti non ricevute) e non con l''ISEE ordinario, quindi la soglia ISEE qui scritta va
  letta su quella base.'
- Le soglie ISEE/ISPE più alte (34.600/70.000 euro) valgono per gli studenti con disabilità (art. 9) e con figli minori conviventi
  (art. 10). Detenuti e atleti hanno requisiti di merito agevolati ma le soglie economiche generali.
- 'Al primo anno il merito si valuta dopo (20 crediti entro il 10 agosto 2027 per la triennale, 15 per la magistrale): mancarlo
  fa perdere la seconda rata o obbliga a restituire, ma è una condizione di decadenza, non di accesso.'
- Il posto alloggio richiede in più lo status di studente fuori sede; non è un requisito della borsa.
- Il cumulo con altre borse o provvidenze per lo stesso anno fa decadere dal beneficio, con facoltà di scelta; lo si è lasciato
  fuori perché è una regola di cumulo.
- L'anno di corso dichiarato può non coincidere con l'anno convenzionale del bando (passaggi, rinunce, trasferimenti).
