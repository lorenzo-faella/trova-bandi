note:
- 'Il bando comprende più benefici (borsa di studio, posto alloggio, mobilità internazionale, premio di laurea): i requisiti
  estratti sono quelli generali della borsa di studio.'
- 'Il posto alloggio è riservato agli studenti fuori sede (residenza a più di 50 km dalla sede del corso, con alloggio a titolo
  oneroso): non modellabile con il vocabolario.'
- La mobilità internazionale è per vincitori o idonei di borsa selezionati dall'università; il premio di laurea è per i vincitori
  di borsa 2025/2026 laureati entro la durata legale, da chiedere entro 30 giorni dalla laurea.
- Agli studenti con disabilità (invalidità almeno 66% o handicap art. 3 c. 3 L. 104/1992) spettano due semestri in più e requisiti
  di merito ridotti (tabella 4).
- La DSU per il diritto allo studio va sottoscritta entro il 22 luglio 2026 (residenti in Italia); i residenti all'estero
  devono sottoscrivere l'ISEEUP presso un CAF convenzionato entro il 10 dicembre 2026. Sono adempimenti di procedura.
- 'Studenti di Medicina immatricolati nel 2026/2027: la domanda ordinaria vale solo come preistruttoria; è prevista una riapertura
  dei termini dopo il semestre aperto.'
- Le tabelle dell'allegato H (tabelle 1, 3, 5) sono richiamate ma solo in parte presenti nelle sezioni ricevute.
