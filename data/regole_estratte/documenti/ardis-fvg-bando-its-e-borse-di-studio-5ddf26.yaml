note:
- 'Il testo ricevuto contiene solo il calendario, il sommario e alcune parti su alloggi e contributo sostitutivo: gli articoli
  2-4 (destinatari e requisiti di iscrizione, merito, frequenza, reddito e patrimonio) non ci sono, quindi i requisiti economici
  restano da verificare.'
- La condizione sui titoli di studio è scritta tra le cause di revoca del contributo alloggio; è stata riportata come requisito
  perché vale già al momento della domanda.
- Il merito per il contributo alloggio consiste nel superare entro il 10 agosto 2027 gli esami intermedi dei moduli conclusi
  (verifica successiva).
- Il contributo sostitutivo alloggio richiede un contratto di affitto registrato di almeno 8 mesi nella sede del corso, per
  gli idonei fuori sede senza posto alloggio.
- 'Le date sono diverse per categoria: domanda online disponibile indicativamente dal 15 luglio 2026; secondi e terzi anni
  entro il 3 agosto 2026 (13 agosto con compilazione oltre il termine), matricole in più finestre fino al 13 novembre 2026.
  Come chiusura si usa la data indicata come ''Scadenza'' (25 novembre 2026, ore 13:00).'
