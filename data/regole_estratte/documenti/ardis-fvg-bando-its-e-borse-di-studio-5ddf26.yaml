note:
- 'Il testo ricevuto è molto parziale: mancano gli articoli su destinatari, requisiti economici (4.4) e merito. La sede in
  Friuli Venezia Giulia si ricava dal fatto che il bando è dell''agenzia regionale per i benefici regionali; non è scritta
  come requisito esplicito.'
- 'La domanda online è disponibile indicativamente dal 15 luglio 2026. La tabella dei termini è frammentata: secondi e terzi
  anni entro il 3 agosto 2026 (13 agosto in ritardo), matricole in tre finestre fino al 30 ottobre 2026 (13 novembre 2026
  in ritardo). Come chiusura è indicato l''ultimo termine per le matricole. La scadenza del 25 novembre 2026 ore 13:00 (pagina
  26) e le date fino al 15 marzo 2027 sembrano riguardare altri adempimenti, come la comunicazione dei dati del contratto
  di alloggio.'
- 'Chi ha già un diploma ITS potrebbe rispondere ''diploma'' a titolo_di_studio: per questo l''esclusione dei titoli ITS resta
  da verificare.'
