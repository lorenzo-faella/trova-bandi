note:
- 'La pagina è un riepilogo generale di ATER Vicenza per le domande ai bandi ERP comunali: le date e le eventuali condizioni
  aggiuntive stabilite dal singolo Comune sono nei bandi comunali, non in questo documento, quindi apertura e chiusura sono
  null.'
- Il diritto sugli immobili riguarda proprietà, usufrutto, uso e abitazione, in Italia o all'estero; il campo proprieta_altra_abitazione
  copre solo un'altra casa adatta al nucleo, il caso della casa in cui si vive è nel requisito successivo. Un diritto di usufrutto
  o di uso sulla casa in cui si vive (risposta 'altro') non è controllato.
- 'Stranieri non UE senza permesso di lungo periodo né protezione: servono un permesso almeno biennale e un regolare lavoro
  autonomo o subordinato. Il lavoro parasubordinato non è stato incluso perché il documento parla solo di lavoro autonomo
  o subordinato.'
- Il requisito di residenza in Veneto vale alla data di scadenza del bando. La residenza o il lavoro in Veneto da più anni
  danno punteggio in graduatoria, non sono requisiti di accesso.
- L'assegnazione avviene solo dopo la graduatoria definitiva e solo se ci sono alloggi disponibili.
