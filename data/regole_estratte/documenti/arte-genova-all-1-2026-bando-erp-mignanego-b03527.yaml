note:
- I requisiti sui diritti reali, sul patrimonio e sulle assegnazioni precedenti valgono per il richiedente e per tutti i componenti
  del nucleo.
- 'Il testo è un OCR con errori: i nomi dei Comuni del bacino H sono stati corretti (Cogoteto in Cogoleto, Masene in Masone,
  Serra Ricco in Serra Riccò).'
- Per 'alloggio adeguato' il bando intende quello con superficie minima in base al numero di componenti, nell'ambito provinciale;
  conta anche la casa in cui si vive. Il genitore separato senza disponibilità della casa coniugale ne è esentato, come chi
  ha l'alloggio sottoposto a esproprio.
- Il limite ISEE di 17.000 euro compare solo nella sezione sul punteggio economico; la sezione dei requisiti economici non
  è tra quelle ricevute.
- Domanda dal 17/09/2026 al 19/10/2026; per i lavoratori emigrati il termine è il 27/10/2026 (residenti UE) o il 16/12/2026
  (paesi extraeuropei).
