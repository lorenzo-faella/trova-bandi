- campo: regione_ateneo
  operatore: in
  valori:
  - Sicilia
  fonte: ERSU Enna, pagina web
  citazione: per gli studenti regolarmente iscritti all’Università Kore di Enna
- campo: anno_di_corso
  operatore: '>='
  valore: 2
  fonte: ERSU Enna, pagina web
  citazione: ad anni successivi al primo
- non_modellabile: Essere idonei al concorso per le borse di studio dell'anno accademico, oppure iscritti all'Università Kore
    di Enna con i requisiti di merito previsti dal bando, che la pagina non riporta.
  fonte: ERSU Enna, pagina web
  citazione: in possesso dei requisiti di merito previsti dal bando di concorso
note:
- Il documento ricevuto contiene solo l'inizio della pagina, sezione PART-TIME; il resto è nel Regolamento.
- Le matricole sono escluse in entrambi i casi (idonei alla borsa, escluse le matricole; iscritti ad anni successivi al primo),
  da cui anno di corso almeno 2.
- La regione dell'ateneo (Sicilia) si ricava dalla sede dell'Università Kore di Enna; per gli idonei alla borsa la pagina
  non nomina l'ateneo.
