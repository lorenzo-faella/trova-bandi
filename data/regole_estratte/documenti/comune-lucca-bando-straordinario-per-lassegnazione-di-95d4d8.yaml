note:
- 'Il testo dell''articolo 1 (destinatari e requisiti) manca: probabilmente riguarda residenza, ISEE del nucleo e intestazione
  dell''utenza domestica di residenza, ma il testo ricevuto non lo dice.'
- Domanda solo online con SPID, CIE o CNS di un componente del nucleo ai fini ISEE; l'intestatario dell'utenza può essere
  un altro componente del nucleo. Ammessa la domanda tramite amministratore di sostegno, tutore o delegato.
- 'Per consultare l''esito va conservato il numero di protocollo: non sono inviate comunicazioni in caso di errori o esclusione.'
