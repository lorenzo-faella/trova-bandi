note:
- I dodici mesi continuativi di residenza in Sardegna sono resi con anni_residenza_regione >= 1; il campo non distingue la
  residenza continuativa.
- Il diploma conseguito all'estero equipollente o equivalente è compreso nel valore diploma e nei titoli superiori.
- 'L''ammissione al percorso dipende anche dai requisiti della normativa ENAC/EASA e dell''organismo di addestramento scelto,
  accertati dall''organismo stesso: non riportati come requisito.'
- 'Data e ora di apertura e chiusura delle domande saranno rese note con un successivo Avviso (la pagina cita ''AVVISO PRESENTAZIONE
  DOMANDE'', Determinazione 3200 del 03.11.2026, il cui testo non è nel documento ricevuto): apertura e chiusura restano null.'
