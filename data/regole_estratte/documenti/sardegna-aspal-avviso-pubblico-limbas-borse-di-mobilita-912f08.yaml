note:
- 'Procedura a sportello in tre finestre: 23/01/2026-31/07/2026, 16/09/2026-19/03/2027, 05/05/2027-31/12/2027, ciascuna fino
  alle ore 17.00 dell''ultimo giorno e fino a esaurimento risorse. Apertura e chiusura indicate sono la prima e l''ultima
  data.'
- 'I cittadini extra UE in attesa del rinnovo del permesso sono ammessi: chi ha risposto ''nessun_titolo'' perché in attesa
  di rinnovo potrebbe comunque avere diritto.'
- 'Rientrano tra i destinatari anche le persone con disabilità (L. 68/99, art. 3 comma 3 L. 104): non è un requisito aggiuntivo.'
- Le attività professionalizzanti senza corso di lingua sono ammesse solo per chi ha già concluso con certificazione un percorso
  Limbas nella prima finestra.
- I requisiti vanno mantenuti fino alla conclusione dell'attività, salvo il superamento del limite di età dopo la domanda.
