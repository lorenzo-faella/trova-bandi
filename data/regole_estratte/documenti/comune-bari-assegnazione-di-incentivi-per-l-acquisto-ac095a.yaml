id: comune-bari-assegnazione-di-incentivi-per-l-acquisto-ac095a
titolo: Assegnazione di incentivi per l'acquisto dell'abbonamento "MUVTinBUS365" su tutte le linee del trasporto pubblico
  locale di AMTAB S.p.A.
ente: Comune di Bari
link: https://www.comune.bari.it/-/novita/avvisi/20260728-bando-assegnazione-muvt-in-bus-365-2026
apertura: '2026-07-28'
chiusura: '2026-11-30'
fonte: documento Comune di Bari, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-19'
requisiti:
- almeno_uno_di:
  - campo: comune
    operatore: in
    valori:
    - Bari
    citazione: A. i cittadini residenti sul territorio comunale;
  - campo: comune_domicilio
    operatore: in
    valori:
    - Bari
    citazione: B. i cittadini dimoranti abitualmente nella città di Bari. Per dimoranti si intendono coloro che, pur avendo
  - tutti_di:
    - campo: iscrizione
      operatore: in
      valori:
      - universita
      - afam
      - its
    - campo: comune_ateneo
      operatore: in
      valori:
      - Bari
    citazione: iscritti a un istituto scolastico o ateneo ubicato sul territorio comunale;
  - non_modellabile: 'Studenti di scuole di ogni ordine e grado con sede nel comune di Bari: il vocabolario ha il comune della
      sede solo per università, AFAM e ITS.'
    citazione: C. gli studenti di ogni ordine e grado che, pur non residenti o non dimoranti a Bari, attestano di essere
  - tutti_di:
    - campo: eta
      operatore: '>='
      valore: 65
    - non_modellabile: Essere già titolare dell'abbonamento AMTAB over 65 e voler eliminare il vincolo delle fasce orarie.
    citazione: D. i cittadini over 65, già titolari di abbonamento over 65, che vogliono eliminare il vincolo delle fasce
      orarie
  fonte: Comune di Bari, pagina 3
  citazione: 'Potranno beneficiare dell’incentivo di cui all’art.1 del presente Bando:'
note:
- 'La domanda si presenta con il modello su muvt.app dal 28 luglio 2026 fino a esaurimento delle risorse. Il bando (art. 8)
  fissa come ultimo giorno il 30 settembre 2026, la pagina web il 30 novembre 2026: come chiusura è stata presa la data della
  pagina web, che sembra una proroga.'
- Per i minorenni la domanda va sottoscritta da un genitore o dal tutore legale.
- 'Si perde il diritto per un anno se un precedente abbonamento MUVTinBUS365 è stato annullato (tre penalità o nessuna validazione
  nel primo mese): non modellato, riguarda solo chi ha già avuto l''abbonamento.'
