note:
- Le domande si presentano al Municipio di residenza dalla data di pubblicazione (non indicata nel testo) fino al 31 dicembre
  2026, fa fede la data di protocollo.
- 'Requisito di reddito: ''reddito I.S.E. non superiore ad € 35.000,00 o reddito derivante da regolare attività lavorativa
  con un valore I.S.E.E. non superiore ad € 26.000,00''. Ho letto le due soglie come alternative; il vocabolario non ha l''ISE,
  quindi il requisito resta quasi sempre da verificare.'
- 'La residenza a Milano è ricavata dal fatto che la domanda va al Municipio di residenza e il contributo è del Comune: il
  testo non lo dice come requisito esplicito.'
- La presenza nel nucleo di ultrasettantenni, minori, invalidi almeno al 74% o persone in carico ai servizi è solo un criterio
  preferenziale, non un requisito.
- Il contributo si eroga fino a esaurimento delle risorse regionali trasferite.
