note:
- 'Il bando è a sportello e senza termine di chiusura: domande dalle ore 10:00 del 1° agosto 2025; le domande non finanziate
  entro il 31 dicembre 2027 saranno archiviate. Per questo chiusura è null.'
- Una sola domanda per tipologia di intervento e per unità immobiliare; in caso di più domande vale la prima in ordine cronologico
  (regola di procedura).
- Per le domande dal 1° gennaio 2027 la documentazione tecnica e di spesa non può avere data anteriore ai due anni precedenti.
- Alcune parti del testo del bando (art. 1 e seguenti) arrivano con parole mancanti per l'estrazione dal PDF.
