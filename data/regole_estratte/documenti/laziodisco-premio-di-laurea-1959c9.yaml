    - non_modellabile: 'Conseguire il titolo entro il primo anno fuori corso: mancano i campi sulla data di laurea e sulla
        durata legale.'
    citazione: Per gli studenti con disabilità pari o superiore al 66%, il beneficio spetta se il titolo è conseguito entro
      il primo anno fuori corso.
  fonte: DiSCo Lazio, pagina web
  citazione: 'Possono presentare domanda di premio di laurea gli studenti che:'
note:
- 'La domanda va presentata online entro 30 giorni dal conseguimento della laurea: è un termine relativo, senza date fisse,
  quindi apertura e chiusura null; non c''è un campo per i giorni dalla laurea.'
- La pagina non dice esplicitamente la sede dell'ateneo o la residenza; il legame con il Lazio passa dall'essere vincitori
  della borsa DiSCo, che resta da verificare.
- La pagina rimanda al Bando diritto allo studio 2026/2027, non disponibile, che potrebbe contenere altre condizioni (es.
  per le abbreviazioni di carriera citate nelle FAQ).
