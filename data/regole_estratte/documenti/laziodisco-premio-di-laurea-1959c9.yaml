ultimo_controllo: '2026-11-22'
requisiti:
- non_modellabile: 'Essere stati vincitori di una borsa di studio DiSCo nell''anno accademico della laurea (a.a. 2025/2026):
    il vocabolario non ha un campo per le borse già ottenute.'
  fonte: DiSCo Lazio, pagina 1
  citazione: sono stati vincitori di una borsa di studio nell’anno accademico di riferimento;
- campo: livello_corso
  operatore: in
  valori:
  - laurea_triennale
  - laurea_magistrale
  - ciclo_unico
  - afam_primo_livello
  - afam_secondo_livello
  fonte: DiSCo Lazio, pagina 60
  citazione: nuovissimo ordinamento, che conseguono nell’a.a. 2025/2026, la laurea triennale, la laurea
- campo: regione_ateneo
  operatore: in
  valori:
  - Lazio
  fonte: DiSCo Lazio, pagina 15
  citazione: 'tipologie di corso, presso uno degli atenei con sede legale nel Lazio:'
- non_modellabile: 'Laurea conseguita nell''a.a. 2025/2026 entro la durata legale del corso (entro il primo anno fuori corso
    per gli studenti con disabilità pari o superiore al 66%): il vocabolario non ha la data della laurea né la durata della
    carriera.'
  fonte: DiSCo Lazio, pagina 1
  citazione: conseguono la laurea entro la durata legale del corso.
- non_modellabile: Non aver ottenuto abbreviazioni di carriera, a qualsiasi titolo.
  fonte: DiSCo Lazio, pagina 50
  citazione: che hanno ottenuto abbreviazione di carriera a vario titolo;
note:
- Estratti solo i requisiti del Premio di laurea (pagina web e artt. 38, 39 e 20.1 del Bando diritto allo studio 2026/2027);
  i requisiti di borsa, alloggio e mobilità non sono stati riportati.
- Art. 38 indica come anno di riferimento l'a.a. 2025/2026 (borsa vinta e laurea conseguita in quell'anno); la pagina web
  dice solo 'anno accademico di riferimento'.
- 'I requisiti economici e di merito sono impliciti nell''aver vinto la borsa 2025/2026, il cui bando non è nel documento:
  non sono stati riportati soglie ISEE/ISPE (quelle dell''art. 12 valgono per l''a.a. 2026/2027).'
- 'Livello del corso: l''art. 38 parla di laurea triennale, specialistica/magistrale e a ciclo unico; sono inclusi anche i
  diplomi AFAM di primo e secondo livello perché l''art. 2 comprende gli AFAM tra le università del bando, ma l''art. 38 non
  li nomina espressamente.'
- 'Chi si è già laureato potrebbe non risultare più iscritto: livello del corso e sede dell''ateneo vanno letti riferiti al
  corso di cui si consegue la laurea.'
- 'Domanda: dall''Area riservata (accesso art. 13), dopo il conseguimento del titolo ed entro il termine perentorio di 30
  giorni dalla laurea; non c''è una finestra fissa, quindi apertura e chiusura sono null.'
- Il premio è pari al 50% della borsa ottenuta nell'anno della laurea, compatibilmente con i fondi disponibili; DiSCo valuta
  la compatibilità con altri benefici per il diritto allo studio di enti pubblici o privati.
