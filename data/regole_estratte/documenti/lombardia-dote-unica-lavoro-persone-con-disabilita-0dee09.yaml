id: lombardia-dote-unica-lavoro-persone-con-disabilita-0dee09
titolo: Dote Unica Lavoro Persone con Disabilità - Provincia di Varese
ente: Regione Lombardia
link: https://www.bandi.regione.lombardia.it/servizi/servizio/catalogo/dettaglio/istruzione-formazione-lavoro/lavoro-occupazione/dote-unica-lavoro-persone-disabilit-provincia-varese-PR_VA_42025049907
apertura: '2025-12-17'
chiusura: '2027-02-26'
fonte: documento Regione Lombardia, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti:
- campo: disabile
  operatore: vero
  fonte: Regione Lombardia, pagina 10
  citazione: le persone con disabilità ai sensi dell'art. 1 della L. 68/1999
- almeno_uno_di:
  - tutti_di:
    - campo: condizione_lavorativa
      operatore: in
      valori:
      - disoccupato
      citazione: che risultino disoccupate ai sensi dell'art. 19 del D.Lgs. 150/2015
    - non_modellabile: 'Dote Inserimento: iscrizione negli elenchi del Collocamento Mirato (art. 8 L. 68/99) della Provincia
        di Varese; mancano i campi per l''iscrizione al Collocamento Mirato e per la provincia.'
  - tutti_di:
    - campo: eta
      operatore: '>='
      valore: 16
      citazione: Lavoratori occupati ai sensi della L.68/99, dai 16 anni compiuti
    - non_modellabile: 'Dote Mantenimento: lavoratore assunto ai sensi della L. 68/99 (anche sospeso in CIGS o con fondi di
        solidarietà, o occupato sotto soglia di reddito con DID) in una sede operativa in provincia di Varese, con le condizioni
        specifiche del paragrafo 1.2 dell''Avviso (aggravamento della salute, richiesta motivata, riorganizzazione aziendale,
        assunzione recente o dopo una dote precedente), che non è nel testo ricevuto.'
  fonte: Regione Lombardia, pagina 10
  citazione: Rientrano altresì nella platea dei destinatari i lavoratori con disabilità occupati in sedi
note:
- 'Due linee: Dote Inserimento per disoccupati iscritti al Collocamento Mirato della Provincia di Varese, Dote Mantenimento
  per lavoratori con disabilità occupati ai sensi della L. 68/99 in sedi della Provincia di Varese.'
- 'La disabilità richiesta è quella dell''art. 1 della L. 68/1999, le cui categorie e soglie la scheda non riporta: qui si
  verifica solo che la persona abbia una disabilità.'
- Per la Dote Mantenimento i requisiti di accesso rimandano al paragrafo 1.2 dell'Avviso, che non è nel testo ricevuto; la
  scheda riassuntiva elenca solo per sommi capi le condizioni (aggravamento, richiesta motivata, riorganizzazione, assunzione
  recente).
- La domanda di dote è inviata dal soggetto esecutore (CPI/Collocamento Mirato o operatore accreditato) tramite Bandi e Servizi,
  con procedura a sportello fino a esaurimento risorse.
- 'Date incoerenti: la pagina web indica scadenza 26/02/2027 ore 12:00, le schede riassuntive dell''Avviso indicano Data Chiusura
  26/02/2028. Si è usata la data della pagina web.'
