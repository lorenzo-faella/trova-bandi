requisiti:
- non_modellabile: 'Riservato alle donne: il genere non è nel vocabolario. L''impresa deve essere a prevalente composizione
    e gestione femminile.'
  fonte: Regione Calabria, pagina 1
  citazione: Donne, con status di disoccupati, inoccupati, persone con disabilità e a rischio discriminazione
- non_modellabile: 'Aver seguito e completato le fasi A e B del percorso Yes I Startup Calabria Donne (per le società, il
    legale rappresentante): manca un campo.'
  fonte: Regione Calabria, pagina 1
  citazione: che abbiano già seguito e completato le fasi A e B
- non_modellabile: 'Impresa ancora da costituire o costituita da meno di 12 mesi, rientrante nella definizione di PMI, in
    un settore non escluso dall''Allegato 1: mancano i campi sull''impresa da costituire.'
  fonte: Regione Calabria, pagina 1
  citazione: intendono costituire, o hanno già costituito da meno di 12 mesi, una nuova impresa a prevalente composizione
    e gestione femminile
- non_modellabile: 'Investimento da realizzare in una sede operativa in Calabria: è la sede dell''impresa, non la residenza
    della persona, che il campo regione descrive.'
  fonte: Regione Calabria, pagina 8
  citazione: dell’intervento nel territorio della Regione Calabria;
- non_modellabile: 'Requisiti dell''impresa: regolarità contributiva (DURC), capacità economico-finanziaria, iscrizione a
    CCIAA/REA/albo o partita IVA e Gestione Separata, impresa non in difficoltà, nessun altro finanziamento pubblico per le
    stesse spese, nessuna insolvenza su prestiti, nessuna revoca nei 3 anni precedenti, una sola domanda.'
  fonte: Regione Calabria, pagina 8
  citazione: capacità economico-finanziaria in relazione al progetto da realizzare;
- non_modellabile: 'Regolarità antimafia e divieto di incarichi a ex dipendenti regionali (pantouflage): non chiediamo dati
    giudiziari.'
  fonte: Regione Calabria, pagina 8
  citazione: essere in regola con la normativa antimafia
note:
- 'I destinatari comprendono disoccupate, inoccupate, persone con disabilità, a rischio discriminazione e occupate: nessuna
  condizione lavorativa è esclusa, quindi non c''è un requisito su condizione_lavorativa.'
- 'La chiusura dello sportello sarà stabilita dal Comitato degli Investimenti in base alle risorse: il documento non la indica.'
- Le esclusioni di settore rimandano all'Allegato 1 e al Regolamento Operativo, che non sono nel testo ricevuto.
- Le definizioni dei soggetti destinatari rimandano all'Art. 5 punti 3, 4 e 5, che non è nel testo ricevuto.
