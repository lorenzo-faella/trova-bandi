note:
- 'Formalmente i beneficiari sono imprese femminili, anche ancora da costituire: per questo la persona che vuole avviare l''impresa
  può presentare domanda. Quasi tutti i requisiti riguardano l''impresa e non sono esprimibili con il vocabolario.'
- Lo status lavorativo delle destinatarie comprende anche le donne occupate, quindi non restringe di fatto l'accesso.
- I requisiti valgono alla data di presentazione della domanda; ogni impresa e ogni componente può presentare una sola domanda.
- Le definizioni dei destinatari (art. 5 punti 3, 4 e 5) e i settori esclusi (Allegato 1) sono richiamati ma non inclusi nelle
  sezioni ricevute.
- Lo sportello apre l'08/07/2024 alle ore 10:00; la chiusura sarà decisa dal Comitato degli Investimenti in base alle risorse.
