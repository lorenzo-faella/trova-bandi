note:
- La residenza in Sardegna deve sussistere alla data di pubblicazione dell'Avviso.
- Sotto i 35 anni non compiuti l'accesso non dipende dalla condizione occupazionale; da 35 anni in su si partecipa solo se
  disoccupati.
- La certificazione di disabilità (art. 3 L. 104/92) è richiesta solo per frequentare il master interamente online.
- Un titolo di studio estero richiede il giudizio di equivalenza, da chiedere ad ASPAL con la domanda.
- Le domande sono accolte a sportello fino a esaurimento delle risorse; una sola borsa per candidato.
