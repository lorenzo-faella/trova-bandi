note:
- Il divieto di cumulo con altri contributi per lo stesso master (salvo quelli sulle tasse di iscrizione) è una regola di
  cumulo, non riportata come requisito.
- La residenza in Sardegna va posseduta alla data di pubblicazione dell'Avviso.
- Per chi ha 35 anni o più la condizione di disoccupato richiede la DID ai sensi dell'art. 19 D.Lgs. 150/2015.
- 'I titoli esteri richiedono il giudizio di equivalenza (par. 9): aspetto procedurale non modellato.'
- Procedura a sportello fino a esaurimento risorse.
