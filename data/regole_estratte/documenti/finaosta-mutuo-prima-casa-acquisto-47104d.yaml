requisiti:
- campo: eta
  operatore: tra
  valore:
  - 18
  - 70
  fonte: Finaosta, pagina 3
  citazione: età non inferiore a diciotto anni e non superiore a settanta anni
- almeno_uno_di:
  - campo: regione
    operatore: in
    valori:
    - Valle d'Aosta/Vallée d'Aoste
  - tutti_di:
    - campo: residente_italia
      operatore: falso
    - non_modellabile: 'Iscritto all''AIRE che rientra definitivamente in Valle d''Aosta e trasferisce la residenza nell''immobile
        entro dodici mesi dalla stipula: manca un campo per l''iscrizione AIRE e il rientro.'
    citazione: 'Possono accedere ai mutui di cui al presente regolamento i soggetti iscritti all’AIRE, e in particolare:'
  fonte: Finaosta, pagina 3
  citazione: residenza in un comune della Regione.
- campo: isee
  operatore: <=
  valore: 60000
  fonte: Finaosta, pagina web
  citazione: con un ISEE pari o inferiore ad euro 60.000
- non_modellabile: Il richiedente e tutto il nucleo non devono possedere (proprietà, usufrutto, nuda proprietà, diritto di
    abitazione) nessuna abitazione di categoria A, esclusa A/10, ovunque si trovi, salvo eccezioni (barriere architettoniche
    con disabilità, abitazione gravata da usufrutto di terzi, abitazione funzionale ad attività produttive, quote sommate
    inferiori all'unità). Il campo proprieta_altra_abitazione chiede solo di un'altra casa adatta al nucleo e non basta.
  fonte: Finaosta, pagina 3
  citazione: non essere proprietari, usufruttuari, nudi proprietari o titolari di diritto di abitazione di una o
- non_modellabile: Non aver ottenuto più di un mutuo prima casa regionale negli ultimi venti anni; se ne ha ottenuto uno,
    devono essere passati almeno tre anni dalla stipula e deve essere estinto o accollato (con eccezioni per coniuge separato,
    comproprietario con sentenza di assegnazione, successione, distruzione dell'abitazione).
  fonte: Finaosta, pagina 4
  citazione: non aver beneficiato di più di un mutuo prima casa erogato dalla Regione nei precedenti venti anni
- non_modellabile: 'L''atto di acquisto non deve essere stato stipulato da oltre 18 mesi: manca un campo per la data dell''atto.'
  fonte: Finaosta, pagina web
  citazione: L’atto di acquisto non deve essere stipulato da oltre 18 mesi.
note:
- Età e residenza valgono per il richiedente proprietario o comproprietario (anche solo intestatario del preliminare); i requisiti
  sulle abitazioni possedute, sui mutui precedenti e sull'ISEE valgono per il richiedente e per tutti i componenti del nucleo.
- 'Età: "fino al giorno del compimento del 70esimo anno"; si è riportato "non superiore a settanta anni" come scritto (tra
  18 e 70).'
- 'Regione scritta come "Valle d''Aosta": verificare che coincida con il nome usato nel vocabolario (ISTAT: "Valle d''Aosta/Vallée
  d''Aoste").'
- 'L''immobile deve essere adibito a prima abitazione del richiedente o del nucleo: è l''oggetto stesso del mutuo e non è
  stato scritto come requisito.'
- 'Il caso del figlio convivente che costituisce un nucleo autonomo vale solo per recupero e nuova costruzione, non per l''acquisto:
  non applicato.'
- Il foglio informativo segue la DGR 369/2026, in vigore dal 1° maggio 2026; il documento non indica un periodo per le domande.
