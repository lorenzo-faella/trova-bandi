id: laziodisco-contributi-alloggio-a29f19
titolo: Contributi alloggio
ente: DiSCo Lazio - Ente regionale per il diritto allo studio e la promozione della conoscenza
link: https://laziodisco.it/borse-di-studio-e-contributi/80229-2/
apertura: null
chiusura: null
fonte: documento DiSCo Lazio - Ente regionale per il diritto allo studio e la promozione della conoscenza, estratto con LLM
  (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-18'
requisiti:
- almeno_uno_di:
  - campo: regione
    operatore: in
    valori:
    - Lazio
  - campo: regione_domicilio
    operatore: in
    valori:
    - Lazio
  fonte: DiSCo Lazio - Ente regionale per il diritto allo studio e la promozione della conoscenza, pagina 1
  citazione: residenti e/o domiciliati nel Lazio
- almeno_uno_di:
  - campo: iscrizione
    operatore: in
    valori:
    - universita
    citazione: iscritti a Università statali o non statali
  - tutti_di:
    - campo: iscrizione
      operatore: in
      valori:
      - afam
    - campo: regione_ateneo
      operatore: in
      valori:
      - Lazio
    - non_modellabile: 'L''istituto AFAM deve rilasciare titoli di studio aventi valore legale: manca un campo.'
    citazione: iscritti agli istituti AFAM con sede nel Lazio e che rilasciano titoli di studio aventi valore legale
  fonte: DiSCo Lazio - Ente regionale per il diritto allo studio e la promozione della conoscenza, pagina 1
  citazione: 'Il contributo è rivolto agli studenti:'
- campo: abitazione
  operatore: in
  valori:
  - affitto
  fonte: DiSCo Lazio - Ente regionale per il diritto allo studio e la promozione della conoscenza, pagina 1
  citazione: Un aiuto economico per contribuire alle spese di affitto sostenute dagli studenti universitari
- non_modellabile: Gli altri requisiti (per esempio di reddito o di merito) sono fissati dal Bando, che non è nel testo ricevuto.
  fonte: DiSCo Lazio - Ente regionale per il diritto allo studio e la promozione della conoscenza, pagina 1
  citazione: Il contributo viene assegnato attraverso la partecipazione al Bando.
note:
- 'La riga sulle università è troncata nel testo ("Università statali o non statali l"): non è chiaro se anche per le università
  valga la sede nel Lazio, quindi regione_ateneo è applicato solo agli istituti AFAM, dove è esplicito.'
- Gli importi (da 200 a 350 euro mensili) dipendono dall'ubicazione dell'alloggio affittato nel Lazio; la scheda non dice
  esplicitamente che l'alloggio debba trovarsi nel Lazio.
- 'Il periodo di pubblicazione del bando non è fisso: apertura e chiusura non sono indicate.'
