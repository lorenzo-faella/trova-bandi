note:
- 'La pagina è una scheda informativa generale: requisiti precisi, scadenze e modalità sono nel bando annuale (ultimo: 2025/2026),
  che non è nel testo. Le date di apertura e chiusura non sono indicate e il periodo di pubblicazione non è fisso.'
- 'Il riconoscimento legale dell''università o il valore legale dei titoli AFAM non è verificabile con il vocabolario: si
  è controllato solo il tipo di iscrizione e la sede nel Lazio.'
- Il requisito di affitto è dedotto dalla finalità del contributo (spese di affitto); le caratteristiche del contratto sono
  rimandate al bando e alle FAQ.
- Esistono FAQ su categorie di studenti escluse dal bando, non riportate nel testo.
