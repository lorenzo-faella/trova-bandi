note:
- Il limite di età a regime è di 28 anni non compiuti; per gli anni 2026 e 2027 è elevato a 30 e per il 2028 e 2029 a 29.
  Si è usato il limite di 30 anni in vigore per il 2026-2027.
- Per la madre minorenne la domanda è presentata da chi esercita la responsabilità genitoriale, che deve avere Carta famiglia
  e l'ISEE; la madre deve comunque avere gli altri requisiti.
- La condizione di studio vale solo per i percorsi riconosciuti elencati (dalla scuola secondaria di primo grado al dottorato,
  compresi IEFP, IFTS, ITS e la formazione professionale regionale).
- 'La residenza in regione deve durare almeno dodici mesi continuativi prima della nascita o dell''adozione: gli anni di residenza
  in regione sono una verifica approssimata.'
- 'La domanda si presenta entro dodici mesi dalla nascita o dall''adozione: non c''è una finestra fissa.'
