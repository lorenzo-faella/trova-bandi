id: fvg-sostegno-allautonomia-abitativa-delle-gi-157916
titolo: Sostegno all’autonomia abitativa delle giovani madri - Neomamme Carta famiglia - Il sostegno all’autonomia abitativa
  è un contributo a fondo perduto destinato alle giovani madri per l’acquisto della prima casa di abitazione.
