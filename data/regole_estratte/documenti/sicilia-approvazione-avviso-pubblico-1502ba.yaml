note:
- 'Il testo è solo la scheda di pubblicazione del decreto (DDG 1100-S8 del 01.04.2026): non contiene requisiti. Non ho aggiunto
  residenza in Sicilia né abitazione in affitto perché la scheda non li dice (il contributo è ''per l''accesso'' alle abitazioni
  in locazione: potrebbe riguardare anche chi non è ancora in affitto).'
- Data pubblicazione 03/04/2026, che non è necessariamente l'inizio del periodo per le domande; data scadenza 03/04/2027 'entro
  le 00:00', cioè di fatto entro la fine del 02/04/2027.
