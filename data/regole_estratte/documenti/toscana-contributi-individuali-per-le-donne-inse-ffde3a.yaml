id: toscana-contributi-individuali-per-le-donne-inse-ffde3a
titolo: Contributi individuali per le donne inserite in percorsi di uscita dalla violenza e di autonomia
ente: Regione Toscana
link: https://www.regione.toscana.it/-/contributi-individuali-per-le-donne-inserite-nei-percorsi-di-cui-alla-delibera-del-12-febbraio
apertura: null
chiusura: '2026-12-31'
fonte: documento Regione Toscana, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti:
- non_modellabile: 'Essere una donna inserita in un percorso di protezione relativo alla violenza di genere, certificato dai
    servizi sociali territoriali, da un Centro antiviolenza o da una Casa rifugio della regione: mancano i campi.'
  fonte: Regione Toscana, pagina 1
  citazione: essere inserite nei percorsi di protezione relativi alla violenza di genere debitamente certificati dai servizi
    sociali territoriali
- campo: eta
  operatore: '>='
  valore: 18
  fonte: Regione Toscana, pagina 1
  citazione: aver compiuto 18 anni;
- almeno_uno_di:
  - campo: regione
    operatore: in
    valori:
    - Toscana
  - campo: regione_domicilio
    operatore: in
    valori:
    - Toscana
  fonte: Regione Toscana, pagina 1
  citazione: essere residenti e/o domiciliate in Toscana.
- almeno_uno_di:
  - campo: cittadinanza
    operatore: in
    valori:
    - italiana
    - ue
    - familiare_con_diritto_soggiorno
    - extra_ue_lungo_periodo
    - protezione_internazionale
  - non_modellabile: 'Altri titoli di soggiorno: ammessi solo se consentono lo svolgimento di un''attività lavorativa, cosa
      che il vocabolario non distingue.'
  fonte: Regione Toscana, pagina 1
  citazione: In caso di cittadinanza non comunitaria è necessario il possesso di regolare permesso di soggiorno che consenta
    lo svolgimento di un'attività lavorativa
- campo: condizione_lavorativa
  operatore: in
  valori:
  - disoccupato
  fonte: Regione Toscana, pagina 1
  citazione: essere in stato di disoccupazione ai sensi del decreto legislativo 150/2015
- non_modellabile: 'Iscrizione a un Centro per l''impiego della Toscana: manca il campo.'
  fonte: Regione Toscana, pagina 1
  citazione: iscritte ad un Centro per l'impiego (Cpi) della Toscana
- non_modellabile: 'Aver stipulato il Progetto per l''occupabilità presso il Centro per l''impiego: manca il campo.'
  fonte: Regione Toscana, pagina 1
  citazione: avere stipulato il Progetto per l’occupabilità presso il Cpi
note:
- La domanda si presenta dal giorno successivo alla pubblicazione sul BURT del decreto 31 del 14 gennaio 2026 (data di pubblicazione
  non indicata) fino al 31 dicembre 2026, salvo chiusura anticipata per esaurimento delle risorse annuali; dal 2 febbraio
  2026 la trasmissione avviene tramite il Formulario FSE online.
- I requisiti devono essere posseduti alla data della domanda e mantenuti per tutta la durata del percorso.
- 'Il vocabolario non ha un campo per il sesso: l''essere donna è compreso nel requisito non modellabile sul percorso di protezione.'
- Il beneficiario formale del contributo FSE+ è ARTI; i destinatari sono le donne indicate.
