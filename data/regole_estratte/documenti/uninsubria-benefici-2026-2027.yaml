note:
- La domanda di borsa va presentata dalle ore 12:00 del 24 luglio 2026 alle ore 15:00 del 30 settembre 2026; chi chiede il
  posto letto deve presentarla entro il 24 agosto 2026. Gli studenti che fanno il semestre filtro in un altro Ateneo avranno
  termini fissati in seguito.
- Valgono solo attestazioni ISEE per il diritto allo studio universitario con DSU sottoscritta entro il 16 ottobre 2026 e
  senza annotazioni.
- Per gli studenti con invalidità pari o superiore al 66% possono essere fissati requisiti di merito individualizzati, fino
  al 40% in meno.
- Il merito del primo anno (crediti entro il 10 agosto e il 30 novembre 2027) è verificato dopo l'assegnazione per mantenere
  la borsa, quindi non è scritto come requisito di accesso.
- 'Per gli studenti stranieri l''ISR non può essere inferiore a 10.179,85 euro: è una regola di calcolo, non una soglia di
  accesso.'
- 'Il posto letto richiede in più la condizione di fuori sede, l''assenza di debiti verso l''Ateneo e di provvedimenti disciplinari:
  non scritti come requisiti della borsa.'
