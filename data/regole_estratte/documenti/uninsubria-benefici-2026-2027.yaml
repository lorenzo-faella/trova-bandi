note:
- Domanda di borsa e servizi dalle 12:00 del 24 luglio 2026 alle 15:00 del 30 settembre 2026; per il posto letto la domanda
  va fatta entro le 15:00 del 24 agosto 2026, e il posto letto è escluso per pendolari e studenti in sede.
- Valgono solo ISEE per il diritto allo studio universitario con DSU sottoscritta entro il 16 ottobre 2026 e senza annotazioni;
  gli studenti stranieri usano l'ISEE parificato dei CAF convenzionati.
- 'Il merito del primo anno è valutato anche ex post (35 crediti per laurea e ciclo unico, 20 o 23 per magistrale, entro il
  10 agosto 2027): sono condizioni di mantenimento.'
- Per gli studenti con invalidità almeno al 66% i requisiti di merito possono essere ridotti fino al 40%.
- Gli studenti che fanno il semestre filtro in un altro ateneo e si immatricolano all'Insubria nel secondo semestre fanno
  domanda in termini da stabilire.
