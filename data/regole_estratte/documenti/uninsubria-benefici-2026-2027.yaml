note:
- Domanda di borsa dalle 12:00 del 24 luglio 2026 alle 15:00 del 30 settembre 2026. Chi chiede anche il posto letto deve presentare
  domanda (e ISEE) entro le 15:00 del 24 agosto 2026. La DSU per l'ISEE universitario va sottoscritta entro il 16 ottobre
  2026.
- 'Soglie di crediti: la tabella distingue corsi ad accesso libero e programmato, e per la magistrale la soglia sale dei crediti
  oltre i 180 riconosciuti all''iscrizione. Si passa con certezza con la soglia più alta (accesso programmato); sotto la soglia
  dell''accesso libero meno il bonus massimo dell''anno il requisito manca; nella fascia intermedia l''esito resta da verificare.'
- L'"ultimo semestre (1 anno fuori corso)" è reso come anno_di_corso 4 per la laurea, 3 per la magistrale, 6 o 7 per il ciclo
  unico (+55/+60 rispetto all'ultimo anno; al 6° anno le soglie del ciclo unico di 5 e di 6 anni coincidono, 245/269).
- 'Le soglie sono ridotte in proporzione per i corsi con un numero di crediti annui diverso da 60 e per le interruzioni di
  carriera per maternità: non modellato.'
- Le matricole ricevono la borsa con il voto di maturità (lauree e ciclo unico) o la sola iscrizione (magistrale); i crediti
  da conseguire entro il 10 agosto 2027 servono a mantenerla e non sono requisiti di accesso.
- 'Il posto letto è un beneficio a parte: esclude pendolari e studenti in sede, chi ha debiti non concordati verso l''Ateneo,
  chi ha già avuto il posto letto per lo stesso anno di corso e chi ha avuto provvedimenti disciplinari. Non è nei requisiti
  della borsa.'
- Gli studenti del semestre filtro (Medicina, Odontoiatria) iscritti in altri atenei che si immatricolano all'Insubria nel
  secondo semestre fanno domanda in termini da stabilire.
- 'Per gli studenti stranieri il reddito estero dichiarato non può essere inferiore a 10.179,85 euro: è una regola di calcolo
  dell''ISEE parificato, non modellata.'
