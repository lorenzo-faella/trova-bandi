id: lombardia-dote-unica-lavoro-persone-con-disabilita-79b48d
titolo: Dote Unica Lavoro Persone con Disabilità - Prov. Brescia
ente: Regione Lombardia
link: https://www.bandi.regione.lombardia.it/servizi/servizio/catalogo/dettaglio/istruzione-formazione-lavoro/lavoro-occupazione/dote-unica-lavoro-persone-disabilit-prov-brescia-PR_BS_42025049893
apertura: '2025-12-17'
chiusura: '2027-02-26'
fonte: documento Regione Lombardia, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti:
- campo: disabile
  operatore: vero
  fonte: Regione Lombardia, pagina web
  citazione: Costituiscono destinatari dell'intervento le persone con disabilità ai sensi dell'art. 1 della L. 68/1999
- almeno_uno_di:
  - tutti_di:
    - campo: condizione_lavorativa
      operatore: in
      valori:
      - disoccupato
    - non_modellabile: 'Iscrizione negli elenchi del Collocamento Mirato (art. 8 L. 68/99) della Provincia di Brescia: manca
        il campo.'
    citazione: che si trovino in stato di disoccupazione secondo quanto previsto dall'art. 19 del D.Lgs. 150/2015
  - tutti_di:
    - campo: condizione_lavorativa
      operatore: in
      valori:
      - occupato
    - non_modellabile: 'Lavorare in una sede operativa situata in provincia di Brescia (anche in CIGS): manca il campo.'
    citazione: lavoratori con disabilità occupati in sedi operative dislocate sul territorio della Provincia di Brescia
  fonte: Regione Lombardia, pagina web
  citazione: Rientrano altresì nella platea dei destinatari i lavoratori con disabilità occupati
note:
- La prima alternativa è la Dote Inserimento (disoccupati iscritti al Collocamento Mirato di Brescia), la seconda la Dote
  Mantenimento (occupati in sedi in provincia di Brescia).
- 'La pagina non chiede la residenza: conta l''iscrizione agli elenchi provinciali o la sede di lavoro, quindi non ho messo
  `regione` o `comune`.'
- 'Per la Dote Mantenimento la pagina aggiunge "purché sussistano i requisiti stabiliti dal presente Avviso": quei requisiti
  sono nell''avviso, che non è nel testo ricevuto.'
- 'La definizione di disabilità dell''art. 1 della L. 68/1999 non è riportata: ho usato solo `disabile`.'
