note:
- Il testo disponibile è la versione inglese del bando; le citazioni sono in inglese.
- Il beneficio principale è la borsa di studio; posto alloggio e contributo per la mobilità internazionale richiedono in più
  lo status di fuori sede (corso ad almeno 30 km, alloggio a titolo oneroso per almeno 10 mesi) o di vincitore di borsa, e
  non sono modellati come requisiti.
- 'Corsi di tipo C: specializzazione esclusa l''area sanitaria (D.Lgs. 368/1999) e dottorato solo se non già titolari delle
  borse del D.M. 224/1999: eccezioni non espresse.'
- AFAM di primo e secondo livello sono assimilati alla laurea triennale e magistrale per durata e crediti, perché il bando
  li classifica come corsi di tipo A e B.
- 'Le soglie di crediti si riducono in proporzione se l''ordinamento prevede meno di 60 crediti l''anno e di 2 crediti per
  ogni corso annuale (massimo 4): non modellato.'
- 'Il limite ISPE è scritto 54.000,00 in cifre e ''sixty-four thousand'' in lettere: si usa il valore in cifre.'
- Iscrizione all'anno accademico 2026/2027 entro il 31 marzo 2027 e pagamento della tassa regionale; DSU firmata nel 2026
  con ISEE per le prestazioni universitarie disponibile in banca dati INPS dal giorno dopo la scadenza; chi ha il nucleo all'estero
  deve inviare l'ISEE parificato entro il 31 marzo 2027.
- 'Sono esclusi anche i laureati nella sessione ordinaria 2025/2026 iscritti al semestre aggiuntivo: condizione legata al
  calendario delle sessioni, non modellata.'
- La domanda scade alle ore 12:00 del 10 settembre 2026; la data di apertura è quella di pubblicazione del bando.
