note:
- Il testo disponibile è la versione inglese del bando ADISURC; le citazioni sono in inglese.
- 'Soglia ISPE: in cifre 54.000,00 euro, in lettere ''sixty-four thousand''. Si usa il valore in cifre.'
- La soglia ISEE è sull'ISEE per il diritto allo studio universitario (o ISEE parificato per chi ha il nucleo all'estero,
  da inviare entro il 31/03/2027); la DSU va sottoscritta nel 2026. Per i dottorandi si può usare l'ISEE del nucleo ristretto.
- 'Non ci sono limiti di età né requisiti di cittadinanza o residenza: la residenza incide solo sullo status (in sede, pendolare,
  fuori sede) e quindi sull''importo.'
- Esclusi anche chi ha subito la sanzione dell'art. 10, c. 3, d.lgs. 68/2012 per irregolarità in anni precedenti, chi riceve
  borse dichiarate incompatibili e alcune combinazioni di doppia iscrizione con un corso in un'altra regione (art. 2.6).
- Per gli iscritti al semestre filtro di Medicina, Odontoiatria e Veterinaria valgono regole e termini particolari (domanda
  fino al 31 marzo 2027).
- Il bando riguarda anche posti alloggio e contributi per la mobilità internazionale, riservati ai borsisti o richiesti nella
  stessa domanda.
- 'Apertura: data di pubblicazione del bando (24 luglio 2026); la scadenza è alle ore 12:00 del 10 settembre 2026.'
