requisiti:
- almeno_un_componente:
  - campo: disabile
    operatore: vero
  - campo: eta
    operatore: <=
    valore: 21
  fonte: Comune di Prato, pagina web
  citazione: Il contributo è destinato a sostenere la partecipazione di minori e giovani fino a 21 anni con disabilità grave
    ad attività estive di socializzazione svolte nell'estate 2026.
- non_modellabile: 'La disabilità deve essere grave: manca un campo sulla gravità della disabilità.'
  fonte: Comune di Prato, pagina web
  citazione: Il contributo è destinato a sostenere la partecipazione di minori e giovani fino a 21 anni con disabilità grave
    ad attività estive di socializzazione svolte nell'estate 2026.
- non_modellabile: 'Partecipazione ad attività estive di socializzazione svolte nell''estate 2026: manca un campo.'
  fonte: Comune di Prato, pagina web
  citazione: Il contributo è destinato a sostenere la partecipazione di minori e giovani fino a 21 anni con disabilità grave
    ad attività estive di socializzazione svolte nell'estate 2026.
note:
- 'La procedura risulta conclusa: sono stati pubblicati gli elenchi dei beneficiari con la Determinazione n. 2928 del 04 novembre
  2026.'
- '''Fino a 21 anni'' è stato letto come età non superiore a 21; potrebbe significare fino al compimento dei 21 anni.'
- Gli altri requisiti (per esempio la residenza) sono nell'avviso, non incluso; la pagina non indica date per le domande.
