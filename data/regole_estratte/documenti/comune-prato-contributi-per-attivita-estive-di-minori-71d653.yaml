id: comune-prato-contributi-per-attivita-estive-di-minori-71d653
titolo: Contributi per attività estive di minori e giovani con grave disabilità fino a 21 anni
ente: Comune di Prato
link: https://www.comune.prato.it/it/novita/avvisi/pagina4199.html?idnewshub=27930
apertura: null
chiusura: null
fonte: documento Comune di Prato, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-18'
requisiti:
- almeno_un_componente:
  - campo: eta
    operatore: <=
    valore: 21
  - campo: disabile
    operatore: vero
  fonte: Comune di Prato, pagina web
  citazione: minori e giovani fino a 21 anni con disabilità grave
- non_modellabile: 'La disabilità deve essere grave e il minore o giovane deve aver partecipato ad attività estive di socializzazione
    nell''estate 2026: mancano i campi.'
  fonte: Comune di Prato, pagina web
  citazione: ad attività estive di socializzazione svolte nell'estate 2026
- non_modellabile: Gli altri requisiti sono nell'avviso, che non è nel documento ricevuto.
  fonte: Comune di Prato, pagina web
  citazione: Pubblicati sulla pagina dell'avviso, gli elenchi dei beneficiari
note:
- Il documento ricevuto contiene solo l'inizio della pagina; gli elenchi dei beneficiari sono già pubblicati (Determinazione
  n. 2928 del 04 novembre 2026), quindi le domande sono chiuse.
- '"Fino a 21 anni" è reso con età non superiore a 21; il documento non dice se sia incluso chi ha già compiuto 21 anni.'
- 'Il documento non dice se occorra essere residenti a Prato: il comune non è indicato.'
