id: edisu-piemonte-premio-di-laurea-5305de
titolo: Premio di laurea
ente: EDISU Piemonte
link: https://www.edisu.piemonte.it/borse-e-contributi/benefici-economici/premio-di-laurea
apertura: '2027-05-04'
chiusura: '2027-06-03'
fonte: documento EDISU Piemonte, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-19'
requisiti:
- non_modellabile: 'Aver vinto la borsa di studio EDISU Piemonte nell''a.a. 2025/26: manca il campo.'
  fonte: EDISU Piemonte, pagina 63
  citazione: hanno vinto la borsa di studio assegnata da EDISU Piemonte nel precedente a.a. 2025/26
- campo: titolo_di_studio
  operatore: in
  valori:
  - laurea_triennale
  - laurea_magistrale
  fonte: EDISU Piemonte, pagina web
  citazione: consegui il titolo di laurea triennale, di laurea magistrale a ciclo unico o laurea magistrale
- non_modellabile: 'Titolo conseguito nell''ultimo anno regolare del corso, entro la sessione straordinaria dell''a.a. 2025/26:
    mancano anno e data del titolo.'
  fonte: EDISU Piemonte, pagina 63
  citazione: hanno conseguito il titolo nell’ultimo anno regolare del corso di studi entro la sessione straordinaria dell’a.a.
    2025/26, cioè
- non_modellabile: Non aver già ricevuto la borsa per il semestre aggiuntivo nell'a.a. 2025/26 o 2026/27.
  fonte: EDISU Piemonte, pagina 63
  citazione: Qualora gli studenti abbiano già ricevuto la borsa per il semestre aggiuntivo per l’a.a. 2025/26 oppure per l’a.a.
    2026/27, non
note:
- La procedura si apre solo se restano fondi dopo aver assegnato la borsa 2026/27 a tutti gli aventi diritto; altrimenti EDISU
  lo comunica sul sito.
- 'Non serve un nuovo ISEE universitario né nuova documentazione consolare: il premio non ha requisiti economici propri.'
- 'Non c''è un requisito di iscrizione o di sede attuale: chi si è laureato può essere iscritto altrove o non esserlo. La
  sede piemontese è implicita nella borsa EDISU 2025/26.'
- Il titolo di studio più alto è limitato a laurea triennale o magistrale (anche a ciclo unico); un titolo successivo nel
  frattempo è improbabile, ma resterebbe escluso.
- La domanda si chiude il 3 giugno 2027 alle ore 12.
