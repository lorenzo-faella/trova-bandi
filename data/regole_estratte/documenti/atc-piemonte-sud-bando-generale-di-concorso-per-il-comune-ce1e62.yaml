note:
- 'Il testo è l''avviso di pubblicazione: i requisiti completi (proprietà di alloggi, reddito, precedenti assegnazioni ecc.)
  sono nel bando n. 4/2026, non ricevuto.'
- Non è chiaro se i familiari di cittadini UE con diritto di soggiorno e gli apolidi seguano la regola degli extracomunitari.
- Domanda sul modulo del Comune, a mano, per posta o PEC al Comune di Carentino o all'ATC Piemonte Sud.
