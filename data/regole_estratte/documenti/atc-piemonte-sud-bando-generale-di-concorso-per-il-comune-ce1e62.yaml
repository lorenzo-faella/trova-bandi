note:
- Requisiti da possedere alla data di pubblicazione del bando (26/10/2026). Le lettere a) (cittadinanza) e b) (residenza o
  lavoro) valgono solo per il richiedente; le lettere da c) a i) per tutti i componenti del nucleo.
- 'Cittadini extra UE: il bando chiede soggiorno regolare e un regolare lavoro subordinato o autonomo (art. 40, c. 6, D.Lgs.
  286/1998), oppure la protezione internazionale. L''avviso di pagina 2 aggiunge che devono essere anche residenti in un comune
  dell''ambito: con la regola sulla residenza, chi lavora soltanto nell''ambito resta ''da verificare''. I collaboratori in
  Gestione Separata non sono stati inclusi.'
- Il limite ISEE di 25.326,56 euro vale al momento della pubblicazione ed è aggiornato ogni anno dalla Regione. Per mantenere
  l'alloggio dopo l'assegnazione il limite è il doppio (50.653,12 euro).
- Domande dal 26/10/2026 al 10/12/2026 al Comune di Carentino o all'ATC Piemonte Sud (a mano, raccomandata A.R. o PEC seguita
  dal frontespizio originale con marca da bollo da 16 euro); le domande arrivate dopo la scadenza sono escluse. Per i lavoratori
  emigrati all'estero il termine è prorogato di un mese (il bando indica il 10/01/2027) e concorrono per un solo ambito, con
  certificato consolare.
- Il bando rimanda alla definizione di nucleo dell'art. 4 della L.R. 3/2010, che non è nel documento.
