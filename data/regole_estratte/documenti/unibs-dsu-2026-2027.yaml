note:
- 'Borsa: la domanda online va confermata entro le 13:00 del 24 settembre 2026 (termine perentorio), con ISEE per il diritto
  allo studio universitario (o ISEE parificato) rilasciato entro la stessa data. Servizio abitativo: domanda entro il 20 agosto
  2026. L''apertura non è indicata. Il bando risulta già chiuso.'
- 'Art. 4: la borsa non si cumula con aiuti analoghi, ma lo studente può scegliere quale tenere. È una regola di cumulo, non
  di accesso, quindi non è modellata.'
- Il merito si conta dagli anni dalla prima immatricolazione assoluta (o reimmatricolazione), compresi gli anni ripetuti;
  anno_di_corso è l'anno di iscrizione attuale. Chi ha chiuso una carriera precedente allo stesso livello (rinuncia, trasferimento)
  può avere una borsa coi fondi d'Ateneo, ma deve rispettare i crediti dell'anno calcolato dalla prima immatricolazione.
- 'Tabella dei crediti: le alternative con la soglia piena sono sufficienti; sotto la soglia l''esito resta da verificare
  perché bonus, corsi con meno di 60 CFU annui, insegnamenti annuali, tempo parziale e disabilità abbassano il requisito in
  modi che il vocabolario non esprime.'
- 'Per i primi anni il merito ex post (35 CFU entro il 10 agosto 2027 o il 30 novembre 2027) serve solo a confermare la borsa:
  non è un requisito d''accesso.'
- Il dottorato e la specializzazione richiedono solo l'ammissione e l'iscrizione regolare; la tabella di merito cita anche
  le scuole di specializzazione di area sanitaria e odontoiatrica (D.I. 716/2016), mentre l'art. 3 esclude l'area medica del
  D. Lgs. 368/1999.
- Lo studente è autonomo solo se da due anni risiede fuori dalla famiglia di origine e ha redditi da lavoro dipendente di
  almeno 9.000 euro; altrimenti conta l'ISEE con i genitori. Definisce l'ISEE da usare, non è un requisito a sé.
- 'Rifugiati: ho usato protezione_internazionale, che comprende anche la protezione sussidiaria.'
- L'esenzione dall'ISEE per rifugiati, apolidi e Paesi poveri vale per l'ISEE; il bando non dice esplicitamente se valga anche
  per l'ISPE, che resta una soglia per tutti.
- Non ho l'art. 12 (revoca), l'Allegato 1 (conversione dei voti esteri) e l'Allegato 2 (sedi e tempi di percorrenza). La sezione
  dell'Allegato 3 sulle scadenze è vuota nel testo ricevuto.
- 'Titolo di studio: ''master'' è ammesso per chi si iscrive alla magistrale perché un master di I livello non supera la laurea
  magistrale, ma un master di II livello sì; il vocabolario non distingue.'
