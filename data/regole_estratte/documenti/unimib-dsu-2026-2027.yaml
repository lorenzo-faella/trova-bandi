note:
- Il bando riguarda più benefici; i requisiti sono quelli della borsa di studio, il beneficio principale. Le date indicate
  sono quelle della domanda di borsa (7 luglio - 30 settembre 2026).
- 'Altri benefici dello stesso bando: posto alloggio (domanda entro il 20 agosto 2026; residenza a oltre 90 minuti dalla sede,
  esclusi i residenti nei comuni delle residenze, requisiti di merito ed economici della borsa); servizio mensa a tariffa
  agevolata (domanda entro il 30 aprile 2027; ISEE fino a 30.000 euro e ISPE fino a 58.452,06 euro, almeno 15 CFU nell''a.a.
  2025/2026 per gli anni successivi); sovvenzione straordinaria (domanda entro il 30 aprile 2027; ISEE fino a 26.887,93 euro
  e ISPE fino a 58.452,06 euro, oppure ISEE fino a 30.000 euro per l''importo ridotto).'
- Il requisito ex post dei CFU per le matricole (entro il 10 agosto o il 30 novembre 2027) serve a mantenere la borsa e non
  è un requisito di accesso.
- Il Tabellario di merito con i CFU esatti per corso è pubblicato in un documento separato che non ho.
- La sezione 3.8 su dottorato e specializzazione e le incompatibilità del punto 10.1 non sono nel testo ricevuto.
