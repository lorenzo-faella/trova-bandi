note:
- 'Le regole riguardano la borsa di studio. Il bando copre anche alloggio (domande entro il 20 agosto 2026, riservato ai residenti
  a oltre 90 minuti dalla sede ed escluso chi risiede nei comuni delle residenze), servizio ristorazione (ISEE fino a 30.000
  euro, ISPE fino a 58.452,06, almeno 15 CFU nel 2025/2026 per gli anni successivi), sovvenzioni straordinarie e integrazione
  per mobilità (domande entro il 30 aprile 2027): non espressi qui.'
- 'La sezione 2 della borsa (destinatari) non è nel testo ricevuto: i livelli di corso ammessi sono ricavati dai requisiti
  di merito.'
- L'anno di corso si conta dalla prima immatricolazione assoluta, compresi gli anni ripetuti; per la laurea magistrale il
  primo fuori corso corrisponde al terzo anno.
- 'Le soglie di crediti scritte nelle alternative sono quelle standard dei corsi ad accesso programmato (le più alte): chi
  le supera è idoneo per il merito; sotto, l''esito resta da verificare.'
- Gli iscritti al semestre filtro di Medicina e Odontoiatria possono partecipare; per chi lo ha frequentato in un altro ateneo
  è prevista una riapertura dei termini con avviso separato.
