note:
- Bando unico dei benefici DSU di Milano-Bicocca a.a. 2026/2027; le regole riguardano la borsa di studio, il beneficio principale.
- 'Termini: borsa di studio dal 7 luglio al 30 settembre 2026 (riportati in apertura e chiusura); posto alloggio entro il
  20 agosto 2026; mensa, sovvenzione straordinaria e integrazione mobilità entro il 30 aprile 2027. La DSU per l''ISEE universitario
  va sottoscritta entro le stesse scadenze.'
- Il posto alloggio richiede in più la residenza in un comune a oltre 90 minuti dalla sede; la mensa a tariffa agevolata ha
  soglie diverse (ISEE fino a 30.000 euro, almeno 15 CFU nel 2025/2026 per gli anni successivi).
- 'È esclusa anche chi riceve per lo stesso anno di corso una borsa di altri enti: regola di cumulo, non modellata.'
- Il tabellario di merito esatto per corso è pubblicato a parte e non è nel testo; i CFU della tabella standard cambiano per
  accesso libero o programmato.
- Per le matricole il merito ex post (CFU entro il 10 agosto o il 30 novembre 2027) serve a mantenere la borsa, non ad ottenerla.
- Gli iscritti al semestre filtro di Bicocca seguono gli stessi termini; per chi lo frequenta altrove è prevista una riapertura
  dei termini con ISEE universitario 2026 entro il 31 dicembre 2026.
