note:
- La domanda va trasmessa via PEC ad adisu@pec.it entro le ore 12:00 del 30 settembre 2026; per i minorenni la presentano
  i genitori o i tutori, insieme alla dichiarazione di consenso (Allegato 2).
- La residenza in Umbria è richiesta alla data di pubblicazione del bando.
- 'L''assegno viene erogato solo dopo che il MUR ha attribuito le risorse, in ordine di protocollo fino a esaurimento: l''idoneità
  non dà diritto automatico al contributo.'
