id: adisu-umbria-bando-per-la-concessione-di-un-assegno-d-a2f7f7
titolo: Bando per la concessione di un assegno di cura forfettario a studenti universitari affetti da disabilità gravissime
  iscritti presso gli Istituti Universitari con sede in Umbria per l’a.a. 2026-2027
ente: ADiSU Umbria - Agenzia per il diritto allo studio universitario
link: https://www.adisu.umbria.it/altri-benefici-concorso/bando/2026-2027/2026/bando-la-concessione-di-un-assegno-di-cura-forfettario
apertura: null
chiusura: '2026-09-30'
fonte: documento ADiSU Umbria - Agenzia per il diritto allo studio universitario, estratto con LLM (Claude Code, claude-opus-5-5),
  non rivisto
pubblico: persone
ultimo_controllo: '2026-11-17'
requisiti:
- campo: disabile
  operatore: vero
  fonte: ADiSU Umbria - Agenzia per il diritto allo studio universitario, pagina 5
  citazione: disabilità gravissima certificata ai sensi dell’art. 3, comma 3, della Legge
- non_modellabile: 'Disabilità gravissima: titolare dell''indennità di accompagnamento o certificato non autosufficiente (allegato
    3 DPCM 159/2013), con almeno una delle condizioni dell''art. 3, comma 2, lettere b), d) e f) del DM 26 settembre 2016
    (ventilazione meccanica, lesioni spinali gravi, deprivazione sensoriale complessa): il vocabolario ha solo disabilità
    sì/no e percentuale.'
  fonte: ADiSU Umbria - Agenzia per il diritto allo studio universitario, pagina 3
  citazione: una delle condizioni di cui l’articolo 3, comma 2, lettere b), d) e f) del decreto
- campo: regione
  operatore: in
  valori:
  - Umbria
  fonte: ADiSU Umbria - Agenzia per il diritto allo studio universitario, pagina 5
  citazione: regione Umbria alla data di pubblicazione del presente Bando, affetti da
- campo: iscrizione
  operatore: in
  valori:
  - universita
  fonte: ADiSU Umbria - Agenzia per il diritto allo studio universitario, pagina 5
  citazione: risultino regolarmente iscritti, entro la data del 30 settembre 2026,
- non_modellabile: 'Iscrizione entro il 30 settembre 2026, per l''a.a. 2026-2027, a un corso di laurea (LCU, LT, LM) erogato
    in modalità convenzionale o mista presso un''università con sede legale in Umbria afferente ad ADiSU: il vocabolario non
    indica sede né modalità del corso.'
  fonte: ADiSU Umbria - Agenzia per il diritto allo studio universitario, pagina 5
  citazione: regione Umbria che rilasciano titoli di studio aventi valore legale
- non_modellabile: Non avere posizioni amministrative non regolarizzate o debiti verso ADiSU.
  fonte: ADiSU Umbria - Agenzia per il diritto allo studio universitario, pagina 5
  citazione: non abbiano posizioni amministrative non regolarizzate e/o debitorie
- non_modellabile: Avere un contratto con personale qualificato che assiste lo studente, della durata di almeno 10 mesi tra
    settembre 2026 e luglio 2027.
  fonte: ADiSU Umbria - Agenzia per il diritto allo studio universitario, pagina 4
  citazione: documentata da regolare contratto della durata di almeno 10 mesi nel
note:
- La domanda va inviata via PEC entro le ore 12:00 del 30 settembre 2026; per i minorenni la presentano i genitori o il tutore
  con la dichiarazione di consenso (Allegato 2).
- 'Il contributo non si cumula con benefici ADiSU o di altre amministrazioni per l''assistenza personale qualificata alla
  didattica: è una regola di cumulo, scritta qui come nota.'
- L'inserimento nell'elenco degli idonei è subordinato anche alla verifica della frequenza delle lezioni; l'erogazione dipende
  dalle risorse attribuite dal MUR.
