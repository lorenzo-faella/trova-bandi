note:
- La residenza in Umbria deve sussistere alla data di pubblicazione del bando.
- Il contributo è incompatibile con benefici analoghi per l'assistenza personale qualificata già concessi da ADiSU o da altre
  amministrazioni.
- Per i minorenni la domanda è presentata dai genitori o tutori.
- 'Scadenza: ore 12:00 del 30 settembre 2026; la data di apertura non è indicata.'
