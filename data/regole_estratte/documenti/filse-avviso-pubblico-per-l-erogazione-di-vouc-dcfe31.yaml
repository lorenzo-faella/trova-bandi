  fonte: FILSE - Finanziaria Ligure per lo Sviluppo Economico, pagina web
  citazione: di durata annuale e con almeno 60 CFU o CFA
- non_modellabile: 'Non aver già usufruito di un voucher "Specializzarsi per competere 2024": manca il campo.'
  fonte: FILSE - Finanziaria Ligure per lo Sviluppo Economico, pagina web
  citazione: Non possono partecipare coloro che hanno già usufruito di un voucher
note:
- L'età si valuta alla data di pubblicazione dell'Avviso sul sito della Regione Liguria, non alla domanda; laurea, residenza
  e master conseguito alla data di presentazione della domanda.
- 'Chiusura: il testo dice entro le ore 17:30 del 31/01/2028 o fino a esaurimento risorse, ma l''intestazione riporta "Scadenza:
  31 Ottobre 2028"; scelta la data del testo.'
- Serve una PEC personale attiva e la documentazione prevista dall'Avviso.
