- non_modellabile: 'Aver superato l''esame finale e conseguito il titolo di un Master annuale di I o II livello: manca il
    campo sul master concluso.'
  fonte: FILSE - Finanziaria Ligure per lo Sviluppo Economico, pagina web
  citazione: aver superato l'esame finale e conseguito il titolo di un Master annuale di I o II livello.
- non_modellabile: 'Caratteristiche del master: annuale con almeno 60 CFU o CFA, organizzato da Università o AFAM italiane
