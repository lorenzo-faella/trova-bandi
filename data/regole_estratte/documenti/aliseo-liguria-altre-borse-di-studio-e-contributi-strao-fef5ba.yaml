note:
- 'La pagina web descrive due misure: l''assegno di cura per studenti con disabilità gravissima (bando chiuso, domande dal
  1/9/2026 al 1/10/2026) e il servizio o contributo per il trasporto di studenti con invalidità motoria pari o superiore al
  66% (domande entro il 31/12/2026). I requisiti e le date si riferiscono all''assegno di cura, l''unico di cui c''è il bando
  completo.'
- 'Per il trasporto: iscrizione all''Università di Genova o AFAM, invalidità motoria pari o superiore al 66%, requisiti di
  merito del concorso benefici (non riportati) e ISEE universitario non superiore a 40.000 euro.'
- L'assegno è incompatibile con benefici analoghi per l'assistenza personale già concessi da ALiSEO o da altre amministrazioni.
