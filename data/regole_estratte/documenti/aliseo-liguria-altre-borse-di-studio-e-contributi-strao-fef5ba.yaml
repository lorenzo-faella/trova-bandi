note:
- La pagina descrive più misure. Le regole riguardano l'Assegno di cura forfettario per studenti con disabilità gravissima,
  di cui il testo riporta il bando. Domanda via PEC dalle 12:00 del 01/09/2026 alle 12:00 del 01/10/2026; la pagina lo segnala
  come 'BANDO CHIUSO'.
- 'Sulla stessa pagina c''è una misura distinta, non modellata qui: trasporti per studenti con invalidità motoria (Genova).
  È per gli iscritti all''Università di Genova o alle AFAM nell''a.a. 2026/2027, con invalidità motoria pari o superiore al
  66%, i requisiti di merito del concorso benefici e un ISEEU non superiore a € 40.000,00. La domanda va inviata via mail
  entro il 31/12/2026, e il servizio di trasporto in convenzione è solo per i residenti nel comune di Genova.'
- 'Il vocabolario non distingue i corsi telematici: la modalità convenzionale o mista resta da verificare.'
