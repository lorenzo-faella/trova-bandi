requisiti:
- non_modellabile: 'L''edificio deve trovarsi nella porzione di territorio del Comune di Perugia riconosciuta come non metanizzata
    (Delibera di Consiglio Comunale n. 134 del 20/07/2026) e fuori dal centro abitato dove ha sede la casa comunale: manca
    il campo.'
  fonte: Comune di Perugia, pagina web
  citazione: I cittadini non serviti dalla rete del gas metano hanno diritto alle agevolazioni fiscali per la fornitura di
    GPL o di gasolio da riscaldamento.
note:
- 'Il requisito riguarda la collocazione dell''edificio, non la residenza: per questo non è indicato il campo comune.'
- L'agevolazione vale per i rifornimenti effettuati nel 2026; si ottiene consegnando al fornitore il certificato scaricato
  online.
