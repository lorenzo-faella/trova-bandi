note:
- 'Il bando riguarda l''a.a. 2025/2026: iscrizione, anno di corso e requisiti di merito sono riferiti a quell''anno accademico.'
- 'La soglia ISEE nel PDF è spezzata (''2 6.000,00''): letta come 26.000 euro; la citazione usa la riga che introduce il requisito.'
- 'Iscritti agli ITS: il questionario non chiede ISEE universitario, ISPE e fuori corso per gli ITS, quindi per loro questi
  requisiti restano da verificare; il requisito ''in corso'' per gli ITS non è controllato.'
- 'Per le matricole 2024/2025 (oggi al secondo anno) il bando chiede tutti gli esami annuali del primo anno: è compreso nel
  requisito degli esami per gli anni successivi al primo.'
- Il bando è cumulabile con la borsa di studio del bando 'Benefici e Servizi'. Le borse sono 42, da 3.500 euro l'anno, rinnovabili
  fino a sei anni consecutivi previa verifica dei requisiti.
- Domanda solo online sul Portale studenti ADiSU (SPID livello 2, CIE o CNS) dalle 08:00 dell'11/05/2026 alle 12:00 dell'11/06/2026;
  l'iscrizione al corso può essere perfezionata dopo, ma prima dell'erogazione.
