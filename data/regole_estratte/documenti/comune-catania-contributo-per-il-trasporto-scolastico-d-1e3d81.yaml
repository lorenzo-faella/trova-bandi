note:
- Si è assunto che lo studente sia un figlio del richiedente; la domanda può essere presentata anche da un tutore.
- L'ISEE serve solo per l'eventuale graduatoria, non per l'accesso.
- Domande entro il 16/11/2026; la data di apertura non è indicata.
