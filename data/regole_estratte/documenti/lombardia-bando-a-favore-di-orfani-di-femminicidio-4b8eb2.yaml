note:
- La definizione di orfano per crimini domestici rimanda al punto A.1 dell'avviso, che non è nel testo ricevuto.
- I requisiti devono sussistere alla data della domanda. La procedura è a sportello, fino a esaurimento del fondo assegnato
  all'ATS di Brescia.
- La pagina indica l'apertura delle domande (14/12/2020) ma nessuna scadenza.
- 'Date corrette a mano il 22/11/2026 (decisione 100): il testo dice "DATA DI CHIUSURA Ore 12:00 del 15/06/2021".'
