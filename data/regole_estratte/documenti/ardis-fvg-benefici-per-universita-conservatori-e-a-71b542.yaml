- non_modellabile: 'Laureandi che chiedono l''ulteriore semestre: esclusi se conseguono il titolo prima del 17 settembre 2026,
    oppure se si laureano nell''a.a. 2025/2026 e proseguono gli studi fuori dal Friuli Venezia Giulia (salvo i master).'
  portata: rara
  fonte: ARDiS - Agenzia regionale per il diritto allo studio del Friuli Venezia Giulia, pagina 8
  citazione: 'I laureandi non possono ottenere la borsa di studio se:'
note:
- 'Il bando è unico e copre più benefici: le regole sopra sono quelle generali di iscrizione, merito, reddito e patrimonio,
  e la scadenza è quella della borsa di studio (17/09/2026 ore 13). Il contributo alloggio (scadenza 21/10/2026) vale solo
  per gli iscritti alle sedi di Portogruaro, Conegliano, Bolzano e Verona che risiedono in un comune ''fuori sede'' e pagano
  un alloggio. Il posto alloggio è per i residenti in comuni ''fuori sede''. Il contributo per la mobilità internazionale
  (scadenza 06/04/2027) è per gli idonei alla borsa. La data di apertura della domanda online sarà pubblicata sul sito.'
- Le sedi di Portogruaro, Conegliano, Bolzano e Verona sono ammesse perché il bando le cita (art. 46) come sedi delle Università
  di Trieste e di Udine. Con regione_ateneo = Friuli-Venezia Giulia non escludiamo altre istituzioni universitarie della regione
  diverse dalle Università di Trieste e di Udine.
- 'Gli iscritti agli ITS Academy possono chiedere solo il posto alloggio con il requisito di sola iscrizione: non sono destinatari
  della borsa.'
- Gli studenti del semestre filtro (classi LM-41, LM-42, LM-46) e quelli che l'hanno frequentato fuori regione e proseguono
  a Trieste o a Udine hanno regole e termini a parte (domande indicativamente dal 03/02/2027 al 10/03/2027).
- anno_di_corso va letto come anno contato dalla prima immatricolazione (la tabella si basa sull'a.a. di prima immatricolazione).
  L'ulteriore semestre è l'anno dopo la durata legale. Gli studenti con disabilità possono accedere fino al secondo anno fuori
  corso. Rinunce, trasferimenti e passaggi con riconoscimento di crediti contano nell'anzianità.
- 'Primo anno: nessun requisito di merito per l''accesso. I 20 crediti entro il 30/11 (9 per gli studenti con disabilità)
  servono solo a mantenere la borsa. Specializzazione e dottorato: servono i requisiti per l''iscrizione regolare all''anno.'
- 'Per i corsi con annualità sotto i 60 crediti le soglie sono riproporzionate secondo i valori pubblicati sul sito ARDIS:
  non è modellato.'
- Per la laurea magistrale è ammesso anche il titolo 'diploma', per i laureandi triennali che fanno domanda prima di laurearsi.
