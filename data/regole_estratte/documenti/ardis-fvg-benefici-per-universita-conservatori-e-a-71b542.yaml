note:
- Il bando unico ARDiS copre borsa di studio, posti alloggio, contributi alloggio e contributi per la mobilità internazionale;
  i requisiti estratti sono quelli generali (iscrizione, merito, reddito e patrimonio), con le esclusioni proprie della borsa.
- 'Posto alloggio: serve anche la residenza in un comune considerato fuori sede rispetto alla sede del corso (allegato 1,
  non ricevuto); gli studenti con disabilità basta che non risiedano nel comune sede del corso. Scadenze: 30 luglio 2026 per
  gli anni successivi, 27 agosto 2026 per le matricole.'
- 'Contributo alloggio (scadenza 21 ottobre 2026): solo per gli iscritti alle sedi di Portogruaro, Conegliano, Bolzano e Verona,
  residenti fuori sede e con alloggio a titolo oneroso di almeno 10 mesi e canone mensile di almeno 150 euro.'
- 'Contributo mobilità internazionale (dal 4 marzo al 6 aprile 2027): solo per idonei o beneficiari della borsa, con periodo
  all''estero riconosciuto in crediti.'
- 'Contributo per studenti genitori (art. 6.7): studenti residenti in FVG con figli minori o con disabilità residenti in FVG,
  con meno di 36 anni e idonei alla borsa.'
- La soglia ISEE riguarda l'ISEE per il diritto allo studio universitario (o l'ISEE universitario parificato per chi ha nucleo
  o redditi all'estero); non vale l'ISEE ordinario.
- Gli iscritti ITS possono chiedere solo il posto alloggio con requisito di sola iscrizione.
- Il periodo di ammissibilità (anni di iscrizione) per gli studenti senza disabilità rimanda a una parte del bando non ricevuta.
- 'Apertura: la data di attivazione della domanda online sarà pubblicata sul sito, quindi null. Chiusura: scadenza della borsa
  di studio, ore 13 del 17 settembre 2026.'
