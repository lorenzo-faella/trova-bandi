note:
- Data e ora di apertura e chiusura dei termini saranno comunicate con un successivo avviso sul sito ASPAL e sul Portale Sardegna
  Lavoro.
- Lo stato di disoccupazione richiede anche una DID attiva, che il vocabolario non distingue.
- Gli anni di residenza in Sardegna devono essere continuativi; il campo anni_residenza_regione non distingue la continuità.
- Basta una DSU presentata al momento della domanda, purché l'ISEE risultante non superi 40.000 euro all'istruttoria.
- 'I requisiti EASA/ENAC (lettere F e G) sono riferiti rispettivamente ai percorsi ATPL Frozen e MPL: si legge come requisito
  relativo al percorso scelto.'
- Tutti i requisiti vanno mantenuti fino alla conclusione del percorso, pena la decadenza.
