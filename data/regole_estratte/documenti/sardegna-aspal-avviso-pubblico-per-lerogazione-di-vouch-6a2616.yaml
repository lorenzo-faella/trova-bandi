note:
- L'età è resa con eta tra 18 e 30 (18 anni compiuti, 31 non compiuti), assumendo estremi inclusi.
- 'I dodici mesi di residenza in Sardegna devono essere continuativi e antecedenti la domanda: anni_residenza_regione >= 1
  presume che il campo conti la residenza attuale senza interruzioni.'
- Per l'ISEE vale anche la DSU già presentata, purché l'attestazione risulti non superiore a 40.000 euro alla data dell'istruttoria.
- Il titolo di studio estero riconosciuto equipollente o equivalente al diploma è ammesso.
- 'Le date di apertura e chiusura delle domande saranno rese note con un successivo avviso ASPAL: non indicate nel documento.'
