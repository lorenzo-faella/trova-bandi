note:
- La domanda di ammissione all'elenco è presentata dai soggetti erogatori (enti accreditati, cooperative sociali ecc.); le
  persone con disabilità sono i destinatari dei voucher. I requisiti sopra sono quelli dei destinatari.
- 'Gli sportelli per gli enti erano attivi fino al 10/12/2024; con l''ultima proroga (Decreto n. 97 del 22/12/2025) il rilascio
  dei voucher e l''attivazione dei servizi erano possibili fino al 28/02/2026: questa è la data usata come chiusura. La misura
  risulta quindi chiusa.'
- Apertura non indicata nella parte ricevuta.
