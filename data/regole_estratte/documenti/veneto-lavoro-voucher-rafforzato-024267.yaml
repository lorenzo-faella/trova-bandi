requisiti:
- campo: disabile
  operatore: vero
  fonte: Veneto Lavoro, pagina web
  citazione: 'I destinatari degli interventi sono le persone con disabilità in possesso dei seguenti requisiti:'
- campo: condizione_lavorativa
  operatore: in
  valori:
  - disoccupato
  fonte: Veneto Lavoro, pagina web
  citazione: essere disoccupate con un patto di servizio attivo;
- non_modellabile: 'Avere un patto di servizio attivo: manca il campo.'
  fonte: Veneto Lavoro, pagina web
  citazione: essere disoccupate con un patto di servizio attivo;
- non_modellabile: 'Iscrizione agli elenchi provinciali della legge 68/99 di una provincia o città metropolitana del Veneto:
    manca il campo (non coincide con la residenza).'
  fonte: Veneto Lavoro, pagina web
  citazione: essere iscritte agli elenchi provinciali della legge 68/99 di una delle province/città metropolitana della Regione
