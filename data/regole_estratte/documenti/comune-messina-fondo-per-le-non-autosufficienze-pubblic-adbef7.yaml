  - Scaletta Zanclea
  fonte: Comune di Messina, pagina 2
  citazione: A) Che i cittadini residenti nei comuni del Distretto Socio Sanitario n° 26 in possesso della
- campo: disabile
  operatore: vero
  fonte: Comune di Messina, pagina 2
  citazione: grave o gravissima, interessate alla predisposizione degli interventi previsti dalla legge, quali il
- almeno_uno_di:
  - non_modellabile: 'Certificazione di disabilità grave ai sensi della Legge 104/1992 art. 3 comma 3 (per il Patto di Servizio):
      manca il campo sul tipo di certificazione.'
    citazione: certificazione sanitaria di cui alla Legge 104/1992 art. 3 comma 3, possono presentare la richiesta
  - non_modellabile: 'Attestazione di riconoscimento della disabilità ai sensi del D.Lgs. 62/2024 (per il Progetto di Vita):
      manca il campo sul tipo di attestazione.'
    citazione: l’attestazione di riconoscimento della disabilità ai sensi del D.L. 62/2024, possono presentare
  fonte: Comune di Messina, pagina 3
  citazione: Che i beneficiari possono optare, alternativamente, per le misure sopra descritte di cui alle lettere A)
note:
- Il distretto D26 comprende i comuni elencati nell'intestazione; chi non risiede a Messina presenta la domanda al proprio
  comune.
- L'ISEE sociosanitario (oltre 25.000 euro) riduce l'importo del 30%, non esclude.
- 'Apertura: dal giorno successivo alla pubblicazione; la pagina web è datata 30/09/2026, quindi si è indicato il 1° ottobre
  2026.'
- L'accesso è subordinato alla copertura dei fondi e alla valutazione multidimensionale; priorità alla continuità degli interventi
  già attivati.
