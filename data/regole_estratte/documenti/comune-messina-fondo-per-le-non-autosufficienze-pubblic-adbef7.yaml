id: comune-messina-fondo-per-le-non-autosufficienze-pubblic-adbef7
titolo: 'Fondo per le Non Autosufficienze: pubblicato l’avviso per accedere agli interventi in favore delle persone con disabilità'
ente: Comune di Messina
