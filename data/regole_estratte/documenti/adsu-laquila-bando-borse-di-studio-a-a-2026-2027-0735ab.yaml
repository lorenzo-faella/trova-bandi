note:
- Domanda da confermare online entro il 31 agosto 2026; la data di apertura non è nel testo ricevuto. Riapertura dei termini
  nel 2027 per chi arriva dal semestre filtro di altri atenei.
- 'Possono partecipare cittadini italiani e UE, stranieri ai sensi della L. 40/98 e apolidi: in pratica nessuna cittadinanza
  è esclusa, quindi non ho scritto un requisito di cittadinanza.'
- Serve l'ISEE per il diritto allo studio universitario 2026 alla scadenza del concorso; gli studenti stranieri con redditi
  all'estero presentano documentazione consolare entro il 30 ottobre 2026.
- 'Il merito dei primi anni è valutato ex post (20 crediti entro il 10 agosto 2027 e il 30 novembre 2027): sono condizioni
  di mantenimento. Gli studenti con invalidità almeno al 66% conservano la borsa senza crediti.'
- 'L''art. 7 (prima immatricolazione) non è nel testo ricevuto: il requisito sull''anno di corso rimanda a esso.'
- 'L''art. 15 vieta di cumulare la borsa con altre borse: lo studente sceglie, quindi non è un requisito di accesso.'
