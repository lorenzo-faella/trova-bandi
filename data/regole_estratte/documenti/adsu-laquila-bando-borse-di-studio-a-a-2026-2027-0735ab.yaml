note:
- La domanda va confermata online entro il 31 agosto 2026; l'iscrizione all'anno accademico va perfezionata entro il 31 marzo
  2027 (10 maggio 2027 per chi si laurea alla triennale in sessione straordinaria e si iscrive alla magistrale), pena l'esclusione.
- Per gli studenti che concludono il semestre filtro in altri atenei e si iscrivono a L'Aquila nel secondo semestre i termini
  saranno riaperti nel primo trimestre 2027.
- Gli anni di corso si contano dalla prima immatricolazione assoluta; il campo fuori_corso_o_ripetente non distingue il primo
  fuori corso (ammesso) dal ripetente (escluso).
- 'La borsa è incompatibile con altre borse per lo stesso anno: lo studente deve scegliere entro 10 giorni dalle graduatorie
  provvisorie. È una scelta, non un requisito d''accesso.'
- 'Gli iscritti ai corsi AFAM sono trattati come i corrispondenti livelli universitari (primo livello come triennale, secondo
  livello come magistrale biennale): il bando non distingue requisiti di merito diversi.'
