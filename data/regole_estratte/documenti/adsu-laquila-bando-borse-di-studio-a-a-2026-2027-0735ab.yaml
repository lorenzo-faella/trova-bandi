note:
- La domanda va confermata online entro il 31 agosto 2026; il bando prevede una riapertura nel 2027 solo per chi conclude
  il semestre filtro in altri Atenei, con termini non ancora indicati.
- Serve l'ISEE per il diritto allo studio universitario 2026; gli studenti stranieri non residenti o con nucleo all'estero
  autocertificano i dati economici con documentazione consolare entro il 30 ottobre 2026; per i Paesi particolarmente poveri
  ISEE e ISPE valgono 0.
- I requisiti di merito del primo anno (20 crediti entro il 10 agosto e il 30 novembre 2027) sono verificati dopo l'assegnazione
  e servono a confermare la borsa, quindi non sono stati scritti come requisiti di accesso.
- 'La borsa non è cumulabile con altre borse per lo stesso anno: lo studente deve scegliere, quindi è una regola di cumulo
  e non un requisito.'
- Chi ha una laurea triennale e si iscrive a un ciclo unico può avere la borsa solo dal 4° anno.
