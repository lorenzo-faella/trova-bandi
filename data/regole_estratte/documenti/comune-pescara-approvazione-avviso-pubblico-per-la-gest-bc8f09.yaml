note:
- È un bando di mobilità (cambio alloggio) riservato a chi è già assegnatario di un alloggio E.R.P.; la residenza nei quattro
  comuni è ricavata dal fatto che l'alloggio assegnato deve trovarsi lì.
- 'Le domande si presentano dalla data di pubblicazione (non indicata) in quattro periodi: fino al 29/01/2027, fino al 30/04/2027,
  fino al 30/07/2027 e fino al 29/10/2027, sempre entro le 13:00.'
- 'La sezione ''CONDIZIONI SOGGETTIVE'' è arrivata vuota: i punteggi e le eventuali condizioni lì descritte non sono stati
  valutati.'
