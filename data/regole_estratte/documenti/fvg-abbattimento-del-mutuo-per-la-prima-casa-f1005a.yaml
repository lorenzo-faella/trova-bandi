id: fvg-abbattimento-del-mutuo-per-la-prima-casa-f1005a
titolo: Abbattimento del mutuo per la prima casa - Famiglia e Infanzia Carta famiglia - Contributo per abbattere il capitale
  residuo da restituire del mutuo per l’acquisto, l’acquisto con contestuale recupero, il recupero o la costruzione della
  prima casa in occasione della nascita o dell'adozione del terzo figlio a partire dal 1° gennaio 2024.
ente: Regione Autonoma Friuli Venezia Giulia
link: https://www.regione.fvg.it/rafvg/cms/RAFVG/famiglia-casa/politiche-famiglia/FOGLIA55/
apertura: null
chiusura: null
fonte: documento Regione Autonoma Friuli Venezia Giulia, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti:
- non_modellabile: 'Titolarità di Carta famiglia in corso di validità, con i figli già inseriti nel nucleo dell''ISEE e della
    Carta famiglia: manca un campo.'
  fonte: Regione Autonoma Friuli Venezia Giulia, pagina 4
  citazione: 1. La domanda di contributo è presentata dal titolare di Carta famiglia in corso di
- almeno_uno_di:
  - campo: isee
    operatore: <=
    valore: 35000
  - non_modellabile: Eccezioni all'obbligo di ISEE previste dalla norma, che il testo non elenca.
  fonte: Regione Autonoma Friuli Venezia Giulia, pagina 4
  citazione: in possesso di un ISEE ordinario pari o inferiore a 35.000,00 euro in corso di
- campo: numero_figli
  operatore: '>='
  valore: 3
  fonte: Regione Autonoma Friuli Venezia Giulia, pagina 5
  citazione: almeno tre figli, di cui l’ultimo anche adottato se con un’età inferiore ai diciotto anni, nato o
- campo: mesi_da_evento_figlio
  operatore: <
  valore: 12
  fonte: Regione Autonoma Friuli Venezia Giulia, pagina 6
  citazione: perentoriamente entro un anno dalla nascita.
- almeno_un_componente:
  - campo: figlio
    operatore: vero
  - campo: eta
    operatore: <
    valore: 18
  fonte: Regione Autonoma Friuli Venezia Giulia, pagina 6
  citazione: adottato se di età inferiore ai diciotto anni, dopo il secondo, a partire dal 1 gennaio 2024 e
- almeno_uno_di:
  - tutti_di:
    - campo: abitazione
      operatore: in
      valori:
      - proprieta
    - campo: mutuo_prima_casa
      operatore: vero
  - non_modellabile: 'Immobile in proprietà o comproprietà (o area per nuova costruzione) da adibire a prima casa, con trasferimento
      di dimora e residenza entro 18 mesi dalla stipula del finanziamento, e finanziamento in essere per la prima casa: chi
      non vi abita ancora va verificato a parte.'
  fonte: Regione Autonoma Friuli Venezia Giulia, pagina 5
  citazione: b) ha in atto un finanziamento da una banca o da un ente previdenziale per la prima casa
- non_modellabile: 'L''immobile (o l''area per la nuova costruzione) deve trovarsi in Friuli Venezia Giulia e il richiedente
    deve avervi o trasferirvi entro 18 mesi la dimora abituale e la residenza: il vocabolario non ha la posizione dell''immobile.'
  fonte: Regione Autonoma Friuli Venezia Giulia, pagina 5
  citazione: c) ha la dimora abituale e la residenza anagrafica nell’immobile oggetto dell’intervento
note:
- Il contributo spetta per ogni figlio nato o adottato dopo il secondo a partire dal 1° gennaio 2024; la domanda va presentata
  entro un anno dalla nascita, non c'è una finestra fissa.
- Il finanziamento deve essere stato concesso da una banca o da un ente previdenziale per acquisto, acquisto con recupero,
  recupero o nuova costruzione della prima casa.
- Una sola domanda, per un solo tipo di intervento. Gli interventi ammessi rimandano all'articolo 3, che non è nel testo ricevuto.
- Dopo la concessione il beneficiario deve mantenere la residenza in Friuli Venezia Giulia per cinque anni.
