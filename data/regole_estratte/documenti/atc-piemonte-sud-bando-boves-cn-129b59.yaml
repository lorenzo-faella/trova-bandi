note:
- I requisiti vanno posseduti alla data del 16/10/2026 dal richiedente e dagli altri componenti del nucleo.
- La non titolarità di diritti reali riguarda qualsiasi alloggio adeguato al nucleo, in Italia o nello Stato di nazionalità,
  inclusa la casa in cui si vive; sono fatti salvi nuda proprietà, alloggio inagibile, pignorato o assegnato al coniuge separato.
- 'Il testo disponibile si interrompe a metà dell''elenco dei requisiti (fine pagina 3): eventuali altri requisiti nella parte
  mancante non sono stati estratti.'
- Per gli extra UE il testo richiede regolare soggiorno e lavoro subordinato o autonomo (art. 40, c. 6, d.lgs. 286/1998);
  non è chiaro se valgano anche i familiari con diritto di soggiorno.
- La data di apertura non è indicata esplicitamente (il bando è protocollato il 16/10/2026). Per i lavoratori emigrati all'estero
  il termine è prorogato di trenta giorni.
- Domanda su moduli del Comune di Boves, a mano su appuntamento, via PEC o raccomandata A.R.
