note:
- È un bando per l'assegnazione di alloggi di edilizia sociale nell'ambito territoriale n. 7 (Cuneo e comuni vicini); i requisiti
  vanno posseduti al 16/10/2026, data di pubblicazione.
- Per i cittadini extra UE ho considerato regolarmente soggiornanti i titoli 'familiare con diritto di soggiorno', 'lungo
  periodo' e 'altro titolo'; gli apolidi non sono citati dal bando.
- Le categorie riservatarie (giovani coppie, anziani, invalidi, nuclei monogenitoriali) contano per la quota del 25% degli
  alloggi, non per l'accesso.
- La scadenza è alle 12:00 del 30/11/2026; per i lavoratori emigrati all'estero è prorogata di trenta giorni. La data di apertura
  non è indicata esplicitamente.
