note:
- I requisiti vanno posseduti alla data del 16/10/2026, data di protocollo del bando; il documento non indica una data di
  apertura delle domande.
- La domanda va presentata entro le ore 12:00 del 30/11/2026 a mano su appuntamento, via PEC o per raccomandata; per i lavoratori
  emigrati all'estero il termine è prorogato di trenta giorni.
- I requisiti sulla casa e sulle assegnazioni precedenti valgono per tutto il nucleo, non solo per il richiedente.
- Gli apolidi non sono nominati tra i cittadini ammessi.
- 'Fino al 25% degli alloggi è riservato a giovani coppie, anziani, invalidi e nuclei monogenitoriali: è una riserva nella
  graduatoria, non un requisito.'
