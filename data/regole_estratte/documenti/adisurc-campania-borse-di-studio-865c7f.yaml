note:
- 'Non ci sono limiti di età né requisiti di cittadinanza o residenza: conta la sede del corso in Campania. Tutti i requisiti
  vanno posseduti alla scadenza del concorso.'
- L'iscrizione all'a.a. 2026/2027 (con pagamento della tassa regionale) va perfezionata entro il 31/03/2027, pena l'esclusione;
  si può fare domanda anche prima di iscriversi.
- 'Merito: le soglie usano anno_di_corso con ''<='' perché crescono con l''anno; l''ulteriore semestre è letto come l''anno
  successivo all''ultimo (4° per la triennale, 3° per la magistrale, 6° o 7° per il ciclo unico). L''anno di corso si conta
  dalla prima immatricolazione al tipo di corso (art. 2.3), non sempre coincide con quello dichiarato dall''ateneo. Per la
  magistrale il bonus è solo quello residuo della triennale: 15 è il massimo teorico. Non modellate le riduzioni per corsi
  con meno di 60 CFU o con corsi annuali (fino a 4 crediti) e gli obblighi formativi del secondo anno.'
- 'Gli iscritti al primo anno non hanno requisiti di merito alla domanda, ma devono conseguire 20 CFU entro il 30/11/2027
  (100% della borsa se entro il 10/08/2027) per non perdere la borsa: è una condizione successiva, non modellata. Esonerati
  gli studenti con disabilità.'
- 'ISEE: serve l''ISEE per il diritto allo studio universitario (DSU sottoscritta nel 2026), sommato all''indicatore della
  situazione economica all''estero; la soglia è al netto di borse e premi percepiti nel 2024. Per chi ha il nucleo all''estero
  vale l''ISEE universitario parificato, da inviare entro il 31/03/2027. Il nucleo segue le regole dell''ISEE Università (studente
  indipendente, orfano, ecc.).'
- 'Titolo di pari livello: chi ha un titolo AFAM o estero (anche non riconosciuto) di pari livello è escluso, ma il vocabolario
  non distingue questi titoli. Chi ha come titolo più alto un master è trattato solo nel ramo del dottorato.'
- Domanda solo online sul sito ADISURC (SPID o CIE), da confermare entro le ore 12:00 del 10/09/2026. Gli iscritti al semestre
  filtro di Medicina, Odontoiatria e Veterinaria e chi si trasferisce da un'altra regione possono presentarla entro il 31/03/2027.
  Il documento non indica la data di apertura.
- Le parti sulle rettifiche (art. 8.3) e sul trasferimento da altra regione (art. 5.4) a cui il bando rimanda non sono nel
  documento.
