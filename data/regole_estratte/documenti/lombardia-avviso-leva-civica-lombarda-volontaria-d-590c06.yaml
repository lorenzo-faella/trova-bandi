id: lombardia-avviso-leva-civica-lombarda-volontaria-d-590c06
titolo: 'Avviso ‘Leva civica lombarda volontaria: destinazione futuro. Palestra civica di cittadinanza attiva per il rafforzamento
  delle competenze e delle professionalità delle giovani generazioni’. ATTIVAZIONE DEI PERCORSI DI LEVA CIVICA.'
ente: Regione Lombardia
link: https://www.bandi.regione.lombardia.it/servizi/servizio/catalogo/dettaglio/politiche-sociali/terzo-settore-volontariato/avviso-leva-civica-lombarda-volontaria-destinazione-futuro-palestra-civica-cittadinanza-attiva-rafforzamento-competenze-professionalit-giovani-generazioni-RLD12025048223
apertura: '2026-05-25'
chiusura: '2027-10-31'
fonte: documento Regione Lombardia, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti:
- campo: cittadinanza
  operatore: in
  valori:
  - italiana
  - ue
  - familiare_con_diritto_soggiorno
  - extra_ue_lungo_periodo
  - protezione_internazionale
  - apolide
  - altro_titolo
  fonte: Regione Lombardia, pagina web
  citazione: i cittadini extra comunitari con regolare permesso di soggiorno
- almeno_uno_di:
  - campo: regione
    operatore: in
    valori:
    - Lombardia
  - campo: regione_domicilio
    operatore: in
    valori:
    - Lombardia
  fonte: Regione Lombardia, pagina web
  citazione: sono residenti o domiciliati in Lombardia;
- campo: eta
  operatore: tra
  valore:
  - 18
  - 28
  fonte: Regione Lombardia, pagina web
  citazione: hanno compiuto i diciotto anni e non superato il ventottesimo anno di età
- campo: condizione_lavorativa
  operatore: in
  valori:
  - disoccupato
  fonte: Regione Lombardia, pagina web
  citazione: sono in condizione di inoccupazione o disoccupazione
- non_modellabile: 'Avere la Dichiarazione di Immediata Disponibilità (DID) e il Patto di Servizio Personalizzato (PSP): mancano
    i campi.'
  fonte: Regione Lombardia, pagina web
  citazione: sono in possesso di una Dichiarazione di Immediata Disponibilità (DID) e di un Patto di Servizio Personalizzato
    (PSP).
- non_modellabile: 'Non avere in corso altri percorsi di Leva civica lombarda volontaria, non aver già superato con quelli
    svolti il limite complessivo di 12 mesi e non essere titolare di altre politiche attive del lavoro regionali finanziate
    dal FSE+: mancano i campi.'
  fonte: Regione Lombardia, pagina web
  citazione: non hanno in corso altri percorsi di Leva civica lombarda volontaria
note:
- 'Per i cittadini extra UE la pagina chiede solo un "regolare permesso di soggiorno": ho ammesso tutti i titoli di soggiorno
  tranne `nessun_titolo`.'
- 'Ho reso "inoccupazione o disoccupazione" (D. Lgs. 150/2015) con `disoccupato`: chi non ha mai lavorato e cerca lavoro dovrebbe
  rispondere così.'
- I requisiti devono sussistere alla data della domanda di partecipazione. La domanda passa attraverso l'Ente beneficiario.
- L'Allegato A2 (domanda di partecipazione) è citato ma il suo testo non è stato ricevuto.
