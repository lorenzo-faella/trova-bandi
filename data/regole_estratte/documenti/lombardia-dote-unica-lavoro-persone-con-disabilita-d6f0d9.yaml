note:
- 'La pagina non elenca i destinatari: rimanda all''avviso allegato (e al suo aggiornamento del 07/08/2026), non disponibili.'
- 'La misura è della Provincia di Pavia, ma la pagina non dice se serva la residenza o il domicilio nella provincia, né il
  vocabolario ha un campo per la provincia di residenza: non è stato aggiunto un requisito territoriale.'
- 'La linea Inserimento è per chi cerca lavoro, la linea Mantenimento per chi è già occupato: la condizione lavorativa non
  è stata vincolata perché la pagina non la definisce.'
