note:
- Le due linee (Dote Inserimento per disoccupati iscritti al Collocamento Mirato della Provincia di Pavia, Dote Mantenimento
  per occupati ai sensi della L. 68/99) sono espresse come alternative.
- 'Per la Dote Mantenimento i requisiti di accesso rimandano al paragrafo 1.2 dell''avviso, che non è tra le sezioni ricevute:
  le condizioni specifiche sono riassunte solo dalla scheda ''Chi può partecipare''.'
- La domanda è presentata dall'operatore accreditato (soggetto esecutore) tramite Bandi e Servizi; sportello fino a esaurimento
  fondi, chiusura alle ore 12:00 salvo proroghe.
- 'Il testo della domanda di partecipazione (Allegato 2) non è tra le sezioni ricevute: eventuali incompatibilità con altri
  percorsi di politica attiva non sono verificabili qui.'
