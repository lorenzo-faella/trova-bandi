note:
- 'Date dall''art. 3: compilazione online dalle ore 9:00 del 21 luglio 2026 alle ore 14:00 del 7 settembre 2026; regolarizzazione
  (upload documenti) entro le ore 14:00 del 30 novembre 2026. Il promemoria di pagina 5 riporta ''30 Novembre 2026'' accanto
  alla compilazione, apparentemente per uno sfasamento delle righe.'
- 'Gli anni di corso della tabella 4 sono contati dall''anno di prima immatricolazione: per la triennale l''anno 4 e per la
  magistrale l''anno 3 corrispondono al primo anno fuori corso; per il ciclo unico 245 crediti valgono per il sesto anno (fuori
  corso dei corsi quinquennali) e 300 per il settimo.'
- 'I laureandi che non proseguono gli studi e gli iscritti con riserva alla magistrale in attesa della laurea triennale possono
  partecipare in deroga (art. 6): non espresso.'
- Gli studenti con DSA (L. 170/2010) hanno la stessa riduzione del merito dei disabili, ma il campo disabile potrebbe non
  coprirli.
- Le sedi Enna e Caltagirone vengono dalla tabella 11 (status in sede); eventuali altre sedi dell'Università Kore danno esito
  incerto.
