note:
- 'Date dall''art. 3: compilazione dalle ore 9:00 del 21 luglio 2026 alle ore 14:00 del 7 settembre 2026. Il promemoria di
  pagina 5 riporta 30 novembre 2026, che secondo l''art. 3 è il termine per regolarizzare la domanda (caricare i documenti).'
- 'L''art. 7 sulla durata di concessione dei benefici (anni massimi dalla prima immatricolazione) non è nel testo ricevuto:
  requisito non verificato.'
- Le tabelle in appendice (3 merito primo anno, 4 e 4 bis CFU anni successivi, 5 limiti economici) non sono nel testo; i limiti
  ISEE e ISPE sono presi dall'art. 8.
- Il merito del primo anno è verificato ex post per mantenere la borsa. Per i primi anni serve il diploma di scuola media
  superiore.
- Chi è iscritto a due corsi ha diritto ai benefici per una sola iscrizione. Laureandi e iscritti con riserva alla magistrale
  hanno regole particolari (art. 6) non modellate.
- L'art. 5 sulle incompatibilità non è nel testo ricevuto.
