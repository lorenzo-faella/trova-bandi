note:
- La scadenza della domanda online è alle ore 14:00 del 7 settembre 2026 (art. 3), con compilazione dalle ore 9:00 del 21
  luglio 2026; il promemoria a pagina 5 accosta alla scadenza della domanda la data del 30 novembre 2026, che l'art. 3 indica
  invece come termine per la regolarizzazione.
- Le tabelle dei crediti (4, 4 bis) e la tab. 5 dei limiti ISEE/ISPE sono in appendice e non sono nel testo ricevuto; i limiti
  ISEE e ISPE sono però scritti nell'art. 8.
- 'Mancano nel testo ricevuto gli articoli sulla durata dei benefici (art. 7) e sulle incompatibilità (art. 5): limiti sugli
  anni fuori corso e incompatibilità con altre borse non sono verificati.'
- 'Per gli iscritti al primo anno il merito è valutato ex post al saldo della borsa: non è un requisito di accesso.'
- Possono partecipare anche i laureandi entro la sessione straordinaria 2025/26 e gli iscritti con riserva alla magistrale
  biennale, con benefici assegnati con riserva.
- Gli studenti internazionali con redditi o patrimoni all'estero presentano ISEEU/ISPEU parificato.
