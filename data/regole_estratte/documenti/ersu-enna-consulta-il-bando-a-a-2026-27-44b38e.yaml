note:
- 'Date incoerenti: il promemoria di pagina 5 indica il 30 novembre 2026 come scadenza della compilazione, mentre l''art.
  3 fissa la compilazione online dal 21 luglio 2026 al 7 settembre 2026 ore 14 e la regolarizzazione (upload documenti) entro
  il 30 novembre 2026. Si usa la data dell''art. 3.'
- Ammessi in deroga anche i laureandi che contano di laurearsi entro la sessione straordinaria 2025/26 e gli iscritti con
  riserva al primo anno di magistrale biennale.
- 'Studenti internazionali: serve ISEEU/ISPEU parificato e permesso di soggiorno valido; i documenti sono adempimenti di domanda.'
- 'Lo status di fuori sede (e il posto letto) dipende dal comune di residenza (tab. 11) e da un contratto di locazione registrato
  di almeno 10 mesi: riguarda l''importo e il servizio abitativo, non l''idoneità alla borsa.'
- Le tabelle 4 bis, 11 bis e il resto della tabella 11 sono richiamate ma non presenti nelle sezioni ricevute.
