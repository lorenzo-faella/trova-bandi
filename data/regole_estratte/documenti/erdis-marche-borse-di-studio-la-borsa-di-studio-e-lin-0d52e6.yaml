id: erdis-marche-borse-di-studio-la-borsa-di-studio-e-lin-0d52e6
titolo: Borse di studio La Borsa di studio è l’intervento diretto fondamentale del diritto allo studio universitario
ente: ERDIS Marche - Ente regionale per il diritto allo studio
link: https://www.erdis.it/servizi/servizio-dettaglio/3161252
apertura: null
chiusura: '2026-08-28'
fonte: documento ERDIS Marche - Ente regionale per il diritto allo studio, estratto con LLM (Claude Code, claude-opus-5-5),
  non rivisto
pubblico: persone
ultimo_controllo: '2026-11-19'
requisiti:
- almeno_uno_di:
  - campo: iscrizione
    operatore: in
    valori:
    - universita
    - afam
  - non_modellabile: 'Iscrizione ai corsi Poliarte - Politecnico delle arti applicate all''impresa o alla Scuola Superiore
      per Mediatori Linguistici di Ancona o Fermo: il vocabolario non ha un valore di iscrizione per questi istituti.'
  fonte: ERDIS Marche - Ente regionale per il diritto allo studio, pagina web
  citazione: Hanno titolo a partecipare al concorso per il conferimento delle borse di studio
- campo: regione_ateneo
  operatore: in
  valori:
  - Marche
  fonte: ERDIS Marche - Ente regionale per il diritto allo studio, pagina web
  citazione: studenti che si iscriveranno ad una istituzione universitaria con sede nella regione Marche
- almeno_uno_di:
  - campo: livello_corso
    operatore: in
    valori:
    - laurea_triennale
    - laurea_magistrale
    - ciclo_unico
    - afam_primo_livello
    - afam_secondo_livello
    - specializzazione
    - dottorato
  - non_modellabile: 'Corsi Poliarte o della Scuola Superiore per Mediatori Linguistici: il vocabolario non ha un livello
      di corso per questi istituti.'
  fonte: ERDIS Marche - Ente regionale per il diritto allo studio, pagina web
  citazione: ai corsi di laurea di primo e secondo livello e di laurea magistrale a ciclo unico
- non_modellabile: 'Per i corsi di specializzazione: durata almeno biennale ed esclusi quelli dell''area medica (D.Lgs. 368/1999);
    il vocabolario non distingue durata e area della specializzazione.'
  portata: rara
  fonte: ERDIS Marche - Ente regionale per il diritto allo studio, pagina web
  citazione: ad eccezione di quelli dell’area medica di cui al Dlgs 4 agosto 1999, n. 368
- non_modellabile: 'Per i dottorandi: non beneficiare della borsa di dottorato (D.M. 224/99) o di altra analoga provvidenza.'
  portata: rara
  fonte: ERDIS Marche - Ente regionale per il diritto allo studio, pagina web
  citazione: a condizione che l’iscritto non benefici della borsa di studio di cui al Decreto Ministeriale n. 224/99 o di
    altra analoga provvidenza
- non_modellabile: 'La borsa spetta solo per il conseguimento del primo titolo per ciascun livello di studio: non si può verificare
    se si possiede già un titolo dello stesso livello del corso a cui ci si iscrive.'
  fonte: ERDIS Marche - Ente regionale per il diritto allo studio, pagina web
  citazione: limitatamente al conseguimento del primo titolo di laurea per ciascun livello di studio
- non_modellabile: Requisiti di merito ed economici previsti dal bando, che la pagina non riporta.
  fonte: ERDIS Marche - Ente regionale per il diritto allo studio, pagina web
  citazione: in possesso dei requisiti di merito ed economici previsti dal presente bando
note:
- La pagina rimanda al bando e al PDF dei termini e condizioni per i requisiti di merito ed economici, che non sono nel testo
  ricevuto.
- Gli iscritti al semestre aperto (Medicina, Odontoiatria, Veterinaria) potranno presentare domanda solo dopo un bando specifico
  ERDIS, con scadenza diversa dal 28/08/2026.
- La domanda apre con la pubblicazione del bando, di cui la pagina non indica la data.
- 'Possono partecipare studenti italiani e stranieri: nessun requisito di cittadinanza.'
