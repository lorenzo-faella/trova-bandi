note:
- La regola riguarda il contributo di 500 euro del regolamento per chi non è beneficiario né idoneo alla borsa; l'incremento
  del 30% per borsisti e idonei descritto nella pagina web è un altro intervento.
- 'Requisito sui crediti: per gli studenti universitari almeno tre crediti entro il 10.8.2026 (esclusi gli iscritti al 1°
  anno; per specializzazioni e dottorati serve l''ammissione al secondo anno); per l''Istituto Superiore di Studi Musicali
  almeno tre crediti entro il 30.11.2026, e il testo non dice se anche lì sono esclusi gli iscritti al 1° anno.'
- 'crediti_conseguiti è il totale dei crediti, mentre il bando guarda una data o l''anno precedente: la verifica è approssimata.'
- Domanda (istanza su modello standard ADSU) entro il 31.3.2027 via PEC a info@pec.adsuteramo.it, con certificazione dell'invalidità.
  I contributi sono ripartiti 30% al primo anno e 70% agli anni successivi, fino a esaurimento dei fondi.
