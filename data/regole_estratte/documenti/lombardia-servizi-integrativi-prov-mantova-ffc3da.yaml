requisiti:
- campo: disabile
  operatore: vero
  fonte: Regione Lombardia, pagina 7
  citazione: 'I destinatari dei servizi sono le persone con disabilità in possesso dei seguenti requisiti:'
- almeno_uno_di:
  - tutti_di:
    - campo: condizione_lavorativa
      operatore: interseca
      valori:
      - disoccupato
    - non_modellabile: Iscrizione al Collocamento Mirato ai sensi della Legge 68/1999.
    citazione: persone disoccupate iscritte al Collocamento Mirato ai sensi della Legge n. 68/1999
  - tutti_di:
    - campo: condizione_lavorativa
      operatore: interseca
      valori:
      - occupato
    - non_modellabile: Occupazione ai sensi della Legge 68/1999 (collocamento mirato).
    citazione: persone occupate ai sensi della Legge n. 68/1999
  fonte: Regione Lombardia, pagina 7
  citazione: persone disoccupate iscritte al Collocamento Mirato ai sensi della Legge n. 68/1999
- non_modellabile: 'Essere inseriti in una politica attiva regionale che preveda espressamente i servizi integrativi: oggi
    solo la Dote Unica Lavoro Disabilità (DULD).'
  fonte: Regione Lombardia, pagina 7
  citazione: politica attiva regionale che prevede formalmente tale possibilità all'interno del proprio atto
- non_modellabile: 'Avviso della Provincia di Mantova: il legame con il territorio provinciale (collocamento mirato o dote
    attivati in provincia di Mantova) non si esprime con il vocabolario, che non ha la provincia di residenza.'
  fonte: Regione Lombardia, pagina 7
  citazione: Si adotta, per la Provincia di Mantova, quale parte integrante e sostanziale del presente
note:
- 'Il documento contiene la scheda web, il decreto regionale e la determina provinciale, ma non il testo dell''Avviso (Allegato
  A): i requisiti sono presi dal riepilogo dei destinatari nella determina; eventuali condizioni ulteriori dell''avviso non
  sono verificabili.'
- 'Il documento non dice espressamente che serve la residenza in Lombardia o in provincia di Mantova, quindi non è stato messo
  un requisito su regione o comune: il legame territoriale resta da verificare.'
- 'I servizi integrativi si usano in affiancamento alla DULD: chi non ha una dote DULD attiva non può accedervi.'
- Domande a sportello sulla piattaforma regionale Bandi e Servizi (BeS) dal 17/12/2025 alle ore 12:00 del 26/02/2027, salvo
  proroghe e fino a esaurimento delle risorse (140.000 euro).
