id: toscana-lavorare-all-estero-borse-di-mobilita-pr-d78665
titolo: 'Lavorare all''estero, borse di mobilità professionale: il bando 2023-2027'
ente: Regione Toscana
link: https://www.regione.toscana.it/-/lavorare-all-estero-borse-di-mobilit%C3%A0-professionale-per-disoccupati-o-inattivi-il-bando-2023
apertura: '2023-06-01'
chiusura: '2027-12-31'
fonte: documento Regione Toscana, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-24'
requisiti:
- campo: cittadinanza
  operatore: in
  valori:
  - italiana
  - ue
  - extra_ue_lungo_periodo
  fonte: Regione Toscana, pagina 1
  citazione: cittadino/a dell'Unione Europea o cittadino/a di paesi terzi in possesso di soggiorno UE per soggiornanti di
    lungo periodo
- campo: regione
  operatore: in
  valori:
  - Toscana
  fonte: Regione Toscana, pagina 7
  citazione: essere residenti in Toscana;
- campo: eta
  operatore: '>='
  valore: 18
  fonte: Regione Toscana, pagina 7
  citazione: aver compiuto 18 anni;
- campo: condizione_lavorativa
  operatore: in
  valori:
  - disoccupato
  - inattivo
  - studente
  - pensionato
  fonte: Regione Toscana, pagina 1
  citazione: disoccupato/a oppure inattivo/a, iscritto/a ad un Centro per l'impiego della Toscana
- non_modellabile: 'Iscrizione a un Centro per l''impiego della Toscana al momento della stipula del contratto estero o della
    lettera di impegno: manca il campo.'
  fonte: Regione Toscana, pagina 1
  citazione: disoccupato/a oppure inattivo/a, iscritto/a ad un Centro per l'impiego della Toscana
- non_modellabile: 'Aver svolto presso un Centro per l''impiego della Toscana l''azione "Consulenza Eures", da disoccupato
    o inattivo, registrata nel Patto di servizio e non più di sei mesi prima della stipula del contratto: manca il campo.'
  fonte: Regione Toscana, pagina 1
  citazione: aver svolto presso un Centro per l'impiego della Toscana l’azione di politica attiva “Consulenza Eures”.
- non_modellabile: 'Possesso di un contratto di lavoro, apprendistato o tirocinio non curriculare (almeno tre mesi, avvio
    entro quattro mesi dalla domanda) o di una lettera di impegno di un datore di lavoro in un paese UE o EFTA diverso dall''Italia:
    manca il campo.'
  fonte: Regione Toscana, pagina 1
  citazione: essere in possesso di un contratto di lavoro/apprendistato/tirocinio o della lettera di impegno di un datore
    di lavoro estero alla stipula del contratto.
- non_modellabile: 'Non beneficiare per la stessa attività di altri finanziamenti pubblici o privati: manca il campo.'
  fonte: Regione Toscana, pagina 7
  citazione: beneficiano per la stessa attività del sostegno di altri finanziamenti pubblici/privati.
note:
- 'Il bando è rivolto a disoccupati o inattivi senza limite d''età massimo: ''inattivi'' comprende studenti e pensionati,
  quindi sono ammessi tutti i non occupati.'
- Lo stato di disoccupato/inattivo va posseduto al momento della stipula del contratto estero o della lettera di impegno,
  non necessariamente alla domanda.
- Le domande si presentano dal giorno successivo alla pubblicazione sul BURT (31.05.2023) fino al 31/12/2027, salvo esaurimento
  delle risorse; domanda online con bollo da 16 euro.
