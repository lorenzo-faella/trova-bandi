note:
- 'Il bando è aperto a studenti italiani e stranieri: nessun requisito di cittadinanza.'
- Per gli iscritti al primo anno il merito (35 crediti, o 20/23 per la magistrale, entro il 10 agosto 2027) serve solo a confermare
  la borsa dopo l'assegnazione, quindi non è un requisito di accesso; gli iscritti al primo anno di laurea e ciclo unico devono
  comunque sostenere la prova di verifica della preparazione iniziale.
- 'Gli studenti con nucleo familiare all''estero non hanno l''ISEE Università: l''ateneo calcola un ISEE parificato, o attribuisce
  d''ufficio la prima fascia per i Paesi fuori dall''allegato 1; qui si confronta il campo isee_universitario con la soglia.'
- La DSU va sottoscritta entro il 30 settembre 2026, pena l'esclusione; occorre risultare iscritti all'a.a. 2026/27 alla pubblicazione
  della graduatoria definitiva (salvo dottorato, specializzazione e primo anno di magistrale).
- Gli studenti del semestre aperto immatricolati nel secondo semestre da altri atenei potranno fare domanda in una finestra
  successiva, indicativamente fine gennaio/febbraio 2027.
