- non_modellabile: Non essere beneficiari, per lo stesso anno di corso, di borse o benefici analoghi da altri enti pubblici
    o privati.
  fonte: Università degli Studi di Milano, pagina 4
  citazione: Beneficiari per lo stesso anno di corso di Borsa di Studio (o analogo beneficio, in qualsiasi forma)
