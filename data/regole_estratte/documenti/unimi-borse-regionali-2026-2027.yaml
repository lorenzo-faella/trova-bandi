note:
- Domanda dal 10 luglio al 30 settembre 2026 (ore 23.59), anche se non ancora iscritti; la DSU per l'ISEE Università va sottoscritta
  entro il 30 settembre 2026 (entro il 7 agosto 2026 per chi chiede l'alloggio). Chi ha frequentato il semestre aperto di
  Medicina, Odontoiatria o Veterinaria in un altro ateneo e si immatricola alla Statale nel secondo semestre potrà fare domanda
  con un avviso di riapertura (indicativamente gennaio-febbraio 2027).
- 'Soglie di crediti: la tabella distingue corsi ad accesso libero e programmato, e per la magistrale ammette il bonus residuo
  della triennale dal 2° anno. Si passa con certezza con la soglia più alta (accesso programmato); sotto la soglia dell''accesso
  libero meno il bonus massimo dell''anno il requisito manca; nella fascia intermedia l''esito resta da verificare.'
- L'"ultimo semestre (primo anno fuori corso)" è reso come anno_di_corso 4 per la laurea, 3 per la magistrale, 6 o 7 per il
  ciclo unico (+55/+60 rispetto all'ultimo anno; al 6° anno le soglie del ciclo unico di 5 e di 6 anni coincidono, 245/269).
  Le soglie si riducono in proporzione per i corsi con un numero di crediti annui diverso da 60.
- Le matricole ottengono la borsa sulla base del reddito; i crediti da conseguire entro il 10 agosto 2027 (35 per laurea e
  ciclo unico, 20 o 23 per la magistrale) servono a confermarla e non sono requisiti di accesso.
- 'Per gli studenti con nucleo familiare all''estero il reddito si valuta con l''ISEE parificato calcolato dall''Ateneo, o
  con la 1ª fascia d''ufficio per i Paesi fuori dall''allegato 1: regole di calcolo, non modellate.'
