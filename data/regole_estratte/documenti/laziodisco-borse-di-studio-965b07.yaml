note:
- 'La pagina parla di ''sede legale'' dell''università o istituto nel Lazio; il campo regione_ateneo indica la sede del corso:
  di solito coincidono, ma per sedi distaccate potrebbero differire.'
- '''Istituto di alta formazione'' è stato reso con iscrizione AFAM; gli ITS non sono citati.'
- 'La domanda va presentata entro la scadenza della prima fase del Bando: chi la perde non può più chiedere la borsa per quell''anno.
  La pagina non indica date (il bando esce di solito a giugno), quindi apertura e chiusura restano null.'
