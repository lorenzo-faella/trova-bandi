note:
- 'La pagina riunisce due avvisi: la riapertura dei termini per la borsa di studio 2025/2026 e il bando studentato per gli
  stessi studenti. Le regole qui sopra valgono per entrambi.'
- Il bando studentato è riservato in più agli studenti fuori sede, condizione che il vocabolario non esprime e che non vale
  per la borsa.
- 'Termini: borsa dal 04/03/2026 ore 12:00 al 24/03/2026 ore 12:00; studentato entro il 24/03/2026 ore 12:00, a pena di esclusione.'
