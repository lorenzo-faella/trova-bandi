id: laziodisco-contributo-mobilita-internazionale-184bcc
titolo: Contributo mobilità internazionale
ente: DiSCo Lazio - Ente regionale per il diritto allo studio e la promozione della conoscenza
link: https://laziodisco.it/borse-di-studio-e-contributi/contributo-mobilita-internazionale/
apertura: null
chiusura: null
fonte: documento DiSCo Lazio - Ente regionale per il diritto allo studio e la promozione della conoscenza, estratto con LLM
  (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti:
- non_modellabile: Requisiti di reddito e merito previsti dal Bando per il diritto allo studio dell'anno accademico di riferimento,
    a cui la pagina rimanda e che non è disponibile.
  fonte: DiSCo Lazio, pagina web
  citazione: Puoi richiedere il contributo se possiedi i requisiti di reddito e merito previsti dal Bando per il diritto allo
    studio dell’anno accademico di riferimento.
- non_modellabile: 'Partecipazione (anche solo come candidato in attesa di esito) a un programma di mobilità internazionale:
    manca il campo.'
  fonte: DiSCo Lazio, pagina web
  citazione: Puoi presentare la domanda anche se non hai ancora ricevuto l’esito della selezione per il programma di mobilità.
