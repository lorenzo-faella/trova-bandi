    operatore: in
    valori:
    - Lazio
  - campo: regione_domicilio
    operatore: in
    valori:
    - Lazio
  fonte: DiSCo Lazio, pagina web
  citazione: residenti e/o domiciliati nel Lazio
- almeno_uno_di:
