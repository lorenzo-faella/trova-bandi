      operatore: in
      valori:
      - afam
    - campo: regione_ateneo
      operatore: in
      valori:
      - Lazio
    citazione: iscritti agli Istituti di Alta Formazione Artistica, Musicale e Coreutica (AFAM) con sede nel Lazio
  fonte: DiSCo Lazio, pagina web
  citazione: 'Il contributo è rivolto agli studenti:'
note:
- Non si verifica che l'università sia statale o legalmente riconosciuta, né che l'istituto AFAM rilasci titoli con valore
  legale.
- 'La partecipazione a un programma di mobilità non è scritta come requisito esplicito, ma è implicita nella frase sull''esito
  della selezione: per prudenza è resa come non_modellabile.'
- 'Il contributo va chiesto insieme alla domanda di borsa di studio, entro la scadenza della prima fase del Bando per il diritto
  allo studio; non si può chiedere dopo. La pagina non indica date: apertura e chiusura null.'
