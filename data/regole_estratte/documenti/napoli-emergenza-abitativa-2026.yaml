note:
- 'La pagina è solo la notizia del Comune: i requisiti completi (ISEE, reddito, cittadinanza, ecc.) sono nell''Avviso Pubblico
  PDF allegato, non disponibile qui. La regola va completata leggendo quel PDF.'
- La pagina dice espressamente 'residenti in Campania'; la restrizione al Comune di Napoli è dedotta dal fatto che l'avviso
  è comunale e le domande si presentano alle PUA delle Municipalità di Napoli o al Servizio Politiche per la Casa.
- 'Non è chiaro se l''attestazione di presa in carico da parte del servizio sociale municipale valga anche per la Misura 2:
  nel testo compare tra le istruzioni della Misura 1 (PUA), per questo è messa solo nell''alternativa della Misura 1.'
- 'Date: la procedura è aperta dalla pubblicazione (30 gennaio 2026) al 31 dicembre 2026 (termine perentorio), ma le domande
  per entrambe le misure si presentano a partire dal 2 marzo 2026. Procedura a sportello in ordine cronologico fino a esaurimento
  delle risorse.'
- 'Modalità: Misura 1 presso le PUA delle Municipalità; Misura 2 via PEC a misura2.fondoregionale@pec.comune.napoli.it.'
