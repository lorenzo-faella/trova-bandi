  - non_modellabile: 'Misura 2: necessità di abbandonare l''alloggio privato o pubblico per provvedimenti di sgombero per
      emergenza, pericolo strutturale o altre cause di forza maggiore; manca un campo.'
  fonte: Comune di Napoli, pagina web
  citazione: nuclei familiari che si trovano in particolari situazioni di emergenza o disagio abitativo ovvero di priorità
    sociale
- non_modellabile: Gli altri requisiti di partecipazione sono nell'Avviso Pubblico allegato in PDF, il cui testo non è presente
    nella pagina.
  fonte: Comune di Napoli, pagina web
  citazione: I dettagli sul contributo concedibile, sui requisiti di partecipazione e sulla documentazione da allegarsi alle
