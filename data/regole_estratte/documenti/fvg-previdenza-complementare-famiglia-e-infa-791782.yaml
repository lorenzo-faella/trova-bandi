note:
- L'ISEE richiesto è quello per le prestazioni agevolate rivolte ai minorenni; si usa il campo isee generico.
- La domanda si presenta ogni anno dal 1° marzo al 31 maggio (termine perentorio), solo online con SPID, CIE o CRS; il testo
  non indica l'anno, quindi apertura e chiusura restano null.
- Il contributo è legato alla Carta famiglia della Regione Friuli Venezia Giulia, che presuppone la residenza in regione,
  ma il testo ricevuto non riporta i requisiti della Carta.
