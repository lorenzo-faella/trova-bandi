- almeno_uno_di:
  - campo: isee
    operatore: <=
    valore: 35000
  - non_modellabile: 'Esenzione dall''ISEE per le madri con figli minori a carico in un percorso di protezione e uscita dalla
      violenza e per i genitori vedovi da non più di tre anni: mancano i campi.'
    citazione: 'Il possesso dell’ISEE non è richiesto:'
  fonte: Regione Autonoma Friuli Venezia Giulia, pagina 1
  citazione: avere un ISEE in corso di validità con valore inferiore o uguale a 35.000,00 euro
- almeno_un_componente:
  - campo: figlio_a_carico
    operatore: vero
  - campo: eta
    operatore: <
    valore: 18
  fonte: Regione Autonoma Friuli Venezia Giulia, pagina 3
  citazione: Per richiedere il contributo i figli minori, anche adottati, devono essere fiscalmente
- non_modellabile: 'Posizione di previdenza complementare aperta presso un fondo iscritto all''Albo COVIP a favore del figlio
    minore, con versamenti nell''anno precedente di almeno 300 euro per figlio effettuati dal titolare o da un beneficiario
    di Carta famiglia: mancano i campi.'
