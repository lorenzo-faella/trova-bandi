note:
- 'La pagina si intitola "Bonus Libri 2026", ma sia la pagina web sia il PDF (avviso dei "Buoni Libro" per testi universitari,
  edizione 2026) riguardano gli stessi beneficiari: studenti iscritti o immatricolati nelle sedi di Taranto di UNIBA, POLIBA,
  LUMSA, ITS Academy e Conservatorio Paisiello. Nessuno dei due parla di libri scolastici.'
- 'La sede è resa con comune_ateneo = Taranto: non si verifica che l''istituto sia proprio uno dei cinque elencati (UNIBA,
  POLIBA, LUMSA, ITS Academy, Conservatorio Paisiello).'
- 'L''iscrizione deve riguardare l''A.A. 2025/2026 e/o 2026/2027: l''anno accademico non è nel vocabolario e non è controllato.'
- 'Il documento dice solo "Requisito ISEE" senza specificare il tipo: si è usato l''ISEE ordinario. Il ".3" dopo "40.000,00"
  sembra un rimando a una nota che non è nel testo.'
- 'L''avviso non pone requisiti di residenza a Taranto: non sono stati aggiunti.'
- Domande solo online con SPID/CIE sulla piattaforma del Comune, dal 31 ottobre alle ore 23:00 del 13 dicembre 2026.
