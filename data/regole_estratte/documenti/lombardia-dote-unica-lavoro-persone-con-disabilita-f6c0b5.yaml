id: lombardia-dote-unica-lavoro-persone-con-disabilita-f6c0b5
titolo: Dote Unica Lavoro Persone con Disabilità- Prov. Cremona
ente: Regione Lombardia
link: https://www.bandi.regione.lombardia.it/servizi/servizio/catalogo/dettaglio/istruzione-formazione-lavoro/lavoro-occupazione/pr-cr-42025049889-dote-unica-lavoro-persone-disabilit-prov-cremona-PR_CR_42025049889
apertura: '2025-12-17'
chiusura: '2027-02-26'
fonte: documento Regione Lombardia, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti:
- campo: disabile
  operatore: vero
  fonte: Regione Lombardia, pagina web
  citazione: Persone con le caratteristiche di disabilità descritte all'art. 1 della L. 68/1999
- almeno_uno_di:
  - tutti_di:
    - campo: condizione_lavorativa
      operatore: in
      valori:
      - disoccupato
      citazione: che risultino disoccupate ai sensi dell'art. 19 del D.Lgs. 150/2015
    - non_modellabile: 'Iscrizione agli elenchi del Collocamento Mirato istituiti presso la Provincia di Cremona: manca il
        campo.'
      citazione: iscritte agli elenchi del Collocamento Mirato istituiti presso la Provincia di Cremona
  - tutti_di:
    - campo: condizione_lavorativa
      operatore: in
      valori:
      - occupato
    - campo: eta
      operatore: '>='
      valore: 16
      citazione: dai 16 anni compiuti
    - non_modellabile: 'Occupazione ai sensi della L. 68/1999 presso imprese private o enti pubblici con sede legale o operativa
        nella provincia di Cremona: manca il campo sulla sede del datore di lavoro.'
      citazione: presso imprese private o enti pubblici aventi sede legale o operativa nella provincia di Cremona
  fonte: Regione Lombardia, pagina web
  citazione: Lavoratori occupati ai sensi della L.68/99, dai 16 anni compiuti
note:
- 'Due linee: Dote Inserimento lavorativo (disoccupati iscritti al Collocamento Mirato della Provincia di Cremona) e Dote
  Mantenimento lavorativo (lavoratori occupati ai sensi della L. 68/1999 presso datori con sede nella provincia di Cremona).'
- 'Il testo non indica una soglia di percentuale di invalidità: rinvia alle caratteristiche dell''art. 1 della L. 68/1999.'
