note:
- 'Il bando copre borsa di studio e posto alloggio. La borsa richiede merito e reddito; il posto alloggio coperto da borsa
  richiede anche la distanza (oltre 90 minuti dalla sede); l''alloggio a pagamento richiede distanza e merito ma non il reddito:
  per questo il requisito di reddito ha l''alternativa non modellabile dell''alloggio a pagamento.'
- La sede in provincia di Bergamo è dedotta dalle sedi nominate (Bergamo, Dalmine); la verifica dell'ateneo esatto resta da
  fare.
- 'Chiusura: domanda di borsa e alloggio entro le 12 del 3 settembre 2026 (anche per l''alloggio a pagamento); per la sola
  borsa il documento indica il 5 ottobre 2026 (domanda online e ISEEU). La data di apertura non è indicata.'
- 'L''ISEEU deve essere sottoscritto nel 2026 entro il 5 ottobre 2026 (3 settembre 2026 per chi chiede anche l''alloggio):
  è una scadenza procedurale.'
- 'Per le matricole il merito si conferma dopo (35 CFU o 20 CFU entro il 10 agosto 2027, OFA entro il 30 settembre 2027):
  sono condizioni per mantenere la borsa, non per chiederla.'
- 'Lo studente indipendente e i dottorandi possono presentare un ISEE senza i genitori: cambia il calcolo dell''ISEE, non
  la soglia.'
