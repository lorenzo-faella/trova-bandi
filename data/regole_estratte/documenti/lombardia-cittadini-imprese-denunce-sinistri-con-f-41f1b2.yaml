id: lombardia-cittadini-imprese-denunce-sinistri-con-f-41f1b2
titolo: 'Cittadini/imprese - Denunce sinistri con fauna selvatica: richieste di risarcimento per danni ai veicoli e/o lesioni
  a seguito sinistri con fauna selvatica riservata a cittadini o imprese proprietarie dei veicoli'
ente: Regione Lombardia
link: https://www.bandi.regione.lombardia.it/servizi/servizio/catalogo/dettaglio/sicurezza-protezione-civile/sicurezza-urbana-polizia-stradale/rimborso-danni-veicoli-lesioni-sinistri-fauna-selvatica-RLA12023031363
apertura: '2024-02-15'
chiusura: null
fonte: documento Regione Lombardia, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti:
- non_modellabile: 'Aver subito un danno al veicolo e/o lesioni per collisione o investimento con fauna selvatica (esclusi
    i cani randagi) su strade statali, regionali, provinciali o comunali della Lombardia: mancano i campi sul sinistro.'
  fonte: Regione Lombardia, pagina web
  citazione: abbiano subito un danno a seguito di collisione/investimento con fauna selvatica nel territorio della regione
    Lombardia
- non_modellabile: 'Essere proprietario del veicolo danneggiato: manca il campo.'
  fonte: Regione Lombardia, pagina web
  citazione: questo strumento è ad uso esclusivo di cittadini/imprese proprietarie dei veicoli danneggiati
note:
- 'Il requisito territoriale riguarda il luogo del sinistro (territorio lombardo), non la residenza del richiedente: per questo
  non ho usato il campo regione.'
- Lo strumento è aperto anche a imprese proprietarie di veicoli; dal 16 marzo 2026 studi legali, compagnie assicuratrici,
  società di gestione sinistri ed enti previdenziali usano lo strumento RLA12025048663.
- Chi non ha SPID, CIE o CNS può far compilare la domanda da una persona delegata.
- Domande dal 15/02/2024 ore 10:00; il documento non indica una chiusura.
