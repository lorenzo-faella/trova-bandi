id: lombardia-cittadini-imprese-denunce-sinistri-con-f-41f1b2
titolo: 'Cittadini/imprese - Denunce sinistri con fauna selvatica: richieste di risarcimento per danni ai veicoli e/o lesioni
  a seguito sinistri con fauna selvatica riservata a cittadini o imprese proprietarie dei veicoli'
ente: Regione Lombardia
link: https://www.bandi.regione.lombardia.it/servizi/servizio/catalogo/dettaglio/sicurezza-protezione-civile/sicurezza-urbana-polizia-stradale/rimborso-danni-veicoli-lesioni-sinistri-fauna-selvatica-RLA12023031363
apertura: '2024-02-15'
chiusura: null
fonte: documento Regione Lombardia, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti:
- non_modellabile: 'Aver subito un danno al veicolo o lesioni per una collisione o un investimento con fauna selvatica (esclusi
    i cani randagi) su una strada statale, regionale, provinciale o comunale in Lombardia: manca il campo.'
  fonte: Regione Lombardia, pagina web
  citazione: che abbiano subito un danno a seguito di collisione/investimento con fauna selvatica nel territorio della regione
    Lombardia
- non_modellabile: 'Essere proprietario del veicolo danneggiato: manca il campo.'
  fonte: Regione Lombardia, pagina web
  citazione: questo strumento è ad uso esclusivo di cittadini/imprese proprietarie dei veicoli danneggiati
note:
- 'Conta il luogo del sinistro (territorio lombardo), non la residenza: per questo non ho messo `regione`.'
- Lo strumento è aperto anche alle imprese proprietarie dei veicoli. Dal 16 marzo 2026 studi legali, assicurazioni, società
  di gestione sinistri ed enti previdenziali usano un altro strumento (RLA12025048663).
- La pagina indica l'apertura delle domande (15/02/2024) ma nessuna scadenza.
