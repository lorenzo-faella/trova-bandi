id: fvg-progetto-ama-de-fvg-attuazione-modelli-d-076ca6
titolo: Progetto AMA DE FVG - Attuazione modelli di intervento per l’inclusione attiva dei detenuti Il progetto rientra nel
  Programma Nazionale “Inclusione e lotta alla povertà 2021-2027”, co-finanziato attraverso i fondi europei FSE+, e rappresenta
  uno degli strumenti operativi per sostenere percorsi concreti di inclusione socio-lavorativa delle persone detenute e costruire
  nuove opportunità di vita.
ente: Regione Autonoma Friuli Venezia Giulia
link: https://www.regione.fvg.it/rafvg/cms/RAFVG/salute-sociale/interventi-socio-sanitari/FOGLIA43/
apertura: null
chiusura: null
fonte: documento Regione Autonoma Friuli Venezia Giulia, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti:
- non_modellabile: 'Essere detenuto o internato in un istituto penitenziario: è una condizione giudiziaria, che per scelta
    non chiediamo.'
  fonte: Regione Autonoma Friuli Venezia Giulia, pagina 1
  citazione: persone detenute e internate, ossia a coloro che, in base a un provvedimento dell’A
note:
- Le categorie con 'particolare attenzione' (fine pena vicino, giovani adulti, fragilità sociale) sono priorità, non requisiti.
- 'Non è un bando con domanda individuale: gli interventi sono attuati negli istituti penitenziari; il documento non indica
  un periodo per le domande.'
