id: fvg-bando-per-la-concessione-di-incentivi-a-121ee0
titolo: Bando per la concessione di incentivi a favore di persone fisiche a copertura dei premi assicurativi avente a oggetto
  le unità immobiliari a uso residenziale - Anno 2025 Al fine di contenere gli effetti anche di tipo finanziario conseguenti
  agli eventi catastrofali e calamitosi.
ente: Regione Autonoma Friuli Venezia Giulia
link: https://www.regione.fvg.it/rafvg/cms/RAFVG/famiglia-casa/casa/FOGLIA14/
apertura: null
chiusura: null
fonte: documento Regione Autonoma Friuli Venezia Giulia, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti:
- non_modellabile: Alla data della domanda essere proprietario o titolare di un diritto reale di godimento (con atto pubblico
    registrato prima della domanda) su un'unità immobiliare a uso residenziale in Friuli Venezia Giulia, categorie catastali
    da A1 a A9 e A11; esclusi locatari e comodatari. Per le polizze condominiali la domanda la presenta l'amministratore di
    condominio (o il condòmino facente funzioni). Mancano i campi sulla proprietà e sulla posizione dell'immobile.
  fonte: Regione Autonoma Friuli Venezia Giulia, pagina 1
  citazione: risultano proprietarie o titolari di diritti reali di godimento formalmente riconosciuti
- non_modellabile: 'Essere intestatario o cointestatario di una polizza contro i danni da eventi atmosferici e catastrofali
    sull''immobile, valida alla data della domanda e con il premio già pagato: manca il campo.'
  fonte: Regione Autonoma Friuli Venezia Giulia, pagina 1
  citazione: sono intestatarie o cointestatarie di uno o più contratti di assicurazione in corso di
- non_modellabile: 'Non costituire impresa ai sensi della normativa europea sugli aiuti di Stato (non esercitare un''attività
    economica): manca il campo.'
  fonte: Regione Autonoma Friuli Venezia Giulia, pagina 4
  citazione: Non possono accedere all’incentivo le persone fisiche che costituiscono impresa
note:
- 'Il bando non chiede la residenza in Friuli Venezia Giulia: chiede che l''immobile assicurato si trovi in regione. Per questo
  non ho messo `regione`, che indica la residenza.'
- È ammesso anche un fabbricato in corso di costruzione, purché abbia già le concessioni edilizie.
- Il periodo per presentare le domande non è nel testo ricevuto.
