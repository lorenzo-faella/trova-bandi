note:
- I requisiti su proprietà, assegnazioni precedenti, ISEE-ERP e precedenti ERP valgono anche per gli altri componenti del
  nucleo.
- La proprietà esclusa riguarda qualunque immobile adeguato alle esigenze del nucleo, in Italia o all'estero, non solo un'altra
  casa; non conta la casa coniugale assegnata al coniuge in sede di separazione.
- La domanda si presenta per un unico ambito territoriale. Gli apolidi non sono elencati tra i beneficiari.
- Domanda online con SPID entro le 23:59 del 17.12.2026, oppure allo sportello entro le 17:00 del 15.12.2026; marca da bollo
  da 16 euro.
