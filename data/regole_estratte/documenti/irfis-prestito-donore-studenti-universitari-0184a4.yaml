id: irfis-prestito-donore-studenti-universitari-0184a4
titolo: Prestito d’onore studenti universitari
ente: IRFIS FinSicilia
link: https://www.irfis.it/prestito-donore-studenti-universitari/
apertura: '2026-06-04'
chiusura: '2026-09-08'
fonte: documento IRFIS FinSicilia, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti:
- campo: iscrizione
  operatore: in
  valori:
  - universita
  incerto_fuori_elenco: true
  fonte: IRFIS FinSicilia, pagina 5
  citazione: a) iscrizione al primo anno delle Università, degli istituti universitari nonché degli istituti superiori di
- campo: regione_ateneo
  operatore: in
  valori:
  - Sicilia
  fonte: IRFIS FinSicilia, pagina 5
  citazione: grado universitario che rilascino corrispondenti titoli accademici, con sede nella Regione Sicilia ovvero
- almeno_uno_di:
  - campo: anno_di_corso
    operatore: <=
    valore: 1
  - tutti_di:
    - campo: anno_di_corso
      operatore: '>='
      valore: 2
    - non_modellabile: 'Per gli anni successivi al primo, aver conseguito almeno il 50 per cento dei CFU previsti per ciascun
        anno accademico: il vocabolario ha solo i crediti totali, non quelli di ogni anno.'
  fonte: IRFIS FinSicilia, pagina 5
  citazione: iscrizione agli anni successivi al primo ai suddetti corsi universitari e conseguimento di almeno il 50 per cento
- campo: isee
  operatore: <
  valore: 20000
  fonte: IRFIS FinSicilia, pagina 5
  citazione: b) possesso di un ISEE inferiore ad euro 20.000,00 vigente, alla data di presentazione della domanda.
- non_modellabile: 'Assenza di misure di prevenzione definitive e di condanne definitive per i reati degli articoli 416-bis
    e 640-bis c.p.: non chiediamo dati giudiziari.'
  fonte: IRFIS FinSicilia, pagina 7
  citazione: 4) di non essere sottoposto a provvedimento d efinitivo relativo all’applicazione di una o più misure di
note:
- 'Gli studenti sono ammessi indipendentemente dallo Stato o dalla Regione di provenienza: conta solo la sede dell''ateneo
  in Sicilia.'
- 'Gli istituti superiori di grado universitario che rilasciano titoli accademici potrebbero comprendere istituti diversi
  dalle università: per questo i valori fuori elenco sono incerti.'
- 'Il bando parla di ISEE vigente, senza dire se debba essere quello per le prestazioni universitarie: si è usato l''ISEE
  ordinario.'
- L'elenco dei beneficiari è ordinato per ISEE crescente fino a esaurimento del plafond.
- Le domande si presentano dalle 12:00 del 4 giugno 2026 alle 12:00 dell'8 settembre 2026; IRFIS si riserva di riaprire i
  termini.
