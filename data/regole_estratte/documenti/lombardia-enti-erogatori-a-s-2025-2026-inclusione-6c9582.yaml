id: lombardia-enti-erogatori-a-s-2025-2026-inclusione-6c9582
titolo: Enti Erogatori a.s. 2025 - 2026 Inclusione scolastica per studenti con disabilità sensoriale
ente: Regione Lombardia
link: https://www.bandi.regione.lombardia.it/servizi/servizio/catalogo/dettaglio/politiche-sociali/disabilita/anno-scolastico-2025-2026-inclusione-educativa-scolastica-disabilit-sensoriale-enti-erogatori-RLD12025046323
apertura: '2025-05-27'
chiusura: null
fonte: documento Regione Lombardia, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti:
- almeno_un_componente:
  - campo: disabile
    operatore: vero
  - non_modellabile: 'La disabilità deve essere sensoriale: visiva (cecità assoluta o parziale, ipovisione grave o medio-grave
      ai sensi della L. 138/2001), uditiva (sordità ai sensi della L. 381/1970 o ipoacusia oltre 60 dB da entrambe le orecchie)
      o pluridisabilità sensoriale; per il percorso nidi, deficit sensoriale bilaterale o ipovisione non migliorabile. Manca
      un campo per il tipo di disabilità.'
    citazione: L’accesso al percorso ordinario è garantito ai bambini/alunni/studenti con disabilità sensoriale come
  - non_modellabile: 'Il bambino/alunno/studente deve essere inserito in un percorso educativo, scolastico o formativo dal
      nido/micronido/sezione primavera fino alla secondaria di secondo grado o alla formazione professionale di secondo ciclo:
      il campo attivita non distingue questi percorsi.'
    citazione: inserito in percorsi educativi, scolastici e formativi a partire dai nidi/micronidi/sezioni primavera
  fonte: Regione Lombardia, pagina 5
  citazione: 'La misura è prevista per i bambini che presentino il criterio clinico di seguito specificato:'
- almeno_uno_di:
  - campo: regione
    operatore: in
    valori:
    - Lombardia
  - non_modellabile: 'Residenza fuori regione con specifiche situazioni familiari (affido presso famiglie residenti in Lombardia,
      adozione, collocamento disposto dal Tribunale presso famiglie o comunità lombarde): mancano i campi.'
  fonte: Regione Lombardia, pagina 15
  citazione: residente in Regione Lombardia oppure residente fuori Regione, ma con specifiche situazioni
note:
- 'Il titolo parla di ''Enti Erogatori'', ma le sezioni ricevute descrivono i destinatari (bambini e studenti con disabilità
  sensoriale) e la domanda presentata dalla famiglia, dallo studente maggiorenne o dal tutore: i requisiti sono estratti per
  le persone. Se il bando fosse rivolto solo agli enti erogatori, la lista andrebbe svuotata.'
- La residenza in Lombardia è riferita al bambino/studente; qui è espressa con il campo regione del richiedente.
- Certificazione clinica, VAIS o EVIS con Verbale Handicap, Diagnosi funzionale o Profilo di funzionamento sono documenti
  da allegare, non requisiti espressi qui.
- Per i casi non rientranti nei criteri clinici le famiglie possono chiedere una deroga all'ATS.
- Domande dal 27 maggio 2025 ore 12.00 sulla piattaforma Bandi e Servizi; la data di chiusura non è indicata nelle sezioni
  ricevute. Procedura valutativa a sportello.
