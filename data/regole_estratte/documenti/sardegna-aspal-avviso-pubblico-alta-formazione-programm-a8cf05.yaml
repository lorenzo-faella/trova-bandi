  fonte: ASPAL - Agenzia sarda per le politiche attive del lavoro, pagina 7
  citazione: residenza in Sardegna;
- non_modellabile: 'Età inferiore a 35 anni, oppure 35 anni o più e privi di impiego o con reddito da lavoro sotto soglia
