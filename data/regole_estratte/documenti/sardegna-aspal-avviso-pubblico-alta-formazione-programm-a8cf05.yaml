note:
- 'Domande dal 17/02/2025 fino a esaurimento risorse e comunque entro il 30/04/2025: l''avviso è scaduto.'
- 'La residenza in Sardegna è richiesta a una data passata: la residenza attuale in Sardegna è usata come indizio, chi oggi
  risiede altrove resta da verificare. Chi si è trasferito in Sardegna dopo quella data risulterebbe erroneamente idoneo.'
- L'età attuale inferiore a 35 anni garantisce che fosse inferiore a 35 anche alla data di riferimento; il caso contrario
  resta da verificare.
- 'L''ISEE per il diritto allo studio universitario serve solo a parametrare l''importo della borsa (dal 100% al 20%): non
  è un requisito di accesso.'
- 'La frequenza interamente online è consentita solo alle persone con disabilità certificata ai sensi dell''art. 3 della L.
  104/92: è una modalità di frequenza, non un requisito generale.'
- Per i titoli esteri l'ammissione è subordinata al riconoscimento del titolo; la borsa è riconosciuta solo al conseguimento
  del titolo finale di master.
