note:
- L'ISEE per il diritto allo studio universitario serve solo a parametrare l'importo della borsa (Tabella 2), non all'idoneità.
- Il divieto di aver fruito di altri contributi per lo stesso percorso è una regola di cumulo, non riportata come requisito.
- 'I titoli esteri richiedono il giudizio di equivalenza (par. 7): aspetto procedurale non modellato.'
- Procedura a sportello fino a esaurimento risorse; il termine del 30/04/2025 è già scaduto.
