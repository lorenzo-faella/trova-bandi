    per persone con disabilità L. 104/92 certificata). Mancano i campi sul corso.'
  fonte: ASPAL - Agenzia sarda per le politiche attive del lavoro, pagina 11
  citazione: 'Il master deve obbligatoriamente prevedere:'
- non_modellabile: 'Non aver beneficiato dei programmi Master and Back o Talent Up: manca il campo.'
