id: erdis-marche-alloggi-erdis-assegna-per-concorso-posti-374401
titolo: Alloggi ERDIS assegna per concorso posti alloggio nelle proprie strutture abitative agli studenti “fuori sede” in
  possesso di determinati requisiti che sono descritti nel relativo Bando di concorso.
ente: ERDIS Marche - Ente regionale per il diritto allo studio
link: https://www.erdis.it/servizi/servizio-dettaglio/3161511
apertura: null
chiusura: null
fonte: documento ERDIS Marche - Ente regionale per il diritto allo studio, estratto con LLM (Claude Code, claude-opus-5-5),
  non rivisto
pubblico: persone
ultimo_controllo: '2026-11-19'
requisiti:
- almeno_uno_di:
  - campo: iscrizione
    operatore: in
    valori:
    - universita
    - afam
  - non_modellabile: 'Iscrizione ai corsi Poliarte - Politecnico delle arti applicate all''impresa o alla Scuola Superiore
      per Mediatori Linguistici di Ancona o Fermo: il vocabolario non ha un valore di iscrizione per questi istituti.'
  fonte: ERDIS Marche - Ente regionale per il diritto allo studio, pagina web
  citazione: 'A studenti che si iscrivono:'
- non_modellabile: 'Verificare iscrizione a uno degli atenei/istituti espressamente ammessi (Camerino, Macerata, Urbino, Politecnica
    delle Marche e altri istituti elencati) e allo specifico corso nel bando completo. Il comune della sede didattica non
    identifica l’istituzione: non esclude da solo sedi distaccate.'
  fonte: ERDIS Marche - Ente regionale per il diritto allo studio, pagina web
  citazione: Università degli Studi di Camerino, Macerata, Urbino e Politecnica delle Marche di Ancona
- almeno_uno_di:
  - campo: livello_corso
    operatore: in
    valori:
    - laurea_triennale
    - laurea_magistrale
    - ciclo_unico
    - afam_primo_livello
    - afam_secondo_livello
    - specializzazione
    - dottorato
  - non_modellabile: 'Corsi Poliarte o della Scuola Superiore per Mediatori Linguistici: il vocabolario non ha un livello
      di corso per questi istituti.'
  fonte: ERDIS Marche - Ente regionale per il diritto allo studio, pagina web
  citazione: ai corsi di laurea di primo e secondo livello e di laurea magistrale a ciclo unico
- non_modellabile: 'Per i corsi di specializzazione: durata almeno biennale ed esclusi quelli dell''area medica (D.Lgs. 368/1999);
    il vocabolario non distingue durata e area della specializzazione.'
  portata: rara
  fonte: ERDIS Marche - Ente regionale per il diritto allo studio, pagina web
  citazione: ad eccezione di quelli dell’area medica di cui al Dlgs 4 agosto 1999, n. 368
- non_modellabile: 'Per i dottorandi: non beneficiare della borsa di dottorato (D.M. 224/99) o di altra analoga provvidenza.'
  portata: rara
  fonte: ERDIS Marche - Ente regionale per il diritto allo studio, pagina web
  citazione: a condizione che l’iscritto non benefici della borsa di studio di cui al Decreto Ministeriale n. 224/99 o di
    altra analoga provvidenza
- non_modellabile: Status di studente fuori sede e altri requisiti descritti nel bando di concorso e nei termini e condizioni
    di servizio, che la pagina non riporta.
  fonte: ERDIS Marche - Ente regionale per il diritto allo studio, pagina web
  citazione: Per conoscere i dettagli di scadenze, requisiti e altre
note:
- I posti alloggio sono assegnati agli studenti fuori sede con i requisiti del bando di concorso, che non è nel testo ricevuto
  insieme al PDF dei termini e condizioni.
- Gli studenti devono essere iscritti entro le date dei bandi delle singole istituzioni; per chi concorre per l'ultimo semestre
  utile della borsa basta l'iscrizione all'anno accademico in corso.
- La pagina non indica il periodo per presentare la domanda.
provenienza:
  rettifica_successiva:
