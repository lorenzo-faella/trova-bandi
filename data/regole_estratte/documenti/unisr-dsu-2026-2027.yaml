note:
- La domanda di borsa va presentata online entro le 12:00 del 30 settembre 2026; chi chiede anche il posto alloggio deve rispettare
  le scadenze dell'art. 15 (18 agosto 2026 per chi era già assegnatario, 8 settembre 2026 per i nuovi).
- Il bando non indica una data di apertura delle domande.
- Lo studente indipendente deve avere residenza fuori dalla famiglia da almeno due anni e redditi da lavoro di almeno 9.000
  euro; altrimenti conta l'ISEE della famiglia di origine.
- Per gli studenti stranieri vale l'ISEEU parificato; il reddito estero dichiarato non può essere inferiore a 6.947,33 euro.
- 'L''art. 13 (condizioni di partecipazione al concorso per il posto alloggio) è troncato nel testo ricevuto: eventuali requisiti
  specifici per l''alloggio non sono modellati.'
- 'Il merito dei primi anni è valutato anche ex post (49 o 45 crediti entro il 10 agosto 2027 per il saldo, 35 entro il 30
  novembre 2027 per non perdere la borsa): sono condizioni di mantenimento.'
