note:
- La domanda di borsa va presentata online entro le ore 12:00 del 30 settembre 2026; chi chiede anche il posto alloggio deve
  presentarla entro il 18 agosto 2026 (già assegnatari) o l'8 settembre 2026 (nuovi), termini dell'articolo 15.
- Per gli studenti con disabilità i requisiti di merito possono scostarsi fino al 40%, stabiliti da una commissione.
- Gli studenti stranieri presentano l'ISEEU parificato; il reddito estero dichiarato non può essere inferiore a 6.947,33 euro,
  regola di calcolo e non soglia di accesso.
- 'Il merito del primo anno è verificato anche dopo l''assegnazione (49 o 45 crediti entro il 10 agosto 2027 per il saldo,
  35 entro il 30 novembre 2027 per non perdere la borsa): sono condizioni di mantenimento, non di accesso.'
- 'Il posto alloggio richiede in più la condizione di fuori sede e l''assenza di provvedimenti disciplinari o debiti verso
  l''Ateneo: non scritti come requisiti della borsa.'
