note:
- 'Scadenza della domanda di borsa: ore 12:00 del 30 settembre 2026. Chi chiede anche il posto alloggio deve presentare domanda
  entro il 18 agosto 2026 (già assegnatari nel 2025/2026) o l''8 settembre 2026 (nuovi assegnatari). La data di apertura non
  è indicata.'
- 'Il posto alloggio a tariffa agevolata è un beneficio a parte: richiede in più la condizione di studente fuori sede e l''assenza
  di provvedimenti disciplinari superiori all''ammonizione, di debiti verso l''Ateneo e di decadenze precedenti dall''alloggio.
  Non è nei requisiti perché vale solo per quel beneficio.'
- Il "1° anno fuori corso" (ultimo semestre) è reso come anno_di_corso 4 per la laurea, 7 per il ciclo unico e 3 per la magistrale;
  gli anni oltre non hanno soglia e non soddisfano il requisito di merito.
- 'I crediti richiesti per la magistrale aumentano dei crediti oltre i 180 riconosciuti all''iscrizione: non modellato. Il
  conteggio dei crediti parte dall''anno di prima immatricolazione assoluta, quindi chi ha cambiato corso può avere soglie
  più alte.'
- Le soglie ridotte per il bonus sono calcolate con il bonus massimo disponibile in quell'anno (5 al 2° anno, 12 al 3°, 15
  dal 4°; 15 come tetto per la magistrale).
- 'Studenti stranieri e italiani residenti all''estero: ISEEU parificato e reddito minimo convenzionale di 6.947,33 euro,
  che sono regole di calcolo e non sono state modellate.'
