id: lombardia-anno-scolastico-2026-2027-inclusione-edu-1ae1f4
titolo: Anno scolastico 2026/2027 - Inclusione educativa/scolastica disabilità sensoriale – ENTI EROGATORI
ente: Regione Lombardia
link: https://www.bandi.regione.lombardia.it/servizi/servizio/catalogo/dettaglio/politiche-sociali/disabilita/anno-scolastico-2026-2027-inclusione-educativa-scolastica-disabilit-sensoriale-enti-erogatori-RLD12026053844
apertura: '2026-05-28'
chiusura: null
fonte: documento Regione Lombardia, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti:
- almeno_un_componente:
  - campo: disabile
    operatore: vero
  - non_modellabile: 'La disabilità deve essere sensoriale (visiva ai sensi della legge 138/2001, uditiva con sordità o ipoacusia
      oltre 60 dB da entrambe le orecchie, o pluridisabilità sensoriale; per i nidi deficit bilaterale o ipovisione non migliorabile):
      il vocabolario non distingue il tipo di disabilità.'
  fonte: Regione Lombardia, pagina 6
  citazione: L’accesso al percorso ordinario è garantito ai bambini/alunni/studenti con disabilità sensoriale come
- non_modellabile: 'Il bambino/alunno/studente deve frequentare un percorso educativo, scolastico o formativo dal nido (anche
    micronido e sezione primavera) alla secondaria di secondo grado o alla formazione professionale di secondo ciclo: il vocabolario
    ha solo ''scuola_superiore'' e non copre nido, infanzia, primaria e secondaria di primo grado, né l''iscrizione di un
    componente diverso dal richiedente.'
  fonte: Regione Lombardia, pagina 16
  citazione: inserito in percorsi educativi, scolastici e formativi a partire dai nidi/micronidi/sezioni primavera
- almeno_uno_di:
  - campo: regione
    operatore: in
    valori:
    - Lombardia
  - non_modellabile: 'Residenti fuori regione con specifiche situazioni familiari (affido presso famiglie lombarde, adozione,
      collocamento disposto dal Tribunale presso famiglie o comunità lombarde): mancano i campi.'
  fonte: Regione Lombardia, pagina 16
  citazione: residente in Regione Lombardia oppure residente fuori Regione, ma con specifiche situazioni
note:
- 'Il titolo indica ''ENTI EROGATORI'': la pagina potrebbe essere lo strumento per gli enti erogatori, mentre le famiglie
  presentano la domanda con lo strumento ''Domanda famiglia – a.s. 2026-2027 inclusione scolastica disabilità sensoriale''.
  I requisiti estratti riguardano i bambini/alunni/studenti destinatari della misura descritti nel documento.'
- La domanda può essere presentata dallo studente maggiorenne, dalla famiglia o dal tutore/amministratore di sostegno; la
  disabilità riguarda il bambino/alunno/studente, per questo è scritta su un componente del nucleo.
- 'Servono la certificazione clinica rilasciata da centri specializzati e, per il percorso ordinario, VAIS oppure EVIS con
  Verbale Handicap INPS, più Diagnosi funzionale o Profilo di funzionamento: sono documenti, non li ho trattati come requisiti
  separati.'
- Per i nidi sono possibili deroghe per casi particolari su valutazione ATS.
- 'L''attivazione richiede la presa in carico da un Ente erogatore iscritto nell''elenco ATS e la predisposizione del Piano
  Individuale: aspetto procedurale.'
- Procedura valutativa a sportello dal 28 maggio 2026 ore 12.00; il documento non indica una data di chiusura.
