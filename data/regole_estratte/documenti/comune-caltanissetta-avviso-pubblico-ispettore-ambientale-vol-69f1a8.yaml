requisiti:
- campo: cittadinanza
  operatore: in
  valori:
  - italiana
  - ue
  fonte: Comune di Caltanissetta, pagina web
  citazione: 'Cittadinanza: italiana o di uno Stato membro dell''Unione Europea.'
- campo: eta
  operatore: tra
  valore:
  - 18
  - 70
  fonte: Comune di Caltanissetta, pagina web
  citazione: 'Età: compresa tra i 18 e i 70 anni.'
- campo: titolo_di_studio
  operatore: in
  valori:
  - licenza_media
  - diploma
  - laurea_triennale
  - laurea_magistrale
  - master
  - dottorato
  fonte: Comune di Caltanissetta, pagina web
  citazione: 'Titolo di studio: licenza media inferiore (diploma di scuola secondaria di primo grado) o titolo equivalente.'
- non_modellabile: 'Godimento dei diritti civili e politici, assenza di condanne penali, procedimenti penali in corso, sanzioni
    per violazioni ambientali e interdizione dai pubblici uffici. Scelta: non chiediamo dati giudiziari.'
  fonte: Comune di Caltanissetta, pagina web
  citazione: 'Idoneità ed onorabilità: godimento dei diritti civili e politici; assenza di condanne penali o procedimenti
    penali in corso; assenza di sanzioni per violazioni ambientali o di interdizioni dai pubblici uffici.'
- non_modellabile: Nessun rapporto lavorativo o professionale con l'azienda che gestisce l'igiene urbana nel comune, né altre
    situazioni di incompatibilità.
  fonte: Comune di Caltanissetta, pagina web
  citazione: 'Incompatibilità: assenza di rapporti lavorativi o professionali con l''azienda che gestisce il servizio di igiene
    urbana sul territorio comunale.'
- non_modellabile: Buona conoscenza del territorio comunale e idoneità psico-fisica alle attività (certificazione medica prima
    della nomina).
  fonte: Comune di Caltanissetta, pagina web
  citazione: 'Conoscenza del territorio e idoneità fisica: buona conoscenza del territorio comunale e idoneità psico-fisica
    allo svolgimento delle attività (da documentare mediante certificazione medica prima della nomina definitiva).'
note:
- Non è un beneficio economico ma una candidatura a ispettore ambientale volontario.
- Per la nomina servono anche il corso gratuito di almeno 20 ore (o titoli alternativi), il colloquio e l'idoneità medica,
  ottenibili dopo la domanda.
- 'Scadenza: ore 12:00 del 30 novembre 2026; la data di apertura non è indicata.'
