id: fvg-sostegno-alla-maternita-neomamme-carta-f-eb65c4
titolo: Sostegno alla maternità - Neomamme Carta famiglia - Il sostegno alla maternità è un sussidio economico, a titolo assistenziale,
  erogato per accompagnare le madri nei primi 12 mesi di vita di ogni figlio o figlia, nati dal 1° gennaio 2026 o in caso
  di adozione dal 1° gennaio 2026, di uno o più minori per i primi 12 mesi dalla sentenza di adozione di ciascuno di essi.
ente: Regione Autonoma Friuli Venezia Giulia
link: https://www.regione.fvg.it/rafvg/cms/RAFVG/famiglia-casa/politiche-famiglia/FOGLIA69/
apertura: null
chiusura: null
fonte: documento Regione Autonoma Friuli Venezia Giulia, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti:
- non_modellabile: La richiedente deve essere la madre (il genere non è nel vocabolario) di un figlio nato o adottato dal
    1° gennaio 2026 (la data esatta di nascita non si verifica).
  fonte: Regione Autonoma Friuli Venezia Giulia, pagina 1
  citazione: 'Per accedere al sussidio la madre deve possedere i seguenti requisiti:'
- almeno_un_componente:
  - campo: figlio
    operatore: vero
  - campo: eta
    operatore: <
    valore: 18
  fonte: Regione Autonoma Friuli Venezia Giulia, pagina 1
  citazione: a) essere madre di uno o più figli, nati dal 1° gennaio 2026 o adottati dal 1° gennaio 2026
- almeno_uno_di:
  - campo: mesi_da_evento_figlio
    operatore: <
    valore: 12
  - non_modellabile: In prima applicazione, per i nati o adottati nel 2026 prima dell'entrata in vigore del Regolamento, i
      dodici mesi decorrono dalla pubblicazione sul BUR, data che il testo non riporta.
  fonte: Regione Autonoma Friuli Venezia Giulia, pagina 1
  citazione: La domanda è presentata entro il termine perentorio di dodici mesi dalla nascita o dalla data
- campo: regione
  operatore: in
  valori:
  - Friuli-Venezia Giulia
  fonte: Regione Autonoma Friuli Venezia Giulia, pagina 1
  citazione: b) essere residente in Friuli Venezia Giulia per un periodo di almeno dodici mesi continuativi
- campo: anni_residenza_regione
  operatore: '>='
  valore: 1
  fonte: Regione Autonoma Friuli Venezia Giulia, pagina 1
  citazione: precedenti la data della nascita o dell'adozione;
- non_modellabile: 'Titolarità di Carta famiglia in corso di validità, con il figlio inserito nel nucleo ai fini di ISEE e
    Carta famiglia: manca un campo.'
  fonte: Regione Autonoma Friuli Venezia Giulia, pagina 1
  citazione: c) essere titolare di Carta famiglia di cui all’articolo 6 della legge regionale 22/2021, in
- almeno_uno_di:
  - campo: isee
    operatore: <=
    valore: 35000
  - non_modellabile: 'Esenti dall''ISEE le madri in un percorso di protezione e uscita da situazioni di violenza e i genitori
      vedovi entro tre anni dalla vedovanza: mancano i campi.'
  fonte: Regione Autonoma Friuli Venezia Giulia, pagina 1
  citazione: e) essere in possesso di un ISEE in corso di validità di valore pari o inferiore a 35.000
- almeno_uno_di:
  - campo: condizione_lavorativa
    operatore: in
    valori:
    - occupato
    - studente
  - tutti_di:
    - campo: condizione_lavorativa
      operatore: in
      valori:
      - disoccupato
    - non_modellabile: 'Dichiarazione di immediata disponibilità al lavoro e azioni di politica attiva previste nel patto
        di servizio: manca un campo.'
  fonte: Regione Autonoma Friuli Venezia Giulia, pagina 1
  citazione: f) essere, alla data della presentazione della domanda, occupata, ovvero, essere impegnata in
note:
- Per la madre minorenne la domanda è presentata da chi esercita la responsabilità genitoriale, che deve avere Carta famiglia
  e l'ISEE; la madre deve comunque avere i requisiti a), b) e f).
- La condizione di studio vale solo per i percorsi riconosciuti elencati (dalla scuola secondaria di primo grado al dottorato,
  compresi IEFP, IFTS, ITS e la formazione professionale regionale).
- 'La residenza in regione deve durare almeno dodici mesi continuativi prima della nascita o dell''adozione: gli anni di residenza
  in regione sono una verifica approssimata.'
- 'La domanda si presenta per ogni figlio entro dodici mesi dalla nascita o dall''adozione: non c''è una finestra fissa. L''eccezione
  dell''articolo 13, comma 1, non è nel testo ricevuto.'
