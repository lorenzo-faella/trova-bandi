note:
- La domanda va presentata entro martedì 29 aprile 2026, ore 16:00.
- 'Le soglie ISEE/ISPE stanno nell''articolo sui requisiti economici (''In tutti i casi''): sono state applicate a tutti,
  ma il testo potrebbe riferirle solo alle richieste per motivi economico-patrimoniali. ''ISPE tra € 57.187,53'' è stato letto
  come limite massimo.'
- Il divieto di seconda laurea dello stesso livello è stato espresso con titolo_di_studio. Non si possono distinguere i titoli
  pre-riforma (diploma universitario, laurea vecchio ordinamento), e chi ha un master dopo la sola triennale risulta escluso
  dalla magistrale.
- I requisiti di merito della categoria 2 (crediti delle Tabelle A2/B del bando borse 2025/26, bonus, regole per disabili)
  rimandano a un altro bando che qui non c'è.
- Gli studenti internazionali con redditi all'estero devono presentare un nuovo ISEE parificato al posto dell'ISEE corrente.
