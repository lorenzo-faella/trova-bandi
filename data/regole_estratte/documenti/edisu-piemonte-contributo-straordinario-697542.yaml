note:
- Le due categorie di destinatari sono in ordine di priorità, non sono requisiti cumulativi.
- 'Le soglie ISEE/ISPE sono scritte nell''articolo sui requisiti economici con ''In tutti i casi'': sono state applicate a
  tutti i richiedenti, ma potrebbero riguardare solo chi chiede il contributo per motivi economici. L''ISEE può essere quello
  per il diritto allo studio universitario o l''ISEE corrente.'
- I requisiti di merito per la categoria 2 rimandano a tabelle del bando borse 2025/26 non presenti; il primo anno richiede
  la sola iscrizione.
- La variazione della situazione lavorativa deve essere successiva al 30 settembre 2025; gli studenti internazionali presentano
  un nuovo ISEE parificato.
- 'Scadenza: martedì 29 aprile 2026 ore 16:00; la data di apertura non è indicata.'
