note:
- L'istanza di borsa è aperta dalle ore 12.00 del 15 luglio 2026 alle ore 12.00 del 2 settembre 2026; entro la stessa data
  va trasmesso il protocollo INPS-ISEE-2026 valido per il diritto allo studio universitario (l'ISEE ordinario o con omissioni/difformità
  non vale).
- Le soglie più alte (ISEE 28.750 euro, ISPE 62.500 euro) valgono per gli studenti con handicap art. 3 comma 1 L. 104/1992
  o invalidità pari o superiore al 66%.
- 'Per le matricole il merito è richiesto solo per mantenere i benefici e ricevere il saldo: non è un requisito di accesso.
  Per le matricole con disabilità non si applica la decadenza per merito.'
- Le tabelle dei crediti per gli anni successivi sono riportate solo in minima parte; gli artt. 28, 29 e 32 (periodi di fruizione)
  non sono nel testo ricevuto.
- Possono partecipare anche gli studenti iscritti all'ultimo semestre in corso del 2025/2026 che non rinnovano l'iscrizione
  (borsa semestrale).
- Il limite di 28 anni riguarda solo il posto letto gratuito o a pagamento, non la borsa.
