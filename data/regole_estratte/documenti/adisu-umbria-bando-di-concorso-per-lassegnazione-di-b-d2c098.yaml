note:
- Domanda di borsa dalle ore 12.00 del 15 luglio 2026 alle ore 12.00 del 2 settembre 2026; entro lo stesso termine va trasmesso
  il protocollo dell'attestazione INPS-ISEE-2026 per il diritto allo studio universitario (quella ordinaria non vale). La
  tabella completa delle scadenze dell'art. 13 non è nel testo.
- L'iscrizione va perfezionata entro le scadenze dei manifesti degli studi o dei bandi di dottorato e specializzazione; l'iscrizione
  tardiva con mora comporta l'esclusione. È un adempimento, lasciato nelle note.
- Il merito delle matricole (art. 21) si verifica dopo, per mantenere la borsa; per le matricole con disabilità (Titolo IV)
  non si applica la decadenza per merito.
- Possono partecipare anche gli iscritti all'ultimo semestre in corso dell'a.a. 2025/2026 che non rinnovano l'iscrizione (borsa
  semestrale), regola particolare non modellata.
- 'Il posto letto gratuito per i fuori sede vale solo sotto i 28 anni alla scadenza della domanda: riguarda un servizio collegato,
  non l''idoneità alla borsa.'
