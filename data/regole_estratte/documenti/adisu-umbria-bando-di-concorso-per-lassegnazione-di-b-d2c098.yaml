note:
- Domanda di borsa dalle ore 12.00 del 15 luglio 2026 alle ore 12.00 del 2 settembre 2026; entro la stessa data va trasmesso
  il protocollo INPS-ISEE-2026 per il diritto allo studio universitario (l'ISEE ordinario non vale). Gli studenti stranieri
  possono integrare la documentazione dei redditi esteri fino al 30 ottobre 2026.
- 'Le tabelle dei crediti per gli anni successivi (artt. 21, 22, 45) e le sezioni su durata dei benefici (artt. 32 e 47) e
  sul Titolo IV (studenti con disabilità) non sono nel testo ricevuto: il merito degli anni successivi resta da verificare.'
- Le matricole ottengono l'idoneità solo con reddito e iscrizione; i crediti minimi servono dopo per mantenere la borsa, quindi
  non sono requisiti di accesso.
- Possono partecipare anche gli iscritti all'ultimo semestre del 2025/2026 che non rinnovano l'iscrizione e le matricole 2025/2026
  della Scuola di Specializzazione in Beni Storico-Artistici; per l'Istituto Italiano Design di Perugia solo i corsi di laurea
  in Design accreditati MUR. Le matricole di Medicina, Odontoiatria e Veterinaria possono fare domanda durante il semestre
  filtro (art. 20).
- 'Il tempo parziale è ammesso solo come studente lavoratore, con contratto di lavoro o partita IVA già in essere alla scadenza
  della domanda: reso come condizione_lavorativa occupato.'
- 'Il posto letto gratuito per i fuori sede richiede di non aver compiuto 28 anni alla scadenza della domanda: vale solo per
  quel servizio e non è tra i requisiti.'
- 'Iscrizione da perfezionare entro le scadenze dei manifesti degli studi o dei bandi di specializzazione e dottorato, senza
  mora: condizione procedurale, non modellata.'
