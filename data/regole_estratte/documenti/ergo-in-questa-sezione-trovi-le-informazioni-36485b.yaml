note:
- 'Il documento è l''intero bando DSU di ER.GO, con più benefici. La regola riguarda la borsa di studio, il beneficio principale.
  Gli altri benefici hanno requisiti propri che qui non sono modellati: alloggio da graduatoria (solo fuori sede, stesse soglie
  ISEE/ISPE, domande fino al 6 o al 24 agosto 2026); contributo di mobilità internazionale (idonei alla borsa vincitori di
  mobilità); interventi straordinari (assegnatari 2025/2026, ISEE fino a 25.000 e ISPE fino a 50.000); interventi per studenti
  con disabilità; collaborazioni per i corsi interateneo (ISEE fino a 28.000, ISPE fino a 62.000); voucher per master all''estero
  (ISEE fino a 40.000, ISPE fino a 62.000, residenza in Italia, domande dal 15/09 al 10/12/2026); contributi per tirocinio
  post lauream.'
- L'art. 7 (Requisiti economici) è arrivato solo con la tabella delle soglie. Mancano le regole sul calcolo dell'ISEE per
  studenti internazionali, con redditi all'estero o indipendenti. Le soglie sono state lette come «non superiore a».
- 'Il merito si valuta sull''anno di prima iscrizione e non sull''anno di corso: chi si trasferisce o cambia corso può risultare
  al primo anno pur avendo un''anzianità maggiore. In quel caso il ramo «anno_di_corso <= 1» va verificato.'
- I CFU richiesti dopo l'accesso (seconda e terza rata, conferma al 30/11/2027 per le matricole) e le cause di decadenza (trasferimento
  fuori regione o rinuncia entro il 31/07/2027, laurea entro la sessione straordinaria 2025/2026) riguardano il mantenimento
  del beneficio. Per questo non sono tra i requisiti.
- Gli studenti internazionali devono presentare entro le scadenze la documentazione tradotta e legalizzata dei redditi e dei
  patrimoni all'estero, pena la non idoneità. È un adempimento documentale, quindi non è modellato. Per apolidi e titolari
  di protezione, l'assegnazione dipende dal riconoscimento dello status.
- 'Le date di apertura e chiusura sono quelle della domanda di borsa di studio: dal 23 giugno al 24 agosto 2026, ore 16.00.'
