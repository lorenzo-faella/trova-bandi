note:
- 'Il bando ER.GO a.a. 2026/2027 copre molti benefici (borsa di studio, alloggio, ristorazione, mobilità internazionale, contributi
  straordinari, servizi per studenti con disabilità, collaborazioni part-time, assegni formativi, tirocini): i requisiti estratti
  riguardano la borsa di studio, il beneficio principale. Le date di apertura e chiusura sono quelle della domanda di borsa
  di studio (23 giugno - 24 agosto 2026, ore 16.00); l''alloggio per i nuovi richiedenti di anni successivi scade il 6 agosto
  2026.'
- Le soglie ISEE (25.000 euro) e ISPE (50.000 euro) valgono anche per i servizi residenziali da graduatoria; l'ISEE è quello
  per le prestazioni per il diritto allo studio universitario.
- 'L''iscrizione va perfezionata entro i termini delle rispettive istituzioni e comunque entro i termini ultimi dell''art.
  13 (tabelle per sede): è una scadenza procedurale non modellata.'
- 'Il requisito di merito per i primi anni usa anno_di_corso <= 1: per le matricole di ogni ciclo l''accesso è sulla sola
  condizione economica; i CFU richiesti dopo l''assegnazione (Tabelle 1-3, 5-6) servono per le rate successive e la conferma,
  non per l''accesso.'
- La durata massima di assegnazione dei benefici (art. 1) e la definizione di studente indipendente (art. 7 comma 2) non sono
  nelle sezioni ricevute.
- In caso di contemporanea iscrizione a due corsi, i benefici si chiedono per il secondo corso solo se non se ne è mai usufruito
  per il primo.
