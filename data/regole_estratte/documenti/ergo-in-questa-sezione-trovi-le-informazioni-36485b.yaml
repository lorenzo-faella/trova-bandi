note:
- 'Il documento è il bando unico ER.GO 2026/2027 e contiene molti benefici: borsa di studio, alloggio, ristorazione, mobilità
  internazionale, interventi straordinari, interventi per studenti con disabilità, collaborazioni, volontariato, voucher per
  master all''estero e contributi per tirocini. I requisiti sopra riguardano la borsa di studio, il beneficio principale.
  Le date sono quelle della domanda di borsa (dal 23 giugno al 24 agosto 2026, ore 16.00).'
- 'Altri benefici, non scritti come requisiti: l''alloggio da graduatoria è solo per i fuori sede, cioè chi non risiede nei
  comuni delle Tabelle 1 e 2 della sede (domanda entro il 6 agosto 2026 per anni successivi e conferme). Il voucher richiede
  residenza in Italia, ISEE fino a 40.000 € e ISPE fino a 62.000 €. Le collaborazioni interateneo richiedono ISEE fino a 28.000
  € e ISPE fino a 62.000 €. Gli interventi straordinari richiedono di aver avuto la borsa nel 2025/2026.'
- 'Non ci sono vincoli di cittadinanza né di residenza: il bando dipende dalla sede del corso. Alcune sedi degli atenei sono
  fuori regione (Mantova per UNIMORE, Ceglie Messapica per UNIBO, Rovigo e Adria per UNIFE), per questo c''è comune_ateneo
  accanto a regione_ateneo. Non tutti gli istituti con sede in Emilia-Romagna sono compresi.'
- Il merito si valuta sull'anno di prima immatricolazione, non sull'anno di corso. Per chi si è trasferito o ha cambiato corso,
  anno_di_corso <= 1 può quindi non bastare. Le matricole (primo anno di tutti i cicli) e gli iscritti a specializzazione
  o dottorato accedono con la sola condizione economica; i CFU successivi servono solo per le rate e per confermare la borsa.
- 'Il titolo di studio non distingue il diploma di specializzazione: chi ne ha già uno ed è iscritto a un''altra specializzazione
  o a un dottorato è escluso, ma la regola non lo rileva. I diplomi AFAM e i titoli del vecchio ordinamento vanno ricondotti
  al livello di laurea equivalente.'
- Per gli studenti internazionali con redditi o patrimoni all'estero la condizione economica si calcola con documentazione
  consolare da presentare entro le scadenze del perfezionamento, pena la non idoneità. Per i membri permanenti di ordini religiosi
  l'importo della borsa non dipende dalla condizione economica; non è chiaro se le soglie ISEE/ISPE valgano anche per loro.
- Il divieto di cumulo con altre borse con la stessa finalità e le cause di decadenza successive (trasferimento, rinuncia
  agli studi entro il 31/07/2027, mancata regolarizzazione dell'iscrizione) non sono scritti come requisiti di accesso.
