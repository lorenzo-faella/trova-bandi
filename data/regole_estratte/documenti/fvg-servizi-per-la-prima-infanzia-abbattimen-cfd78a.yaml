id: fvg-servizi-per-la-prima-infanzia-abbattimen-cfd78a
titolo: 'Servizi per la prima infanzia: abbattimento rette anno educativo 2026/2027 - Famiglia e Infanzia Benefici per la
  frequenza di nidi, servizi educativi domiciliari, spazi gioco e centri per bambini e genitori, accreditati o “in fase di
  accreditamento".'
ente: Regione Autonoma Friuli Venezia Giulia
link: https://www.regione.fvg.it/rafvg/cms/RAFVG/famiglia-casa/politiche-famiglia/FOGLIA68/
apertura: '2026-03-31'
chiusura: '2027-07-23'
fonte: documento Regione Autonoma Friuli Venezia Giulia, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti:
- almeno_uno_di:
  - tutti_di:
    - campo: regione
      operatore: in
      valori:
      - Friuli-Venezia Giulia
    - campo: anni_residenza_regione
      operatore: '>='
      valore: 1
  - non_modellabile: 'Residenza da almeno 12 mesi continuativi dell''altro genitore, oppure attività lavorativa in regione
      da almeno 12 mesi continuativi di uno dei genitori: mancano i campi.'
  fonte: Regione Autonoma Friuli Venezia Giulia, pagina 1
  citazione: residenza o attività lavorativa in regione da almeno 12 mesi continuativi di almeno uno dei
- almeno_uno_di:
  - campo: isee
    operatore: <=
    valore: 50000
    citazione: valore dell’ISEE pari o inferiore a euro 50.000,00
  - non_modellabile: 'Madre di figli minori inserita in un percorso personalizzato di protezione e sostegno all''uscita da
      situazioni di violenza, debitamente attestato: ammessa anche senza ISEE.'
    citazione: protezione e sostegno all’uscita da situazioni di violenza debitamente attestato, anche in assenza
  - non_modellabile: 'Genitore vedovo, entro tre anni dal verificarsi della vedovanza: può fare domanda senza ISEE.'
    citazione: in assenza di attestazione ISEE i genitori in possesso di certificato di stato vedovile o di
  fonte: Regione Autonoma Friuli Venezia Giulia, pagina 1
  citazione: valore dell’ISEE pari o inferiore a euro 50.000,00
- almeno_un_componente:
  - campo: figlio
    operatore: vero
  - campo: eta
    operatore: <
    valore: 3
    citazione: dedicati ai bambini da 3 mesi a 36 mesi.
  fonte: Regione Autonoma Friuli Venezia Giulia, pagina 1
  citazione: presenza del minore per il quale si presenta domanda nel nucleo familiare.
- non_modellabile: Il minore deve essere già iscritto a un nido, servizio educativo domiciliare, spazio gioco o centro per
    bambini e genitori accreditato o in fase di accreditamento (o, per i servizi comunali, deve esserne stata chiesta l'iscrizione);
    sono esclusi i minori iscritti alle sezioni primavera.
  fonte: Regione Autonoma Friuli Venezia Giulia, pagina 1
  citazione: il minore deve essere già iscritto a un servizio educativo per la prima infanzia accreditato
note:
- 'L''età minima di 3 mesi del bambino non si può esprimere con l''età in anni: si controlla solo che abbia meno di 3 anni
  (36 mesi).'
- Per le madri in percorso di uscita dalla violenza vale comunque il requisito di residenza o lavoro in regione da almeno
  un anno continuativo.
- 'Il nome della regione è scritto come ''Friuli-Venezia Giulia'': verificare che coincida con quello usato dal motore.'
- Per presentare domanda serve già un'attestazione ISEE o la DSU sottoscritta (adempimento della domanda).
- Le domande dal 31 marzo al 31 maggio 2026 sono accolte automaticamente; quelle successive vanno in lista d'attesa secondo
  le risorse; il sistema resta aperto fino alle 12 del 23 luglio 2027, data usata come chiusura.
