id: fvg-servizi-per-la-prima-infanzia-abbattimen-cfd78a
titolo: 'Servizi per la prima infanzia: abbattimento rette anno educativo 2026/2027 - Famiglia e Infanzia Benefici
  per la frequenza di nidi, servizi educativi domiciliari, spazi gioco e centri per bambini e genitori, accreditati
  o “in fase di accreditamento".'
ente: Regione Autonoma Friuli Venezia Giulia
link: https://www.regione.fvg.it/rafvg/cms/RAFVG/famiglia-casa/politiche-famiglia/FOGLIA68/
apertura: '2026-03-31'
chiusura: '2027-07-23'
fonte: documento Regione Autonoma Friuli Venezia Giulia, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
