note:
- 'Avviso chiuso: adesioni aperte dalle 12:00 del 15.09.2021, previste fino al 31.12.2022 ma interrotte alle 24:00 del 20.06.2022
  (Determinazione Direttoriale n. 763 del 09.06.2022).'
- Per i NEET si controlla solo di non essere iscritti a scuola o università; altri percorsi di formazione non sono verificabili.
- I requisiti devono esserci alla data di adesione, all'assegnazione del BUL e alla presa in carico.
- Chi è stato preso in carico con l'Avviso Umbriattiva Reimpiego può aderire solo dopo la scadenza del Buono Reimpiego (e
  comunque dal 31.12.2021).
- Gli enti (ATI/ATS) e le imprese che assumono sono beneficiari di altre parti dell'avviso, non modellate qui.
- Adesione solo dal portale Lavoro per Te Umbria con SPID o CIE; i cassintegrati con accordo sindacale possono aderire al
  colloquio presso il CPI.
