note:
- 'È una pagina di istruzioni per il bando benefici a.a. 2026/2027 (borsa di studio e posto alloggio) per gli iscritti all''Università
  di Genova e alle AFAM: i requisiti veri e propri sono nel bando, non riportato. La sede in Liguria si ricava dal fatto che
  l''ente è l''agenzia regionale ligure e che la pagina parla dell''Università di Genova.'
- 'La domanda online andava presentata dal 15 giugno al 31 luglio 2026, ore 12:00: il termine è già scaduto. La pagina cita
  anche borse per dottorandi e specializzandi.'
- 'La pagina riporta anche una procedura a.a. 2025/2026, chiusa, per chi ha concluso il semestre filtro di Medicina in altri
  atenei: domande dal 19/02/2026 al 12/03/2026.'
