id: calabria-europa-certificazione-delle-competenze-digitali-df42e4
titolo: Certificazione delle competenze digitali
ente: Regione Calabria
link: https://calabriaeuropa.regione.calabria.it/bando/certificazione-delle-competenze-digitali/
apertura: null
chiusura: null
fonte: documento Regione Calabria, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti:
- campo: eta
  operatore: <
  valore: 35
  fonte: Regione Calabria, pagina 12
  citazione: Sono ammessi a presentare domanda i/le giovani al di sotto dei 35 anni non ancora compiuti che intendano acquisire
- almeno_uno_di:
  - campo: regione
    operatore: in
    valori:
    - Calabria
  - campo: regione_domicilio
    operatore: in
    valori:
    - Calabria
  fonte: Regione Calabria, pagina 12
  citazione: essere domiciliati o residenti in Calabria alla data di presentazione della domanda;
- campo: condizione_lavorativa
  operatore: in
  valori:
  - disoccupato
  fonte: Regione Calabria, pagina 12
  citazione: essere disoccupati o inoccupati ai sensi della normativa vigente;
- non_modellabile: 'Aver completato l''iter di presa in carico presso il Centro per l''Impiego competente: manca un campo.'
  fonte: Regione Calabria, pagina 12
  citazione: aver effettuato l’iter di presa in carico presso il Centro per l’Impiego competente territorialmente;
- campo: cittadinanza
  operatore: in
  valori:
  - italiana
  - ue
  - familiare_con_diritto_soggiorno
  - extra_ue_lungo_periodo
  - protezione_internazionale
  - apolide
  - altro_titolo
  fonte: Regione Calabria, pagina 12
  citazione: in caso di cittadini non comunitari, è richiesto il possesso di regolare permesso di soggiorno in corso di validità.
note:
- 'Gli inoccupati (chi cerca il primo lavoro) sono ammessi come i disoccupati: si è usato il valore disoccupato, perché il
  vocabolario non distingue.'
- 'Le certificazioni già acquisite sono ammesse solo se rilasciate dopo il 21 luglio 2025 e conformi ai framework indicati:
  è una condizione sul titolo da finanziare, non sulla persona.'
- 'Le domande si presentano dalla data comunicata con un atto successivo fino a esaurimento delle risorse: il documento non
  indica le date.'
- Una sola domanda per destinatario.
