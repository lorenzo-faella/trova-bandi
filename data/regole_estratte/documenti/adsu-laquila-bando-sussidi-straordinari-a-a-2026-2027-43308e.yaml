note:
- 'Gli studenti stranieri con nucleo familiare all''estero non possono avere l''ISEE per il diritto allo studio e presentano
  documentazione dei redditi e patrimoni esteri: per loro la verifica delle soglie ISEE/ISPE avviene su quella documentazione.'
- 'Lo studente può essere considerato indipendente dalla famiglia di origine solo a certe condizioni (residenza separata da
  almeno due anni, redditi da lavoro di almeno 9.000 euro): incide sul calcolo dell''ISEE, non è un requisito a sé.'
