note:
- 'Gli studenti stranieri non residenti in Italia o con nucleo residente all''estero non hanno l''ISEE per il diritto allo
  studio e presentano documentazione dei redditi esteri: il bando non dice come si applicano a loro le soglie ISEE/ISPE, che
  restano scritte come requisito per tutti (chi non ha l''ISEE risponderà ''non lo so'').'
- La definizione di studente 'indipendente' riguarda il calcolo del nucleo per l'ISEE, non è un requisito a sé.
- Domande via e-mail entro e non oltre il 15 gennaio 2027; il bando non indica una data di apertura (l'ordinanza di pubblicazione
  è del 16.07.2026).
