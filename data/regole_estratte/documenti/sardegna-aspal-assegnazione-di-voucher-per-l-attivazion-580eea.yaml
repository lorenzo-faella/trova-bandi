note:
- Domande dalle ore 15:00 del 16/02/2026 alle ore 14:00 del 09/03/2026 tramite il portale Sardegna Lavoro.
- I requisiti vanno posseduti alla domanda, all'attivazione e per tutta la durata del tirocinio; l'età basta alla data della
  domanda.
- 'Il tirocinante utilmente collocato in graduatoria deve iscriversi al CPI competente e stipulare il Patto di Servizio Personalizzato:
  è un obbligo successivo, non un requisito di accesso.'
- Per i titoli esteri l'ammissione è subordinata al riconoscimento del titolo.
