id: masaf-carta-dedicata-a-te-2026
titolo: Carta "Dedicata a te" 2026
ente: Ministero dell'agricoltura, della sovranità alimentare e delle foreste
link: https://www.masaf.gov.it/Carta_Dedicata_a_te_2026-info
apertura: null
chiusura: null
fonte: documento Ministero dell'agricoltura, della sovranità alimentare e delle foreste, estratto con LLM (Claude Code, claude-opus-5-5),
  non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti:
- campo: residente_italia
  operatore: vero
  fonte: Ministero dell'agricoltura, della sovranità alimentare e delle foreste, pagina web
  citazione: Saranno coinvolti 1.177.597 nuclei familiari residenti in Italia, composti
- almeno_uno_di:
  - tutti_di:
    - campo: numero_componenti
      operatore: '>='
      valore: 3
    - almeno_un_componente:
      - campo: eta
        operatore: <
        valore: 18
  - non_modellabile: 'La pagina presenta la composizione (almeno 3 componenti con almeno un minore) anche come ''criterio
      di priorità'': non è chiaro se i nuclei diversi siano esclusi o solo in coda.'
  fonte: Ministero dell'agricoltura, della sovranità alimentare e delle foreste, pagina web
  citazione: da almeno tre persone con almeno un minore, con ISEE inferiore a 15.000 euro e
- campo: isee
  operatore: <=
  valore: 15000
  fonte: Ministero dell'agricoltura, della sovranità alimentare e delle foreste, pagina web
  citazione: 'Requisiti principali: Indicatore ISEE fino a 15.000 euro'
- non_modellabile: 'Il nucleo non deve ricevere altri strumenti di inclusione sociale o di sostegno alla povertà, nazionali
    o locali: la pagina non dice quali e manca il campo.'
  fonte: Ministero dell'agricoltura, della sovranità alimentare e delle foreste, pagina web
  citazione: privi di altri strumenti di inclusione sociale o sostegno alla povertà.
note:
- 'Non c''è domanda: l''INPS individua direttamente i beneficiari, quindi non ci sono date di apertura e chiusura.'
- 'Soglia ISEE scritta in due modi: ''ISEE inferiore a 15.000 euro'' e ''Indicatore ISEE fino a 15.000 euro''. Ho usato <=
  15000, la lettura che non esclude chi ha esattamente 15.000 euro.'
- 'La composizione del nucleo (almeno tre persone con almeno un minore) compare sia tra le caratteristiche dei beneficiari
  sia come ''Criterio di priorità'': l''ho resa come requisito con un''alternativa da verificare.'
- 'La carta va attivata con un primo acquisto entro il 16 dicembre 2026, pena la perdita di validità: è una condizione successiva
  all''assegnazione, non un requisito di accesso.'
- 'È una pagina web informativa (comunicato), non il decreto: mancano i dettagli, per esempio quali misure di sostegno escludono
  dalla carta.'
