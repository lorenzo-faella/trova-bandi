  citazione: se in possesso di specifici requisiti economici e di merito stabiliti dagli Atenei
note:
- Il documento ricevuto contiene solo la sezione Chi può richiedere l'esonero?.
- Per gli studenti AFAM e della Scuola Superiore per Mediatori Linguistici di Rimini la pagina prevede solo il rimborso della
  tassa regionale; l'esonero è disciplinato da ogni istituto.
- La regione dell'ateneo si ricava dall'ente ER.GO e dagli atenei citati (Modena e Reggio Emilia, Rimini).
- Chi non è idoneo alla borsa deve presentare domanda di esonero o contribuzione ridotta entro le scadenze, che il documento
  non riporta.
