  fonte: ER.GO - Azienda regionale per il diritto agli studi superiori, pagina web
  citazione: se in possesso di specifici requisiti economici e di merito stabiliti dagli Atenei
note:
- 'Per l''Università di Modena e Reggio Emilia l''esonero è previsto anche per studenti con disabilità e Top Student: non
  espresso.'
- Per gli studenti AFAM e della Scuola Superiore per Mediatori Linguistici di Rimini idonei alla borsa è previsto il rimborso
  della tassa regionale.
