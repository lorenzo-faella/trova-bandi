id: lombardia-ferau-autorizzazione-unica-di-cui-allart-053f4f
titolo: FERAU - Autorizzazione Unica di cui all’articolo 9 del d.lgs. 25 novembre 2024, n. 190
ente: Regione Lombardia
link: https://www.bandi.regione.lombardia.it/servizi/servizio/catalogo/dettaglio/ambiente-territorio/energia/ferau-autorizzazione-unica-cui-articolo-9-d-lgs-25-novembre-2024-n-190-RLV12026053104
apertura: '2026-04-13'
chiusura: null
