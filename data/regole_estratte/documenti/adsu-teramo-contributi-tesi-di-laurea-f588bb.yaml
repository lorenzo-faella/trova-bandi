note:
- 'Il bando è per chi ha già discusso la tesi: la persona potrebbe non risultare più iscritta quando compila il profilo, e
  allora le condizioni su iscrizione e livello del corso vanno lette sul corso appena concluso.'
- Sede resa con comune_ateneo Teramo per l'Università di Teramo e l'Istituto Superiore di Studi Musicali.
- La pagina web dice ISEE non superiore a quello per la borsa di studio; il regolamento fissa 36.897,11 euro. Si usa l'ISEE
  per il diritto allo studio universitario.
- 'Scadenza: il testo riporta ''30 aprile 202 8'', letto come 30 aprile 2028 (tesi discusse nell''a.a. 2026-27). Domanda via
  PEC a info@pec.adsuteramo.it, con attestazione del Presidente della Commissione, certificato di laurea con esami, copia
  della tesi e ISEE.'
- Premio di 500 euro, assegnato in ordine cronologico di arrivo delle domande fino a esaurimento.
