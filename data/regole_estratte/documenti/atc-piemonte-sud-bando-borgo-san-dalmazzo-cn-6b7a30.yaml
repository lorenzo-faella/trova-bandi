note:
- È un bando per la graduatoria generale di assegnazione degli alloggi di edilizia sociale nell'ambito territoriale di Cuneo;
  i requisiti vanno posseduti al 23/10/2026.
- Per i cittadini extra UE ho considerato regolarmente soggiornanti i titoli 'familiare con diritto di soggiorno', 'lungo
  periodo' e 'altro titolo'; gli apolidi non sono citati dal bando.
- La scadenza è alle 23:59 del 07/12/2026; per i lavoratori emigrati all'estero è prorogata di trenta giorni. La data di apertura
  non è indicata esplicitamente.
