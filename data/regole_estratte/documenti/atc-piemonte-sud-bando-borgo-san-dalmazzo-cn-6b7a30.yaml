note:
- Per i cittadini extra UE il titolo di soggiorno deve essere regolare e il lavoro, subordinato o autonomo, regolare; i titolari
  di protezione internazionale sono ammessi senza condizioni di lavoro.
- I requisiti vanno posseduti al 23/10/2026; la residenza o il lavoro nell'ambito alla data di pubblicazione del bando, che
  non è indicata in modo esplicito.
- Domande entro le ore 23.59 del 07/12/2026; per i lavoratori emigrati all'estero il termine è prorogato di trenta giorni.
