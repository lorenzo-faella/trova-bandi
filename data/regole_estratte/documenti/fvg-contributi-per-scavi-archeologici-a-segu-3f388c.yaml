note:
- 'Nel testo ricevuto manca il soggetto della frase sui beneficiari ("Possono beneficiare del contributo avente residenza..."):
  non si sa se il contributo spetti a persone fisiche, imprese o enti. La menzione di residenza oltre a sede legale od operativa
  fa pensare che siano ammesse anche persone fisiche, ma va verificato sul bando completo.'
- 'Il requisito territoriale vale come residenza per le persone o come sede legale od operativa per gli altri soggetti; il
  nome della regione è scritto nella forma "Friuli-Venezia Giulia": verificare che coincida con quella usata dal motore.'
- 'Termine: domande via PEC entro il 15 novembre 2026, come indicato nel titolo; data di apertura non indicata nel testo ricevuto.'
