note:
- Iscrizione all'A.A. 2026-2027 entro il 12.10.2026; l'inserimento nell'elenco dipende anche dalla verifica della frequenza
  delle lezioni.
- Il bando cita anche gli iscritti alla Scuola Italiana di Design (SID), che il vocabolario non distingue.
- Il contratto di assistenza è richiesto come documento a pena d'esclusione; l'ho tenuto come requisito perché il contributo
  esiste solo se lo studente ha l'assistente. Da valutare.
- 'Incompatibile con analoghi benefici per l''assistenza personale già concessi da ESU o da altre amministrazioni: regola
  di cumulo, non modellata.'
- Domanda via PEC a esu@cert.esu.pd.it con il modulo editabile; contributo erogato solo dopo l'assegnazione dei fondi MUR,
  in ordine cronologico.
