id: bolzano-portale-contributi-per-la-partecipazione-ad-azio-a2c762
titolo: Contributi per la partecipazione ad azioni di formazione continua - Provincia di Bolzano
ente: Provincia autonoma di Bolzano
link: https://civis.bz.it/it/servizi/servizio.html?id=1038487
apertura: null
chiusura: null
fonte: documento Provincia autonoma di Bolzano, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti:
- campo: regione
  operatore: in
  valori:
  - Trentino-Alto Adige/Südtirol
  fonte: Provincia autonoma di Bolzano, pagina web
  citazione: residenti in provincia di Bolzano
- non_modellabile: 'Residenza in provincia di Bolzano: il vocabolario non ha un campo per la provincia di residenza.'
  fonte: Provincia autonoma di Bolzano, pagina web
  citazione: Persone residenti in provincia di Bolzano
- almeno_uno_di:
  - tutti_di:
    - campo: condizione_lavorativa
      operatore: in
      valori:
      - occupato
    - campo: tipo_lavoro
      operatore: in
      valori:
      - dipendente
    - non_modellabile: 'Impiego presso aziende private con sede in Alto Adige: manca il campo sul datore di lavoro.'
      citazione: impiegati presso aziende private con sede in Alto Adige
  - campo: condizione_lavorativa
    operatore: in
    valori:
    - disoccupato
    citazione: in possesso dello stato di disoccupazione
  - non_modellabile: 'Interruzione dell''attività lavorativa da almeno sei mesi con volontà di reinserirsi: il termine è in
      mesi e il vocabolario conta i giorni dalla cessazione, quindi non lo traduciamo.'
    citazione: hanno interrotto la propria attività lavorativa per almeno sei mesi
  fonte: Provincia autonoma di Bolzano, pagina web
  citazione: Lavoratori e lavoratrici dipendenti residenti in provincia di Bolzano
note:
- 'Misura sempre aperta: la domanda va presentata al più tardi due giorni prima dell''inizio del corso; per azioni formative
  che terminano nell''anno della domanda, entro il 31 ottobre di quell''anno.'
- Il corso deve iniziare entro 120 giorni dalla domanda e concludersi entro 24 mesi; dettagli nel D.G.P. 1056/25 allegato
  A, non fornito.
- Contributi erogati dalla formazione professionale in lingua italiana.
