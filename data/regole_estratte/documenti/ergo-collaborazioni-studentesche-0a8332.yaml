note:
- Il documento è il volume intero dei bandi UNIMORE 2026/2027; qui c'è solo il bando per le collaborazioni studentesche retribuite
  (pagine 69-79), più le Norme Generali che valgono per tutti i benefici. Il tutorato alla pari per studenti con disabilità/DSA
  è un bando a parte e non è incluso.
- 'Sede: UNIMORE è resa con provincia_ateneo Modena e Reggio nell''Emilia (nome ISTAT), con iscrizione all''università; il
  vincolo esatto (iscrizione proprio a UNIMORE) non è verificabile.'
- Le soglie ISEE/ISPE si applicano all'ISEE per il diritto allo studio universitario; ER.GO sottrae dall'ISEE i compensi delle
  collaborazioni già percepite rapportati alla scala di equivalenza, quindi chi è di poco sopra 31.250 euro potrebbe rientrare.
- La Tabella 4 dei CFU minimi e l'art. 1 delle Norme Generali (durata) sono in parti del bando che non abbiamo.
- Per attivare la collaborazione bisogna regolarizzare l'iscrizione 2026/2027 entro il 30 aprile 2027.
- Gli studenti internazionali con redditi o patrimoni all'estero devono inviare la documentazione tradotta e legalizzata entro
  la scadenza, pena la non idoneità; gli extra UE con redditi solo all'estero possono usare l'ISEE Paese.
- Domanda online sul sito ER.GO dal 23 giugno al 24 agosto 2026 (ore 16.00), compreso il perfezionamento con PEC o PIN.
