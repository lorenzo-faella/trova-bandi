  citazione: scuole di specializzazione di durata almeno biennale, ad eccezione dei corsi dell’area medica di cui al
note:
- 'La tabella con le scadenze per la domanda (art. 7, Tabella n. 1) non c''è nel testo ricevuto, quindi apertura e chiusura
  restano null. Le sole date presenti riguardano il semestre filtro di Medicina e Odontoiatria: dal 15/06/2026 alle 12:00
  del 31/07/2026 per chi è iscritto a Genova, dal 19/02/2027 alle 12:00 del 12/03/2027 per chi viene da altri atenei.'
- Serve un'attestazione ISEE universitario (ISEEU) con DSU firmata entro il 31/07/2026, oppure un ISEEUP per i nuclei all'estero;
  un ISEE ordinario o con difformità non vale se non corretto entro il 19/10/2026. Sono adempimenti, non requisiti.
- Per gli iscritti al primo anno non si chiede merito al momento della domanda; dopo servono 20 crediti entro il 10/08/2027
  (o il 30/11/2027 per metà borsa), pena la revoca. Gli studenti con disabilità ne sono esentati. È una condizione per mantenere
  il beneficio e non è tra i requisiti.
- 'Gli studenti da Paesi particolarmente poveri e gli apolidi o titolari di protezione internazionale senza redditi in Italia
  hanno ISEEU e ISPEU considerati pari a zero: rispettano comunque le soglie.'
- Il titolo AFAM, il diploma universitario e la laurea vecchio ordinamento hanno regole di equivalenza particolari (art. 2,
  commi 2-4), qui riassunte nel requisito sul primo titolo.
