note:
- 'La tabella n. 1 con i termini per presentare la domanda (art. 7) non è nel testo ricevuto: apertura e chiusura restano
  null. Per gli iscritti al semestre filtro di Medicina e Odontoiatria a Genova la domanda va presentata dal 15/06/2026 al
  31/07/2026; la DSU per l''ISEEU va sottoscritta entro il 31/07/2026.'
- 'La borsa è riservata agli iscritti all''Università degli Studi di Genova e alle Istituzioni AFAM della Liguria (Tabella
  C, non riportata): regione_ateneo = Liguria approssima la condizione sull''ateneo.'
- 'Primo titolo per ciascun livello: le eccezioni dell''art. 2 (titoli AFAM o diploma universitario che consentono la magistrale
  a ciclo unico con ammissione ad anni successivi, diploma di Conservatorio vecchio ordinamento) e dell''art. 3.5 non sono
  espresse; il valore ''master'' di titolo_di_studio è stato ammesso per prudenza perché non distingue il master di primo
  e di secondo livello.'
- 'Requisito di merito: anno_di_corso è letto come anno contato dall''anno convenzionale di prima iscrizione (art. 5); l''''ultimo
  semestre'' corrisponde al primo anno oltre la durata legale. Le soglie per la laurea magistrale a ciclo unico di 5 e 6 anni
  coincidono fino al sesto anno. Le soglie ridotte con il bonus sono le soglie della tabella meno il bonus massimo dell''anno:
  chi sta tra le due risulta ''da verificare''.'
- I crediti valgono se registrati entro il 10/08/2026; per le matricole i 20 crediti da conseguire entro il 10/08/2027 o il
  30/11/2027 servono a mantenere la borsa, non per accedere, e non sono modellati.
- 'Non modellati perché procedurali o successivi all''assegnazione: iscrizione da perfezionare entro il 31/12/2026 (10/03/2027
