note:
- 'La tabella con le scadenze di presentazione della domanda (art. 7, Tabella n. 1) non è nel testo ricevuto, quindi apertura
  e chiusura restano null. Date note: la DSU per l''ISEEU va sottoscritta entro il 31/07/2026; per il semestre filtro a Genova
  la domanda va dal 15/06/2026 al 31/07/2026, e per chi arriva dal semestre filtro di un altro ateneo dal 19/02/2027 al 12/03/2027.'
- La cittadinanza non limita l'accesso. Studenti con nucleo all'estero usano l'ISEEU parificato (ISEEUP), da ottenere entro
  il 31/12/2026; per apolidi e titolari di protezione internazionale contano solo i redditi in Italia; per chi viene da Paesi
  particolarmente poveri gli indicatori valgono 0 con la certificazione consolare.
- Al primo anno il merito (20 crediti entro il 10/08/2027 o il 30/11/2027) si valuta dopo ed è una condizione di revoca, non
  di accesso; gli studenti con disabilità ne sono esentati.
- 'Il cumulo con altre provvidenze monetarie per lo stesso anno porta all''esclusione, con facoltà di scegliere: lo si è lasciato
  fuori perché è una regola di cumulo.'
- Il limite dei 35 anni è scritto come alternativa con anno_di_corso >= 2 perché vale solo per il primo anno di laurea e ciclo
  unico; al primo anno l'esito resta da verificare.
- L'anno di corso dichiarato può non coincidere con l'anno convenzionale del bando (art. 5).
