note:
- 'Le date di presentazione della domanda (art. 7, Tabella n. 1) non sono nel testo ricevuto: apertura e chiusura restano
  null. Solo per il semestre filtro di Medicina e Odontoiatria sono indicati i periodi 15/06/2026-31/07/2026 e 19/02/2027-12/03/2027.'
- 'Termini documentali che fanno perdere il diritto: DSU per l''ISEEU sottoscritta entro il 31/07/2026 (attestazioni corrette
  entro il 19/10/2026); ISEEUP rilasciato da un CAAF convenzionato entro il 31/12/2026; iscrizione perfezionata entro il 31/12/2026
  (entro il 10/03/2027 per il primo anno di laurea magistrale). Non sono resi come requisiti perché riguardano modi e tempi
  della domanda.'
- 'Non è chiesta una residenza: il bando è legato alla sede del corso. regione_ateneo Liguria copre l''Università di Genova
  e le AFAM liguri; il bando riguarda solo questi istituti.'
- Il limite dei 35 anni vale per il primo anno di laurea o ciclo unico. Chi ha già una laurea, un master o un dottorato ed
  è al primo anno può essere solo iscritto a una magistrale, a un dottorato o a una specializzazione (gli altri casi sono
  esclusi dalla regola del primo titolo), per cui il limite non lo riguarda.
- Studenti da Paesi particolarmente poveri (Tabella n. 7), apolidi e titolari di protezione internazionale hanno regole proprie
  per calcolare ISEEU e ISPEU, che possono valere 0 euro.
- 'Non sono modellati: i 20 crediti da conseguire entro il 30/11/2027 per gli iscritti al primo anno (condizione per mantenere
  la borsa, non per ottenerla); l''incompatibilità con altre borse con la stessa finalità (lo studente può scegliere quale
  tenere); i requisiti per le integrazioni e per il posto alloggio (per esempio la maggiore età per essere alloggiati).'
- Gli studenti AFAM non possono chiedere la borsa come "ultimo semestre".
