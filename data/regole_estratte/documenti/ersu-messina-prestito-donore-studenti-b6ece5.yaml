requisiti:
- campo: iscrizione
  operatore: in
  valori:
  - universita
  - afam
  fonte: ERSU Messina, pagina 1
  citazione: Destinatari dell’agevolazione sono gli studenti universitari
- campo: regione_ateneo
  operatore: in
  valori:
  - Sicilia
  fonte: ERSU Messina, pagina 1
  citazione: con sede nella Regione Sicilia
- almeno_uno_di:
  - campo: anno_di_corso
    operatore: <=
    valore: 1
  - tutti_di:
    - campo: anno_di_corso
      operatore: '>='
      valore: 2
    - non_modellabile: 'Aver conseguito almeno il 50 per cento dei CFU previsti per ciascun anno accademico: il documento
        non dice quanti CFU sono previsti per anno.'
  fonte: ERSU Messina, pagina 1
  citazione: iscrizione agli anni successivi al primo ai suddetti corsi universitari e conseguimento di almeno il 50 per cento
    dei CFU previsti per ciascun anno accademico;
- campo: isee
  operatore: <
  valore: 20000
  fonte: ERSU Messina, pagina 1
  citazione: b) possesso di un ISEE inferiore ad euro 20.000,00 vigente
note:
- Il documento ricevuto contiene solo la sezione Destinatari; non riporta il periodo per presentare domanda.
- Gli istituti superiori di grado universitario che rilasciano titoli accademici sono resi con iscrizione università o AFAM;
  il documento non nomina gli AFAM.
- 'Il prestito è aperto agli studenti di qualsiasi provenienza: non c''è requisito di residenza.'
