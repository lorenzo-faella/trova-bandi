id: lombardia-dote-unica-lavoro-persone-con-disabilita-c30ba6
titolo: Dote Unica Lavoro Persone con Disabilità - Provincia di Monza e Brianza
ente: Regione Lombardia
link: https://www.bandi.regione.lombardia.it/servizi/servizio/catalogo/dettaglio/istruzione-formazione-lavoro/lavoro-occupazione/dote-unica-lavoro-persone-disabilit-provincia-monza-brianza-PR_MB_42025049901
apertura: '2025-12-17'
chiusura: null
fonte: documento Regione Lombardia, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti:
- campo: disabile
  operatore: vero
  fonte: Regione Lombardia, pagina web
  citazione: 'Persone con le caratteristiche di disabilità descritte all''art. 1 della L. 68/1999:'
- non_modellabile: 'La disabilità deve rientrare nelle categorie dell''art. 1 della L. 68/1999: il vocabolario chiede solo
    se c''è una disabilità e la percentuale, non la categoria.'
  fonte: Regione Lombardia, pagina web
  citazione: 'Persone con le caratteristiche di disabilità descritte all''art. 1 della L. 68/1999:'
- almeno_uno_di:
  - tutti_di:
    - campo: condizione_lavorativa
      operatore: in
      valori:
      - disoccupato
    - non_modellabile: 'Iscrizione agli elenchi del Collocamento Mirato delle Province lombarde o della Città Metropolitana:
        manca il campo.'
    citazione: disoccupate, ai sensi dell'art 19 D. Lgs 150/2015 e iscritte agli elenchi del Collocamento Mirato istituiti
      presso le Province lombarde e la Città Metropolitana destinatarie della Dote Inserimento;
  - non_modellabile: 'Destinatari della Dote Mantenimento (persone già occupate): il testo ricevuto non li descrive.'
  fonte: Regione Lombardia, pagina web
  citazione: destinatarie della Dote Inserimento;
note:
- Il testo ricevuto descrive solo i destinatari della Dote Inserimento; quelli della Dote Mantenimento restano da verificare
  nell'avviso.
- 'L''iscrizione è agli elenchi del Collocamento Mirato delle Province lombarde: implica un legame territoriale con la Lombardia,
  ma la pagina non parla di residenza e il requisito non è stato tradotto in `regione`.'
