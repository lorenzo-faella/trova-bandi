note:
- La domanda non è presentata dalla donna ma dal/dalla legale rappresentante del Centro antiviolenza, Casa rifugio o Casa
  di semiautonomia del Lazio che l'ha presa in carico, via PEC.
- 'L''esclusione per chi ha richiesto o percepito il Reddito di libertà è scritta come regola di cumulo, ma con ''qualora
  richiesto'' agisce anche all''accesso: per prudenza è stata riportata come requisito da verificare.'
- 'Procedura a sportello fino a esaurimento delle risorse: il testo non indica date di apertura e chiusura.'
