- non_modellabile: 'Essere una donna che ha subito violenza e ha intrapreso (o sta seguendo) un percorso di fuoriuscita dalla
    violenza, segnalata da un Centro antiviolenza, Casa rifugio o Casa di semiautonomia del Lazio: il vocabolario non ha campi
    su genere e condizione di vittima di violenza.'
  fonte: Regione Lazio - Lazio Europa, pagina web
  citazione: avere intrapreso o essere all’interno di un percorso di fuoriuscita dalla violenza
- non_modellabile: 'Non aver richiesto o percepito il Reddito di libertà INPS: manca il campo.'
  fonte: Regione Lazio - Lazio Europa, pagina web
  citazione: La concessione del contributo non può essere cumulata con il Reddito di libertà erogato dall’INPS, qualora richiesto
    e/o percepito.
- non_modellabile: 'Non aver già ricevuto il Contributo di libertà nella precedente edizione: manca il campo.'
  fonte: Regione Lazio - Lazio Europa, pagina web
