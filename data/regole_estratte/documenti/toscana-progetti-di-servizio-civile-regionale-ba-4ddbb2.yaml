requisiti:
- almeno_uno_di:
  - campo: regione
    operatore: in
    valori:
    - Toscana
  - campo: regione_domicilio
    operatore: in
    valori:
    - Toscana
  - non_modellabile: 'Sono ammessi anche i regolarmente soggiornanti in Toscana senza residenza né domicilio: manca un campo.'
  fonte: Regione Toscana, pagina 2
  citazione: siano residenti, domiciliati o regolarmente soggiornanti in Toscana;
- campo: eta
  operatore: tra
  valore:
  - 18
  - 29
  fonte: Regione Toscana, pagina 2
  citazione: siano in età compresa fra diciotto e ventinove anni (ovvero fino al giorno antecedente il compimento
- campo: condizione_lavorativa
  operatore: in
  valori:
  - disoccupato
  - inattivo
  - studente
  fonte: Regione Toscana, pagina 2
  citazione: siano non occupati, disoccupati, inattivi;
- non_modellabile: 'Non aver riportato condanna penale, anche non definitiva, alla reclusione superiore a un anno per delitto
    non colposo: non chiediamo dati giudiziari.'
  fonte: Regione Toscana, pagina 2
  citazione: non abbiano riportato condanna penale anche non def initiva alla pena della reclusione superiore ad
- non_modellabile: 'Non aver già prestato due volte il servizio civile regionale in Toscana e non aver avuto con l''ente del
    progetto, nell''ultimo anno e per almeno sei mesi, rapporti di lavoro o collaborazione retribuita: mancano i campi.'
  fonte: Regione Toscana, pagina 3
  citazione: a) abbiano prestato il servizio civile regionale in Toscana per due volte (art. 11 comma 3 della Legge);
note:
- Il bando di aprile 2026 aveva una prima finestra dal 30 aprile al 10 giugno 2026; le date indicate sono quelle dell'avviso
  pubblico integrativo (9 posti), dall'8 ottobre alle 12:00 del 9 novembre 2026. Per i posti vacanti c'è un avviso separato,
  non incluso.
- 'Possono partecipare anche gli studenti di qualunque corso, purché non occupati: chi lavora e studia non è ammesso, ma con
  più condizioni lavorative la verifica sullo studio non lo esclude.'
- Il limite di età arriva fino al giorno prima del trentesimo compleanno.
- Una sola domanda per un solo progetto; i requisiti, tranne l'età, vanno mantenuti fino al termine del servizio. Eventuali
  requisiti specifici di ciascun progetto sono sui siti degli enti titolari, non nel testo ricevuto.
