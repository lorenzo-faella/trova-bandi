requisiti:
- almeno_uno_di:
  - campo: regione
    operatore: in
    valori:
    - Toscana
  - campo: regione_domicilio
    operatore: in
    valori:
    - Toscana
  fonte: Regione Toscana, pagina 1
  citazione: siano residenti, domiciliati o regolarmente soggiornanti in Toscana;
- campo: eta
  operatore: tra
  valore:
  - 18
  - 29
  fonte: Regione Toscana, pagina 1
  citazione: siano in età compresa fra diciotto e ventinove anni (ovvero fino al giorno antecedente il compimento del trentesimo
    anno);
- campo: condizione_lavorativa
  operatore: in
  valori:
  - disoccupato
  - inattivo
  - studente
  - pensionato
  fonte: Regione Toscana, pagina 1
  citazione: siano non occupati, disoccupati, inattivi;
- non_modellabile: 'Assenza di condanna penale, anche non definitiva, alla reclusione superiore a un anno per delitto non
    colposo. Scelta: non chiediamo dati giudiziari.'
  fonte: Regione Toscana, pagina 1
  citazione: non abbiano riportato condanna penale anche non definitiva alla pena della reclusione superiore ad un anno per
    delitto non colposo.
- non_modellabile: 'Non aver già prestato due volte il servizio civile regionale in Toscana: manca il campo.'
  fonte: Regione Toscana, pagina 1
  citazione: abbiano prestato il servizio civile regionale in Toscana per due volte
- non_modellabile: 'Non aver avuto con l''ente che realizza il progetto, nell''ultimo anno prima dell''uscita del bando e
    per almeno sei mesi, rapporti di lavoro o collaborazione retribuita: manca il campo.'
  fonte: Regione Toscana, pagina 1
  citazione: rapporti di lavoro o di collaborazione retribuita, anche da altri soggetti, a qualunque titolo
note:
- 'Date: il bando principale era aperto dalle ore 8 del 30 aprile 2026 alle ore 12:00 del 10 giugno 2026; apertura e chiusura
  riportano la finestra dell''avviso integrativo (ore 8:00 dell''8 ottobre 2026 - ore 12:00 del 9 novembre 2026), che la pagina
  indica come scadenza attuale. L''avviso per i posti vacanti ha una pagina propria non inclusa.'
- '''Non occupati, disoccupati, inattivi'': sono ammessi tutti i non occupati; il bando ammette espressamente chi frequenta
  un qualunque corso di studi.'
- I 'regolarmente soggiornanti' in Toscana sono resi con residenza o domicilio in Toscana.
- I requisiti, tranne l'età, vanno mantenuti fino al termine del servizio. Si può presentare una sola domanda per un solo
  progetto; i singoli progetti possono avere requisiti propri pubblicati sui siti degli enti, non disponibili qui.
