id: toscana-assegno-formazione-gol-0e28c6
titolo: Assegno formazione GOL
ente: Regione Toscana
link: https://www.regione.toscana.it/-/assegno-formazione-gol
apertura: null
chiusura: '2027-07-31'
fonte: documento Regione Toscana, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti:
- almeno_uno_di:
  - campo: disabile
    operatore: vero
  - campo: eta
    operatore: '>='
    valore: 55
  - tutti_di:
    - campo: eta
      operatore: <
      valore: 30
    - campo: condizione_lavorativa
      operatore: in
      valori:
      - disoccupato
      - inattivo
  - non_modellabile: 'Altre categorie GOL: lavoratori in cassa integrazione (L. 234/2021 art. 1 c. 200 e CIGS del D.L. 92/2025),
      disoccupati percettori di NASpI o DIS-COLL, percettori di Reddito di cittadinanza, Supporto per la Formazione e il Lavoro
      o Assegno di Inclusione, donne in condizioni di svantaggio, disoccupati da almeno sei mesi o con minori opportunità
      occupazionali, autonomi che cessano l''attività, lavoratori con reddito sotto la soglia di incapienza: mancano i campi.'
  fonte: Regione Toscana, pagina web
  citazione: 'Lavoratori fragili o vulnerabili: giovani NEET (meno di 30 anni), donne in condizioni di svantaggio, persone
    con disabilità, lavoratori maturi (55 anni e oltre);'
- non_modellabile: 'Aver stipulato un Patto di servizio/lavoro presso un Centro per l''Impiego della Toscana e aver formalizzato
    l''adesione all''Assegno formazione GOL: manca un campo.'
  fonte: Regione Toscana, pagina web
  citazione: coloro che hanno stipulato un Patto di servizio/lavoro presso i Centri per l'Impiego di riferimento di Regione
    Toscana
- non_modellabile: 'Non avere accesso a un percorso adeguato nel Catalogo "GOL in Toscana" (assenza o esaurimento dei percorsi,
    oppure sede ad almeno 80 km dal domicilio o a più di 60 minuti con i mezzi pubblici), salvo il percorso di Assistente
    Familiare, e possedere i requisiti di accesso al percorso scelto: mancano i campi.'
  fonte: Regione Toscana, pagina web
  citazione: comprovata difficoltà nel raggiungere la/le sede/i di svolgimento del/dei corsi individuato/i nel Catalogo GOL
    in Toscana
note:
- 'La domanda di finanziamento è presentata dagli enti erogatori per conto dei beneficiari. La pagina indica come scadenza
  sia il 31 luglio 2027 sia il 31 luglio 2026: si è scelto il 2027, perché la pagina parla anche delle domande presentate
  dal 1 luglio 2026.'
- 'Per i giovani NEET si è usata la condizione di disoccupato o inattivo sotto i 30 anni: chi studia o è in formazione non
  è NEET.'
- Il tipo di percorso (upskilling o reskilling) dipende dalla profilazione svolta dal Centro per l'Impiego.
