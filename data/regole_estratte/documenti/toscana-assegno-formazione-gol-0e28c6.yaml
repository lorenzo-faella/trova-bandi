  citazione: 'Il presente avviso si rivolge a:'
- non_modellabile: 'Aver stipulato un Patto di servizio/lavoro presso un Centro per l''impiego della Regione Toscana: manca
    il campo.'
  fonte: Regione Toscana, pagina 1
  citazione: coloro che hanno stipulato un Patto di servizio/lavoro presso i Centri per l'Impiego di riferimento di Regione
    Toscana
- non_modellabile: 'Non avere accesso all''offerta del Catalogo "GOL in Toscana", per assenza o esaurimento di percorsi adeguati
    oppure per sede del corso distante almeno 80 km dal domicilio o oltre 60 minuti con i mezzi pubblici (salvo il percorso
    di Assistente familiare): mancano i campi.'
  fonte: Regione Toscana, pagina 1
  citazione: 'che non hanno accesso all’offerta formativa presente all’interno del Catalogo “GOL in Toscana” per:'
note:
- 'La pagina riporta due scadenze diverse: ''fino al 31 luglio 2027'' e ''fino alla scadenza del 31 luglio 2026''; ho usato
  la più recente, coerente con le domande presentate dal 1 luglio 2026. Data di apertura non indicata.'
- La domanda è presentata dall'ente formativo per conto del beneficiario, dopo l'adesione formalizzata con il Centro per l'impiego
  e al raggiungimento di almeno 6 adesioni al corso.
- Il beneficiario deve inoltre possedere i requisiti di accesso al percorso prescelto, che dipendono dal singolo corso, e
  rispettare il monte ore previsto dal DM 5 novembre 2021.
- 'Il bando non richiede espressamente la residenza in Toscana: il legame con la regione passa dal Patto di servizio con un
  Centro per l''impiego toscano.'
- Per i NEET ho escluso gli studenti (non in istruzione o formazione); la condizione di 'non in formazione' non è verificabile
  oltre.
