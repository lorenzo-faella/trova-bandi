note:
- La domanda si presenta dal giorno successivo alla pubblicazione del bando (pubblicato il 23 settembre 2026) fino alle 23:59
  del 30 ottobre 2026; per gli studenti del Semestre Filtro provenienti da atenei non molisani è prevista una riapertura dei
  termini con avviso separato.
- 'Obblighi procedurali (non modellati): PEC nominativa intestata allo studente, pena esclusione; DSU per l''ISEE universitario
  2026 sottoscritta entro la scadenza; protocollo ISEE indicato nella domanda; iscrizione perfezionata entro i termini dell''università
  senza mora.'
- La tabella dei crediti lega ogni anno all'anno di prima iscrizione (2° anno = prima iscrizione 2025/2026, ecc.) e i crediti
  vanno conseguiti entro il 10 agosto 2026; l'"ulteriore semestre" è reso come l'anno successivo alla durata normale (4° per
  la triennale, 3° per la magistrale, 6° o 7° per il ciclo unico). Le soglie del 6° anno coincidono (245) per il ciclo unico
  di 5 e di 6 anni.
- 'Le durate massime (triennale 7 semestri, ciclo unico durata + 1 semestre, magistrale 5 semestri) sono espresse indirettamente:
  gli anni non presenti in tabella non soddisfano il requisito di merito.'
- 'Soglie ISEE/ISPE maggiorate: il bando le riserva agli studenti con invalidità "superiore al 66%" (reso come > 66), mentre
  per merito e durata parla di disabilità "non inferiore al 66%" (reso come >= 66). Altrove il bando cita "pari o superiore
  al 66%": per chi ha esattamente il 66% la soglia economica va verificata.'
- 'Esclusioni sul titolo non distinguibili con il vocabolario: laurea del vecchio ordinamento, diploma SSIS per chi si iscrive
  a un''altra specializzazione, laurea magistrale conseguita al Conservatorio, specializzazione già conseguita.'
- 'Gli studenti del Semestre Filtro (Medicina, Odontoiatria, Veterinaria) hanno una graduatoria dedicata e devono immatricolarsi
  a un corso di un ateneo molisano: regole non modellate.'
- 'Il bando cita anche i Conservatori nel computo dei crediti, ma i destinatari dell''Art. 2 sono solo gli iscritti agli atenei:
  si è usato iscrizione = universita.'
