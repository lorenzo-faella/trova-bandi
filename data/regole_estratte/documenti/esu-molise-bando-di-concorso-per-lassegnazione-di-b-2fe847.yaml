note:
- Domanda online con SPID o CIE dal giorno successivo alla pubblicazione del bando (pubblicato il 23 settembre 2026) entro
  le 23:59 del 30 ottobre 2026; è obbligatoria una PEC intestata allo studente.
- Serve un ISEE 2026 per il diritto allo studio universitario con DSU sottoscritta entro la scadenza della domanda, e il protocollo
  va indicato nella domanda.
- 'Per i primi anni il merito si valuta ex post (18 crediti entro il 10 agosto 2027 per la seconda rata, 20 entro il 30 novembre
  2027 per non perdere la borsa): sono condizioni di mantenimento, non di accesso.'
- 'La soglia per gli studenti con disabilità è riferita a invalidità ''superiore al 66%'' (art. 11), mentre altrove il bando
  parla di ''non inferiore al 66%'': ho seguito la formulazione dell''art. 11.'
- Per gli studenti del Semestre Filtro ci sono una graduatoria dedicata e una riapertura dei termini con avviso separato,
  che non sono modellate.
- Il bando rimanda ad articoli e alle Definizioni non inclusi nel testo ricevuto (es. art. 6 comma 6.3, punti 1-3 sugli studenti
  stranieri).
