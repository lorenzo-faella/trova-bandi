note:
- 'Le sezioni ricevute non riportano le date per presentare la domanda (Art. 9 rimanda alle pagine del sito Bocconi): apertura
  e chiusura restano null.'
- Il merito degli anni successivi si conta dall'anno di prima immatricolazione assoluta e sui crediti registrati entro il
  10 agosto 2026; anno_di_corso è l'anno di iscrizione attuale, quindi per chi ha avuto rinunce, trasferimenti o passaggi
  la soglia può essere più alta di quella applicata.
- 'Per i primi anni il merito (44 CFU per laurea e ciclo unico, 39 per la magistrale, entro il 10/08/2027) serve solo a confermare
  la borsa dopo l''assegnazione: non è un requisito d''accesso.'
- 'Il bonus di crediti non è nel vocabolario: sotto la soglia piena ma sopra la soglia meno il bonus massimo l''esito resta
  da verificare.'
- 'Dottorato: il merito è essere vincitori del concorso (1° anno) o regolarmente ammessi all''anno successivo, cioè coincide
  con l''iscrizione.'
- Mancano l'Allegato C (artt. 3 e 4 per gli studenti con handicap o invalidità almeno del 66%), l'Allegato B (documenti) e
  l'art. 15 (revoche).
- 'Per partecipare bisogna essere regolarmente iscritti entro i termini dell''Academic Services e aver pagato tasse e contributi:
  procedura, non modellata. Anche l''ISEE per il diritto allo studio senza omissioni/difformità e l''ISEEU parificato dal
  CAF convenzionato sono adempimenti.'
- 'Titolo di studio: ''master'' è ammesso per chi si iscrive alla magistrale perché un master di I livello non supera la laurea
  magistrale, ma un master di II livello sì; il vocabolario non distingue.'
