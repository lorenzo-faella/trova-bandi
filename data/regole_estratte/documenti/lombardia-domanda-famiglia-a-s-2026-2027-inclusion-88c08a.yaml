id: lombardia-domanda-famiglia-a-s-2026-2027-inclusion-88c08a
titolo: Domanda famiglia a.s. 2026 - 2027 Inclusione scolastica per studenti con disabilità sensoriale
ente: Regione Lombardia
link: https://www.bandi.regione.lombardia.it/servizi/servizio/catalogo/dettaglio/politiche-sociali/disabilita/domanda-famiglia-s-2026-2027-inclusione-scolastica-studenti-disabilit-sensoriale-RLD12026053842
apertura: '2026-05-28'
chiusura: null
fonte: documento Regione Lombardia, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-21'
requisiti:
- almeno_uno_di:
  - campo: regione
    operatore: in
    valori:
    - Lombardia
  - non_modellabile: 'Residenti fuori regione con specifiche situazioni familiari (affido presso famiglie lombarde, adozione,
      collocamento disposto dal Tribunale presso famiglie o comunità lombarde): mancano i campi.'
  fonte: Regione Lombardia, pagina 1
  citazione: residenti in Regione Lombardia oppure residenti fuori Regione, ma con specifiche situazioni familiari
- almeno_un_componente:
  - campo: disabile
    operatore: vero
  fonte: Regione Lombardia, pagina 1
  citazione: Il bambino/alunno/studente con disabilità sensoriale ha diritto agli interventi e ai servizi
- non_modellabile: 'La disabilità deve essere sensoriale (visiva, uditiva o pluridisabilità sensoriale) secondo i criteri
    clinici del bando (legge 138/2001, legge 381/1970, perdita uditiva oltre 60 dB, bilateralità del deficit per il percorso
    nidi): il vocabolario non distingue il tipo di disabilità.'
  fonte: Regione Lombardia, pagina 6
  citazione: 'a. studenti con disabilità visiva di cui:'
- non_modellabile: 'Il bambino o studente deve essere inserito in un percorso educativo, scolastico o formativo dal nido alla
    secondaria di secondo grado o formazione professionale di secondo ciclo: il campo iscrizione non copre nidi, infanzia,
    primaria e secondaria di primo grado.'
  fonte: Regione Lombardia, pagina 1
  citazione: inseriti in percorsi educativi, scolastici e formativi a partire dagli asili nido
note:
- 'Il beneficiario è il bambino/studente, mentre la domanda può farla lo studente maggiorenne, la famiglia o il tutore: la
  residenza in Lombardia è controllata sul campo regione di chi risponde, che di solito coincide con quella del figlio.'
- La certificazione clinica e i verbali (VAIS, oppure EVIS con Verbale Handicap INPS, più Diagnosi funzionale o Profilo di
  funzionamento) sono documenti da allegare e non sono stati modellati come requisiti.
- 'Il servizio si attiva solo dopo la presa in carico da parte di un Ente erogatore iscritto negli elenchi ATS e la redazione
  del Piano Individuale: è parte della procedura.'
- Casi particolari fuori dai criteri clinici del percorso nidi possono essere sottoposti alle ATS per una deroga.
- 'Procedura valutativa a sportello: il documento indica solo l''apertura (28 maggio 2026, ore 12), non una data di chiusura.'
