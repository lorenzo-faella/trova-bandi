requisiti:
- campo: disabile
  operatore: vero
  fonte: Regione Lombardia, pagina 1
  citazione: 'I destinatari dei servizi sono le persone con disabilità in possesso dei seguenti requisiti:'
- almeno_uno_di:
  - tutti_di:
    - campo: condizione_lavorativa
      operatore: in
      valori:
      - disoccupato
    - non_modellabile: 'Iscrizione al Collocamento Mirato ai sensi della Legge n. 68/1999: manca il campo.'
    citazione: persone disoccupate iscritte al Collocamento Mirato ai sensi della Legge n. 68/1999
  - tutti_di:
    - campo: condizione_lavorativa
      operatore: in
      valori:
      - occupato
    - non_modellabile: 'Occupazione ai sensi della Legge n. 68/1999 (collocamento mirato): manca il campo.'
    citazione: persone occupate ai sensi della Legge n. 68/1999
  fonte: Regione Lombardia, pagina 1
  citazione: persone occupate ai sensi della Legge n. 68/1999
- non_modellabile: 'Essere inseriti in una politica attiva regionale che preveda espressamente questi servizi; oggi è solo
    la Dote Unica Lavoro Disabilità (DULD): manca il campo sulla partecipazione a politiche attive.'
  fonte: Regione Lombardia, pagina 1
  citazione: costituisce l'unica politica attiva regionale che prevede formalmente tale possibilità all'interno del proprio
    atto dispositivo.
note:
- L'istanza per l'attivazione del voucher è presentata dagli operatori accreditati ai servizi al lavoro o dagli uffici della
  Città metropolitana di Milano, non direttamente dalla persona; i requisiti estratti sono quelli dei destinatari dei servizi.
- L'avviso riguarda il territorio della Città metropolitana di Milano, ma il testo ricevuto non pone un requisito esplicito
  di residenza o domicilio dei destinatari, quindi non l'ho aggiunto.
- 'Ho ricevuto solo la scheda informativa iniziale: l''avviso completo potrebbe contenere altri requisiti.'
