id: basilicata-avviso-pubblico-fc-voucher-professionist-f59075
titolo: Avviso Pubblico FC – Voucher Professionisti
ente: Regione Basilicata
link: https://portalebandi.regione.basilicata.it/avvisi-e-bandi/avviso-pubblico-fc-voucher-professionisti/
apertura: '2026-05-22'
chiusura: '2026-12-31'
fonte: documento Regione Basilicata, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti:
- tutti_di:
  - campo: condizione_lavorativa
    operatore: in
    valori:
    - occupato
  - campo: tipo_lavoro
    operatore: in
    valori:
    - autonomo
    - parasubordinato
  fonte: Regione Basilicata, pagina 9
  citazione: professionista in possesso di Partita Iva attiva intestata esclusivamente al richiedente il
- non_modellabile: 'Partita IVA attiva intestata solo al richiedente e, in alternativa, iscrizione all''albo di un ordine/collegio
    professionale oppure, se non iscritto ad albi, iscrizione alla Gestione Separata INPS: mancano i campi su partita IVA
    e iscrizione all''albo.'
  fonte: Regione Basilicata, pagina 9
  citazione: non iscritto ad alcun albo, ma iscritto alla Gestione Separata
- campo: regione
  operatore: in
  valori:
  - Basilicata
  fonte: Regione Basilicata, pagina 9
  citazione: essere residenti in un Comune della Regione Basilicata;
- campo: eta
  operatore: tra
  valore:
  - 18
  - 66
  fonte: Regione Basilicata, pagina 9
  citazione: aver compiuto i 18 anni di età e non superare i 66 anni di età.
- non_modellabile: Esclusi i professionisti costituiti come impresa individuale iscritta alla Camera di Commercio.
  fonte: Regione Basilicata, pagina 9
  citazione: Sono esclusi i professionisti costituiti come impresa individuale iscritta alla Camera di Commercio
- non_modellabile: Esclusi i professionisti che hanno già usufruito di voucher analoghi o di altre azioni di formazione continua
    del PR Basilicata FESR FSE+ 2021-2027.
  fonte: Regione Basilicata, pagina 9
  citazione: e i professionisti che abbiano già usufruito di voucher analoghi a valere sul medesimo
- non_modellabile: 'Esclusi i professionisti operanti in ambito sanitario o assimilabile: manca il settore della professione.'
  fonte: Regione Basilicata, pagina 9
  citazione: Sono, inoltre, esclusi i professionisti operanti in ambito sanitario o assimilabile.
note:
- La definizione di professionista è rinviata all'Allegato E, che non è stato ricevuto.
- 'Non è chiaro se il professionista con partita IVA iscritto alla Gestione Separata si riconosca come ''autonomo'' o ''parasubordinato'':
  sono ammessi entrambi i valori.'
- Le condizioni sul percorso formativo (settori STEP o Decarbonizzazione, almeno 50 ore, enti erogatori ammessi, non avviato
  prima della domanda) riguardano il corso, non la persona.
- 'Apertura calcolata: dalle ore 9:00 del quindicesimo giorno successivo alla pubblicazione sul BURB del 07/05/2026; domande
  a sportello fino alle 18:00 del 31/12/2026 salvo esaurimento risorse.'
