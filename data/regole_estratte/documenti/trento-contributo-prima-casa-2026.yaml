id: trento-contributo-prima-casa-2026
titolo: Contributo per l'acquisto della prima casa di abitazione - 2026
ente: Provincia autonoma di Trento
link: https://www.provincia.tn.it/Servizi/Contributo-per-l-acquisto-della-prima-casa-di-abitazione-2026
apertura: '2026-11-02'
chiusura: '2027-01-13'
fonte: documento Provincia autonoma di Trento, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-19'
requisiti:
- almeno_uno_di:
  - non_modellabile: 'Essere un giovane o una giovane coppia: la pagina non dice i limiti di età o la definizione di giovane
      coppia.'
  - tutti_di:
    - campo: numero_figli
      operatore: '>='
      valore: 3
    - non_modellabile: 'I tre figli devono essere a carico: numero_figli conta tutti i figli, non solo quelli a carico.'
  fonte: Provincia autonoma di Trento, pagina web
  citazione: sei un giovane, siete una giovane coppia o siete una famiglia numerosa con almeno 3 figli a carico
- tutti_di:
  - campo: regione
    operatore: in
    valori:
    - Trentino-Alto Adige/Südtirol
  - non_modellabile: 'Residenza nella provincia di Trento: il vocabolario ha la regione e il comune di residenza, non la provincia.
      Con due richiedenti basta che sia residente uno dei due.'
  fonte: Provincia autonoma di Trento, pagina web
  citazione: sei residente in provincia di Trento
- non_modellabile: 'Indicatore ICEF del nucleo destinatario (edilizia abitativa agevolata 2026) non superiore a 0,5100: l''ICEF
    non è l''ISEE e il vocabolario non lo prevede.'
  fonte: Provincia autonoma di Trento, pagina web
  citazione: non superiore a 0,5100
- campo: proprieta_altra_abitazione
  operatore: falso
  fonte: Provincia autonoma di Trento, pagina web
  citazione: non avete la titolarità di un diritto di proprietà pieno ed esclusivo su una o più unità abitative
- non_modellabile: Fa eccezione la casa assegnata con provvedimento giudiziale a precedenti coniugi, uniti civilmente o conviventi
    di fatto, che non impedisce il contributo.
  portata: rara
  fonte: Provincia autonoma di Trento, pagina web
  citazione: di quella assegnata con provvedimento giudiziale a precedenti coniugi, uniti civilmente o conviventi di fatto
- non_modellabile: Aver sottoscritto un contratto preliminare o una proposta di acquisto, oppure aver acquistato la prima
    casa dopo il 1° gennaio 2026.
  fonte: Provincia autonoma di Trento, pagina web
  citazione: hai sottoscritto un contratto preliminare di compravendita o una proposta di acquisto oppure hai acquistato,
    successivamente al 1° gennaio 2026, la prima casa di abitazione
- non_modellabile: Non aver beneficiato di altri contributi provinciali per l'acquisto o la costruzione della prima casa nei
    10 anni precedenti la domanda.
  fonte: Provincia autonoma di Trento, pagina web
  citazione: non hai beneficiato di altri contributi provinciali per l’acquisto o la costruzione della prima casa di abitazione
note:
- 'Il requisito sulla proprietà riguarda il nucleo destinatario della prima casa, che può non coincidere con il nucleo attuale,
  e qualsiasi unità abitativa, non solo quelle adatte al nucleo: proprieta_altra_abitazione lo approssima.'
- Sono escluse dal divieto anche la casa oggetto della domanda, se già acquistata, e per le famiglie numerose la casa in cui
  risiedono.
- Il contributo è concesso in ordine cronologico fino all'esaurimento delle risorse.
