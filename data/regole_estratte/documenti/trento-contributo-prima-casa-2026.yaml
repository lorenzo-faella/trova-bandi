id: trento-contributo-prima-casa-2026
titolo: Contributo per l'acquisto della prima casa di abitazione - 2026
ente: Provincia autonoma di Trento
link: https://www.provincia.tn.it/Servizi/Contributo-per-l-acquisto-della-prima-casa-di-abitazione-2026
apertura: '2026-11-02'
chiusura: '2027-01-13'
fonte: documento Provincia autonoma di Trento, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-18'
requisiti:
- almeno_uno_di:
  - non_modellabile: 'Essere un giovane o una giovane coppia: il documento non riporta i limiti di età né la definizione di
      giovane coppia.'
  - campo: numero_figli
    operatore: '>='
    valore: 3
  fonte: Provincia autonoma di Trento, pagina web
  citazione: sei un giovane, siete una giovane coppia o siete una famiglia numerosa con almeno 3 figli a carico
- campo: regione
  operatore: in
  valori:
  - Trentino-Alto Adige
  fonte: Provincia autonoma di Trento, pagina web
  citazione: sei residente in provincia di Trento
- non_modellabile: 'Residenza nella provincia di Trento (non basta la regione): manca un campo per la provincia.'
  fonte: Provincia autonoma di Trento, pagina web
  citazione: sei residente in provincia di Trento
- non_modellabile: 'Indicatore ICEF del nucleo destinatario, edilizia abitativa agevolata 2026, non superiore a 0,5100: l''ICEF
    non è l''ISEE e non c''è un campo.'
  fonte: Provincia autonoma di Trento, pagina web
  citazione: non superiore a 0,5100
- campo: proprieta_altra_abitazione
  operatore: falso
  fonte: Provincia autonoma di Trento, pagina web
  citazione: non avete la titolarità di un diritto di proprietà pieno ed esclusivo su una o più unità abitative, ad eccezione
- non_modellabile: 'Aver sottoscritto un contratto preliminare o una proposta di acquisto, oppure aver acquistato la prima
    casa dopo il 1° gennaio 2026: manca il campo.'
  fonte: Provincia autonoma di Trento, pagina web
  citazione: hai sottoscritto un contratto preliminare di compravendita o una proposta di acquisto oppure hai acquistato,
    successivamente al 1° gennaio 2026, la prima casa di abitazione
- non_modellabile: 'Non aver beneficiato di altri contributi provinciali per l''acquisto o la costruzione della prima casa
    nei 10 anni precedenti: manca il campo.'
  fonte: Provincia autonoma di Trento, pagina web
  citazione: non hai beneficiato di altri contributi provinciali per l’acquisto o la costruzione della prima casa di abitazione
note:
- Il documento ricevuto contiene solo le sezioni A chi è rivolto e Tempi e scadenze.
- 'Con due richiedenti la residenza in provincia di Trento basta che l''abbia uno dei due: i requisiti sulla residenza, riferiti
  al richiedente, possono escludere a torto il secondo richiedente non residente.'
- 'La proprietà di altre abitazioni ha eccezioni: la casa per cui si chiede il contributo, quella assegnata dal giudice a
  un ex coniuge o convivente, e per le famiglie numerose quella in cui si risiede. Il campo proprieta_altra_abitazione chiede
  di un''altra casa adatta al nucleo, quindi non coglie tutte le eccezioni.'
- 'La famiglia numerosa richiede almeno 3 figli a carico: numero_figli conta tutti i figli, anche non a carico.'
