note:
- Assegno di cura forfettario di 15.000 euro per studenti con disabilità gravissima; le condizioni cliniche non possono essere
  autocertificate.
- L'iscrizione regolare deve risultare entro il 15/10/2026, pena esclusione.
- Non ci sono requisiti di reddito o ISEE.
- Domanda online entro le 14:00 del 21/09/2026; la data di apertura non è indicata (bando pubblicato il 10 agosto 2026).
