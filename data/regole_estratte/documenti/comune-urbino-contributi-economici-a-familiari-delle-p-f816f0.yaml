id: comune-urbino-contributi-economici-a-familiari-delle-p-f816f0
titolo: Contributi economici a familiari delle persone ospiti, o agli stessi ospiti, in strutture residenziali socio-sanitarie
  e sociali
ente: Comune di Urbino
link: https://www.comune.urbino.pu.it/novita/n/avviso/contributi-economici-a-familiari-delle-persone-ospiti-o-agli-stessi-ospiti-in-strutture-residenziali-socio-sanitarie-e-sociali-1094?cHash=1e02672098a4261b0b97859f292526b7
apertura: '2026-10-26'
chiusura: '2026-11-16'
fonte: documento Comune di Urbino, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-17'
requisiti:
- almeno_uno_di:
  - tutti_di:
    - campo: comune
      operatore: in
      valori:
      - Urbino
      - Petriano
      - Montecalvo in Foglia
      - Fermignano
      - Urbania
      - Peglio
      - Sant'Angelo in Vado
      - Borgo Pace
      - Mercatello sul Metauro
    - campo: isee
      operatore: <=
      valore: 25000
    - non_modellabile: 'Familiare che chiede il contributo: maggiorenne, residente nelle Marche dall''1/01/2026, coniuge,
        convivente di fatto o unito civilmente, oppure parente o affine di 1° o 2° grado della persona in struttura, e paga
        la retta o parte di essa.'
  - non_modellabile: 'Persona in struttura che chiede per sé: residente prima dell''ingresso in un Comune dell''ATS 4 (Marche),
      paga la retta o parte di essa senza supporto economico dei familiari, è in struttura al momento della domanda e ha un
      ISEE socio sanitario residenze non superiore a 25.000 euro.'
  fonte: Comune di Urbino, pagina 4
  citazione: 'I destinatari finali del contributo sono:'
- non_modellabile: 'La persona in struttura deve essere ospite, alla domanda, di una struttura residenziale socio-sanitaria
    o sociale autorizzata in un Comune delle Marche (aree anziani, persone con disabilità, salute mentale) e avere un ISEE
    socio-sanitario residenze non superiore a 25.000 euro: il vocabolario non descrive l''inserimento in struttura né questo
    tipo di ISEE.'
  fonte: Comune di Urbino, pagina 5
  citazione: possedere ISEE socio-sanitario residenze in corso di validità non superiore a € 25.000,00
- non_modellabile: La quota sociale della retta non deve essere già finanziata, nemmeno in parte, da altri contributi pubblici.
  fonte: Comune di Urbino, pagina 8
  citazione: riferite a spese (per la quota sociale della retta) già finanziate anche in parte con altri
note:
- La domanda (Allegato G) va consegnata agli uffici dell'ATS 4 o dell'Unione Montana oppure inviata via PEC entro il 16 novembre
  2026; la spedizione per raccomandata non è ammessa.
- Per il familiare l'ISEE richiesto è quello ordinario; per la persona in struttura è l'ISEE socio sanitario residenze, che
  il vocabolario non distingue.
- Se arrivano domande da più familiari per la stessa persona si ammette quella con ISEE più basso; se arrivano sia dal familiare
  sia dalla persona in struttura vale quella del familiare.
