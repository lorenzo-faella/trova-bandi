id: comune-urbino-contributi-economici-a-familiari-delle-p-f816f0
titolo: Contributi economici a familiari delle persone ospiti, o agli stessi ospiti, in strutture residenziali socio-sanitarie
  e sociali
ente: Comune di Urbino
link: https://www.comune.urbino.pu.it/novita/n/avviso/contributi-economici-a-familiari-delle-persone-ospiti-o-agli-stessi-ospiti-in-strutture-residenziali-socio-sanitarie-e-sociali-1094?cHash=1e02672098a4261b0b97859f292526b7
apertura: '2026-10-26'
chiusura: '2026-11-16'
fonte: documento Comune di Urbino, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-19'
requisiti:
- almeno_uno_di:
  - tutti_di:
    - campo: regione
      operatore: in
      valori:
      - Marche
      citazione: residenza in un Comune della regione Marche al l’1/01/2026 e alla data di presentazione
    - campo: comune
      operatore: in
      valori:
      - Urbino
      - Petriano
      - Montecalvo in Foglia
      - Fermignano
      - Urbania
      - Peglio
      - Sant'Angelo in Vado
      - Borgo Pace
      - Mercatello sul Metauro
      citazione: residenza in un Comune dell’ ATS 4 al momento della presentazione dell’istanza;
    - campo: eta
      operatore: '>='
      valore: 18
      citazione: maggiore età;
    - campo: isee
      operatore: <=
      valore: 25000
      citazione: validità non superiore ad euro 25.000,00.
    - non_modellabile: 'Residenza nelle Marche già all''1/01/2026; essere coniuge, convivente o unito civilmente, parente
        o affine fino al 2° grado di una persona ospite di una struttura residenziale autorizzata delle Marche (aree anziani,
        disabilità, salute mentale) con ISEE socio-sanitario residenze non superiore a 25.000 euro, e pagarne in tutto o in
        parte la retta: mancano i campi.'
  - non_modellabile: 'La persona ospite in struttura che fa domanda per sé: essere in una struttura residenziale autorizzata
      delle Marche (aree anziani, disabilità, salute mentale), essere stata residente in un comune dell''ATS 4 prima dell''ingresso,
      avere un ISEE socio-sanitario residenze non superiore a 25.000 euro e pagare la retta senza l''aiuto economico dei familiari:
      mancano i campi.'
  fonte: Comune di Urbino, pagina 4
  citazione: 'I destinatari finali del contributo sono:'
- non_modellabile: La quota sociale della retta non deve essere già finanziata, anche solo in parte, da altri contributi pubblici.
  fonte: Comune di Urbino, pagina 8
  citazione: riferite a spese (per la quota sociale della retta) già finanziate anche in parte con altri
note:
- 'Due categorie di richiedenti: il familiare che paga la retta (FPIS) oppure la stessa persona in struttura (PIS) che la
  paga senza aiuto dei familiari. Se arrivano domande sia dal familiare sia dalla PIS, è ammessa quella del familiare.'
- 'Per la PIS la residenza in un comune dell''ATS 4 conta prima dell''ingresso in struttura, quindi non coincide per forza
  con la residenza attuale: per questo non è stata espressa con il campo comune.'
- La domanda va presentata all'ATS 4 (Comune di Urbino) entro il 16 novembre 2026, a mano o via PEC; non è ammessa la raccomandata.
  La rendicontazione va consegnata entro il 22.02.2027.
