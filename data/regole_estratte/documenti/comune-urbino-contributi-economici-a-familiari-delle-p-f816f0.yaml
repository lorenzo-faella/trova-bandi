id: comune-urbino-contributi-economici-a-familiari-delle-p-f816f0
titolo: Contributi economici a familiari delle persone ospiti, o agli stessi ospiti, in strutture residenziali socio-sanitarie
  e sociali
ente: Comune di Urbino
link: https://www.comune.urbino.pu.it/novita/n/avviso/contributi-economici-a-familiari-delle-persone-ospiti-o-agli-stessi-ospiti-in-strutture-residenziali-socio-sanitarie-e-sociali-1094?cHash=1e02672098a4261b0b97859f292526b7
apertura: '2026-10-26'
chiusura: '2026-11-16'
fonte: documento Comune di Urbino, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-13'
requisiti:
- almeno_uno_di:
  - tutti_di:
    - campo: regione
      operatore: in
      valori:
      - Marche
      citazione: residenza in un Comune della regione Marche al l’1/01/2026 e alla data di presentazione
    - campo: comune
      operatore: in
      valori:
      - Urbino
      - Petriano
      - Montecalvo in Foglia
      - Fermignano
      - Urbania
      - Peglio
      - Sant'Angelo in Vado
      - Borgo Pace
      - Mercatello sul Metauro
      citazione: residenza in un Comune dell’ ATS 4 al momento della presentazione dell’istanza;
    - campo: eta
      operatore: '>='
      valore: 18
      citazione: maggiore età;
    - campo: isee
      operatore: <=
      valore: 25000
      citazione: validità non superiore ad euro 25.000,00.
    - non_modellabile: 'Essere coniuge, convivente, unito civilmente, parente o affine entro il 2° grado di una persona ospite
        di una struttura residenziale autorizzata della Regione Marche (aree anziani, disabilità, salute mentale), con ISEE
        socio-sanitario residenze non superiore a 25.000 euro, e pagarne la retta o parte di essa: mancano i campi.'
    citazione: A. Se il richiedente è il familiare della persona in struttura (FPIS), deve possedere i seguenti
  - tutti_di:
    - non_modellabile: 'Essere ospite, al momento della domanda, di una struttura residenziale autorizzata della Regione Marche
        (aree anziani, disabilità, salute mentale) e pagare la retta senza supporto economico dei familiari: mancano i campi.'
    - non_modellabile: 'ISEE socio-sanitario residenze non superiore a 25.000 euro: manca il campo.'
    - non_modellabile: 'Residenza prima dell''ingresso in struttura in un Comune dell''ATS 4 (Urbino, Petriano, Montecalvo
        in Foglia, Fermignano, Urbania, Peglio, Sant''Angelo in Vado, Borgo Pace, Mercatello sul Metauro): il profilo chiede
        solo la residenza attuale.'
    citazione: B. Se il richiedente è la persona in struttura (PIS), deve possedere i seguenti requisiti
  fonte: Comune di Urbino, pagina 4
  citazione: 'I destinatari finali del contributo sono:'
- non_modellabile: 'La quota sociale della retta non deve essere già finanziata, anche solo in parte, da altri contributi
    pubblici: manca il campo.'
  fonte: Comune di Urbino, pagina 8
  citazione: riferite a spese (per la quota sociale della retta) già finanziate anche in parte con altri
note:
- 'Due tipi di richiedente: il familiare che paga la retta (FPIS) oppure la stessa persona ospite della struttura (PIS) che
  paga senza aiuto dei familiari; se arrivano entrambe le istanze vale quella del familiare.'
- La persona in struttura può presentare la domanda anche tramite amministratore di sostegno o tutore.
- Per la PIS il testo dice in un punto 'residente in un Comune della Regione Marche prima dell'ingresso in struttura' e in
  un altro i Comuni dell'ATS 4; si è riportata la condizione più stretta.
- Rendiconto da presentare entro il 22.02.2027.
