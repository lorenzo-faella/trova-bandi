id: edisu-piemonte-contributi-straordinari-studenti-con-inv-8196fc
titolo: Contributi straordinari studenti con invalidità 46% iscritti al collocamento mirato
ente: EDISU Piemonte
link: https://www.edisu.piemonte.it/borse-e-contributi/benefici-economici/contributi-straordinari-studenti-con-invalidita-pari-o
apertura: '2026-10-28'
chiusura: '2026-11-27'
fonte: documento EDISU Piemonte, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-18'
requisiti:
- campo: percentuale_invalidita
  operatore: '>='
  valore: 46
  fonte: EDISU Piemonte, pagina 94
  citazione: Possono concorrere all’assegnazione del contributo gli studenti con invalidità civile pari o superiore al 46%
- non_modellabile: Iscrizione al collocamento mirato (legge 68/1999); attività lavorative oltre 180 giornate ne causano la
    cessazione. Manca il campo.
  fonte: EDISU Piemonte, pagina 94
  citazione: iscritti al collocamento mirato ai sensi della legge 12 marzo 1999, n. 68
- campo: iscrizione
  operatore: in
  valori:
  - universita
  - afam
  fonte: EDISU Piemonte, pagina 94
  citazione: a un corso di laurea, laurea magistrale a ciclo unico o laurea magistrale presso gli atenei ed i corsi di laurea
    indicati all’art. 1
- campo: regione_ateneo
  operatore: in
  valori:
  - Piemonte
  fonte: EDISU Piemonte, pagina 12
  citazione: Istituti di alta formazione artistica, musicale e coreutica e ISIA con sede legale in Piemonte
- non_modellabile: 'Iscrizione a tempo pieno per l''a.a. 2026/27 a laurea, laurea magistrale o laurea magistrale a ciclo unico:
    esclusi part-time, dottorati e scuole di specializzazione. Il vocabolario non distingue tipo di corso e impegno.'
  fonte: EDISU Piemonte, pagina 94
  citazione: iscritti per l’anno accademico 2026/27 a tempo
- non_modellabile: Non essersi già laureati al momento della domanda.
  fonte: EDISU Piemonte, pagina 94
  citazione: Gli studenti che si sono laureati al momento della domanda non possono chiedere il contributo.
- non_modellabile: Non aver presentato domanda di borsa di studio EDISU Piemonte per il 2026/27, oppure avervi rinunciato
    prima di chiedere il contributo.
  fonte: EDISU Piemonte, pagina web
  citazione: NON possono presentare domanda per i contributi straordinari.
- campo: isee_universitario
  operatore: <=
  valore: 26306.25
  fonte: EDISU Piemonte, pagina 20
  citazione: non può superare il limite di € 26.306,25
- campo: ispe
  operatore: <=
  valore: 57187.53
  fonte: EDISU Piemonte, pagina 20
  citazione: ≤ € 57.187,53
- almeno_uno_di:
  - campo: anno_di_corso
    operatore: <=
    valore: 1
  - non_modellabile: 'Anni successivi al primo: crediti minimi al 10 agosto 2026 secondo le tabelle dell''art. 29 per studenti
      con disabilità (allegati C e C1), per ateneo, corso e anno di immatricolazione, con possibili crediti bonus.'
  fonte: EDISU Piemonte, pagina 95
  citazione: I requisiti di merito per gli studenti anni successivi sono stabiliti
- non_modellabile: 'Altre cause di non ammissione e di esclusione dell''art. 3: titolo di studio già posseduto di livello
    pari o superiore al corso, beneficio già ottenuto per lo stesso anno di corso, altra borsa analoga, revoche o decadenze
    precedenti, pendenze economiche con EDISU, congelamento della carriera.'
  fonte: EDISU Piemonte, pagina 94
  citazione: ammissione ed esclusione si rimanda all’art. 3 del presente Bando.
note:
- La domanda si presenta dal 28 ottobre al 27 novembre 2026 alle ore 12.
- Chi non è ancora iscritto al collocamento mirato al momento della domanda viene escluso nella graduatoria provvisoria, ma
  può iscriversi entro il 2 aprile 2027 e documentarlo con reclamo.
- 'I requisiti di reddito rimandano all''art. 6 del bando di borsa di studio: le soglie valgono anche per l''ISEE Parificato
  e l''ISPEUP degli studenti con famiglia all''estero.'
- Il documento allegato è lo stesso bando della borsa di studio EDISU 2026/27; per il contributo valgono la Sezione X (artt.
  36-42) e i rimandi agli artt. 1, 3, 6 e 29. Chi ha una borsa EDISU 2026/27 deve rinunciarvi online, aprire un ticket e,
  se ospite di una residenza EDISU, lasciare il posto letto pagando il periodo fruito.
