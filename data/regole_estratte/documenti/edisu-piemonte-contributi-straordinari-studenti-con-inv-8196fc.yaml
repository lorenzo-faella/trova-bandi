  fonte: EDISU Piemonte, pagina web
  citazione: NON possono presentare domanda per i contributi straordinari
- non_modellabile: Non essersi già laureati al momento della domanda e non rientrare nelle altre cause di non ammissione ed
    esclusione dell'art. 3 (borse analoghe, revoche o decadenze passate, pendenze con EDISU, corsi singoli, anno di corso
    già coperto da borsa).
  fonte: EDISU Piemonte, pagina 94
  citazione: Gli studenti che si sono laureati al momento della domanda non possono chiedere il contributo.
note:
- 'Il bando parla solo di corsi di laurea, laurea magistrale e ciclo unico: gli iscritti ai corsi AFAM, che l''art. 1 conta
  tra gli Atenei, sono esclusi da questa regola; se l''ente li ammette, va allargato livello_corso.'
- Chi non è ancora iscritto al collocamento mirato al momento della domanda risulta escluso in graduatoria provvisoria ma
  può iscriversi entro il 2 aprile 2027 e allegarlo al reclamo.
- La soglia di invalidità del 46% è quella del contributo; la soglia del 66% dell'art. 29 serve solo a definire lo studente
  con disabilità per la borsa.
- La domanda si chiude il 27 novembre 2026 alle ore 12.
- 'Il rimando a passaggi e trasferimenti (artt. 9 e 14) e alle tabelle di merito C e C1 non è modellabile: le tabelle sono
  per codice di corso.'
