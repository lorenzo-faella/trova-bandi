id: edisu-piemonte-contributi-straordinari-studenti-con-inv-8196fc
titolo: Contributi straordinari studenti con invalidità 46% iscritti al collocamento mirato
ente: EDISU Piemonte
link: https://www.edisu.piemonte.it/borse-e-contributi/benefici-economici/contributi-straordinari-studenti-con-invalidita-pari-o
apertura: '2026-10-28'
chiusura: '2026-11-27'
fonte: documento EDISU Piemonte, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-17'
requisiti:
- tutti_di:
  - campo: disabile
    operatore: vero
  - campo: percentuale_invalidita
    operatore: '>='
    valore: 46
  fonte: EDISU Piemonte, pagina 94
  citazione: gli studenti con invalidità civile pari o superiore al 46%
- non_modellabile: Iscrizione al collocamento mirato (legge 68/1999); attività lavorative oltre 180 giornate ne fanno cessare
    l'iscrizione. Chi non è ancora iscritto può iscriversi entro il 2 aprile 2027 e documentarlo con reclamo.
  fonte: EDISU Piemonte, pagina 94
  citazione: iscritti al collocamento mirato ai sensi della legge 12 marzo 1999, n. 68
- tutti_di:
  - campo: iscrizione
    operatore: in
    valori:
    - universita
    - afam
  - non_modellabile: 'Iscrizione per l''a.a. 2026/27 a tempo pieno a un corso di laurea, laurea magistrale a ciclo unico o
      laurea magistrale di uno degli atenei piemontesi indicati all''art. 1: mancano i campi su tempo pieno, livello del corso
      e sede dell''ateneo.'
  fonte: EDISU Piemonte, pagina 94
  citazione: pieno a un corso di laurea, laurea magistrale a ciclo unico o laurea magistrale presso gli atenei ed i corsi
    di laurea indicati all’art. 1
- non_modellabile: Non essersi già laureati nel corso frequentato al momento della domanda.
  fonte: EDISU Piemonte, pagina 94
  citazione: Gli studenti che si sono laureati al momento della domanda non possono chiedere il contributo.
- campo: isee_universitario
  operatore: <=
  valore: 26306.25
  fonte: EDISU Piemonte, pagina 20
  citazione: non può superare il limite di € 26.306,25
- campo: ispe
  operatore: <=
  valore: 57187.53
  fonte: EDISU Piemonte, pagina 20
  citazione: ≤ € 57.187,53
- almeno_uno_di:
  - campo: anno_di_corso
    operatore: <=
    valore: 1
  - non_modellabile: 'Per gli anni successivi al primo: crediti minimi conseguiti entro il 10 agosto 2026 secondo le tabelle
      per studenti con disabilità (art. 29, allegati C e C1), diverse per corso, ateneo e anno di prima immatricolazione,
      con possibile uso dei crediti bonus.'
  fonte: EDISU Piemonte, pagina 95
  citazione: I requisiti di merito per gli studenti anni successivi sono stabiliti
- non_modellabile: 'Condizioni di non ammissione ed esclusione dell''art. 3: non avere già un titolo di livello pari o superiore
    al corso frequentato, non aver già avuto la borsa per lo stesso anno di corso, non essere iscritti a corsi singoli, non
    beneficiare di altra borsa analoga, non avere revoche, decadenze o pendenze economiche verso EDISU.'
  fonte: EDISU Piemonte, pagina 94
  citazione: ammissione ed esclusione si rimanda all’art. 3 del presente Bando.
note:
- 'Chi ha presentato domanda di borsa di studio EDISU 2026/27 non può chiedere il contributo, a meno di rinunciare prima alla
  borsa (e, se ospite di una residenza EDISU, al posto letto): è una regola di incompatibilità, riportata qui e non come requisito.'
- 'Il bando rimanda per il merito all''art. 29, scritto per gli studenti con invalidità pari o superiore al 66%: si assume
  che valgano le stesse tabelle C e C1; per il primo anno non è indicato alcun requisito di merito di accesso.'
- Le soglie economiche sono quelle dell'art. 6 (ISEE Universitario o ISEE Parificato per famiglie residenti all'estero); la
  tabella delle date di pubblicazione delle graduatorie (art. 42) non è nel testo ricevuto.
- Domanda dal 28 ottobre al 27 novembre 2026 ore 12, sullo Sportello online alla voce "CONTRIBUTI DISABILI 46%", allegando
  la certificazione di invalidità e l'iscrizione al collocamento mirato.
