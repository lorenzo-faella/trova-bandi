note:
- 'La domanda di finanziamento la presentano solo gli Enti locali valdostani (Unités des Communes e Comuni); le persone over
  58 sono i destinatari finali e vengono scelte con una selezione pubblica dell''ente. Apertura e chiusura indicate sono quelle
  delle finestre per gli enti (I: dal giorno dopo la pubblicazione al 16/11/2026; II: 15-31/03/2027; III: 15-30/09/2027),
  non termini per le persone.'
- I requisiti dei destinatari valgono al momento dell'avvio delle attività; la residenza deve essere continuativa nei 12 mesi
  precedenti, mentre il campo anni_residenza_regione non distingue la continuità.
- Possono partecipare anche i percettori dell'Assegno di inclusione con gli stessi requisiti.
- 'Chi matura i requisiti pensionistici durante il progetto cessa l''attività: è una condizione di perdita, non di accesso.'
