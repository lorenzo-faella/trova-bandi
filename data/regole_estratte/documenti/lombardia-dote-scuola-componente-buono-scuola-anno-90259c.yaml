note:
- 'I beneficiari sono gli studenti, ma per i minori la domanda la fa la famiglia: il requisito di residenza in Lombardia è
  scritto sul richiedente e si suppone che il nucleo risieda insieme.'
- 'I dettagli sono rinviati all''Avviso (Allegato A), che non è nel testo ricevuto: potrebbero esserci altri requisiti (per
  esempio sull''età o sul tipo di corso) che qui mancano.'
- Domande solo online su Bandi e Servizi con SPID, CIE o CNS/CRS, dalle 12.00 del 3 novembre 2026 alle 12.00 del 10 dicembre
  2026; procedura a sportello.
