note:
- 'La misura è complementare al Programma GOL e si rivolge a chi ne è escluso: per i disoccupati servono tutti insieme i requisiti
  elencati (30-54 anni, uomo, in cerca da meno di 180 giorni, senza ammortizzatori né RdC, senza presa in carico dei servizi
  sociali).'
- La frase sulle persone con disabilità iscritte al collocamento mirato ('senza limiti di età o di tempo di disoccupazione')
  è letta come una via di accesso alternativa; non è chiaro se valgano per loro gli altri requisiti (residenza in Lombardia,
  stato di disoccupazione).
- Il documento indica solo la scadenza prorogata per le domande (ore 12 del 31/12/2026); la data di apertura delle domande
  non è indicata, l'avviso è pubblicato dal 02/05/2023.
- Gli occupati sospesi non devono rilasciare la DID né sottoscrivere il PSP; la presa in carico avviene presso CPI e operatori
  accreditati.
