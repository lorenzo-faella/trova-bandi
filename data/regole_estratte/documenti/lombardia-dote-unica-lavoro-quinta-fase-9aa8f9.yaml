id: lombardia-dote-unica-lavoro-quinta-fase-9aa8f9
titolo: Dote Unica Lavoro - Quinta fase
ente: Regione Lombardia
link: https://www.bandi.regione.lombardia.it/servizi/servizio/catalogo/dettaglio/istruzione-formazione-lavoro/lavoro-occupazione/dote-unica-lavoro-quinta-fase-RLW12023031023
apertura: '2023-05-02'
chiusura: '2026-12-31'
fonte: documento Regione Lombardia, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti:
- almeno_uno_di:
  - tutti_di:
    - campo: condizione_lavorativa
      operatore: in
      valori:
      - occupato
      citazione: percettori di indennità di integrazione salariale in costanza di rapporto di lavoro
    - non_modellabile: Lavoratore sospeso di un'unità produttiva o operativa in Lombardia che percepisce CIGS, oppure assegno
        di integrazione salariale o di solidarietà per causali straordinarie dei FIS o dei Fondi di solidarietà; esclusi i
        percettori di CIGO. Mancano i campi.
      citazione: Sono esclusi i percettori di cassa integrazione guadagni ordinaria (CIGO).
  - tutti_di:
    - campo: disabile
      operatore: vero
    - non_modellabile: 'Iscrizione al collocamento mirato (L. 68/99): manca il campo.'
    citazione: Le persone con disabilità, iscritte al collocamento mirato di cui alla L. 68/99
  fonte: Regione Lombardia, pagina web
  citazione: Occupati sospesi, ossia i lavoratori riferiti a unità produttive e/o operative ubicate in Lombardia
- non_modellabile: 'Essere esclusi dal Programma GOL (Garanzia di Occupabilità dei Lavoratori): manca il campo.'
  fonte: Regione Lombardia, pagina web
  citazione: si rivolge a coloro che risultano esclusi dal Programma
note:
- 'Per gli occupati sospesi conta la sede in Lombardia dell''unità produttiva, non la residenza: per questo non ho messo `regione`.
  Per le persone con disabilità la pagina non indica un requisito di residenza.'
- Ho letto le persone con disabilità iscritte al collocamento mirato come un secondo gruppo di destinatari, alternativo agli
  occupati sospesi; la pagina dice solo che possono accedere "senza limiti di età o di tempo di disoccupazione".
- Come apertura ho usato la data di pubblicazione (02/05/2023); la chiusura è la proroga al 31/12/2026, ore 12.
