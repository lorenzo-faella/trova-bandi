requisiti:
- campo: disabile
  operatore: vero
  fonte: Regione Lombardia, pagina 14
  citazione: Costituiscono destinatari dell'intervento le persone con disabilità ai sensi dell'art. 1 della L. 68/1999,
- almeno_uno_di:
  - tutti_di:
    - campo: condizione_lavorativa
      operatore: interseca
      valori:
      - disoccupato
      citazione: che risultino disoccupate ai sensi dell'art. 19 del D.Lgs. 150/2015
    - non_modellabile: 'Dote Inserimento: iscrizione negli elenchi del Collocamento Mirato (art. 8 L. 68/1999) della Provincia
        di Bergamo, con DID rilasciata. Mancano i campi per l''iscrizione e per la provincia.'
      citazione: il destinatario deve essere iscritto nelle liste della Provincia di Bergamo
  - tutti_di:
    - campo: condizione_lavorativa
      operatore: interseca
      valori:
      - occupato
    - campo: eta
      operatore: '>='
      valore: 16
      citazione: Lavoratori occupati ai sensi della L.68/99, dai 16 anni compiuti
    - non_modellabile: 'Dote Mantenimento: occupato ai sensi della L. 68/1999 in una sede operativa in provincia di Bergamo
        (anche sospeso in CIGS o con fondi di solidarietà), con una delle condizioni specifiche (aggravamento della salute,
        richiesta motivata di azienda o lavoratore, riorganizzazione aziendale, assunzione dopo una dote precedente, assunzione
        recente) e nelle casistiche del paragrafo 1.2, che non è disponibile.'
      citazione: subordinato al verificarsi di specifiche condizioni
  fonte: Regione Lombardia, pagina 14
  citazione: Rientrano altresì nella platea dei destinatari i lavoratori con disabilità occupati in
note:
- 'La domanda di dote non la presenta la persona: la trasmette il soggetto esecutore (CPI/Collocamento Mirato della Provincia
  di Bergamo o operatore accreditato del Catalogo Unico Regionale) con la DRU su Bandi e Servizi. I requisiti estratti sono
  quelli del destinatario.'
- 'L''avviso ha due doti: Dote Inserimento per i disoccupati iscritti al Collocamento Mirato della Provincia di Bergamo, e
  Dote Mantenimento per gli occupati ai sensi della L. 68/1999. Sono scritte come alternative.'
- 'Dote Mantenimento: la sezione destinatari parla di sedi operative "sul territorio della Provincia di Bergamo", mentre la
  scheda informativa (pagina 57) e la tabella dei requisiti parlano di imprese con sede legale o operativa "nella Regione
  Lombardia". Si è seguita la sezione destinatari, nel non_modellabile.'
- 'Il paragrafo 1.2 della Dote Mantenimento, a cui rimandano i requisiti di accesso, non è tra le sezioni ricevute: è coperto
  dal non_modellabile.'
- 'Non si controlla la percentuale di invalidità o la categoria prevista dall''art. 1 della L. 68/1999: il documento non la
  indica. Il vincolo provinciale (iscrizione alle liste di Bergamo, sede di lavoro in provincia) è un non_modellabile, perché
  il vocabolario non ha un campo per la provincia; non è stato aggiunto un filtro di residenza, perché il documento non lo
  pone in modo esplicito.'
- Assegnazione a sportello in ordine cronologico fino a esaurimento delle risorse (Dote Inserimento 877.533,00 euro, Dote
  Mantenimento 470.902,26 euro); durata massima della dote 12 mesi.
