id: lombardia-dote-unica-lavoro-persone-con-disabilita-bdd558
titolo: Dote Unica Lavoro Persone con Disabilità - Prov. Bergamo
ente: Regione Lombardia
link: https://www.bandi.regione.lombardia.it/servizi/servizio/catalogo/dettaglio/istruzione-formazione-lavoro/lavoro-occupazione/dote-unica-lavoro-persone-disabilit-prov-bergamo-PR_BG_42025049902
apertura: '2025-12-17'
chiusura: '2027-02-26'
fonte: documento Regione Lombardia, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
