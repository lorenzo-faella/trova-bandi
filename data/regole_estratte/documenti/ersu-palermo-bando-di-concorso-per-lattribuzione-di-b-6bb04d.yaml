note:
- La domanda si compila online dalle 9:00 del 5 giugno 2026 alle 14:00 del 22 luglio 2026 (e chi non usa SPID o CIE la convalida
  con codice OTP entro la stessa scadenza). Il documento va regolarizzato entro il 10 settembre 2026; gli studenti internazionali
  caricano ISEE parificato e permesso di soggiorno entro il 30 novembre 2026.
- 'La pagina web indica le soglie ISEE/ISPE come "2025/2026", ma l''art. 8 del bando le riferisce all''a.a. 2026/2027: si
  sono usate quelle del bando.'
- 'La cittadinanza non limita l''accesso: gli studenti internazionali presentano l''ISEE parificato. Ci sono borse riservate
  (persone con disabilità, Paesi particolarmente poveri e rifugiati, orfani di vittime del lavoro o di mafia, vittime dell''usura,
  figli di emigrati siciliani, residenti nelle isole minori, orfani ospiti di strutture), ma riguardano la distribuzione delle
  borse e non l''accesso.'
- 'Al primo anno il merito si valuta dopo, al saldo (tabelle 2 e 3 in appendice, non ricevute): è una condizione di revoca,
  non di accesso.'
- Chi è moroso per benefici revocati in passato può partecipare, ma resta sospeso e perde i benefici se non restituisce le
  somme entro il 15 aprile 2027.
- 'La borsa è incompatibile con altre borse per lo stesso anno e con le collaborazioni part-time o di tutorato, ma è previsto
  un conguaglio: lo si è lasciato fuori perché è una regola di cumulo.'
- I laureandi che contano di laurearsi entro la sessione straordinaria 2025/2026 possono partecipare con riserva come iscritti
  al 1° anno fuori corso.
