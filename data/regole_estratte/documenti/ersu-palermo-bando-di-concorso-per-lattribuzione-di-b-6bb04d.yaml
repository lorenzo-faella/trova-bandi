note:
- 'Le soglie di crediti per gli studenti senza disabilità (tabelle 4.1 e 4.2) non sono nel testo ricevuto: per loro, dal secondo
  anno, il merito resta da verificare. Per gli studenti con disabilità o DSA abbiamo usato la tabella 4.3 (soglie ridotte
  del 40%), che vale per i corsi con 60 CFU l''anno. Per i corsi con una distribuzione diversa dei crediti le soglie sono
  riproporzionate.'
- 'La tabella 4.3 è indicizzata per anno di immatricolazione: anno_di_corso va letto come anno contato dalla prima immatricolazione
  o reimmatricolazione (2025/26 = 2° anno). Ai corsi AFAM abbiamo applicato le soglie delle lauree corrispondenti, perché
  il bando li tratta come corsi di laurea.'
- 'Primo anno: per l''accesso basta il diploma di scuola superiore. I crediti (15 entro il 10/08/2027 e 20 entro il 30/11/2027;
  9 e 12 per gli studenti con disabilità) servono solo a mantenere la borsa. Specializzazione e dottorato: vale il merito
  previsto dagli ordinamenti.'
- 'Istituzioni ammesse: Università di Palermo (tutte le sedi), LUMSA sede di Palermo, UniCamillus sede di Cefalù, SSML CIELS
  Palermo, Accademia di Belle Arti di Palermo e i quattro Conservatori elencati. Per le università usiamo le province delle
  sedi (Palermo, Trapani, Agrigento, Caltanissetta), senza poter escludere altri atenei con sede in quelle province.'
- Per la laurea magistrale è ammesso anche il titolo 'diploma' perché il bando ammette i laureandi triennali iscritti con
  riserva. I laureati triennali iscritti a un ciclo unico sono esclusi nei primi tre anni e possono accedere dal quarto.
- I corsi AFAM devono prevedere l'accesso solo con il diploma di scuola superiore. Il corso propedeutico (ex semestre filtro)
  di Medicina, Odontoiatria e Veterinaria sarà regolato da un addendum.
- 'Le borse ERSU sono incompatibili con altre borse e con le collaborazioni part-time dello stesso anno, ma è previsto un
  conguaglio: non è un requisito di accesso. Gli studenti morosi per revoche precedenti partecipano ma restano sospesi fino
  alla restituzione entro il 15/04/2027.'
- Le esclusioni per motivi di procedura (validazione OTP, regolarizzazione dei documenti entro il 10/09/2026, ISEE con omissioni
  non sanato) non sono modellate come requisiti.
