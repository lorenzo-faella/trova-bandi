note:
- Bando ERSU Palermo a.a. 2026/2027 per borse di studio, servizio abitativo e ristorazione; le regole riguardano la borsa
  di studio.
- Domanda online dalle ore 9 del 5 giugno 2026 alle ore 14 del 22 luglio 2026; regolarizzazione e rettifiche entro il 10 settembre
  2026, studenti internazionali entro il 30 novembre 2026.
- Serve un'attestazione ISEE per il diritto allo studio universitario valida e senza difformità; gli studenti internazionali
  presentano l'ISEEU/ISPEU parificato.
- Possono partecipare anche i laureandi che contano di laurearsi entro la sessione straordinaria 2025/2026, con benefici assegnati
  con riserva.
- La tabella delle durate (art. 7) e le tabelle di merito in appendice non sono nel testo fornito.
- 'Le borse ERSU sono incompatibili con altre borse e con le collaborazioni part-time dello stesso anno, ma con diritto al
  conguaglio: regola di cumulo, non modellata.'
- Gli studenti morosi possono partecipare ma restano sospesi finché non restituiscono le somme dovute.
