note:
- La domanda all'IRFIS la presenta l'OCC per conto del debitore; la procedura è a sportello fino a esaurimento delle risorse,
  senza date di apertura e chiusura indicate.
- 'Il deposito della domanda in Tribunale entro 180 giorni e l''ottenimento del decreto di ammissione (o della sentenza di
  apertura della liquidazione o del decreto di esdebitazione) sono condizioni di validità e di erogazione successive alla
  richiesta: non sono state modellate come requisiti di partenza.'
- I requisiti dell'OCC (iscrizione al registro, almeno 8 gestori residenti in Sicilia, polizza assicurativa) riguardano l'organismo,
  non il debitore.
- 'Il limite de minimis vale ''ove applicabile'' e riguarda il cumulo con altre agevolazioni: non modellato.'
