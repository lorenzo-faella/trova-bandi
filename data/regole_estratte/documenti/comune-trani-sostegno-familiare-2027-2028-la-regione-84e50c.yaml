note:
- 'Ricevute solo le sezioni 10 e 11: i requisiti di accesso del punto 2 dell''Avviso mancano e restano da verificare.'
- 'La residenza in Puglia non è scritta nelle sezioni ricevute: è ricavata dal fatto che l''avviso è della Regione Puglia
  e che le istanze sono istruite dall''Ambito Territoriale di residenza della persona; da confermare sul punto 2.'
- Età, disabilità e ISEE vanno riferiti alla persona in condizione di gravissima disabilità (il soggetto destinatario), anche
  se la domanda la presenta il referente familiare o un delegato.
- Per gli adulti vale l'ISEE socio-sanitario con nucleo ristretto o l'ISEE ordinario, se più favorevole; per i minorenni (solo
  Sezione A) l'ISEE minorenni.
- Sono escluse anche le domande di persone decedute prima della valutazione del medico del distretto e dell'UVM.
- Domande dalle 12.00 del 17.11.2026 alle 12.00 del 17.12.2026, solo online su bandi.pugliasociale.regione.puglia.it con SPID
  livello 2, CIE o CNS intestate al destinatario o al referente familiare (o tramite delegato); va allegata la dichiarazione
  sostitutiva e l'atto di impegno del caregiver. Annullamento possibile fino alle 11.00 del 17.12.2026.
