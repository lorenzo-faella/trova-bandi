note:
- Beneficiari sono gli studenti; la domanda la presenta di solito la famiglia. La residenza a Teramo è richiesta sia agli
  studenti sia ai richiedenti, e qui è controllata su chi risponde.
- ISEE in corso di validità al 31/12/2026; per le domande presentate dal 01/01/2027 vale anche un ISEE valido al 31/12/2027.
- 'La dichiarazione di non aver usufruito di altri contributi pubblici per i libri è richiesta per la domanda: trattata come
  requisito non modellabile.'
- Domanda solo online sulla piattaforma Planet School entro le 23:59 del 31/01/2027, con IBAN intestato o cointestato e fatture/scontrini
