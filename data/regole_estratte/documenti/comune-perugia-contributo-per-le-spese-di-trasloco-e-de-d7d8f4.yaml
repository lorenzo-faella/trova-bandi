id: comune-perugia-contributo-per-le-spese-di-trasloco-e-de-d7d8f4
titolo: Contributo per le spese di trasloco e deposito temporaneo – Sisma alta Umbria 2023
ente: Comune di Perugia
link: https://www.comune.perugia.it/novita/contributo-per-le-spese-di-trasloco-e-deposito-temporaneo-sisma-alta-umbria-2023/
apertura: null
chiusura: null
fonte: documento Comune di Perugia, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-13'
requisiti:
- non_modellabile: 'Essere proprietario, usufruttuario, conduttore, comodatario o assegnatario (o titolare di diritto reale
    di godimento) di un''abitazione principale sgomberata per gli eventi sismici 2023 dell''alta Umbria, con inagibilità totale
    da scheda AeDES esito E, oppure esito B o C con autorizzazione alla progettazione del miglioramento sismico o inclusione
    in aggregati edilizi: mancano i campi.'
  fonte: Comune di Perugia, pagina web
  citazione: Il contributo è concesso ai proprietari, usufruttuari, conduttori, comodatari o assegnatari
note:
- Il contributo rimborsa le spese di trasloco e deposito temporaneo effettivamente sostenute e documentate (Ordinanza commissariale
  n. 21/2017, max 5.000 euro per nucleo); il Comune allega il provvedimento di sgombero totale e il certificato di residenza.
- La pagina non indica un termine per la domanda né lo dice esplicitamente riservato ai residenti a Perugia. Esiste un modello
  di domanda per gli eredi.
- Domanda via PEC, raccomandata A/R o a mano all'U.O. Ambiente e Protezione Civile.
