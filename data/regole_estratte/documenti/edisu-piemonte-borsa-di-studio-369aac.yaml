- almeno_uno_di:
  - campo: anno_di_corso
    operatore: <=
    valore: 1
  - non_modellabile: 'Per gli anni successivi al primo di laurea, magistrale e ciclo unico: crediti minimi conseguiti entro
      il 10 agosto 2026, secondo tabelle che cambiano per ateneo, corso, anno di immatricolazione, tempo pieno o parziale
      e disabilità (allegati A1, A2, B, C, C1). Per dottorati e specializzazioni basta l''ammissione all''anno.'
  fonte: EDISU Piemonte, pagina 53
  citazione: Tali requisiti consistono nel conseguimento entro il 10 agosto 2026 del numero di crediti indicato
note:
- 'Domande: dal 22 luglio al 4 settembre 2026 ore 12 per laurea, laurea magistrale e ciclo unico; dal 28 ottobre al 27 novembre
  2026 ore 12 per dottorati e scuole di specializzazione. Apertura e chiusura riportano la finestra complessiva.'
- 'Per i primi anni il merito non è richiesto all''accesso: servono 20 crediti (11 se part-time) entro il 10 agosto 2027 per
  la seconda rata, e almeno 20 entro il 30 novembre 2027 per non dover restituire la prima. Sono condizioni di mantenimento,
  non di accesso.'
- La borsa non è compatibile con il contributo per studenti con invalidità pari o superiore al 46% iscritti al collocamento
  mirato (Sezione X).
- Gli studenti del semestre filtro di Medicina, Odontoiatria e Veterinaria fanno domanda all'ente del diritto allo studio
  dell'ateneo dove frequentano il semestre filtro.
- Lo status di studente indipendente (residenza fuori dalla famiglia da due anni e reddito di almeno 9.000 euro nel 2024 e
  nel 2025) cambia solo il nucleo ISEE, non l'idoneità.
- Il contratto di alloggio a titolo oneroso serve solo per l'importo da fuori sede, non per avere la borsa.
- Esclusi gli iscritti a Double Degree o Erasmus Mundus con prima iscrizione in un ateneo estero, e gli iscritti EAP/EISD/SELECT
  già vincitori di borse analoghe.
- 'L''assegnazione dipende dalla graduatoria e dai fondi disponibili: chi ha i requisiti può risultare idoneo non vincitore.'
