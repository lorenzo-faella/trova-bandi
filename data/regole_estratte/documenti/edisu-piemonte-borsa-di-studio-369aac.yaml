  citazione: a condizione di non essere risultati vincitori di
note:
- 'Scadenze diverse per tipo di corso: laurea, laurea magistrale e ciclo unico dal 22 luglio al 4 settembre 2026 ore 12; dottorati
  e scuole di specializzazione dal 28 ottobre al 27 novembre 2026 ore 12. Come chiusura è indicata la data più tarda: per
  i corsi di laurea la domanda è già chiusa dal 4 settembre.'
- 'Per gli studenti del primo anno il merito (20 crediti, 11 se part-time) serve per la seconda rata e per mantenere la prima:
  non è un requisito di accesso. Gli studenti con disabilità hanno tabelle di merito ridotte (art. 29).'
- Per dottorati e specializzazioni l'ISEE è l'ISEE Dottorato o nucleo ristretto, con le stesse soglie di ISEE e ISPE; con
  famiglia residente all'estero vale l'ISEE Parificato calcolato da EDISU sulla documentazione consolare (artt. 30-31).
- La borsa non è compatibile con il contributo per studenti con invalidità pari o superiore al 46% iscritti al collocamento
  mirato (Sezione X).
- Gli studenti che frequentano il semestre filtro di Medicina, Odontoiatria e Veterinaria seguono regole e finestre proprie
  (art. 9 comma 3); chi si laurea entro settembre 2026 non può chiedere la borsa per il semestre aggiuntivo.
- 'La tabella delle durate dei benefici (art. 2 e art. 29 comma 1) non è nel testo ricevuto: il limite di anni per cui si
  può chiedere la borsa non è verificato.'
- Il servizio abitativo richiede inoltre la condizione di fuori sede (art. 4), che qui non si valuta perché riguarda il posto
  letto e l'importo, non il diritto alla borsa.
