id: edisu-piemonte-borsa-di-studio-369aac
titolo: Borsa di studio
ente: EDISU Piemonte
link: https://www.edisu.piemonte.it/borse-e-contributi/benefici-economici/borsa-di-studio
apertura: '2026-07-22'
chiusura: '2026-11-27'
fonte: documento EDISU Piemonte, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-18'
requisiti:
- campo: iscrizione
  operatore: in
  valori:
  - universita
  - afam
  fonte: EDISU Piemonte, pagina 12
  citazione: Possono concorrere per l’assegnazione dei benefici gli studenti iscritti ad Atenei Piemontesi
- campo: regione_ateneo
  operatore: in
  valori:
  - Piemonte
  fonte: EDISU Piemonte, pagina 12
  citazione: Istituti di alta formazione artistica, musicale e coreutica e ISIA con sede legale in Piemonte
- non_modellabile: 'Tipo di corso: laurea, laurea magistrale, laurea magistrale a ciclo unico, diploma accademico AFAM, dottorato
    di ricerca senza borsa di dottorato, scuola di specializzazione almeno biennale non di area medica (D.Lgs. 368/1999);
    esclusi corsi singoli e corsi di Conservatorio che non richiedono il diploma. Il vocabolario non distingue il tipo di
    corso.'
  fonte: EDISU Piemonte, pagina 11
  citazione: corsi di dottorato di ricerca (D.lgs. 210/98) che non beneficino della borsa di studio
- non_modellabile: Solo prima iscrizione a ciascun livello di corso ed entro le durate dell'art. 2, calcolate dall'anno di
    prima immatricolazione; la tabella delle durate non è nel testo ricevuto.
  fonte: EDISU Piemonte, pagina 13
  citazione: I benefici possono essere richiesti per la prima iscrizione ad ogni livello di corso secondo le seguenti durate
- campo: isee_universitario
  operatore: <=
  valore: 26306.25
  fonte: EDISU Piemonte, pagina 20
  citazione: non può superare il limite di € 26.306,25
- campo: ispe
  operatore: <=
  valore: 57187.53
  fonte: EDISU Piemonte, pagina 20
  citazione: ≤ € 57.187,53
- almeno_uno_di:
  - campo: anno_di_corso
    operatore: <=
    valore: 1
  - non_modellabile: 'Anni successivi al primo di laurea, laurea magistrale e ciclo unico: numero minimo di crediti al 10
      agosto 2026 secondo le tabelle per ateneo, corso, anno di immatricolazione e tipo di iscrizione (tabelle A1, A2, B;
      C e C1 per studenti con disabilità), con possibili crediti bonus. Per i dottorati e le scuole di specializzazione degli
      anni successivi basta l''ammissione all''anno.'
  fonte: EDISU Piemonte, pagina 53
  citazione: Tali requisiti consistono nel conseguimento entro il 10 agosto 2026 del numero di crediti indicato
- non_modellabile: 'Cause di non ammissione e di esclusione dell''art. 3: titolo di studio già posseduto di livello pari o
    superiore al corso, borsa già ottenuta per lo stesso anno di corso, altra borsa analoga, revoche o decadenze precedenti,
    pendenze economiche con EDISU, Double Degree o Erasmus Mundus con prima iscrizione presso ateneo estero, congelamento
    della carriera nel 2026/27.'
  fonte: EDISU Piemonte, pagina 13
  citazione: 'I seguenti casi costituiscono cause di non ammissione ai benefici:'
note:
- 'Due finestre di domanda: corsi di laurea, laurea magistrale e ciclo unico dal 22 luglio al 4 settembre 2026 ore 12 (già
  chiusa); dottorati e scuole di specializzazione dal 28 ottobre al 27 novembre 2026 ore 12. Per gli studenti del semestre
  filtro di Medicina, Odontoiatria e Veterinaria è prevista una finestra straordinaria dal 6 febbraio al 6 marzo 2027.'
- La soglia ISEE vale anche per l'ISEE Parificato (studenti con famiglia all'estero) e per l'ISEE Dottorato/nucleo ristretto;
  la soglia ISPE vale anche per l'ISPEUP. L'ISEE universitario deve essere sottoscritto dal 1° gennaio 2026.
- 'Primi anni: i 20 crediti (11 part-time) entro il 10 agosto 2027 o il 30 novembre 2027 servono a ricevere la seconda rata
  o a non perdere la borsa, non all''accesso; per gli studenti con disabilità non si applicano.'
- 'Chi ha fatto un passaggio di corso o un trasferimento deve fare domanda come anno successivo anche se iscritto al primo
  anno: la condizione anno_di_corso <= 1 non lo coglie.'
- Il servizio abitativo è riservato agli studenti fuori sede e non ai dottorandi; l'importo dipende dalla tipologia in sede,
  pendolare o fuori sede. La borsa non è compatibile con il contributo per studenti con invalidità dal 46% (Sezione X).
