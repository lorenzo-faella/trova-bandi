note:
- 'Le finestre di domanda sono due: corsi di laurea, laurea magistrale e ciclo unico dal 22 luglio al 4 settembre 2026 ore
  12; dottorati e scuole di specializzazione dal 28 ottobre al 27 novembre 2026 ore 12. Apertura e chiusura riportano la finestra
  complessiva: per gli iscritti a laurea, magistrale e ciclo unico la domanda è chiusa dal 4 settembre 2026.'
- Per gli studenti del semestre filtro di Medicina, Odontoiatria e Veterinaria è prevista una finestra straordinaria dal 6
  febbraio al 6 marzo 2027 (art. 9 comma 3.2).
- 'I crediti richiesti al primo anno (20 entro il 10 agosto 2027) servono per la seconda rata e per mantenere la prima: sono
  condizioni di mantenimento, non di accesso.'
- 'La tabella delle durate dei benefici (art. 2 e art. 29 comma 1) non è nel testo ricevuto: fuori corso e ripetenti restano
  da verificare dentro il requisito generale.'
- Gli iscritti a Double Degree o Erasmus Mundus con prima iscrizione presso un ateneo estero non possono fare domanda; EAP,
  EISD e SELECT possono, se non hanno vinto borse analoghe.
- La condizione di fuori sede, in sede o pendolare e l'alloggio a titolo oneroso cambiano solo l'importo, non il diritto alla
  borsa.
- La borsa non è compatibile con il contributo per gli studenti con invalidità dal 46% iscritti al collocamento mirato (Sezione
  X).
- Per dottorati e specializzazioni la soglia si applica all'ISEE Dottorato o Nucleo Ristretto; per chi ha la famiglia all'estero
  all'ISEE Parificato calcolato da EDISU.
