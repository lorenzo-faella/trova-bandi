note:
- 'L''ISEE non decide l''accesso ma la tariffa: il servizio è gratuito fino a 9.000 euro di ISEE e per gli studenti con disabilità;
  se le richieste superano i posti, ha priorità l''ISEE più basso.'
- Domande dalle ore 12 del 28 luglio alle ore 12 del 5 settembre 2026, solo tramite lo sportello telematico del Comune.
- I requisiti di dettaglio sono nell'avviso pubblico allegato, che non è nel testo ricevuto.
