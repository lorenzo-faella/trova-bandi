id: inps-assegno-maternita-stato
titolo: Assegno di maternità dello Stato
ente: INPS
link: https://www.inps.it/it/it/dettaglio-scheda.it.schede-servizio-strumento.schede-servizi.assegno-di-maternit-dello-stato-50580.assegno-di-maternit-dello-stato.html
apertura: null
chiusura: null
fonte: scheda INPS, estratta con LLM (Claude Code, claude-opus-5-5), non rivista
pubblico: persone
ultimo_controllo: '2026-11-05'
requisiti:
- non_modellabile: 'Il richiedente deve essere madre o padre (anche adottanti), affidatario preadottivo, adottante non coniugato,
    coniuge della madre adottante o dell''affidataria preadottiva, affidatario non preadottivo se nessuno dei genitori ha
    riconosciuto il figlio o non è riconoscibile, oppure legale rappresentante del genitore incapace: manca un campo sul ruolo
    rispetto al minore.'
  fonte: scheda INPS, A chi è rivolto
  citazione: 'L’Assegno di maternità dello Stato spetta:'
- non_modellabile: 'Il minore non deve essere stato adottato dal coniuge quando è figlio, anche adottivo, dell''altro coniuge:
    manca un campo sul tipo di adozione.'
  fonte: scheda INPS, A chi è rivolto
  citazione: Non spetta alcun assegno per il figlio minore adottato dal coniuge quando è figlio, anche adottivo, dell’altro
    coniuge.
- campo: residente_italia
  operatore: vero
  fonte: scheda INPS, Domanda
  citazione: la residenza in Italia al momento della nascita del bambino o dell’ingresso in famiglia del minore adottato o
    in affidamento
- almeno_uno_di:
  - campo: cittadinanza
    operatore: in
    valori:
    - italiana
    - ue
    - familiare_con_diritto_soggiorno
    - extra_ue_lungo_periodo
  - non_modellabile: 'Permesso unico di lavoro o permesso per motivi di ricerca, autorizzati per un periodo superiore a sei
      mesi: il vocabolario non distingue questi titoli dentro altro_titolo.'
  fonte: scheda INPS, Domanda
  citazione: la cittadinanza italiana o di uno Stato dell’Unione europea ovvero il possesso di titoli di soggiorno idonei
- campo: mesi_da_evento_figlio
  operatore: <
  valore: 6
  fonte: scheda INPS, Domanda
  citazione: 'La domanda deve essere presentata entro sei mesi:'
- non_modellabile: 'Requisiti lavorativi e contributivi della madre: se lavoratrice, almeno 3 mesi di contribuzione per maternità
    tra i 18 e i 9 mesi precedenti il parto o l''ingresso del minore; se disoccupata, almeno tre mesi di lavoro e perdita
    del diritto a prestazioni, da non più di nove mesi e non oltre il periodo delle prestazioni godute; se ha cessato di lavorare
    per recesso in gravidanza, tre mesi di contribuzione tra i 18 e i 9 mesi precedenti il parto. Gli stessi requisiti contributivi
    valgono per il padre, salvo il caso di decesso della madre. Il campo settimane_contributi_4_anni copre un periodo diverso
    e mancano i campi su contribuzione per maternità e perdita delle prestazioni.'
  fonte: scheda INPS, Domanda
  citazione: deve avere almeno 3 mesi di contribuzione per maternità nel periodo compreso tra i 18 e i 9 mesi precedenti il
    parto
- non_modellabile: 'Se chiede il padre, oltre ai requisiti contributivi, serve uno dei casi previsti (abbandono del figlio
    da parte della madre o affidamento esclusivo, separazione durante l''affidamento preadottivo, adozione senza affidamento
    durante la separazione, adottante non coniugato, decesso della madre) con le relative condizioni: riconoscimento del figlio,
    minore nella famiglia anagrafica e soggetto alla potestà, non affidato a terzi, madre regolarmente soggiornante e residente
    o che non abbia già fruito dell''Assegno, secondo il caso. Mancano i campi su queste situazioni familiari.'
  fonte: scheda INPS, Domanda
  citazione: 'Per il padre sono previsti i seguenti requisiti:'
note:
- 'La residenza è richiesta al momento della nascita o dell''ingresso del minore, mentre residente_italia chiede la residenza
  attuale: chi nel frattempo si è trasferito può risultare diversamente da quanto dice la scheda. Anche il padre, in caso
  di decesso della madre, deve avere regolare soggiorno e residenza al momento della domanda.'
- 'La scheda non indica protezione internazionale, apolidi o permesso per casi speciali tra i titoli validi: non sono stati
  aggiunti. Il permesso unico di lavoro e quello per ricerca rientrano solo nell''alternativa non_modellabile.'
- 'Se il padre subentra nella domanda già presentata dalla madre deceduta, i requisiti si accertano sulla madre: l''eccezione
  non è esprimibile, e residenza e cittadinanza del padre in quel caso potrebbero non essere quelle da controllare.'
- Le regole sulla quota differenziale (altra prestazione di maternità o Assegno del Comune di importo inferiore) riguardano
  quanto si riceve e non sono state trattate come requisiti. La scheda non dice cosa succede se l'altra prestazione è di importo
  pari o superiore.
- 'Per affidatari, adottanti non padri e legale rappresentante la scheda non indica requisiti contributivi specifici: non
  sono stati aggiunti.'
