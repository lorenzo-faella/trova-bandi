note:
- Le istituzioni afferenti (tabella 1) sono l'Università degli Studi di Messina e il Conservatorio "A. Corelli" di Messina.
  L'art. 23 cita anche le sedi distaccate di Noto e Priolo, in provincia di Siracusa, per cui si sono aggiunti quei comuni.
  Il bando vale solo per queste istituzioni, non per ogni ateneo della provincia.
- 'Le sezioni ricevute non contengono un articolo sui motivi di esclusione (titolo già posseduto, tempo parziale, abbreviazione
  di corso, morosità): se il bando completo li prevede, mancano qui.'
- Serve un'attestazione ISEE per il diritto allo studio universitario in corso di validità e senza omissioni o difformità,
  oppure con i documenti che le chiariscono. Gli studenti internazionali usano l'ISEE parificato fatto da un CAF. Sono condizioni
  di documentazione.
- Per il primo anno il merito si verifica dopo (15 CFU entro il 10 agosto 2027 e 20 entro il 30 novembre 2027; per chi ha
  una disabilità o un DSA 9 e 12) e decide solo se si tiene o si restituisce la borsa. Dottorandi e specializzandi devono
  essere iscritti all'Università di Messina nell'anno in corso.
- 'Altre condizioni di procedura: avere una PEC personale; regolarizzare l''iscrizione all''ateneo di Messina entro il 21
  aprile 2027; regolarizzare la domanda entro il 16 settembre 2026 (gli studenti extracomunitari possono farlo entro il 30
  novembre 2026).'
- Le borse riservate (studenti con disabilità, studenti di paesi poveri, rifugiati, orfani di vittime del lavoro o di mafia,
  vittime dell'usura, residenti nelle isole minori siciliane, ecc.) riguardano la distribuzione delle borse, non l'idoneità.
- Le domande per borsa di studio e servizio abitativo si compilano online dal 1 luglio 2026 alle ore 14:00 del 18 agosto 2026.
