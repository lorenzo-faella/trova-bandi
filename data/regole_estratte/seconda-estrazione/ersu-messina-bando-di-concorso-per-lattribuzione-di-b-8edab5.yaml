note:
- Le regole descrivono la borsa di studio (con il servizio abitativo, richiesto nella stessa domanda dal 1 luglio alle ore
  14:00 del 18 agosto 2026). La manifestazione di interesse al posto letto e la dichiarazione di locazione si presentano dal
  16 ottobre 2026 all'8 gennaio 2027; la parte sul servizio ristorazione non l'ho ricevuta.
- 'Non ho ricevuto le appendici (tabella 1 delle istituzioni, tabelle 4 e 5.1-5.4 sul merito, tabella 6 sui limiti economici):
  i CFU minimi restano da verificare.'
- 'Per le matricole il merito si verifica ex post (tabella 4) per il saldo della borsa: non è una condizione di accesso.'
- Serve un'attestazione ISEE per il diritto allo studio universitario senza omissioni o difformità; gli studenti internazionali
  con redditi all'estero usano l'ISEE parificato.
- Chi ha rinunciato agli studi o è decaduto può partecipare se paga entro il 21 aprile 2027 le tasse dovute e restituisce
  i benefici dell'anno in questione.
- 'Le borse ERSU sono incompatibili con altre borse e con le collaborazioni part-time, ma è previsto un conguaglio: lo tratto
  come regola di cumulo, non come requisito.'
- Sono previste borse riservate (disabilità, studenti di paesi poveri, rifugiati, orfani di vittime del lavoro o di mafia,
  vittime dell'usura, residenti nelle isole minori, ecc.), sempre con gli stessi requisiti economici e di merito.
