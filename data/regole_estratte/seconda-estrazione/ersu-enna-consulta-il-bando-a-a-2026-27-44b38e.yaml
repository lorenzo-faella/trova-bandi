note:
- Il bando è per gli iscritti all'Università "Kore" di Enna. La tabella 11 indica come sedi dei corsi Enna e Caltagirone (provincia
  di Catania), per cui si è aggiunto quel comune. Il bando non vale per altri atenei della provincia di Enna.
- 'Per la tabella 4, anno_di_corso è letto come anni dalla prima immatricolazione: immatricolati 2025/26 = 2° anno, ecc. Per
  la triennale il 4° anno è il primo fuori corso, con 135 CFU; per la magistrale biennale il 3° anno, con 80 CFU. Negli anni
  successivi la tabella non dà soglie ("-").'
- Per il primo anno il merito si verifica dopo (15 CFU entro il 10 agosto 2027 e 20 entro il 30 novembre 2027; per chi ha
  una disabilità 9 e 12) e decide solo se si tiene o si restituisce la borsa.
- L'esclusione per titolo pari o superiore riguarda anche il diploma universitario pre-riforma e la laurea vecchio ordinamento,
  che il vocabolario non distingue. I laureandi possono partecipare con riserva.
- Serve un'attestazione ISEE per il diritto allo studio universitario in corso di validità; gli studenti internazionali usano
  l'ISEE parificato. Sono condizioni di documentazione, come la regolarizzazione della domanda entro il 30 novembre 2026.
- Chi è iscritto a due corsi ha i benefici per una sola iscrizione, a un corso dell'istituzione di competenza dell'ERSU di
  Enna.
- La domanda si compila online dalle ore 9:00 del 21 luglio 2026 alle ore 14:00 del 7 settembre 2026. Il promemoria a pagina
  5 cita il 30 novembre 2026, ma è la scadenza per regolarizzare la domanda.
