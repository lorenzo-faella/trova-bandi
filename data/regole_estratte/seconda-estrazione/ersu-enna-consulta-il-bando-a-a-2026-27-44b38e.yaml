note:
- 'La domanda online si compila dalle ore 9:00 del 21 luglio alle ore 14:00 del 7 settembre 2026 (art. 3); il 30 novembre
  2026 è la scadenza per regolarizzarla caricando i documenti. Il promemoria a pagina 5 accosta le date alle voci sbagliate:
  ho seguito l''art. 3.'
- 'Non ho ricevuto l''art. 7 sulla durata dei benefici né le appendici (tabelle 3, 4 e 4 bis sul merito, tab. 5 sui limiti
  economici): il limite di anni fuori corso e i CFU minimi restano da verificare. L''art. 21 indica solo che al primo anno
  fuori corso spetta metà importo (al secondo per gli studenti con disabilità).'
- 'Per le matricole il merito si verifica ex post (tabella 3/4) per il saldo della borsa: non è una condizione di accesso.'
- Serve un'attestazione ISEE per il diritto allo studio universitario; gli studenti internazionali con redditi all'estero
  usano l'ISEE parificato.
- Chi è iscritto a due corsi riceve i benefici per una sola iscrizione, a un corso del territorio dell'ERSU di Enna.
- Le regole descrivono la borsa di studio; il servizio abitativo segue la stessa domanda e le stesse graduatorie, con manifestazione
  di interesse entro dieci giorni dalla graduatoria definitiva.
