note:
- La data di apertura delle domande non è indicata; nel primo trimestre 2027 i termini saranno riaperti solo per chi arriva
  dal semestre filtro di altri atenei.
- 'Serve l''ISEE per il diritto allo studio universitario 2026 del nucleo anagrafico, con le regole sullo studente indipendente:
  è documentazione, non requisito separato.'
- Gli studenti extra UE con redditi all'estero autocertificano i dati economici; per i Paesi particolarmente poveri ISEE e
  ISPE valgono 0.
- Per chi ha la laurea triennale e si iscrive a un ciclo unico la borsa spetta solo dal 4° anno.
- I 20 crediti da conseguire entro il 30 novembre 2027 (primo anno) e l'incompatibilità con altre borse riguardano conferma,
  revoca e cumulo, non l'accesso.
- Gli studenti con invalidità pari o superiore al 66% non perdono la borsa del primo anno per mancati crediti.
