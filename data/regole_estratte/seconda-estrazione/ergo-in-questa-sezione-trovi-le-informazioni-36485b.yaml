note:
- 'Il documento è il bando unico dei benefici DSU di ER.GO per l''a.a. 2026/2027. I requisiti sono quelli della borsa di studio
  (Sezione I Norme generali e Sezione II): le date di apertura e chiusura sono quelle della domanda di borsa, dal 23 giugno
  al 24 agosto 2026 alle 16.00.'
- 'Gli altri benefici del bando hanno requisiti propri che qui non sono modellati: alloggio da graduatoria (solo fuori sede
  non residenti nei comuni delle Tabelle 1 e 2, domanda entro il 6 agosto 2026 per anni successivi e conferme), contributo
  per la mobilità internazionale (idonei alla borsa, vincitori di un programma di mobilità), interventi straordinari (assegnatari
  di borsa o alloggio nel 2025/2026, ISEE fino a 25.000 e ISPE fino a 50.000 euro), interventi per studenti con disabilità,
  volontariato, collaborazioni per corsi interateneo (ISEE fino a 28.000 e ISPE fino a 62.000 euro), assegni formativi per
  master all''estero (ISEE fino a 40.000, ISPE fino a 62.000 euro, residenza in Italia, domanda dal 15 settembre al 10 dicembre
  2026), contributi per tirocinio post lauream.'
- 'Del testo mancano l''art. 1 (durata massima dei benefici) e la parte dell''art. 7 sul calcolo della condizione economica,
  compresi lo studente indipendente e i criteri per i redditi esteri: il requisito sulla durata resta da verificare.'
- 'Il merito si valuta sull''anno di prima iscrizione, non sull''anno di corso: chi si è trasferito o ha cambiato corso può
  dover avere crediti anche se è iscritto al primo anno. Le soglie di merito per la seconda, terza e quarta rata e per confermare
  la borsa valgono dopo l''assegnazione e non sono state modellate.'
- Gli studenti internazionali devono presentare la documentazione su redditi e patrimoni esteri entro le scadenze di perfezionamento
  della domanda, pena la non idoneità. Per chi attende il riconoscimento della protezione internazionale o il rinnovo del
  permesso, l'assegnazione dipende dal rilascio del permesso di soggiorno.
- La borsa non si cumula con altre borse aventi la stessa finalità, ma si può scegliere la borsa ER.GO rinunciando all'altra.
  Per i membri permanenti di ordini religiosi l'importo della borsa non dipende dalle condizioni economiche familiari.
