note:
- 'La sezione 2.1 rimanda alle disposizioni di pagina 31 per chi arriva dal semestre filtro di un altro ateneo, che non sono
  state ricevute: termini da definire.'
- 'La DSU dell''ISEE per il diritto allo studio non deve essere sottoscritta dopo il 16 ottobre 2026 ed è necessaria senza
  annotazioni: è documentazione.'
- 'Per gli studenti stranieri il reddito non può essere inferiore a 10.179,85 euro come valore ISR minimo: è una regola di
  calcolo, non di accesso.'
- Il posto letto ha una domanda separata dal 24 luglio al 24 agosto 2026 ed è escluso per studenti in sede o pendolari, con
  debiti verso l'Ateneo o provvedimenti disciplinari.
- I crediti ex post del primo anno (entro il 10 agosto e il 30 novembre 2027) riguardano mantenimento e decadenza, non l'accesso.
