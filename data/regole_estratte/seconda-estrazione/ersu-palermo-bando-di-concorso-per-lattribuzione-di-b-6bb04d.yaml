note:
- Domanda online dalle 9 del 5 giugno 2026 alle 14 del 22 luglio 2026, da validare con OTP se non si entra con SPID o CIE.
  La documentazione aggiuntiva va caricata entro il 10 settembre 2026; gli studenti internazionali devono caricare ISEE parificato
  e permesso di soggiorno entro il 30 novembre 2026. Sono adempimenti, non requisiti.
- 'L''attestazione ISEE deve valere per le prestazioni per il diritto allo studio universitario ed essere senza omissioni
  o difformità: è una condizione di procedura, a pena di esclusione.'
- Le tabelle in appendice (2, 3, 4.1-4.3 sul merito, 6 sui Paesi poveri, 8.1 e 8.2 su sede e pendolari) e la tabella delle
  durate dell'art. 7 non sono nel testo ricevuto.
- 'Il merito del primo anno si valuta dopo, al saldo della borsa (art. 24, non ricevuto per intero): non lo riporto.'
- Le borse riservate (disabili, stranieri di Paesi poveri e rifugiati, orfani di vittime del lavoro o di mafia, vittime dell'usura,
  residenti nelle isole minori, figli di emigrati siciliani, orfani in strutture di accoglienza) sono quote della stessa borsa,
  con gli stessi requisiti economici e di merito.
- 'Incompatibilità con altre borse e collaborazioni part-time (art. 5): si fa un conguaglio, non c''è esclusione.'
- Per laureandi e iscritti con riserva alla magistrale ci sono regole particolari. Chi ha una laurea triennale e si iscrive
  a una magistrale a ciclo unico entra dal 4° anno.
