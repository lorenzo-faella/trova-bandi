id: fvg-ristori-per-i-danni-subiti-a-veicoli-di-bd86c3
titolo: Ristori per i danni subiti a veicoli di proprietà privata danneggiati dagli eventi meteorologici verificatisi dal
  13 luglio 2023 al 6 agosto 2023 Da lunedì 15 dicembre 2025, la Protezione civile della Regione è individuata quale ente
  attuatore del procedimento contributivo. Informazioni aggiornate sono disponibili sul sito Internet della Protezione civile
  della Regione.
ente: Regione Autonoma Friuli Venezia Giulia
link: https://www.regione.fvg.it/rafvg/cms/RAFVG/infrastrutture-lavori-pubblici/lavori-pubblici/edilizia/FOGLIA6/
apertura: null
chiusura: '2023-10-31'
fonte: documento Regione Autonoma Friuli Venezia Giulia, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti:
- non_modellabile: 'Essere proprietario o comproprietario di un veicolo (autovettura, ciclomotore o motoveicolo) danneggiato
    dagli eventi meteorologici dal 13 luglio al 6 agosto 2023: nessun campo descrive veicoli posseduti o danni subiti.'
  fonte: Regione Autonoma Friuli Venezia Giulia, pagina 1
  citazione: Possono beneficiare del ristoro le persone fisiche proprietarie o comproprietarie del veicolo
- non_modellabile: 'Domanda ammissibile solo per veicolo riparabile con spese per cristalli, fanali o specchietti, oppure
    per veicolo la cui riparazione non è economicamente conveniente: dettaglio del danno non verificabile.'
  fonte: Regione Autonoma Friuli Venezia Giulia, pagina 1
  citazione: Sono altresì ammissibili le domande per le quali il richiedente abbia dichiarato che la
note:
- 'Il termine per la domanda è scaduto il 31 ottobre 2023 alle 16.00: possono beneficiare solo coloro che hanno già presentato
  domanda valida entro quella data, quindi il bando non è più accessibile a nuovi richiedenti.'
- Il documento non indica un requisito di residenza.
- Spesa ammissibile minima di 100 euro e massimali di ristoro (1.500 o 3.000 euro) riguardano l'importo, non l'idoneità. Dal
  15 dicembre 2025 l'ente attuatore è la Protezione civile della Regione.
