note:
- 'Le sezioni iniziali del bando (articoli 1 e 2) non sono state ricevute: eventuali requisiti su cittadinanza o destinatari
  lì contenuti non sono stati considerati.'
- Domanda di borsa entro le ore 12:00 del 30 settembre 2026; chi chiede anche il posto alloggio deve fare domanda entro il
  18 agosto 2026 (già assegnatari) o l'8 settembre 2026 (nuovi).
- Il posto alloggio a tariffa agevolata richiede in più la condizione di studente fuori sede e l'assenza di provvedimenti
  disciplinari superiori all'ammonizione, debiti verso l'Ateneo o decadenze precedenti dall'alloggio.
- 'Per gli studenti stranieri il reddito estero dichiarato non può essere inferiore a 6.947,33 euro: è una soglia di valutazione,
  non un requisito di accesso.'
- I crediti da conseguire entro il 10 agosto 2027 e il 30 novembre 2027 per il primo anno riguardano il saldo e la revoca,
  non l'accesso.
