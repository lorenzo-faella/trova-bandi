note:
- 'La Tabella n. 1 dell''art. 7, con le date per presentare la domanda, non è nel testo ricevuto: apertura e chiusura restano
  null. Per gli iscritti al semestre filtro a Genova la domanda va dal 15 giugno al 31 luglio 2026, per quelli provenienti
  da altri atenei dal 19 febbraio al 12 marzo 2027.'
- 'La DSU per l''ISEE universitario va sottoscritta entro il 31 luglio 2026 (l''ISEEUP entro il 31 dicembre 2026), a pena
  di esclusione. L''iscrizione va perfezionata entro il 31 dicembre 2026 (10 marzo 2027 per il primo anno di magistrale):
  sono adempimenti di procedura.'
- 'Il merito del primo anno (20 crediti entro il 10 agosto o il 30 novembre 2027) serve per avere la borsa pagata e per non
  perderla: non è un requisito per fare domanda. Gli studenti con disabilità ne sono esenti.'
- 'Gli studenti di Paesi particolarmente poveri, gli apolidi e i titolari di protezione internazionale hanno regole specifiche
  per gli indicatori economici: non c''è un requisito di cittadinanza.'
- 'Il cumulo con altre provvidenze monetarie con la stessa finalità (art. 25.2 lett. v) fa escludere, ma lo studente può scegliere
  quale beneficio tenere: non lo riporto come requisito.'
- Gli studenti AFAM non possono chiedere la borsa come "ultimo semestre".
