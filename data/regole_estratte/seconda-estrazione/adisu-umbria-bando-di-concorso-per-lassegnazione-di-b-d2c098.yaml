id: adisu-umbria-bando-di-concorso-per-lassegnazione-di-b-d2c098
titolo: Bando di concorso per l’assegnazione di Borse di studio e altri servizi per il diritto allo studio universitario a.a.
  2026/2027
ente: ADiSU Umbria - Agenzia per il diritto allo studio universitario
link: https://www.adisu.umbria.it/concorso-borsa-di-studio/bando/2026-2027/bando-di-concorso-lassegnazione-di-borse-di-studio-e-altri
apertura: '2026-07-15'
chiusura: '2026-09-02'
fonte: documento ADiSU Umbria - Agenzia per il diritto allo studio universitario, estratto con LLM (Claude Code, claude-opus-5-5),
  non rivisto
pubblico: persone
