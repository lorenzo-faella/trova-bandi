id: inps-assegno-di-cura-e-sostentamento-acs-a-seguito
titolo: Assegno di Cura e Sostentamento (ACS) a seguito di malattia tubercolare
ente: INPS
link: https://www.inps.it/it/it/dettaglio-scheda.it.schede-servizio-strumento.schede-servizi.assegno-di-cura-e-sostentamento-acs-a-seguito-di-malattia-tubercolare-50100.assegno-di-cura-e-sostentamento-acs-a-seguito-di-malattia-tubercolare.html
apertura: null
chiusura: null
fonte: scheda INPS, estratta con LLM (Claude Code, claude-opus-5-5), non rivista
pubblico: persone
ultimo_controllo: '2026-11-18'
requisiti:
- campo: situazioni_particolari
  operatore: interseca
  valori:
  - malattia_tbc
  fonte: scheda INPS, Cos'è
  citazione: a seguito di malattia tubercolare
- non_modellabile: 'Capacità di guadagno, in relazione alle proprie attitudini, ridotta a meno della metà: manca un campo.'
  fonte: scheda INPS, Cos'è
  citazione: la capacità di guadagno, in relazione alle proprie attitudini, si è ridotta a meno della metà
- non_modellabile: 'Non percepire una normale retribuzione continuativa a tempo pieno: il vocabolario non distingue il lavoro
    a tempo pieno.'
  fonte: scheda INPS, Cos'è
  citazione: non si percepisce una normale retribuzione continuativa a tempo pieno
- almeno_uno_di:
  - campo: settimane_contributi_4_anni
    operatore: '>='
    valore: 52
    citazione: almeno un anno di contribuzione o 52 contributi settimanali nell'arco dell'intera vita lavorativa
  - non_modellabile: 'Almeno 52 contributi settimanali nell''intera vita lavorativa (anche oltre gli ultimi 4 anni), oppure
      appartenenza ad alcune categorie di lavoratori pubblici, pensionati o titolari di rendita, oppure familiare a carico
      dell''assicurato: mancano i campi.'
  fonte: scheda INPS, A chi è rivolto
  citazione: L'Assegno spetta a chi ha già diritto all’Indennità Giornaliera (IG)
note:
- '52 settimane di contributi negli ultimi 4 anni bastano per il requisito contributivo, che però si conta sull''intera vita
  lavorativa: chi non le ha resta da verificare.'
- Il termine di 90 giorni dalla fine dell'Indennità Post Sanatoriale o del precedente ACS cambia solo la decorrenza, non fa
  perdere il diritto, quindi non è un requisito.
- La scheda presuppone la fine dell'Indennità Post Sanatoriale o di un precedente ACS, ma non la scrive come condizione di
  accesso.
