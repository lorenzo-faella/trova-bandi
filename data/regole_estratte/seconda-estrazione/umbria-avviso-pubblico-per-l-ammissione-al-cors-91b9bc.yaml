note:
- 'Apertura: dal giorno successivo alla pubblicazione dell''avviso sul Bollettino Ufficiale della Regione Umbria, data non
  indicata nel testo ricevuto.'
- 'Dirigenti del Sistema Sanitario Nazionale tradotti come dipendenti pubblici occupati (situazioni_particolari dipendente_pubblico):
  da verificare se il sistema include questa categoria nella Gestione unitaria.'
- 'Nessun requisito di residenza né di appartenenza al SSR umbro: i dirigenti con incarico di struttura complessa del Sistema
