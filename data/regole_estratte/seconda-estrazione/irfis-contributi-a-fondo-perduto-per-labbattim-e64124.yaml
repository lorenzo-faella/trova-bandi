note:
- L'ISEE può essere il 2025 o il 2026 vigente alla domanda; la soglia è la stessa.
- Esclusi i beni di lusso elencati (gioielli, auto oltre 1.600 cc, imbarcazioni...) e i beni non durevoli o semidurevoli;
  sempre ammessi protesi e dispositivi medici. Rientra nel requisito non modellabile sul prestito.
- Domanda solo telematica dall'intestatario del prestito (anche tramite tutore, curatore o amministratore di sostegno); una
  sola domanda per un unico prestito. Contributo fino a esaurimento della dotazione.
