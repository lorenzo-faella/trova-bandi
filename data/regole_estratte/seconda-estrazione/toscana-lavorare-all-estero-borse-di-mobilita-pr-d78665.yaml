id: toscana-lavorare-all-estero-borse-di-mobilita-pr-d78665
titolo: 'Lavorare all''estero, borse di mobilità professionale: il bando 2023-2027'
ente: Regione Toscana
link: https://www.regione.toscana.it/-/lavorare-all-estero-borse-di-mobilit%C3%A0-professionale-per-disoccupati-o-inattivi-il-bando-2023
apertura: '2023-06-01'
chiusura: '2027-12-31'
fonte: documento Regione Toscana, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti:
- campo: cittadinanza
  operatore: in
  valori:
  - italiana
  - ue
  - extra_ue_lungo_periodo
  fonte: Regione Toscana, pagina 1
  citazione: cittadino/a dell'Unione Europea o cittadino/a di paesi terzi in possesso di soggiorno UE per soggiornanti di
    lungo periodo
- campo: regione
  operatore: in
  valori:
  - Toscana
  fonte: Regione Toscana, pagina 7
  citazione: essere residenti in Toscana
- campo: eta
  operatore: '>='
  valore: 18
  fonte: Regione Toscana, pagina 7
  citazione: aver compiuto 18 anni
- campo: condizione_lavorativa
  operatore: in
  valori:
  - disoccupato
  - inattivo
  fonte: Regione Toscana, pagina 1
  citazione: disoccupato/a oppure inattivo/a, iscritto/a ad un Centro per l'impiego della Toscana
- non_modellabile: 'Iscrizione a un Centro per l''impiego della Toscana e svolgimento dell''azione ''Consulenza Eures'', da
    disoccupato o inattivo, registrata sul Patto di servizio prima del contratto estero e non più di sei mesi prima della
    sua stipula: mancano i campi.'
  fonte: Regione Toscana, pagina 7
  citazione: aver svolto presso un Centro per l'impiego della Toscana
- non_modellabile: 'Possesso di un contratto di lavoro, apprendistato o tirocinio (almeno tre mesi, almeno 15 ore settimanali
    se part-time, avvio entro quattro mesi dalla domanda) o di una lettera di impegno di un datore di lavoro in un Paese UE
    o EFTA diverso dall''Italia: manca il campo.'
  fonte: Regione Toscana, pagina 1
  citazione: essere in possesso di un contratto di lavoro/apprendistato/tirocinio o della lettera di impegno
note:
- 'Apertura: dal giorno successivo alla pubblicazione sul BURT (31.05.2023), cioè dal 1° giugno 2023; chiusura il 31/12/2027
  salvo esaurimento delle risorse. Domanda solo on-line sul Sistema Informativo FSE.'
- Lo stato di disoccupato o inattivo va posseduto al momento della stipula del contratto estero o della firma della lettera
  di impegno, non necessariamente alla domanda.
- 'La cittadinanza ammette solo UE e titolari di permesso UE per soggiornanti di lungo periodo: i familiari di cittadini UE
  e gli altri titoli non sono citati, quindi non inclusi.'
- Nessun limite massimo di età.
- 'Non riportato come requisito (regola di cumulo): inammissibili le domande di chi riceve altri finanziamenti pubblici o
  privati per la stessa attività.'
