note:
- Le date di apertura e chiusura delle domande sono rinviate a un successivo avviso (la pagina web cita un 'Avviso presentazione
  domande' con determinazione 3200 del 03.11.2026, il cui testo non c'è). Domanda solo telematica, con SPID/CIE/CNS.
- 'Età 18-30 anni: ''31 anni non compiuti''.'
- 'ISEE: ammessa anche la sola DSU, purché l''attestazione risulti non superiore a 40.000 euro alla data dell''istruttoria;
  l''ISEE ordinario serve anche per la graduatoria.'
- 'Il permesso di soggiorno degli extra UE deve essere in corso di validità e consentire le attività del corso: non verifichiamo
  il tipo di permesso.'
- 'Non riportato come requisito (regola di cumulo): non aver beneficiato di altri contributi incompatibili per lo stesso percorso
  formativo.'
- 'Il percorso deve essere svolto presso un organismo approvato Part-147 del Catalogo ASPAL LMA 2026 o verificato da ASPAL:
  è un requisito del corso, non della persona.'
