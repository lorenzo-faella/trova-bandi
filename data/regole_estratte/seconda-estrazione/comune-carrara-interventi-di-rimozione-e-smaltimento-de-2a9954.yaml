note:
- 'Il bando non è riservato ai residenti: chiede la proprietà dell''immobile su cui si interviene, che si presume nel territorio
  comunale. Per questo non si usa il campo comune, che indica la residenza.'
- Possono fare domanda anche proprietari di edifici produttivi, commerciali o agricoli, non solo persone fisiche. Con più
  proprietari si assegna un unico contributo per intervento.
- Le domande senza modulo firmato sono inammissibili; quelle prive di uno dei documenti (proprietà, FIR, fattura quietanzata,
  documento d'identità, verbale condominiale per le parti comuni) vanno integrate pena l'inammissibilità.
- Il testo ricevuto non contiene il periodo di presentazione delle domande (le date indicate riguardano l'esecuzione dei lavori).
