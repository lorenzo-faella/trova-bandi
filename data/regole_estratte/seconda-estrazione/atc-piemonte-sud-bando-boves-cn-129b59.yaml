note:
- I requisiti vanno posseduti alla data del 16/10/2026, data di protocollo del bando; la data di apertura delle domande non
  è indicata esplicitamente.
- Domande entro le ore 12:00 del 30/11/2026 a mano su appuntamento, via PEC o raccomandata A.R.; per i lavoratori emigrati
  all'estero il termine è prorogato di trenta giorni.
- I requisiti sulla casa e sull'ISEE valgono per il richiedente e per tutti i componenti del nucleo come definito dalla L.R.
  3/2010.
- 'Fino al 25% degli alloggi è riservato a giovani coppie, anziani, invalidi e nuclei monogenitoriali: è una riserva di assegnazione,
  non un requisito.'
