note:
- I requisiti sono riferiti allo studente; se la domanda la presenta un genitore, iscrizione e residenza vanno lette sullo
  studente.
- Il testo ricevuto non indica il periodo per presentare le domande; il titolo è troncato e non riporta l'anno scolastico.
- Il requisito sull'abbonamento ferroviario è dedotto dal titolo dell'avviso, la citazione è presa dall'art. 4.
