    valori:
    - scuola_superiore
  - non_modellabile: 'Iscrizione a una scuola secondaria di primo grado o a un percorso IeFP presso un soggetto accreditato:
      il campo iscrizione non ha questi valori.'
  fonte: Regione Umbria, pagina 3
  citazione: Essere iscritti nell’anno scolastico/formativo di riferimento ad una scuola secondaria di primo o
- non_modellabile: 'La scuola o il soggetto accreditato IeFP deve avere sede in Umbria: manca un campo sulla sede della scuola
    (regione_ateneo vale solo per università, AFAM e ITS).'
  fonte: Regione Umbria, pagina 3
  citazione: secondo grado avente sede in Umbria ovvero ad un percorso di Istruzione e Formazione
- campo: isee
  operatore: <=
  valore: 30000
  fonte: Regione Umbria, pagina 3
  citazione: Avere un ISEE ordinario pari o inferiore a 30.000,00 euro, regolare e in corso di validità;
- non_modellabile: 'Il contributo è per l''acquisto dell''abbonamento ai servizi pubblici di trasporto scolastico su rotaia
    di interesse regionale e locale: manca un campo sull''uso del treno per andare a scuola.'
  fonte: Regione Umbria, pagina 3
