note:
- 'Date per le lauree triennali, magistrali e a ciclo unico: dal 20 luglio al 7 settembre 2026, alle ore 13. Dottorato e specializzazione:
  dal 25 settembre al 16 novembre 2026. Studenti del semestre filtro di un''altra regione: dal 1° febbraio al 1° marzo 2027,
  con possibile posticipo; per loro serve anche aver fatto domanda di borsa all''ente DSU della regione di provenienza.'
- 'A pena di esclusione bisogna sottoscrivere entro i termini la DSU 2026, valida per le prestazioni per il diritto allo studio
  universitario. Gli studenti con nucleo o redditi all''estero devono inviare la documentazione dell''art. 8: sono adempimenti
  di procedura, non requisiti.'
- 'Il merito del primo anno (es. 20 crediti entro il 10 agosto 2027) è una condizione per tenere la borsa, non per ottenerla:
  non lo riporto.'
- La soglia ISEE più alta per chi ha figli minori vale per i figli conviventi nati dal 1° gennaio 2020 (art. 10). Per detenuti
  e atleti valgono le soglie generali.
- 'Gli studenti stranieri, apolidi e rifugiati possono partecipare (art. 8): non c''è un requisito di cittadinanza.'
- 'Per il posto alloggio bisogna essere studenti fuori sede: è un servizio accessorio, non un requisito della borsa.'
- 'Cumulo con altre provvidenze (art. 22.1.1.1): è una causa di decadenza, e lo studente può scegliere quale beneficio tenere.
  Non la tratto come requisito.'
- 'Mancano parti del bando che il testo richiama: art. 8.3 (documentazione degli stranieri, studente autonomo), art. 9.2 e
  9.5, art. 16. Possono contenere altre condizioni.'
