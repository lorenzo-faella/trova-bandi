note:
- Il bando riguarda l'a.a. 2024/2025 e i termini sono già scaduti.
- 'Le date non coincidono: l''art. 7 indica domande dal 4 al 25 giugno 2025, la pagina web indica la scadenza alle ore 16:00
  del 4 luglio 2025 (probabile proroga). Come chiusura si è usata la data della pagina web.'
- L'art. 3 dell'avviso, a cui rimanda la pagina web per i requisiti e la documentazione delle categorie di vittime, non è
  stato ricevuto.
- La domanda va presentata agli sportelli EDISU di Torino, Novara o Vercelli su appuntamento, oppure via Ticketing o raccomandata.
