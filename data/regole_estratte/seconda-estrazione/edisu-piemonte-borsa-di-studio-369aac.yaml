  fonte: EDISU Piemonte, pagina 14
  citazione: l’aver subito negli anni accademici precedenti la revoca totale del beneficio di cui al presente bando
- non_modellabile: 'Iscritti ai titoli congiunti EAP o EISD (LM-56) di UniTo e al percorso SELECT del Politecnico: possono
    partecipare solo se non hanno vinto borse francesi per il diritto allo studio o borse europee analoghe (es. Erasmus Mundus).
    Esclusi i Double Degree ed Erasmus Mundus Joint Master con prima iscrizione all''ateneo estero.'
  portata: rara
  fonte: EDISU Piemonte, pagina 11
  citazione: possono partecipare al concorso, a condizione di non essere risultati vincitori di
note:
- 'Due finestre di domanda: corsi di laurea, laurea magistrale e magistrale a ciclo unico dal 22 luglio al 4 settembre 2026
  ore 12; dottorati e scuole di specializzazione dal 28 ottobre al 27 novembre 2026 ore 12. La chiusura indicata è quella
  più tarda, valida solo per dottorati e specializzazioni.'
- 'Per gli studenti del primo anno i 20 crediti entro il 10 agosto 2027 (11 se part-time) servono per la seconda rata, e 20
  crediti entro il 30 novembre 2027 per non perdere la prima: sono condizioni di mantenimento, non di accesso.'
- Chi ha fatto un passaggio di corso o un trasferimento deve fare domanda come anno successivo, quindi gli si applicano i
  requisiti di merito anche se l'ateneo lo iscrive al primo anno.
- 'La tabella dei requisiti di accesso dei primi anni (Art. 9 comma 1) è tagliata nel testo ricevuto: eventuali condizioni
  aggiuntive per i primi anni di laurea magistrale (es. conferma per merito) non sono verificabili.'
- 'Per dottorati e scuole di specializzazione vale l''ISEE Dottorato o Nucleo Ristretto con le stesse soglie: qui si usa il
  campo isee_universitario.'
- Per gli studenti con disabilità (invalidità almeno 66% o L. 104/1992 art. 3) valgono tabelle di merito ridotte e la scala
  di equivalenza aumentata di 1,05.
- Gli studenti di Medicina, Odontoiatria e Veterinaria che frequentano il semestre filtro fanno domanda all'ente per il diritto
  allo studio dell'ateneo del semestre filtro; è prevista una finestra straordinaria dal 6 febbraio al 6 marzo 2027.
- La borsa non è compatibile con il contributo per studenti con invalidità dal 46% iscritti al collocamento mirato (Sezione
  X).
- 'Studenti internazionali e italiani con famiglia all''estero devono presentare la documentazione consolare per l''ISEE parificato
  nei termini dell''art. 31: è un adempimento di procedura, non un requisito.'
