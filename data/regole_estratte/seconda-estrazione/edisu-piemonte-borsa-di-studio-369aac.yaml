  fonte: EDISU Piemonte, pagina 13
  citazione: l’essere iscritti per l’a.a. 2026/27 ad un anno di corso per il quale si è già beneficiato di borsa EDISU Piemonte
- non_modellabile: Non aver subito in anni precedenti la revoca totale del beneficio con sanzione, la decadenza dopo accertamento
