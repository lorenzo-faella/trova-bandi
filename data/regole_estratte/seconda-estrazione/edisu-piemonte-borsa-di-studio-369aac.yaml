- non_modellabile: Non aver già avuto la borsa (EDISU o altro ente per il diritto allo studio) per lo stesso anno di corso,
    salvo restituzione, e non beneficiare di altra borsa analoga di enti pubblici o privati (escluse quelle per soggiorni
