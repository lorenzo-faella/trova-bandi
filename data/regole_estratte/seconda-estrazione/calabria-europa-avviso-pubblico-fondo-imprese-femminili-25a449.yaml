note:
- 'L''avviso finanzia imprese, ma può presentare domanda anche chi deve ancora costituirla: per questo i requisiti sono scritti
  sulla persona e sull''impresa futura.'
- Le definizioni dei soggetti destinatari (art. 5 punti 3, 4 e 5) e l'elenco dei settori esclusi (Allegato 1) rinviano a parti
  che non sono nel testo ricevuto.
- 'La condizione lavorativa non restringe: sono ammesse anche le donne occupate, quindi non è stato aggiunto un requisito
  su condizione_lavorativa.'
- 'Non c''è un requisito di residenza in Calabria: la Calabria riguarda la sede dell''investimento, quindi non è stato usato
  il campo regione.'
- Sportello aperto dall'08/07/2024 alle 10:00, chiusura fissata dal Comitato degli Investimenti in base alle risorse; domanda
  con firma digitale, PEC e imposta di bollo sulla piattaforma indicata.
