note:
- 'Date per le lauree, lauree magistrali e magistrali a ciclo unico: dalle 8 del 14 luglio alle 12 del 13 agosto 2026. Dottorato
  e specializzazione: dal 1° al 30 ottobre 2026. Studenti del semestre filtro di un''altra regione: dal 2 febbraio al 4 marzo
  2027.'
- 'L''attestazione ISEE deve valere per le prestazioni per il diritto allo studio universitario dello studente, a pena di
  esclusione. Gli studenti con nucleo all''estero devono presentare la documentazione dell''art. 10; apolidi e titolari di
  protezione devono presentare il permesso di soggiorno: sono adempimenti, non requisiti.'
- 'Il merito del primo anno (20 crediti entro il 10 agosto o il 30 novembre 2027) si valuta dopo ed è una condizione per tenere
  la borsa: non lo riporto.'
- 'Chi ha una laurea triennale e si iscrive a una magistrale a ciclo unico può chiedere la borsa solo dal 4° anno (art. 12
  comma 3): caso particolare, non riportato.'
- Gli studenti di corsi interateneo con sede amministrativa in un'altra regione fanno domanda all'ente di quella regione (art.
  3 comma 4).
- 'Possono partecipare studenti italiani e stranieri: non c''è un requisito di cittadinanza.'
