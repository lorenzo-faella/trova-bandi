note:
- Le istituzioni della tabella 1 (Università di Catania, Accademia di Belle Arti di Catania, Accademia ABADIR di Sant'Agata
  li Battiati, Istituto musicale Bellini di Catania) sono tutte in provincia di Catania. Per questo si usa provincia_ateneo,
  ma il bando vale solo per queste istituzioni e non per tutta la provincia.
- 'Nella tabella 6 la soglia ISEE è stampata come "€ 25.00,00": si legge come 25.000 euro, ma va controllata sul bando.'
- Le soglie di CFU per gli anni successivi al primo (tabelle 5.1-5.4) non sono nel testo ricevuto. Per il primo anno il merito
  si verifica dopo (15 CFU entro il 10 agosto 2027 e 20 entro il 30 novembre 2027; per chi ha una disabilità 9 e 12) e decide
  solo se si tiene o si restituisce la borsa.
- 'I diplomandi e i laureandi possono partecipare (art. 6): per questo il diploma di scuola superiore si chiede solo per l''AFAM,
  come scrive il bando.'
- L'esclusione per titolo pari o superiore riguarda anche il diploma universitario pre-riforma e la laurea vecchio ordinamento,
  che il vocabolario non distingue.
- 'Sono esclusi anche chi si iscrive dopo il 23 aprile 2027, chi non comunica l''IBAN entro dodici mesi e chi non dichiara
  di aver chiesto benefici ad altri enti per il diritto allo studio: sono condizioni di procedura e di tempi, non scritte
  come requisiti.'
- 'La domanda di benefici va compilata online entro le ore 14:00 del 10 agosto 2026. La data di apertura non è indicata. Il
  promemoria a pagina 6 cita l''11 settembre 2026, ma l''impaginazione della tabella è sfalsata: si usa la scadenza dell''art.
  3.'
