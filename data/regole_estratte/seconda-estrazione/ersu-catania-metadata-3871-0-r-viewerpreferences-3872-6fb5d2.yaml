note:
- 'La domanda online va compilata (e validata con OTP se serve) entro le ore 14:00 del 10 agosto 2026; il documento non indica
  la data di apertura. Il promemoria a pagina 6 riporta invece «11 settembre 2026» accanto alla scadenza della richiesta,
  ma sembra uno scorrimento delle righe della tabella: ho seguito l''art. 3.'
- 'Non ho ricevuto le appendici (tab. 1 delle istituzioni, tab. 4 e 5.1-5.4 sul merito, tab. 6 sui limiti ISEE/ISPE): le soglie
  economiche e i CFU minimi restano da verificare.'
- 'Per le matricole il merito si verifica ex post (tabella 4) per il saldo della borsa: non è una condizione di accesso.'
- Le borse ERSU sono incompatibili con altre borse e con le collaborazioni part-time, ma è previsto un conguaglio (art. 5);
  l'art. 10 esclude però i beneficiari di borse di altre amministrazioni pubbliche, che ho riportato come requisito.
- Le regole descrivono la borsa di studio; il servizio abitativo segue la stessa domanda e le stesse graduatorie. La parte
  sul servizio di ristorazione non l'ho ricevuta.
- Gli studenti internazionali con redditi all'estero devono presentare l'ISEE parificato calcolato dal CAF indicato dall'ERSU
  di Catania.
