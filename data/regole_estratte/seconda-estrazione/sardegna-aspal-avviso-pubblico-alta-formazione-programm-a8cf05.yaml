note:
- 'La residenza in Sardegna è richiesta a una data passata (04/08/2022 per la Linea A, 27/06/2024 per la Linea B): il controllo
  usa la residenza attuale.'
- 'L''età è riferita al 30/11/2022 o al 01/09/2024: chi oggi ha meno di 35 anni li aveva di sicuro anche allora; per gli altri
  resta da verificare, perché età, condizione lavorativa e reddito di allora non si ricavano dal profilo attuale.'
- 'Il titolo di laurea comprende anche il diploma accademico AFAM di primo o secondo livello, che il vocabolario non distingue:
  è stato reso con laurea_triennale/laurea_magistrale e titoli superiori.'
- 'La certificazione di disabilità (art. 3 L. 104/92) serve solo a chi frequenta interamente online: è stata resa come esenzione
  dalla quota del 70% in presenza, con il campo disabile.'
- L'ISEE per il diritto allo studio universitario incide solo sulla percentuale della borsa (tabella 2), non sull'idoneità.
- Domanda via PEC, a sportello fino a esaurimento risorse e comunque entro il 30/04/2025, con imposta di bollo da 16 euro.
