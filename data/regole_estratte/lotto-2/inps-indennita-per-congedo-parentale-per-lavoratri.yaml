id: inps-indennita-per-congedo-parentale-per-lavoratri
titolo: Indennità per congedo parentale per lavoratrici e lavoratori iscritti alla Gestione Separata
ente: INPS
link: https://www.inps.it/it/it/dettaglio-scheda.it.schede-servizio-strumento.schede-servizi.50290.indennit-per-congedo-parentale-per-lavoratrici-e-lavoratori-iscritti-alla-gestione-separata.html
apertura: null
chiusura: null
fonte: scheda INPS, estratta con LLM (Claude Code, claude-opus-5-5), non rivista
pubblico: persone
ultimo_controllo: '2026-11-18'
requisiti:
- almeno_uno_di:
  - campo: tipo_lavoro
    operatore: interseca
    valori:
    - parasubordinato
  - tutti_di:
    - campo: tipo_lavoro
      operatore: interseca
      valori:
      - autonomo
    - non_modellabile: 'Professionista iscritto alla Gestione Separata (art. 2, c. 26, l. 335/1995): manca il campo sulla
        gestione di iscrizione.'
  fonte: scheda INPS, Domanda
  citazione: sono iscritti come lavoratori collaboratori coordinati e continuativi e categorie assimilate, oppure come professionisti
- campo: condizione_lavorativa
  operatore: interseca
  valori:
  - occupato
  fonte: scheda INPS, Domanda
  citazione: hanno un rapporto di lavoro in corso di validità nel periodo del congedo
- non_modellabile: 'Iscrizione alla Gestione Separata senza essere titolari di pensione né iscritti ad altre forme previdenziali
    obbligatorie: mancano i campi.'
  fonte: scheda INPS, A chi è rivolto
  citazione: non sono iscritti ad altre forme previdenziali obbligatorie;
- non_modellabile: 'Almeno un mese di contribuzione effettivamente versata con aliquota maggiorata nei 12 mesi precedenti
    l''inizio del congedo: manca il campo.'
  fonte: scheda INPS, Domanda
  citazione: hanno almeno un mese di contribuzione effettivamente versata con aliquota maggiorata nei 12 mesi precedenti l'inizio
    del congedo indennizzabile.
- campo: mesi_da_evento_figlio
  operatore: <
  valore: 144
  fonte: scheda INPS, Come funziona
  citazione: Il congedo si può utilizzare entro i 12 anni di vita del figlio o dall’ingresso in famiglia o in Italia in caso
    di adozione o affidamento.
- non_modellabile: 'In caso di affidamento non preadottivo il congedo non spetta: manca il campo sul tipo di affidamento.'
  portata: rara
  fonte: scheda INPS, Come funziona
  citazione: In caso di affidamento non preadottivo, le lavoratrici e i lavoratori iscritti alla Gestione Separata non possono
    fruire del congedo parentale
note:
- Il diritto all'indennità si prescrive entro un anno dalla fine del periodo indennizzabile; la domanda tardiva indennizza
  solo i giorni successivi alla presentazione. Non modellato perché dipende dal periodo di congedo.
- Il limite complessivo di nove mesi tra i due genitori riguarda la durata, non l'accesso.
