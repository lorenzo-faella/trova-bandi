  citazione: hanno versato contributi in diverse Casse, Gestioni o Fondi previdenziali
- non_modellabile: Requisiti di assicurazione e di contribuzione, che la scheda non quantifica.
  fonte: scheda INPS, Domanda
  citazione: vengono rispettati i requisiti di assicurazione e di contribuzione;
note:
- 'Non si vincola la condizione lavorativa attuale: la scheda parla di lavoratori dipendenti, autonomi, Gestione Separata
  e liberi professionisti in base ai contributi versati, e si rivolge anche ai titolari di assegno ordinario di invalidità.'
