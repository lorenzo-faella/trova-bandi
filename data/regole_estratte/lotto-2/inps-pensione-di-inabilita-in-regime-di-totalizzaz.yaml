    la scheda non lo traduce in una percentuale di invalidità.'
  fonte: scheda INPS, Domanda
  citazione: viene riconosciuto lo stato di assoluta e permanente impossibilità a svolgere qualsiasi attività lavorativa.
- non_modellabile: 'Contributi versati in più Casse, Gestioni o Fondi previdenziali: manca il campo.'
