    classe seconda: il vocabolario non ha questi ordini di scuola.'
  fonte: scheda INPS, Cos'è
  citazione: scuola primaria e secondaria di primo grado (fino alla classe seconda).
- non_modellabile: Altri requisiti indicati nel bando di concorso annuale, che la scheda non riporta.
  fonte: scheda INPS, Domanda
  citazione: I requisiti sono indicati nel bando di concorso indetto ogni anno dall’INPS.
note:
- 'La domanda può presentarla il genitore iscritto, il genitore superstite, il tutore o lo studente maggiorenne: la situazione
