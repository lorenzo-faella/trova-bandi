id: inps-indennita-per-riposi-giornalieri-per-padri-e
titolo: Indennità per riposi giornalieri per padri e madri dipendenti
ente: INPS
link: https://www.inps.it/it/it/dettaglio-scheda.it.schede-servizio-strumento.schede-servizi.50581.indennit-per-riposi-giornalieri-per-padri-e-madri-dipendenti.html
apertura: null
chiusura: null
fonte: scheda INPS, estratta con LLM (Claude Code, claude-opus-5-5), non rivista
pubblico: persone
ultimo_controllo: '2026-11-18'
requisiti:
- campo: condizione_lavorativa
  operatore: in
  valori:
  - occupato
  fonte: scheda INPS, Domanda
  citazione: avere un valido rapporto di lavoro in corso
- campo: tipo_lavoro
  operatore: in
  valori:
  - dipendente
  fonte: scheda INPS, A chi è rivolto
  citazione: Si rivolge alle lavoratrici e ai lavoratori dipendenti
- non_modellabile: 'Sono escluse le lavoratrici domestiche e a domicilio: il vocabolario non permette di escludere una situazione
    particolare né distingue il lavoro a domicilio.'
  fonte: scheda INPS, A chi è rivolto
  citazione: Le lavoratrici domestiche e a domicilio non hanno diritto ai riposi giornalieri.
- almeno_un_componente:
  - campo: figlio
    operatore: vero
  fonte: scheda INPS, Domanda
  citazione: il minore deve essere vivente
- campo: mesi_da_evento_figlio
  operatore: <
  valore: 12
  fonte: scheda INPS, Cos'è
  citazione: durante il primo anno di vita o, in caso di adozione o affidamento, entro il primo anno dall’ingresso in famiglia
    del minore
- non_modellabile: 'Il padre ne ha diritto solo se la madre è deceduta o gravemente inferma, oppure se la madre è lavoratrice
    dipendente e rinuncia o non ha diritto ai riposi; non se la madre non è lavoratrice o è in astensione, aspettativa o permessi
    non retribuiti: mancano i campi sul genere del richiedente e sulla situazione dell''altro genitore.'
  fonte: scheda INPS, Domanda
  citazione: può richiedere il riposo giornaliero in alternativa alla madre lavoratrice dipendente che rinuncia o non ha diritto
    ai riposi
- non_modellabile: 'La domanda va presentata prima dell''inizio del periodo di riposo e comunque entro l''anno di prescrizione:
    manca la data di inizio del riposo.'
  fonte: scheda INPS, Domanda
  citazione: La domanda va presentata prima dell'inizio del periodo di riposo giornaliero e comunque non oltre l’anno di prescrizione.
note:
- La durata dei riposi (una o due ore, raddoppio per parto plurimo, dimezzamento con asilo nido aziendale) incide solo su
  quanto spetta, non sul diritto.
- Sono inclusi i lavoratori naviganti, marittimi e dell'aviazione civile ex IPSEMA, che rientrano tra i dipendenti.
