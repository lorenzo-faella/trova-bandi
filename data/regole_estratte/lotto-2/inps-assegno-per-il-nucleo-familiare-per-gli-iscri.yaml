    non si verificano con il vocabolario.'
  fonte: scheda INPS, Domanda
  citazione: limitatamente ai nuclei familiari con figli e orfanili, è abrogato
note:
- 'La domanda si presenta entro la prescrizione di cinque anni: per i periodi fino al 28 febbraio 2022 valgono ancora le regole
  che includono i figli nel nucleo, finché non sono prescritti.'
- La domanda riguarda sempre l'anno precedente o anni passati, quindi la situazione lavorativa attuale è solo un'approssimazione.
