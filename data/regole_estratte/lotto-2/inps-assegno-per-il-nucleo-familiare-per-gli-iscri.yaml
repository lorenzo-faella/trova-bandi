    l''esclusione.'
  fonte: scheda INPS, Cos'è
  citazione: 'Dal beneficio sono esclusi:'
- non_modellabile: 'Versamento dell''aliquota con la quota aggiuntiva per ANF e maternità e copertura contributiva effettivamente
    accreditata nel periodo: mancano i campi.'
  fonte: scheda INPS, A chi è rivolto
