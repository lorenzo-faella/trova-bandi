note:
- I liberi professionisti iscritti alla Gestione Separata sono resi con tipo_lavoro autonomo; l'iscrizione alla Gestione Separata
  resta da verificare.
- 'La domanda riguarda anni passati: tipo_lavoro si chiede solo agli occupati, quindi chi oggi non lavora più ma aveva diritto
  nel periodo richiesto potrebbe risultare escluso.'
