    mancano i campi.'
  fonte: scheda INPS, A chi è rivolto
  citazione: iscrizione esclusiva alla Gestione Separata
- non_modellabile: 'Almeno il 70% del reddito complessivo del nucleo deve derivare da attività iscritte alla Gestione Separata:
    manca il campo.'
  fonte: scheda INPS, Come funziona
  citazione: deve essere composto, per almeno il 70%
