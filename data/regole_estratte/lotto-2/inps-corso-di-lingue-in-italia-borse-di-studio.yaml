id: inps-corso-di-lingue-in-italia-borse-di-studio
titolo: 'Corso di lingue in Italia: borse di studio'
ente: INPS
link: https://www.inps.it/it/it/dettaglio-scheda.it.schede-servizio-strumento.schede-servizi.corso-di-lingue-in-italia-borse-di-studio-51932.corso-di-lingue-in-italia-borse-di-studio.html
apertura: null
chiusura: null
fonte: scheda INPS, estratta con LLM (Claude Code, claude-opus-5-5), non rivista
pubblico: persone
ultimo_controllo: '2026-11-13'
requisiti:
- non_modellabile: 'Essere figlio o orfano di un dipendente o pensionato della pubblica amministrazione iscritto alla Gestione
    Unitaria prestazioni creditizie e sociali: mancano i campi.'
  fonte: scheda INPS, A chi è rivolto
  citazione: ai figli e agli orfani di dipendenti e pensionati della pubblica amministrazione, iscritti alla Gestione Unitaria
    prestazioni creditizie e sociali (ex Fondo Credito)
- almeno_un_componente:
  - campo: figlio
    operatore: vero
  - campo: eta
    operatore: <=
    valore: 23
  fonte: scheda INPS, Domanda
  citazione: Gli studenti richiedenti non devono avere più di 23 anni di età.
- non_modellabile: 'Lo studente deve frequentare gli ultimi due anni della scuola primaria, la scuola media o la scuola superiore:
    il vocabolario ha solo la scuola superiore.'
  fonte: scheda INPS, Domanda
  citazione: 'Devono aver frequentato:'
- non_modellabile: 'Il corso di lingua straniera deve svolgersi in un unico anno scolastico, durare almeno quattro mesi con
    almeno 60 ore e portare alla certificazione CEFR del livello previsto: mancano i campi.'
  fonte: scheda INPS, Come funziona
  citazione: abbia una durata minima di quattro mesi;
- non_modellabile: 'Non fruire nello stesso anno scolastico di altri contributi analoghi superiori al 50% della borsa: manca
    il campo.'
  fonte: scheda INPS, Come funziona
  citazione: il beneficiario non deve fruire o aver già fruito
- non_modellabile: Domanda entro i termini del bando di concorso annuale, che la scheda non riporta.
  fonte: scheda INPS, Domanda
  citazione: entro i termini previsti nel bando di concorso
note:
- Il requisito di età è scritto sul figlio nel nucleo, pensando al genitore che usa il servizio; se a usarlo è lo studente
  stesso, l'età va riferita a lui.
