id: inps-corso-di-lingue-in-italia-borse-di-studio
titolo: 'Corso di lingue in Italia: borse di studio'
ente: INPS
link: https://www.inps.it/it/it/dettaglio-scheda.it.schede-servizio-strumento.schede-servizi.corso-di-lingue-in-italia-borse-di-studio-51932.corso-di-lingue-in-italia-borse-di-studio.html
apertura: null
chiusura: null
fonte: scheda INPS, estratta con LLM (Claude Code, claude-opus-5-5), non rivista
pubblico: persone
ultimo_controllo: '2026-11-18'
requisiti:
- campo: situazioni_particolari
  operatore: interseca
  valori:
  - genitore_dipendente_pubblico
  fonte: scheda INPS, A chi è rivolto
  citazione: Il bando di concorso è rivolto ai figli e agli orfani di dipendenti e pensionati della pubblica amministrazione,
    iscritti alla Gestione Unitaria prestazioni creditizie e sociali (ex Fondo Credito).
- campo: eta
  operatore: <=
  valore: 23
  fonte: scheda INPS, Domanda
  citazione: Gli studenti richiedenti non devono avere più di 23 anni di età.
- almeno_uno_di:
  - campo: iscrizione
    operatore: in
    valori:
    - scuola_superiore
  - non_modellabile: 'Aver frequentato gli ultimi due anni della scuola primaria o la scuola secondaria di primo grado, oppure
      aver già frequentato le superiori: il vocabolario non ha la scuola primaria e media né la frequenza passata.'
  fonte: scheda INPS, Domanda
  citazione: 'Devono aver frequentato:'
- non_modellabile: 'Corso di lingua straniera finalizzato alla certificazione CEFR, svolto in un unico anno scolastico, di
    almeno quattro mesi e 60 ore di lezione: mancano i campi sul corso.'
  fonte: scheda INPS, Come funziona
  citazione: abbia una durata minima di quattro mesi;
- non_modellabile: 'Non fruire o aver fruito nello stesso anno scolastico di contributi analoghi di valore superiore al 50%
    della borsa, e incompatibilità con analoghe prestazioni indicate dal bando: manca il campo.'
  fonte: scheda INPS, Come funziona
  citazione: Il beneficio è incompatibile con analoghe prestazioni, come specificato dal bando pubblicato annualmente.
note:
- 'La scheda chiama richiedenti gli studenti: la situazione ammessa è genitore_dipendente_pubblico. Se la domanda la compila
  il genitore per un figlio minorenne, l''età e la scuola andrebbero riferite al figlio.'
- 'Il livello di certificazione da sostenere dipende dalla scuola frequentata: è un obbligo successivo, non un requisito di
  accesso.'
