id: inps-assegno-per-il-nucleo-familiare-lavoratori-ag
titolo: Assegno per il Nucleo Familiare – Lavoratori agricoli
ente: INPS
link: https://www.inps.it/it/it/dettaglio-scheda.it.schede-servizio-strumento.schede-servizi.assegno-per-il-nucleo-familiare-lavoratori-agricoli-58681.assegno-per-il-nucleo-familiare-lavoratori-agricoli.html
apertura: null
chiusura: null
fonte: scheda INPS, estratta con LLM (Claude Code, claude-opus-5-5), non rivista
pubblico: persone
ultimo_controllo: '2026-11-18'
requisiti:
- campo: situazioni_particolari
  operatore: interseca
  valori:
  - lavoro_agricolo
  fonte: scheda INPS, A chi è rivolto
  citazione: 'L’ANF spetta ai lavoratori dipendenti agricoli che lavorano in Italia:'
- campo: lavora_in_italia
  operatore: vero
  fonte: scheda INPS, A chi è rivolto
  citazione: che lavorano in Italia
- non_modellabile: 'Operaio agricolo a tempo determinato iscritto negli elenchi nominativi (OTD), oppure operaio a tempo indeterminato
    che lavora per parte dell''anno (OTI): mancano i campi.'
  fonte: scheda INPS, A chi è rivolto
  citazione: operai a tempo determinato, iscritti negli elenchi nominativi dei lavoratori agricoli (OTD)
- non_modellabile: 'Almeno il 70% del reddito del nucleo deve venire da lavoro dipendente e assimilato: manca il campo.'
  fonte: scheda INPS, Come funziona
  citazione: per almeno il 70%, da reddito derivante da lavoro dipendente e assimilato
- non_modellabile: Reddito del nucleo sotto la soglia di esclusione della tipologia familiare, pubblicata nelle tabelle INPS
    annuali che la scheda non riporta.
  fonte: scheda INPS, Come funziona
  citazione: cessa in corrispondenza di soglie di esclusione diverse a seconda della tipologia familiare
- non_modellabile: 'Composizione del nucleo: dal 1° marzo 2022 l''ANF non spetta ai nuclei con figli; i familiari ammessi
    (coniuge o unito civilmente, fratelli, sorelle e nipoti orfani minori o inabili) e le regole per i familiari all''estero
    non si verificano con il vocabolario.'
  fonte: scheda INPS, Domanda
  citazione: limitatamente ai nuclei familiari con figli e orfanili, è abrogato
note:
- Le 101 giornate di lavoro incidono sulla durata dell'assegno (intero anno o giornate lavorate), non sul diritto.
- Gli impiegati in agricoltura sono trattati come dipendenti del settore non agricolo.
- Per gli OTI la domanda può essere presentata entro la prescrizione di cinque anni.
