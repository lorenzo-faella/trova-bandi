id: inps-assegno-di-solidarieta-assistenza-magistrale
titolo: Assegno di solidarietà Assistenza Magistrale
ente: INPS
link: https://www.inps.it/it/it/dettaglio-scheda.it.schede-servizio-strumento.schede-servizi.assegno-di-solidariet-assistenza-magistrale-50251.assegno-di-solidariet-assistenza-magistrale.html
apertura: null
chiusura: null
fonte: scheda INPS, estratta con LLM (Claude Code, claude-opus-5-5), non rivista
pubblico: persone
ultimo_controllo: '2026-11-19'
requisiti:
- campo: situazioni_particolari
  operatore: interseca
  valori:
  - gestione_magistrale
  fonte: scheda INPS, A chi è rivolto
  citazione: i familiari superstiti di iscritti alla Gestione Magistrale
- almeno_uno_di:
  - campo: situazioni_particolari
    operatore: interseca
    valori:
    - superstite
  - non_modellabile: 'Genitore a totale carico dell''iscritto, o fratello/sorella maggiorenne permanentemente inabile al lavoro
      e a carico, ammessi solo in assenza di vedovo/a e orfani: mancano i campi.'
  fonte: scheda INPS, Come funziona
  citazione: 'sono individuati nel seguente ordine:'
- non_modellabile: 'L''iscritto deve essere deceduto in attività di servizio, e il coniuge superstite non deve aver contratto
    nuovo matrimonio: mancano i campi.'
  fonte: scheda INPS, Cos'è
  citazione: deceduti in attività di servizio
- campo: isee
  operatore: <=
  valore: 40000
  fonte: scheda INPS, Come funziona
  citazione: un ISEE non superiore a 40mila euro
note:
- Lo stato di bisogno economico è espresso con la soglia ISEE di 40mila euro, l'unico criterio che la scheda indica.
- 'La condizione del coniuge non risposato riguarda solo i coniugi, ma la scheda non la presenta come eccezione: è inclusa
  nel requisito sul decesso in servizio, senza portata rara.'
