id: inps-indennita-giornaliera-ig-per-malattia-tuberco
titolo: Indennità Giornaliera (IG) per malattia tubercolare
ente: INPS
link: https://www.inps.it/it/it/dettaglio-scheda.it.schede-servizio-strumento.schede-servizi.indennit-giornaliera-ig-per-malattia-tubercolare-50104.indennit-giornaliera-ig-per-malattia-tubercolare.html
apertura: null
chiusura: null
fonte: scheda INPS, estratta con LLM (Claude Code, claude-opus-5-5), non rivista
pubblico: persone
ultimo_controllo: '2026-11-18'
requisiti:
- campo: situazioni_particolari
  operatore: interseca
  valori:
  - malattia_tbc
  fonte: scheda INPS, Domanda
  citazione: 'Il soggetto che si ammala di malattia tubercolare deve essere in possesso:'
- non_modellabile: 'Almeno 52 contributi nell''arco della vita lavorativa: il vocabolario ha solo le settimane di contributi
    degli ultimi 4 anni.'
  fonte: scheda INPS, Domanda
  citazione: di 52 contributi nell'arco della vita lavorativa (requisito contributivo);
- non_modellabile: 'Certificazione sanitaria rilasciata dal Centro medico legale INPS territorialmente competente: si assume
    compresa nella malattia tubercolare riconosciuta, ma va verificata.'
  fonte: scheda INPS, Domanda
  citazione: certificazione rilasciata dal Centro medico legale della struttura INPS territorialmente competente (requisito
    sanitario).
- non_modellabile: 'Non avere diritto all''intera retribuzione durante le cure: manca il campo.'
  fonte: scheda INPS, Cos'è
  citazione: Non spetta qualora il lavoratore abbia diritto all'intera retribuzione.
- non_modellabile: 'Il diritto si prescrive in cinque anni: manca il campo sulla data della malattia.'
  fonte: scheda INPS, Come funziona
  citazione: Il diritto alle indennità antitubercolari si prescrive nel termine di cinque anni.
note:
- 'La scheda prevede una misura ridotta anche per i familiari e per i soggetti non aventi diritto alla tutela, senza dire
  quali requisiti valgano per loro: il requisito contributivo è riferito al soggetto che si ammala.'
