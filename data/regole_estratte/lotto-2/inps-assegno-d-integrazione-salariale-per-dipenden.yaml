id: inps-assegno-d-integrazione-salariale-per-dipenden
titolo: Assegno d'integrazione salariale per dipendenti di aziende iscritte ai fondi di solidarietà
ente: INPS
link: https://www.inps.it/it/it/dettaglio-scheda.it.schede-servizio-strumento.schede-servizi.50226.Assegno-d-integrazione-salariale-per-dipendenti-di-aziende-iscritte-ai-fondi-di-solidarieta.html
apertura: null
chiusura: null
fonte: scheda INPS, estratta con LLM (Claude Code, claude-opus-5-5), non rivista
pubblico: persone
ultimo_controllo: '2026-11-18'
requisiti:
- campo: condizione_lavorativa
  operatore: in
  valori:
  - occupato
  fonte: scheda INPS, Cos'è
  citazione: una tutela in costanza di rapporto di lavoro
- campo: tipo_lavoro
  operatore: in
  valori:
  - dipendente
  fonte: scheda INPS, A chi è rivolto
  citazione: I Fondi di solidarietà assicurano la prestazione di Assegno di integrazione salariale ai lavoratori dipendenti
- non_modellabile: 'Sono esclusi i dirigenti, se la normativa del singolo Fondo non dispone diversamente: manca un campo sulla
    qualifica.'
  fonte: scheda INPS, A chi è rivolto
  citazione: con l’esclusione dei dirigenti (se non diversamente specificato nella normativa di riferimento dei singoli Fondi)
- non_modellabile: 'Il datore di lavoro deve operare in un settore non coperto dall''integrazione salariale ordinaria ed essere
    iscritto a un Fondo di solidarietà: mancano i campi sul datore di lavoro.'
  fonte: scheda INPS, A chi è rivolto
  citazione: la costituzione dei Fondi di solidarietà è prevista per i datori di lavoro che operano in settori non coperti
    dall’integrazione salariale ordinaria
- non_modellabile: 'L''attività lavorativa deve essere sospesa o ridotta per una delle causali di integrazione salariale ordinaria
    o straordinaria, su istanza del datore di lavoro: manca un campo.'
  fonte: scheda INPS, A chi è rivolto
  citazione: a seguito di apposita istanza presentata all’Istituto dai datori di lavoro la cui attività lavorativa è sospesa
    o ridotta
- non_modellabile: 'Il datore di lavoro deve rispettare gli obblighi di informazione e consultazione sindacale (per alcuni
    Fondi serve un accordo aziendale): manca un campo.'
  fonte: scheda INPS, Domanda
  citazione: devono essere rispettati, da parte del datore di lavoro richiedente, gli obblighi di informazione e consultazione
    sindacale
- non_modellabile: 'Solo per il Fondo Trentino, il Fondo Bolzano e il Fondo Attività professionali: anzianità di effettivo
    lavoro presso l''unità produttiva di almeno 30 giorni alla data della domanda. Manca un campo.'
  portata: rara
  fonte: scheda INPS, A chi è rivolto
  citazione: di almeno 30 giorni (Fondo Trentino, Fondo Bolzano, Fondo Attività professionali)
note:
- 'Il mancato rispetto dei termini di domanda non fa perdere il diritto: non è stato considerato requisito.'
- Sono inclusi gli apprendisti di tutte le tipologie e i lavoratori a domicilio, che rientrano tra i dipendenti.
- Per la causale di crisi aziendale sono esclusi i casi di cessazione dell'attività produttiva; il dettaglio delle causali
  non è modellabile.
