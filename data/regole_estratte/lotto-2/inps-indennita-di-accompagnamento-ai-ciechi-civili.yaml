id: inps-indennita-di-accompagnamento-ai-ciechi-civili
titolo: Indennità di accompagnamento ai ciechi civili assoluti
ente: INPS
link: https://www.inps.it/it/it/dettaglio-scheda.it.schede-servizio-strumento.schede-servizi.50081.indennit-di-accompagnamento-ai-ciechi-civili-assoluti.html
apertura: null
chiusura: null
fonte: scheda INPS, estratta con LLM (Claude Code, claude-opus-5-5), non rivista
pubblico: persone
ultimo_controllo: '2026-11-13'
requisiti:
- campo: disabile
  operatore: vero
  fonte: scheda INPS, Domanda
  citazione: riconoscimento della cecità civile assoluta
- non_modellabile: 'La disabilità deve essere la cecità civile assoluta riconosciuta dalla Commissione medico-legale: manca
    un campo sul tipo di minorazione.'
  fonte: scheda INPS, Cos'è
  citazione: in favore di soggetti riconosciuti ciechi assoluti
- almeno_uno_di:
  - campo: cittadinanza
    operatore: in
    valori:
    - italiana
    - ue
    citazione: 'per i cittadini stranieri comunitari: iscrizione all’anagrafe del comune di residenza'
  - tutti_di:
    - campo: cittadinanza
      operatore: in
      valori:
      - familiare_con_diritto_soggiorno
      - extra_ue_lungo_periodo
      - protezione_internazionale
      - apolide
      - altro_titolo
    - campo: mesi_validita_permesso
      operatore: '>='
      valore: 12
    citazione: per i cittadini stranieri extracomunitari permesso di soggiorno di almeno un anno
  fonte: scheda INPS, Domanda
  citazione: per i cittadini stranieri extracomunitari permesso di soggiorno di almeno un anno (articolo 41, Testo Unico immigrazione)
- campo: residente_italia
  operatore: vero
  fonte: scheda INPS, Domanda
  citazione: residenza stabile e abituale sul territorio nazionale
note:
- Non ci sono requisiti di reddito né di età.
- L'incompatibilità con analoghe prestazioni per invalidità di guerra, lavoro o servizio è una regola di cumulo con diritto
  di opzione, quindi non è un requisito.
- Per i cittadini UE l'iscrizione all'anagrafe del comune di residenza è resa con la residenza in Italia.
