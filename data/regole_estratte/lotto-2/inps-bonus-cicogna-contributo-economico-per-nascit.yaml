requisiti:
- campo: situazioni_particolari
  operatore: interseca
  valori:
  - poste_ipost
  fonte: scheda INPS, A chi è rivolto
  citazione: Il concorso è riservato ai dipendenti del Gruppo Poste Italiane SpA e ai dipendenti ex IPOST
- almeno_uno_di:
  - almeno_un_componente:
    - campo: figlio
      operatore: vero
  - non_modellabile: Domanda presentata dal tutore del figlio o dell'orfano del titolare, che può non avere il beneficiario
      come figlio nel nucleo.
  fonte: scheda INPS, Domanda
  citazione: Sono beneficiari del concorso i figli o orfani del titolare del diritto
- non_modellabile: 'Il figlio deve essere nato o adottato nell''anno solare indicato nel bando: la scheda non indica l''anno
    e il termine non si esprime in giorni o mesi dall''evento.'
  fonte: scheda INPS, Domanda
  citazione: nati o adottati nel corso dell’anno solare indicato nel bando di concorso
note:
- La mancata presentazione della DSU fa solo slittare in graduatoria, quindi non è un requisito di accesso.
- 'La domanda possono presentarla anche il coniuge superstite, il genitore non coniugato o il tutore: rientrano nella situazione
  poste_ipost come familiari.'
