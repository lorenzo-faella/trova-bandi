id: inps-indennita-per-morte-ai-superstiti
titolo: Indennità per morte ai superstiti
ente: INPS
link: https://www.inps.it/it/it/dettaglio-scheda.it.schede-servizio-strumento.schede-servizi.indennit-per-morte-ai-superstiti-50303.indennit-per-morte-ai-superstiti.html
apertura: null
chiusura: null
fonte: scheda INPS, estratta con LLM (Claude Code, claude-opus-5-5), non rivista
pubblico: persone
ultimo_controllo: '2026-11-18'
requisiti:
- campo: situazioni_particolari
  operatore: interseca
  valori:
  - superstite
  fonte: scheda INPS, Cos'è
  citazione: L’indennità per morte è una prestazione economica in favore del coniuge superstite di un assicurato iscritto
    in una delle gestioni previdenziali INPS.
- almeno_uno_di:
  - non_modellabile: 'Essere il coniuge superstite e non avere diritto, alla data della morte, alla pensione indiretta: il
      vocabolario non distingue il coniuge dal figlio superstite né il diritto alla pensione indiretta.'
    citazione: nel caso in cui, alla data della morte del defunto, non abbia diritto alla pensione indiretta
  - tutti_di:
    - non_modellabile: 'Figlio dell''assicurato, in mancanza del coniuge, a carico del genitore al momento del decesso: manca
        il campo.'
      citazione: 'In mancanza del coniuge, l’indennità spetta ai figli:'
    - almeno_uno_di:
      - campo: eta
        operatore: <
        valore: 18
        citazione: se di età inferiore ai 18 anni o se inabili al lavoro;
      - non_modellabile: 'Figlio inabile al lavoro: il vocabolario ha la disabilità ma non l''inabilità al lavoro.'
      - tutti_di:
        - almeno_uno_di:
          - tutti_di:
            - campo: eta
              operatore: <
              valore: 21
            - campo: iscrizione
              operatore: in
              valori:
              - scuola_superiore
            citazione: a 21 anni, in caso di frequenza di scuola media o professionale;
          - tutti_di:
            - campo: eta
              operatore: <
              valore: 26
            - campo: iscrizione
              operatore: in
              valori:
              - universita
            citazione: a 26 anni, in caso di frequenza dell’Università.
        - non_modellabile: 'Lo studente non deve lavorare o deve percepire solo un piccolo reddito da lavoro: la scheda non
            indica la soglia.'
        citazione: 'Per i figli studenti che non lavorano o percepiscono un piccolo reddito da lavoro e sono a carico del
          genitore al momento della morte, il limite di 18 anni è elevato:'
  fonte: scheda INPS, A chi è rivolto
  citazione: Al coniuge superstite dell'assicurato (la cui pensione è calcolata con il sistema retributivo o misto)
- non_modellabile: 'La pensione dell''assicurato deceduto deve essere calcolata con il sistema retributivo o misto: manca
    il campo.'
  fonte: scheda INPS, A chi è rivolto
  citazione: la cui pensione è calcolata con il sistema retributivo o misto
- non_modellabile: 'Alla morte dell''assicurato deve risultare versato o accreditato almeno un anno di contribuzione nella
    relativa gestione: manca il campo sulla contribuzione del defunto.'
  fonte: scheda INPS, Domanda
  citazione: risulti versato o accreditato almeno un anno di contribuzione nella relativa gestione
- non_modellabile: 'Domanda entro un anno dalla data della morte dell''assicurato, pena la decadenza: manca il campo sulla
    data del decesso.'
  fonte: scheda INPS, Domanda
  citazione: La domanda deve essere presentata entro un anno dalla data della morte dell’assicurato, pena il decadimento del
    diritto.
note:
- '"Scuola media o professionale" è letta come scuola secondaria superiore, l''unica del vocabolario compatibile con il limite
  di 21 anni.'
- I limiti di 21 e 26 anni sono scritti come età inferiore, per analogia con "età inferiore ai 18 anni".
