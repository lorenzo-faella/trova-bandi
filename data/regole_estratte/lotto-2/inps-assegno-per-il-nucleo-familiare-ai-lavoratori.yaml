id: inps-assegno-per-il-nucleo-familiare-ai-lavoratori
titolo: Assegno per il nucleo familiare ai lavoratori domestici
ente: INPS
link: https://www.inps.it/it/it/dettaglio-scheda.it.schede-servizio-strumento.schede-servizi.assegno-per-il-nucleo-familiare-ai-lavoratori-domestici-51717.assegno-per-il-nucleo-familiare-ai-lavoratori-domestici.html
apertura: null
chiusura: null
fonte: scheda INPS, estratta con LLM (Claude Code, claude-opus-5-5), non rivista
pubblico: persone
ultimo_controllo: '2026-11-18'
requisiti:
- campo: situazioni_particolari
  operatore: interseca
  valori:
  - lavoro_domestico
  fonte: scheda INPS, A chi è rivolto
  citazione: lavoratori domestici e domestici somministrati che hanno effettuato i dovuti versamenti contributivi
- non_modellabile: 'Aver effettuato i versamenti contributivi dovuti come lavoratore domestico: manca un campo sulla contribuzione
    versata.'
  fonte: scheda INPS, A chi è rivolto
  citazione: che hanno effettuato i dovuti versamenti contributivi
- non_modellabile: 'Nucleo familiare composto da più persone secondo la composizione ANF (coniuge o parte di unione civile,
    fratelli, sorelle e nipoti orfani minori o inabili): il vocabolario non distingue questi familiari.'
  fonte: scheda INPS, A chi è rivolto
  citazione: a condizione che il nucleo familiare sia composto da più persone
- non_modellabile: Reddito familiare sotto i limiti di legge fissati ogni anno per tipologia di nucleo, che la scheda non
    riporta.
  fonte: scheda INPS, A chi è rivolto
  citazione: che il reddito sia al di sotto dei limiti stabiliti per legge ogni anno
- non_modellabile: 'Almeno il 70% del reddito del nucleo deve derivare da lavoro dipendente o assimilato: manca il campo sulla
    composizione del reddito familiare.'
  fonte: scheda INPS, Come funziona
  citazione: Il reddito complessivo del nucleo familiare deve essere composto, per almeno il 70%, da reddito derivante da
    lavoro dipendente e/o assimilato.
- non_modellabile: 'Non svolgere altre attività lavorative con diritto al trattamento di famiglia: manca il campo.'
  fonte: scheda INPS, Come funziona
  citazione: Se il lavoratore svolge altre attività lavorative con diritto al trattamento di famiglia, non vengono concessi
    gli Assegni.
note:
- 'Gli arretrati spettano nel limite della prescrizione quinquennale: per periodi più vecchi di cinque anni il diritto si
  perde, ma dipende dal periodo richiesto e non è stato modellato.'
- Per i richiedenti extracomunitari ci sono regole sui familiari residenti all'estero che incidono sulla composizione del
  nucleo, non modellate.
