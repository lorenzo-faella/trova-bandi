id: inps-sostegno-per-lo-studio-all-estero-itaca-per-f
titolo: Sostegno per lo studio all'estero (ITACA) per figli di iscritti alla Gestione Unitaria delle prestazioni creditizie
  e sociali
ente: INPS
link: https://www.inps.it/it/it/dettaglio-scheda.it.schede-servizio-strumento.schede-servizi.50048.sostegno-per-lo-studio-all-estero-itaca-per-figli-di-iscritti-alla-gestione-unitaria-delle-prestazioni-creditizie-e-sociali.html
apertura: null
chiusura: null
fonte: scheda INPS, estratta con LLM (Claude Code, claude-opus-5-5), non rivista
pubblico: persone
ultimo_controllo: '2026-11-18'
requisiti:
- campo: situazioni_particolari
  operatore: interseca
  valori:
  - genitore_dipendente_pubblico
  fonte: scheda INPS, A chi è rivolto
  citazione: 'Il programma di studio all''estero è rivolto ai figli e orfani:'
- campo: iscrizione
  operatore: in
  valori:
  - scuola_superiore
  fonte: scheda INPS, Domanda
  citazione: essere iscritti al secondo o terzo anno di una scuola secondaria di secondo grado;
- non_modellabile: 'Iscrizione al secondo o terzo anno della scuola secondaria di secondo grado: l''anno di corso nel vocabolario
    si chiede solo per università, AFAM e ITS.'
  fonte: scheda INPS, Domanda
  citazione: essere iscritti al secondo o terzo anno di una scuola secondaria di secondo grado;
- non_modellabile: 'Non essere in ritardo nella carriera scolastica: manca il campo per gli studenti della scuola secondaria.'
  fonte: scheda INPS, Domanda
  citazione: non essere in ritardo nella carriera scolastica.
note:
- 'La scheda non dice chi sia il soggetto richiedente: i requisiti sono scritti dal punto di vista dello studente, figlio
  od orfano dell''iscritto. Se la domanda la compila il genitore, scuola e anno andrebbero riferiti al figlio.'
