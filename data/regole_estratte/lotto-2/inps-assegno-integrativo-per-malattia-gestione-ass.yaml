id: inps-assegno-integrativo-per-malattia-gestione-ass
titolo: Assegno integrativo per malattia Gestione Assistenza Magistrale
ente: INPS
link: https://www.inps.it/it/it/dettaglio-scheda.it.schede-servizio-strumento.schede-servizi.51334.assegno-integrativo-per-malattia-gestione-assistenza-magistrale.html
apertura: null
chiusura: null
fonte: scheda INPS, estratta con LLM (Claude Code, claude-opus-5-5), non rivista
pubblico: persone
ultimo_controllo: '2026-11-19'
requisiti:
- campo: situazioni_particolari
  operatore: interseca
  valori:
  - gestione_magistrale
  fonte: scheda INPS, A chi è rivolto
  citazione: Agli iscritti alla Gestione Assistenza Magistrale in servizio.
- campo: condizione_lavorativa
  operatore: in
  valori:
  - occupato
  fonte: scheda INPS, Cos'è
  citazione: riconosciuto agli iscritti in servizio alla Gestione Assistenza Magistrale
- non_modellabile: 'Riduzione del 50% o sospensione della retribuzione a causa di assenze per malattia: manca il campo.'
  fonte: scheda INPS, Cos'è
  citazione: nella riduzione del 50% della retribuzione
- non_modellabile: 'Le assenze per malattia devono risalire a non oltre 12 mesi prima della domanda: manca il campo con la
    data delle assenze.'
  fonte: scheda INPS, Cos'è
  citazione: Le assenze dal servizio per malattia devono essere avvenute non oltre 12 mesi prima della data della domanda.
note:
- 'Il valore gestione_magistrale comprende anche i familiari degli iscritti, mentre l''assegno spetta solo all''iscritto in
  servizio: per questo si chiede anche la condizione di occupato.'
- L'ISEE determina solo la percentuale dell'assegno, non l'idoneità.
