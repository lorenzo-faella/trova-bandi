id: inps-indennita-per-congedo-di-maternita-e-di-pater
titolo: Indennità per congedo di maternità e di paternità alternativo per lavoratrici e lavoratori dipendenti
ente: INPS
link: https://www.inps.it/it/it/dettaglio-scheda.it.schede-servizio-strumento.schede-servizi.50586.indennit-per-congedo-di-maternit-e-di-paternit-alternativo-per-lavoratrici-e-lavoratori-dipendenti.html
apertura: null
chiusura: null
fonte: scheda INPS, estratta con LLM (Claude Code, claude-opus-5-5), non rivista
pubblico: persone
ultimo_controllo: '2026-11-18'
requisiti:
- non_modellabile: 'Gravidanza in corso o parto, oppure adozione o affidamento di un minore: il periodo di congedo varia (flessibilità,
    interdizione, adozione, affidamento non preadottivo) e non si traduce in un termine sui campi dell''evento figlio.'
  fonte: scheda INPS, Cos'è
  citazione: Il congedo di maternità è il periodo di astensione obbligatoria dal lavoro riconosciuto alle lavoratrici dipendenti
    durante la gravidanza e il puerperio.
- almeno_uno_di:
  - tutti_di:
    - campo: condizione_lavorativa
      operatore: in
      valori:
      - occupato
    - campo: tipo_lavoro
      operatore: in
      valori:
      - dipendente
    citazione: Per le lavoratrici e i lavoratori dipendenti è richiesta la sussistenza di un rapporto di lavoro.
  - tutti_di:
    - campo: condizione_lavorativa
      operatore: in
      valori:
      - disoccupato
    - non_modellabile: 'Il congedo deve iniziare entro 60 giorni dall''ultimo giorno di lavoro (anche oltre se spetta disoccupazione,
        mobilità o cassa integrazione; entro 180 giorni con 26 contributi settimanali nei due anni precedenti per chi ha svolto
        lavori esclusi dal contributo di disoccupazione): il termine si conta dall''inizio del congedo, non da oggi.'
    citazione: il congedo di maternità deve iniziare entro 60 giorni dall'ultimo giorno di lavoro
  - tutti_di:
    - campo: situazioni_particolari
      operatore: interseca
      valori:
      - lavoro_domestico
    - non_modellabile: '26 contributi settimanali nell''anno precedente l''inizio del congedo oppure 52 nei due anni precedenti:
        il campo sui contributi copre gli ultimi 4 anni.'
    citazione: sono richiesti 26 contributi settimanali nell'anno precedente l'inizio del congedo di maternità oppure 52 contributi
      settimanali nei due anni precedenti l'inizio del congedo
  - tutti_di:
    - campo: situazioni_particolari
      operatore: interseca
      valori:
      - lavoro_agricolo
    - non_modellabile: 'Qualità di bracciante con iscrizione negli elenchi nominativi annuali per almeno 51 giornate di lavoro
        agricolo nell''anno di inizio del congedo: manca il campo.'
    citazione: iscrizione negli elenchi nominativi annuali per almeno 51 giornate di lavoro agricolo
  - non_modellabile: 'Lavoratrici LSU o APU (attività socialmente utili o di pubblica utilità): manca il campo.'
  fonte: scheda INPS, A chi è rivolto
  citazione: 'Il congedo di maternità spetta a:'
- non_modellabile: 'Se chiede il padre (congedo di paternità alternativo): morte o grave infermità della madre, abbandono
    del figlio da parte della madre, affidamento esclusivo al padre, oppure, in caso di adozione o affidamento, rinuncia della
    madre lavoratrice. Mancano i campi sul genitore che chiede e sugli eventi che riguardano la madre.'
  fonte: scheda INPS, Come funziona
  citazione: è riconosciuto quando si verificano eventi che riguardano la madre del bambino
- non_modellabile: 'Domanda entro un anno dalla fine del periodo indennizzabile, pena la prescrizione: la fine del periodo
    varia caso per caso e non si ricava dalla sola data dell''evento.'
  fonte: scheda INPS, Domanda
  citazione: mai oltre un anno dalla fine del periodo indennizzabile, pena la prescrizione del diritto all'indennità
note:
- 'Le lavoratrici dipendenti da amministrazioni pubbliche rientrano tra i destinatari, ma l''indennità la paga l''amministrazione
  da cui dipendono: sono coperte dall''alternativa dei dipendenti occupati.'
- Le lavoratrici sospese hanno un rapporto in corso e ricadono nell'alternativa dei dipendenti occupati.
- 'Non c''è un campo sul sesso o sul ruolo di genitore del richiedente: il requisito sul padre resta da verificare.'
