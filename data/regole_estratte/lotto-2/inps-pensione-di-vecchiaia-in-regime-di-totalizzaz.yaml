  citazione: che hanno versato contributi in diverse casse, gestioni o fondi previdenziali
- non_modellabile: 'Anzianità contributiva complessiva di almeno 20 anni (1.040 contributi settimanali): il vocabolario conta
    solo le settimane degli ultimi 4 anni.'
  fonte: scheda INPS, Domanda
  citazione: anzianità contributiva complessiva di almeno 20 anni (1.040 contributi settimanali)
- non_modellabile: 'Ulteriori requisiti dei singoli ordinamenti, come cessazione del rapporto di lavoro o cancellazione dall''albo:
    mancano i campi.'
  fonte: scheda INPS, Domanda
  citazione: sussistenza degli ulteriori requisiti, diversi da quelli di età e anzianità contributiva
- non_modellabile: Esclusa la trasformazione dell'assegno ordinario di invalidità in pensione di vecchiaia.
  portata: rara
  fonte: scheda INPS, Domanda
  citazione: La totalizzazione è preclusa in caso di trasformazione dell’assegno ordinario di invalidità in pensione di vecchiaia.
note:
- 'La soglia di 65 anni è un minimo: con l''adeguamento alla speranza di vita l''età effettiva è più alta.'
