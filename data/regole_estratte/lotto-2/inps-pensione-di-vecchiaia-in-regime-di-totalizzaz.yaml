id: inps-pensione-di-vecchiaia-in-regime-di-totalizzaz
titolo: Pensione di vecchiaia in regime di totalizzazione
ente: INPS
link: https://www.inps.it/it/it/dettaglio-scheda.it.schede-servizio-strumento.schede-servizi.50305.pensione-di-vecchiaia-in-regime-di-totalizzazione.html
apertura: null
chiusura: null
fonte: scheda INPS, estratta con LLM (Claude Code, claude-opus-5-5), non rivista
pubblico: persone
ultimo_controllo: '2026-11-18'
requisiti:
- non_modellabile: 'Aver versato contributi in diverse casse, gestioni o fondi previdenziali come lavoratore dipendente, autonomo
    o libero professionista: manca il campo.'
  fonte: scheda INPS, A chi è rivolto
  citazione: che hanno versato contributi in diverse casse, gestioni o fondi previdenziali
- campo: eta
  operatore: '>='
  valore: 65
  fonte: scheda INPS, Domanda
  citazione: raggiungimento di 65 anni di età, sia per gli uomini sia per le donne;
- non_modellabile: 'Anzianità contributiva complessiva di almeno 20 anni (1.040 contributi settimanali): manca il campo sugli
    anni di contribuzione.'
  fonte: scheda INPS, Domanda
  citazione: anzianità contributiva complessiva di almeno 20 anni (1.040 contributi settimanali);
- non_modellabile: 'Ulteriori requisiti previsti dai singoli ordinamenti per la pensione di vecchiaia (cessazione del rapporto
    di lavoro, cancellazione dall''albo professionale, ecc.): mancano i campi.'
  fonte: scheda INPS, Domanda
  citazione: sussistenza degli ulteriori requisiti, diversi da quelli di età e anzianità contributiva
- non_modellabile: 'La totalizzazione è preclusa se la pensione di vecchiaia deriva dalla trasformazione dell''assegno ordinario
    di invalidità: manca il campo.'
  portata: rara
  fonte: scheda INPS, Domanda
  citazione: La totalizzazione è preclusa in caso di trasformazione dell’assegno ordinario di invalidità in pensione di vecchiaia.
note:
- 'Dal 1° gennaio 2013 il requisito di 65 anni è adeguato alla speranza di vita, ma la scheda non dice il valore attuale:
  65 anni è solo il minimo scritto.'
