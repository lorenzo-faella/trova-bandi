- non_modellabile: Dal 2013 l'età richiesta è adeguata alla speranza di vita, e la scheda non riporta il valore aggiornato.
  fonte: scheda INPS, Domanda
  citazione: Il requisito anagrafico a decorrere dal 1° gennaio 2013 viene adeguato alla speranza di vita.
- non_modellabile: 'Contributi versati in più casse, gestioni o fondi previdenziali: manca il campo.'
