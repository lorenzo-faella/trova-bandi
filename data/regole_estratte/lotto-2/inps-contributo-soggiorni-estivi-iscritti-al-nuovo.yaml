id: inps-contributo-soggiorni-estivi-iscritti-al-nuovo
titolo: Contributo soggiorni estivi iscritti al Nuovo Fondo Mutualità IPOST
ente: INPS
link: https://www.inps.it/it/it/dettaglio-scheda.it.schede-servizio-strumento.schede-servizi.50036.contributo-soggiorni-estivi-iscritti-al-nuovo-fondo-mutualit-ipost.html
apertura: null
chiusura: null
fonte: scheda INPS, estratta con LLM (Claude Code, claude-opus-5-5), non rivista
pubblico: persone
ultimo_controllo: '2026-11-18'
requisiti:
- campo: situazioni_particolari
  operatore: interseca
  valori:
  - poste_ipost
  fonte: scheda INPS, A chi è rivolto
  citazione: I destinatari del concorso sono gli iscritti al Nuovo Fondo di Mutualità dell'ex IPOST.
- non_modellabile: 'Iscrizione al Nuovo Fondo di Mutualità dell''ex IPOST con un capitale di almeno mille euro: il vocabolario
    ha solo la situazione Poste/ex IPOST, non l''iscrizione al fondo né il capitale.'
  fonte: scheda INPS, Domanda
  citazione: Per l'ammissione al concorso occorre essere iscritti al Nuovo Fondo di Mutualità con un capitale di almeno mille
    euro.
note:
- 'Chi presenta domanda anche per il concorso "Cure termali - Nuova mutualità" non perde il diritto: viene considerata solo
  l''ultima domanda presentata, quindi non è stato scritto come requisito.'
