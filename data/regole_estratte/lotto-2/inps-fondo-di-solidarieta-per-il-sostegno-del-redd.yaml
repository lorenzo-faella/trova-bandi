id: inps-fondo-di-solidarieta-per-il-sostegno-del-redd
titolo: Fondo di solidarietà per il sostegno del reddito, dell’occupazione e della riconversione e riqualificazione professionale
  del personale del Gruppo Poste Italiane
ente: INPS
link: https://www.inps.it/it/it/dettaglio-scheda.it.schede-servizio-strumento.schede-servizi.50261.fondo-solidariet--per--sostegno-reddito-del-personale-gruppo-poste-italiane.html
apertura: null
chiusura: null
fonte: scheda INPS, estratta con LLM (Claude Code, claude-opus-5-5), non rivista
pubblico: persone
ultimo_controllo: '2026-11-18'
requisiti:
- campo: situazioni_particolari
  operatore: interseca
  valori:
  - poste_ipost
  fonte: scheda INPS, A chi è rivolto
  citazione: dipendenti di Poste Italiane SpA e delle società del Gruppo Poste Italiane
- campo: tipo_lavoro
  operatore: in
  valori:
  - dipendente
  fonte: scheda INPS, A chi è rivolto
  citazione: tutti i lavoratori, esclusi i dirigenti, dipendenti di Poste Italiane SpA
- non_modellabile: 'Esclusi i dirigenti e i dipendenti delle società del gruppo con licenza bancaria, di trasporto aereo o
    di corriere espresso; la società deve essere controllata da Poste Italiane SpA: mancano i campi.'
  fonte: scheda INPS, A chi è rivolto
  citazione: Sono escluse le società con licenza bancaria, di trasporto aereo e quelle che svolgono attività di corriere espresso.
- non_modellabile: 'Procedure contrattuali concluse con un accordo aziendale: dipende dall''azienda, manca il campo.'
  fonte: scheda INPS, Domanda
  citazione: Queste procedure si devono concludere con un accordo aziendale.
- non_modellabile: 'Essere interessati da riduzione dell''orario o sospensione dell''attività per le cause dell''integrazione
    salariale ordinaria o straordinaria, oppure essere destinatari di un accordo su programmi formativi: manca il campo.'
  fonte: scheda INPS, Domanda
  citazione: interessati da riduzione dell’orario di lavoro o sospensione dell’attività lavorativa
- non_modellabile: 'Per l''Assegno di integrazione salariale, non svolgere attività lavorativa per terzi durante la riduzione
    o sospensione: manca il campo.'
  fonte: scheda INPS, Domanda
  citazione: non svolga alcun tipo di attività lavorativa in favore di soggetti terzi
note:
- Dal 1° gennaio 2022 rientrano anche gli apprendisti e i lavoratori a domicilio.
- La domanda è presentata dall'azienda e la concessione dipende dalle disponibilità del Fondo.
