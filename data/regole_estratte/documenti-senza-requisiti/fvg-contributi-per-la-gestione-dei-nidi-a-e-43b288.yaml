id: fvg-contributi-per-la-gestione-dei-nidi-a-e-43b288
titolo: Contributi per la gestione dei nidi - A.E. 2024-2025 Contributi ai soggetti che gestiscono nidi d'infanzia, per contenere
  le rette a carico delle famiglie.
ente: Regione Autonoma Friuli Venezia Giulia
link: https://www.regione.fvg.it/rafvg/cms/RAFVG/famiglia-casa/politiche-famiglia/FOGLIA45/
apertura: '2025-02-01'
chiusura: '2025-02-28'
fonte: documento Regione Autonoma Friuli Venezia Giulia, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti: []
note:
- 'Il bando è rivolto solo ai gestori pubblici, privati e del privato sociale di nidi d''infanzia accreditati (e ai soggetti
  da loro delegati), non alle famiglie: il contributo serve a contenere le rette, ma il beneficiario è il gestore.'
- 'Termini: domanda dal 01 al 28 febbraio 2025 tramite Istanze Online (IOL), pena esclusione. Il regolamento (art. 7) prevede
  in via generale la finestra dal 1° maggio al 31 luglio di ogni anno, ma la pagina web indica la novità di febbraio 2025.'
