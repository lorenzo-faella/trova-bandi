note:
- 'La manifestazione di interesse è rivolta agli enti formativi che vogliono entrare nel catalogo dei corsi per il Cabin Crew
  Attestation, non alle persone: i voucher per i disoccupati residenti in Sardegna (18-35 anni secondo la DGR citata) sono
  disciplinati da un avviso ASPAL distinto.'
- Le domande degli enti si inviano via PEC dalla data di approvazione della determinazione (n. 1075 del 15.04.2026) fino alle
  ore 12:00 del 15/05/2026; la pagina segnala anche una riapertura (Determinazione 1465 del 19.05.2026) di cui il documento
  non riporta le date.
