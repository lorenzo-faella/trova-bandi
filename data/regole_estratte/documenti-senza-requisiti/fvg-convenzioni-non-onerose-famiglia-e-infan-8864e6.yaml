note:
- L'avviso è rivolto agli esercizi commerciali di vendita al dettaglio che aderiscono alle convenzioni, non a persone. Le
  famiglie ricevono gli sconti solo in quanto titolari o beneficiari di Carta famiglia in corso di validità, i cui requisiti
  sono disciplinati in un'altra pagina non inclusa.
- 'Adesione possibile in qualsiasi momento: nessuna data di apertura o chiusura.'
