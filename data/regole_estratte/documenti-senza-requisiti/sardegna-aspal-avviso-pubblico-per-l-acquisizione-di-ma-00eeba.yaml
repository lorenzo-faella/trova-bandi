titolo: Avviso Pubblico per l'acquisizione di manifestazione d'interesse da parte delle Agenzie Formative accreditate nel
  Sistema Regione, per l’organizzazione e l’attivazione dei percorsi di formazione dedicati all’autoimprenditorialità (con
  indicazione delle modalità di erogazione) - PROGRAMMA NAZIONALE JUST TRANSITION FUND ITALIA 2021-2027
ente: ASPAL - Agenzia sarda per le politiche attive del lavoro
link: https://agenziaregionaleperillavoro.regione.sardegna.it/j/v/2362?s=44&v=9&c=14207&c1=4920&id=118093&b=
apertura: null
chiusura: '2026-11-10'
fonte: documento ASPAL - Agenzia sarda per le politiche attive del lavoro, estratto con LLM (Claude Code, claude-opus-5-5),
  non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti: []
note:
- 'L''avviso raccoglie manifestazioni d''interesse delle Agenzie Formative accreditate presso la Regione Autonoma della Sardegna
  per entrare nella Short List: è rivolto a enti, non a persone.'
- 'Le persone sono destinatarie dei percorsi di autoimpiego (Programma JTF), a cui accedono tramite presa in carico del CPI,
  non con questo avviso. Per informazione, i requisiti dei destinatari sono: residenza o domicilio in uno dei comuni del Sulcis
  Iglesiente elencati; iscrizione nell''elenco anagrafico del CPI di Carbonia o Iglesias; età non inferiore ai 18 anni; cittadinanza
  UE o titolo di soggiorno valido; essere disoccupato con DID e PSP, oppure occupato, oppure percettore di sostegno al reddito
  in costanza di rapporto di lavoro con PSP; avere un''idea imprenditoriale o professionale da sviluppare.'
- Le manifestazioni d'interesse si presentano dalla data di pubblicazione dell'avviso (non indicata nelle parti ricevute)
  fino al 10 novembre 2026.
