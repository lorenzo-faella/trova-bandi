note:
- 'L''avviso è rivolto solo agli Enti promotori (pubblici e privati no profit) iscritti all''Albo degli Enti di Leva Civica
  Lombarda Volontaria, che presentano i progetti: le persone non fanno domanda su questo avviso.'
- 'Le persone anziane sono destinatarie finali e si candidano poi presso l''Ente promotore. I requisiti dei destinatari (paragrafo
  A.4) sono: età pari o superiore a 65 anni; essere pensionati, percettori di altre prestazioni assistenziali oppure inattivi
  (né occupati né disoccupati); cittadinanza italiana o UE oppure regolare permesso di soggiorno; residenza in Lombardia;
  nessun rapporto di lavoro con l''ente titolare o ospitante nei 12 mesi precedenti; partecipazione possibile una sola volta.'
- Le date di apertura e chiusura si riferiscono alla presentazione dei progetti da parte degli Enti; i percorsi per i destinatari
  partono dal 1 aprile 2027.
