id: toscana-contributi-per-attivare-tirocini-non-cur-713b6d
titolo: Contributi per attivare tirocini non curriculari per donne inserite in percorsi di uscita dalla violenza
ente: Regione Toscana
link: https://www.regione.toscana.it/-/contributi-per-attivare-tirocini-non-curriculari-per-donne-inserite-in-percorsi-di-uscita-dalla-violenza
apertura: '2024-03-28'
chiusura: '2026-12-31'
fonte: documento Regione Toscana, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti: []
note:
- 'Il contributo è chiesto e ricevuto dai soggetti ospitanti privati ("Possono presentare richiesta di contributo, a valere
  sul presente avviso, i soggetti ospitanti"), con sede o unità operativa in Toscana: non è rivolto a persone. Le donne inserite
  in percorsi di uscita dalla violenza (maggiorenni, residenti o domiciliate in Toscana, disoccupate iscritte a un CPI toscano,
  con Progetto per l''Occupabilità) sono solo le destinatarie dei tirocini.'
- Domande dal 28 marzo 2024 (giorno dopo la pubblicazione sul BURT del 27 marzo 2024) fino al 31 dicembre 2026, salvo esaurimento
  delle risorse annuali.
