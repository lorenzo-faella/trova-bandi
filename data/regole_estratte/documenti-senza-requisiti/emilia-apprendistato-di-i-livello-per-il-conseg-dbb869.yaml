id: emilia-apprendistato-di-i-livello-per-il-conseg-dbb869
titolo: Apprendistato di I livello per il conseguimento di una qualifica professionale, di un diploma professionale o di un
  diploma di istruzione secondaria superiore nei percorsi realizzati dalle istituzioni scolastiche
ente: Regione Emilia-Romagna
link: https://formazionelavoro.regione.emilia-romagna.it/leggi-atti-bandi/bandi-regionali/bandi-per-annualita/2026/apprendistato-di-ideg-livello-per-il-conseguimento-di-una-qualifica-professionale-di-un-diploma-professionale-o-di-un-diploma-di-istruzione-secondaria-superiore-nei-percorsi-realizzati-dalle-istituzioni-scolastiche
apertura: '2026-10-15'
chiusura: '2028-10-30'
fonte: documento Regione Emilia-Romagna, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti: []
note:
- La domanda (candidatura di ammissione ai cataloghi) è presentata dalle istituzioni scolastiche, firmata dal legale rappresentante;
  tra chi può fare domanda sono indicati solo scuole, università ed enti di formazione. Il bando non è rivolto a persone che
  fanno domanda direttamente.
- 'I destinatari finali delle misure finanziate con voucher sono giovani apprendisti: iscritti a un percorso IeFP o di istruzione
  secondaria di secondo grado, tra i 15 anni compiuti e il compimento dei 25, con contratto di apprendistato ai sensi dell''art.
  43 del D.lgs. 81/2015, occupati in sedi operative in Emilia-Romagna. La verifica dei requisiti spetta all''istituzione scolastica.'
- Candidature istruite mensilmente; termine ultimo 30 ottobre 2028.
