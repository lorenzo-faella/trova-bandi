note:
- 'L''Avviso è una manifestazione d''interesse rivolta solo alle strutture sanitarie private autorizzate che chiedono di entrare
  nel Catalogo della misura "Buoni Servizi Sanitari": chi presenta domanda non è una persona, quindi nessun requisito per
  persone.'
- I destinatari finali della misura (Art. 13) sono i cittadini residenti in Sardegna, con permesso di soggiorno se extra UE,
  con ricetta di priorità U o B per prestazioni dell'Allegato A, e con ISEE fino a 10.000 euro oppure esenzione per reddito;
  i cittadini non presentano domanda con questo Avviso ma si rivolgono alle strutture del Catalogo, informate da un Avviso
  divulgativo separato.
- La domanda telematica delle strutture si apre il 10.12.2025; la prima versione del Catalogo comprende le istanze pervenute
  entro il 20.12.2025, ma il Catalogo viene aggiornato almeno due volte l'anno con nuove candidature, quindi non c'è una chiusura
  definitiva.
