note:
- 'L''avviso è rivolto solo agli organismi di formazione accreditati (soggetti gestori), che candidano le operazioni in partenariato
  con scuole, università e imprese: le persone non fanno domanda.'
- I destinatari finali dei percorsi sono giovani fino al compimento dei 25 anni assunti con contratto di apprendistato ai
  sensi dell'art. 43 del D.Lgs. 81/2015, ma non presentano domanda in questo avviso.
- Le operazioni vanno inviate entro le ore 12 del 14/07/2027, con istruttorie a scadenze intermedie (16/09/2026, 18/11/2026,
  27/01/2027, 24/03/2027, 19/05/2027). Il documento non indica una data di apertura.
