note:
- 'Il concorso è rivolto a istituti scolastici e formativi con sede in Lombardia (anche in partenariato con enti locali e
  organizzazioni senza scopo di lucro): la candidatura è presentata dalla scuola e il premio è erogato all''istituzione vincitrice,
  non a persone. Nessun requisito per persone.'
- I progetti sono elaborati da gruppi di almeno due studenti delle classi quinte della primaria, terze della secondaria di
  primo grado, dell'ultimo triennio della secondaria di secondo grado o delle classi terze e quarte IeFP, con i docenti.
- Domande dalle 9:00 del 6 novembre 2026 alle 17:00 del 7 febbraio 2027.
