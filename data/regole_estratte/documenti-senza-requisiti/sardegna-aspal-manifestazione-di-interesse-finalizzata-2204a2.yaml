note:
- 'La manifestazione di interesse è rivolta solo agli enti formativi che erogano corsi per la licenza di pilota di linea (ATPL),
  per costituire il catalogo formativo: non è rivolta a persone.'
- 'I voucher formativi saranno destinati a ''disoccupati residenti in Sardegna da almeno 12 mesi'' tramite un distinto Avviso
  pubblico ASPAL, non contenuto in questo documento: quei requisiti andranno estratti da quell''avviso.'
- Le manifestazioni si inviano via PEC a partire dalla data di pubblicazione della determinazione (pubblicazione online 19/06/2026)
  e restano aperte fino a esaurimento delle risorse; quelle arrivate entro il 20/07/2026 saranno istruite entro il 30/08/2026.
