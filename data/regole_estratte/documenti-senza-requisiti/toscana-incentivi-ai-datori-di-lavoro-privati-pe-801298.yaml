note:
- 'Il bando è rivolto solo ai datori di lavoro privati (imprese, enti, associazioni, liberi professionisti), con esclusione
  delle persone fisiche come datori di lavoro domestico: i lavoratori disoccupati, le donne, i disabili e gli svantaggiati
  sono destinatari dell''assunzione, non beneficiari del contributo.'
- Dall'8 luglio 2026 il bando è sospeso per le categorie a)-e) dell'art. 5 e resta aperto solo per le assunzioni di persone
  con disabilità iscritte al collocamento mirato (lettera f).
- Domande dal 9 novembre 2023 con finestre annuali; l'ultima finestra (assunzioni 2027) va dall'11 gennaio 2027 alle ore 12
  del 10 gennaio 2028, salvo esaurimento delle risorse. La pagina indica come scadenza corrente il 10.01.2027 (assunzioni
  2026).
