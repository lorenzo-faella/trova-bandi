note:
- Il concorso è rivolto solo a istituti secondari di II grado statali o paritari della Sardegna (anche in partenariato con
  associazioni), che presentano la domanda tramite il Dirigente Scolastico (artt. 2 e 3); gli studenti sono destinatari diretti
  delle attività ma non fanno domanda. Nessun requisito per persone.
