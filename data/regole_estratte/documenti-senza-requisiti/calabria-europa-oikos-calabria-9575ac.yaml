note:
- 'La domanda di finanziamento può essere presentata solo dagli Enti Bilaterali del settore edile e dell''artigianato edile
  accreditati (eventualmente associati con organismi di formazione, università, ITS), non da persone: per questo non si estraggono
  requisiti.'
- I destinatari finali dei percorsi formativi sono persone disoccupate, inoccupate o inattive, residenti o domiciliate in
  Calabria, in età lavorativa, con il titolo di studio richiesto dal percorso e, se non comunitarie, con permesso di soggiorno
  valido e conoscenza base dell'italiano; non presentano domanda sull'avviso e sono selezionati dall'ente.
- Le domande si presentano dalle ore 10:00 del 27/04/2026 fino a esaurimento risorse, tramite piattaforma regionale con SPID.
