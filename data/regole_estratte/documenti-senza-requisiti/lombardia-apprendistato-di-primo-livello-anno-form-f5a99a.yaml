  possono rivolgersi alle istituzioni scolastiche e formative"). Nessun requisito per persone.
- Il documento dice che i percorsi sono rivolti a giovani dai 15 ai 25 anni non compiuti con contratto di apprendistato di
  primo livello; i requisiti dettagliati dei destinatari sono nel paragrafo A.4, che non è tra le sezioni ricevute.
- 'Nota 10 del documento: il percorso e il contratto devono essere attivati tra il 1° giugno 2025 e il 29 agosto 2026 e concludersi
  entro il 31 marzo 2027.'
- Procedura a sportello dalle 10:00 del 30 settembre 2025 alle 14:00 del 4 settembre 2026, fino a esaurimento risorse.
