note:
- 'La pagina finanzia progetti di mobilità transnazionale "rivolti a studenti delle istituzioni scolastiche secondarie autonome
  della Toscana": i progetti sono presentati e gestiti dalle scuole (graduatoria di progetti, "Modalità operative bando scuole"),
