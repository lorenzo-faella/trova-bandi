note:
- 'I progetti possono essere presentati solo da istituzioni scolastiche e organismi di formazione accreditati per i percorsi
  IeFP: l''avviso non è rivolto a persone.'
- Gli studenti (iscritti dalla seconda classe in poi di un percorso triennale o quadriennale IeFP, età tra 15 e 34 anni all'avvio
  dello stage) sono destinatari finali di un'attività curricolare organizzata dalla scuola, non presentano domanda.
- 'Proposte presentabili dall''adozione dell''atto (DGR n. 1168 del 09/10/2026) fino alle ore 12.00 del 30/06/2030, con procedura
  a sportello: le date riguardano gli enti proponenti.'
