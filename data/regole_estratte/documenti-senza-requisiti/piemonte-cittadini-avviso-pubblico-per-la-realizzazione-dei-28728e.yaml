id: piemonte-cittadini-avviso-pubblico-per-la-realizzazione-dei-28728e
titolo: Avviso pubblico per la realizzazione dei percorsi formativi in apprendistato di Alta Formazione e di Ricerca. Validità
  2022-2024
ente: Regione Piemonte
link: https://bandi.regione.piemonte.it/contributi-finanziamenti/avviso-pubblico-realizzazione-dei-percorsi-formativi-apprendistato-alta-formazione-ricerca-validita
apertura: '2022-05-16'
chiusura: '2026-11-10'
fonte: documento Regione Piemonte, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-13'
requisiti: []
note:
- 'L''avviso non è rivolto a persone: la domanda di contributo la presentano solo le istituzioni formative (Fondazioni ITS,
  università, istituzioni AFAM, istituzioni di ricerca) con almeno una sede operativa in Piemonte iscritta all''anagrafe regionale,
  con firma digitale del legale rappresentante. Gli apprendisti tra 18 e 29 anni assunti con contratto di apprendistato di
  alta formazione e ricerca sono destinatari dei percorsi ma non fanno domanda.'
- Il testo dell'avviso indica domande a sportello dal 16 maggio 2022 al 10 novembre 2024 (di norma da gennaio al 10 novembre
  di ogni anno); la durata è stata estesa al 31/12/2026 con D.D. 807/2024 e la pagina web indica come scadenza il 10/11/2026
  alle 16:00, che ho usato come chiusura.
