titolo: PNRR - GOL APL - Agenzie per il lavoro nell'ambito GOL Attuazione delle misure di accompagnamento al lavoro nell’ambito
  delle azioni per la cooperazione tra sistema pubblico/privato - Agenzie per il Lavoro nell’ambito GOL.
ente: Regione Autonoma Friuli Venezia Giulia
