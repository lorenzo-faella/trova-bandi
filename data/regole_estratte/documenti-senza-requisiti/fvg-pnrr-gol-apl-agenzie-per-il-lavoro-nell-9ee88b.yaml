requisiti: []
note:
- 'L''avviso serve a selezionare le Agenzie per il lavoro accreditate (singole o in ATI) che erogano i servizi del Programma
  GOL: le candidature sono presentate solo da questi soggetti, non da persone.'
- 'I cittadini beneficiari dei servizi (residenti o domiciliati in Friuli Venezia Giulia, non già in altra politica attiva,
  appartenenti alle categorie GOL e assegnati dal CPI al Percorso 4 o con maggiore intensità di servizio) non presentano domanda
  con questo avviso: vengono assegnati dal Centro per l''impiego dopo l''assessment.'
- 'Termini per le candidature delle agenzie: dal giorno successivo alla pubblicazione sul BUR fino al trentesimo giorno successivo;
  la data di pubblicazione non è nel testo ricevuto.'
