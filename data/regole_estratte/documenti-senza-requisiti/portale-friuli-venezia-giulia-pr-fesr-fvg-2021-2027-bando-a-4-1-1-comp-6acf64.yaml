requisiti: []
note:
- 'Il bando è rivolto solo a un''Associazione temporanea (ATI) di enti di formazione accreditati, che propone il Catalogo
  formativo S4, e alle imprese con sede operativa in Friuli Venezia Giulia che beneficiano della formazione (beneficiari finali
  dell''aiuto): le persone non fanno domanda.'
- I partecipanti ai corsi (lavoratori, titolari, soci di cooperative, componenti dei CdA di imprese con unità produttive in
  regione) sono individuati dalle imprese committenti e non presentano domanda; sono esclusi tra gli altri i dipendenti pubblici
  e i lavoratori somministrati.
- 'La proposta dell''ATI andava presentata via PEC dal giorno successivo alla pubblicazione nel BUR (data non indicata) entro
  le ore 12.00 del 1 marzo 2024. Le commesse aziendali (cloni) potevano essere presentate non oltre il 31 dicembre 2025 e
  concludersi entro il 30 giugno 2026: il bando risulta scaduto.'
