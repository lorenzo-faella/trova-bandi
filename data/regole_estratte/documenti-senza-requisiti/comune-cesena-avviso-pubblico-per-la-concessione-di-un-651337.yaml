note:
- L'avviso riguarda la concessione di locali dell'immobile Ex Arrigoni per un pubblico esercizio ed è rivolto solo a imprese
  individuali, società, cooperative, consorzi, Enti del Terzo Settore e raggruppamenti, non a persone fisiche come beneficiari.
- Plico al Protocollo Generale del Comune di Cesena entro le ore 13:00 del 23/11/2026; la notizia è pubblicata il 28/09/2026.
