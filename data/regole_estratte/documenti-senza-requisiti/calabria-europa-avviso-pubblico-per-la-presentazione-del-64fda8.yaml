note:
- 'L''avviso finanzia percorsi IeFP in modalità duale: le domande possono essere presentate esclusivamente dagli Enti di formazione
  professionale accreditati dalla Regione Calabria (art. 5), non da persone. Per questo non si estraggono requisiti.'
- I giovani destinatari (14-17 anni con licenza media per la Linea 1, 17-25 anni prosciolti senza diploma per la Misura 5,
  17-25 anni con qualifica IeFP per la Linea 2) si iscrivono ai percorsi presso gli enti e non presentano domanda sull'avviso.
- Le candidature si presentano dalle ore 8:00 del giorno successivo alla pubblicazione dell'avviso (data non indicata nelle
  sezioni ricevute) entro le ore 23:59 del 17 settembre 2024, via PEC.
