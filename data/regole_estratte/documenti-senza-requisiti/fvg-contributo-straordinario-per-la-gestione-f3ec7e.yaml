note:
- 'Il contributo straordinario è rivolto solo ai gestori pubblici, privati e del privato sociale di nidi d''infanzia accreditati
  (e ai soggetti da loro delegati) che al 28/02/2026 non avevano già presentato domanda: non riguarda persone o famiglie.'
- 'Termine: domanda entro il 21/09/2026 tramite Istanze OnLine (IOL), pena esclusione; data di apertura non indicata.'
