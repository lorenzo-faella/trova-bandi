requisiti:
- campo: cittadinanza
  operatore: in
  valori:
  - italiana
  - ue
  fonte: Comune di Caltanissetta, pagina 1
  citazione: 'Cittadinanza: italiana o di uno Stato membro dell''Unione Europea.'
- campo: eta
  operatore: tra
  valore:
  - 18
  - 70
  fonte: Comune di Caltanissetta, pagina 1
  citazione: 'Età: compresa tra i 18 e i 70 anni.'
- campo: titolo_di_studio
  operatore: in
  valori:
  - licenza_media
  - diploma
  - laurea_triennale
  - laurea_magistrale
  - master
  - dottorato
  fonte: Comune di Caltanissetta, pagina 1
  citazione: 'Titolo di studio: licenza media inferiore (diploma di scuola secondaria di primo grado) o titolo equivalente.'
- non_modellabile: 'Godimento dei diritti civili e politici, assenza di condanne penali, procedimenti penali in corso, sanzioni
    per violazioni ambientali e interdizioni dai pubblici uffici. Scelta: non chiediamo dati giudiziari.'
  fonte: Comune di Caltanissetta, pagina 1
  citazione: assenza di condanne penali o procedimenti penali in corso
- non_modellabile: 'Assenza di rapporti lavorativi o professionali con l''azienda di igiene urbana del Comune e di altre situazioni
    di incompatibilità: manca il campo.'
  fonte: Comune di Caltanissetta, pagina 1
  citazione: assenza di rapporti lavorativi o professionali con l'azienda che gestisce il servizio di igiene urbana sul territorio
    comunale.
- non_modellabile: 'Buona conoscenza del territorio comunale e idoneità psico-fisica alle attività, da certificare prima della
    nomina: mancano i campi.'
  fonte: Comune di Caltanissetta, pagina 1
  citazione: buona conoscenza del territorio comunale e idoneità psico-fisica allo svolgimento delle attività
note:
- Non è un contributo economico ma una candidatura come ispettore ambientale volontario; i requisiti sono comunque rivolti
  a persone fisiche.
- L'avviso non richiede la residenza a Caltanissetta, solo la conoscenza del territorio comunale.
- 'Per la nomina servono anche l''idoneità formativa (corso comunale gratuito di almeno 20 ore, frequenza dell''80% e valutazione
  finale) e il superamento del colloquio: sono fasi della selezione, non requisiti alla scadenza.'
- 'La data di apertura non è indicata: la scadenza è alle 12:00 del 30 novembre 2026, trentesimo giorno dalla prima pubblicazione.'
