note:
- 'Le tipologie di servizio sono due: la prima passa da un concorso con gli stessi requisiti di reddito e merito della borsa
  di studio regionale (non riportati qui); la seconda è aperta a qualsiasi studente senza requisiti di reddito e merito, quindi
  l''unico requisito comune è essere studente.'
- 'Il documento dice solo ''studente'': si è usata l''iscrizione all''università; non è chiaro se valga anche per AFAM o ITS
  né se serva l''iscrizione a un ateneo di Verona.'
- Il documento non indica il periodo per presentare le domande.
