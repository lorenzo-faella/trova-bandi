id: comune-trani-avviso-pubblico-per-manifestazioni-di-in-d53b30
titolo: Avviso Pubblico per manifestazioni di interesse da parte di soggetti disponibili a stipulare una convenzione con il
  Comune di Trani per la gestione del Servizio Doposcuola a. s. 2026/2027.
ente: Comune di Trani
link: https://www.comune.trani.bt.it/it/news/avviso-pubblico-per-manifestazioni-di-interesse-da-parte-di-soggetti-disponibili-a-stipulare-una-convenzione-con-il-comune-di-trani-per-la-gestione-del-servizio-doposcuola-a-s-2026-2027
apertura: null
chiusura: null
fonte: documento Comune di Trani, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-13'
requisiti: []
note:
- 'La manifestazione di interesse è rivolta a soggetti del privato sociale (organizzazioni con sede legale nel territorio
  del Servizio Sociale di Trani) che vogliono stipulare una convenzione per gestire il doposcuola: non è un bando a cui partecipano
  persone.'
- I destinatari finali del servizio sono minori di 6-14 anni residenti o legalmente soggiornanti a Trani, ma non presentano
  domanda con questo avviso.
- 'Termine: ore 12:00 del quindicesimo giorno dalla pubblicazione all''Albo pretorio, data non indicata nel testo.'
