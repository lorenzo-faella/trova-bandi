titolo: Contributo per la gestione dei nidi - Anno educativo 2025/2026 Contributi ai soggetti che gestiscono nidi d'infanzia,
  per contenere le rette a carico delle famiglie.
ente: Regione Autonoma Friuli Venezia Giulia
link: https://www.regione.fvg.it/rafvg/cms/RAFVG/famiglia-casa/politiche-famiglia/FOGLIA66/
apertura: '2026-02-01'
chiusura: '2026-02-28'
