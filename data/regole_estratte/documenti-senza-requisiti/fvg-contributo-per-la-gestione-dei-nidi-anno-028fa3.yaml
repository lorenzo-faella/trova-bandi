requisiti: []
note:
- 'Il bando è rivolto solo ai gestori pubblici, privati e del privato sociale di nidi d''infanzia accreditati (e ai soggetti
  da loro delegati), non alle famiglie: il contributo serve a contenere le rette, ma il beneficiario è il gestore.'
- 'Termini: domanda dal 01 al 28 febbraio 2026 tramite Istanze OnLine (IOL), pena esclusione. Il regolamento (art. 7) prevede
  in via generale la finestra dal 1° maggio al 31 luglio di ogni anno, ma la pagina web indica la novità di febbraio 2026.'
