note:
- 'Beneficiari dell''avviso sono solo gli Enti del Terzo Settore iscritti al RUNTS (o imprese sociali) già affidatari di beni
  confiscati di proprietà di un Comune calabrese: le persone non presentano domanda, per questo non si estraggono requisiti.'
- Le persone (disoccupati, persone con disabilità, stranieri, soggetti svantaggiati, vittime di usura e racket, residenti
  o domiciliati in Calabria) beneficiano solo in via indiretta dei servizi erogati dagli enti.
- Le sezioni ricevute non indicano il periodo per presentare le domande.
