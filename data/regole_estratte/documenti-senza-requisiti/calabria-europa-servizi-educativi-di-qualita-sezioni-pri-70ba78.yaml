note:
- 'La domanda di sovvenzione la presentano solo i soggetti gestori delle Sezioni Primavera (Comuni e altri enti pubblici,
  istituzioni scolastiche statali, gestori privati), non le famiglie: per questo non si estraggono requisiti.'
- Le famiglie beneficiano in modo indiretto (servizio gratuito) se il bambino risiede in Calabria, è iscritto e frequenta
  una Sezione Primavera autorizzata e accreditata e il nucleo ha ISEE minorenni non superiore a 40.000 euro; sono condizioni
  che verifica il gestore, non una domanda della famiglia.
- Lo sportello apre alle ore 9:00 di una data lasciata in bianco nel documento e chiude alle ore 16:00 del 31 dicembre 2028;
  le domande valgono per ciascun anno educativo 2026/2027, 2027/2028 e 2028/2029.
