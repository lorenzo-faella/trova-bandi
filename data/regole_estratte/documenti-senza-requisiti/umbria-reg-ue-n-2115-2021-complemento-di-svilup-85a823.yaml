note:
- 'L''avviso (intervento SRD07, Azione 4, realizzazione, adeguamento e ampliamento di infrastrutture turistiche) è rivolto
  a ''Soggetti pubblici o privati, in forma singola o associata'' che realizzano investimenti in infrastrutture turistiche
  nel territorio regionale umbro: si tratta di enti e soggetti che presentano progetti di investimento, non di un beneficio
  per persone fisiche in quanto tali. Per questo non sono stati estratti requisiti del profilo persona.'
- 'Se si volesse includere comunque il privato cittadino, i requisiti sarebbero tutti non modellabili: realizzazione di un
  intervento ammissibile in Umbria (per Perugia e Terni solo nelle aree eleggibili della DGR 11 del 10.01.2024), lavori non
  iniziati, disponibilità del terreno o immobile.'
- Le modalità e gli altri requisiti soggettivi sono rinviati alle 'Disposizioni comuni agli Avvisi pubblici CSR 2023/2027'
  (DD 650 del 17.06.2026), non ricevute.
- 'Scadenza per le domande di sostegno: 30 ottobre 2026; data di apertura non indicata nelle parti ricevute.'
