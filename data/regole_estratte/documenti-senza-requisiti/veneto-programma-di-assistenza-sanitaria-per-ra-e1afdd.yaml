titolo: Programma di assistenza sanitaria per ragioni umanitarie presso le Aziende e gli Enti del Servizio Socio-Sanitario
  Regionale del Veneto - anno 2026. Legge n. 449/1997, art. 32, comma 15.
ente: Regione del Veneto
link: https://bandi.regione.veneto.it/Public/Dettaglio?idAtto=13141
apertura: null
chiusura: '2026-12-31'
fonte: documento Regione del Veneto, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti: []
note:
- 'La richiesta di intervento sanitario può essere presentata solo da un Ente, un''Associazione senza scopo di lucro o un
  Ente del Terzo Settore con sede in Veneto: le persone non fanno domanda direttamente, quindi non si estraggono requisiti.'
- 'I beneficiari finali sono persone che vivono fuori dall''UE e non sono in Italia (cittadinanza e residenza extra UE, condizioni
  economiche disagiate, nessun parente entro il quarto grado residente in Italia): il servizio, rivolto a chi risiede in Italia,
  non li raggiunge.'
- Le richieste si presentano dal giorno successivo alla pubblicazione sul BUR della delibera di approvazione del Programma
  (data non indicata nel testo; lo scadenzario riporta pubblicazione 30/06/2026) ed entro il termine perentorio del 31/12/2026.
