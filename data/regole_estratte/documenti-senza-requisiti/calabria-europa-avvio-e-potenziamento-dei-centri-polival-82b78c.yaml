note:
- L'avviso è rivolto agli Ambiti Territoriali Sociali (per il tramite dei Comuni capofila), che sono gli unici beneficiari
  e presentano le proposte; gli ETS sono partner, non beneficiari. Le persone non fanno domanda all'avviso.
- 'I destinatari finali dei Centri sono persone residenti in Calabria, con disturbo dello spettro autistico, di età tra 16
  e 40 anni, con accesso subordinato a valutazione multidimensionale (UVMD) e PAI o Progetto di Vita: non sono requisiti per
  chiedere il contributo dell''avviso.'
- 'Le proposte si presentano dal giorno successivo alla pubblicazione sul BURC fino al trentesimo giorno: il documento non
  riporta la data di pubblicazione, quindi apertura e chiusura restano null.'
