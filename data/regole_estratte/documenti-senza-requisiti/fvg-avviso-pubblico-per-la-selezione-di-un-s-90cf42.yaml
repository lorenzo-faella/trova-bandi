id: fvg-avviso-pubblico-per-la-selezione-di-un-s-90cf42
titolo: Avviso pubblico per la selezione di un soggetto per la realizzazione di percorsi formativi finalizzati all'apprendimento
  delle tecniche di lavorazione del merletto a fuselli per l’anno formativo 2025-2026 L'Avviso disciplina la presentazione,
  la selezione e il finanziamento di un soggetto che proponga un’offerta formativa costituita da un numero minimo di 14 (quattordici)
  fino a un numero massimo di 16 (sedici) percorsi specifici finalizzati all’apprendimento delle tecniche di lavorazione del
  merletto a fuselli.
ente: Regione Autonoma Friuli Venezia Giulia
link: https://www.regione.fvg.it/rafvg/cms/RAFVG/cultura-sport/patrimonio-culturale/FOGLIA62/
apertura: null
chiusura: null
fonte: documento Regione Autonoma Friuli Venezia Giulia, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti: []
note:
- 'L''avviso seleziona un ente di formazione accreditato (soggetto pubblico non territoriale o privato senza scopo di lucro)
  che realizzi i corsi di merletto a fuselli: il finanziamento va all''ente, non alle persone.'
- I corsi sono gratuiti e destinati a persone residenti e non residenti in Friuli Venezia Giulia in età lavorativa o pensionabile
  (la pagina web dice 'pensionate o in età pensionabile'), oltre a minori fino a 18 anni tramite partenariati con le scuole.
- Le sezioni ricevute non riportano le date di presentazione delle domande (Capo IV non incluso).
