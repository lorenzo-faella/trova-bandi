id: fvg-avviso-pubblico-per-la-selezione-di-prog-40bd74
titolo: Avviso pubblico per la selezione di progetti di ricerca congiunti nei settori del calcolo quantistico e della comunicazione
  quantistica Incentivi per la realizzazione di progetti di ricerca fondamentale, ricerca industriale e sviluppo sperimentale
  nel settore del calcolo quantistico (Dispositivi per il calcolo quantistico, Algoritmi quantistici per la computazione e
  le simulazioni quantistiche, Simulazione di circuiti quantistici) e della comunicazione quantistica (Algoritmi di crittografia
  per reti sicure, Protocolli innovativi per la comunicazione quantistica, Reti di seconda generazione).
ente: Regione Autonoma Friuli Venezia Giulia
link: https://www.regione.fvg.it/rafvg/cms/RAFVG/ricerca/fare-ricerca/FOGLIA29/
apertura: '2025-09-08'
chiusura: '2025-09-30'
fonte: documento Regione Autonoma Friuli Venezia Giulia, estratto con LLM (Claude Code, claude-opus-5-5), non rivisto
pubblico: persone
ultimo_controllo: '2026-11-20'
requisiti: []
note:
- 'L''avviso è rivolto a Università, Organismi di Ricerca pubblici e Società di interesse nazionale insediati in regione,
  riuniti in partenariati di almeno tre soggetti: non è rivolto a persone fisiche.'
- Domande dall'8 settembre 2025 al 30 settembre 2025.
