note:
- 'L''avviso è rivolto solo agli organismi di formazione accreditati (ambito IeFP, con requisiti aggiuntivi Apprendistato
  e Svantaggio), che candidano le operazioni in partenariato con imprese: le persone non fanno domanda.'
- I destinatari finali sono giovani iscritti a percorsi quinquennali di istruzione secondaria di secondo grado, soggetti al
  diritto-dovere, senza qualifica né diploma, che hanno assolto l'obbligo di istruzione e frequentato almeno due anni; non
  presentano domanda in questo avviso.
- Presentazione a sportello con scadenze intermedie; apertura 15/12/2025 ore 14:00, scadenza finale ore 12 del 28/01/2027.
