note:
- 'L''avviso è rivolto ai datori di lavoro privati con sede operativa in Sardegna, che chiedono il contributo per assumere
  o ospitare in tirocinio persone con disabilità: la persona con disabilità è destinataria dell''intervento ma non presenta
  la domanda né riceve il contributo.'
- Per i destinatari il bando richiede la disabilità ai sensi dell'art. 1 della L. 68/99 e l'iscrizione (o i requisiti per
  l'iscrizione) alle liste del collocamento mirato della Regione Sardegna, con assunzione o trasformazione dal 22 maggio 2024.
- 'Domande a sportello dal 17 marzo 2025 fino a esaurimento delle risorse: nessuna data di chiusura indicata.'
