titolo: '“VALORE LAVORO - AVVISO PUBBLICO PER LA REALIZZAZIONE DI AZIONI DI INSERIMENTO LAVORATIVO DI PERSONE CON DISABILITÀ”
  P.R. FSE + Sardegna 2021/2027 - Priorità 3 “Inclusione e lotta alla povertà” - O.S. h): ESO4.8: “Incentivare l''inclusione
  attiva, per promuovere le pari opportunità, la non discriminazione e la partecipazione attiva, e migliorare l''occupabilità,
  in particolare dei gruppi svantaggiati” – Settore di intervento 153. Percorsi di integrazione e reinserimento nel mondo
  del lavoro per i soggetti svantaggiati. D.G.R. n. 14/31 del 22.05.2024'
ente: ASPAL - Agenzia sarda per le politiche attive del lavoro
