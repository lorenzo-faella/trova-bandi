note:
- 'L''avviso assegna contributi a soggetti proponenti progetti di produzione di spettacolo dal vivo (associazioni, fondazioni,
  cooperative, imprese, con domanda del legale rappresentante): è rivolto a organizzazioni, non a persone.'
- Le domande andavano presentate entro le ore 16 del 3 giugno 2025 (scadenza prorogata con decreto 11651 del 30 maggio 2025);
  la data di apertura non è indicata (l'avviso è pubblicato sul BURT n. 18 del 30 aprile 2025).
- La pagina riporta anche la graduatoria 2025 e le modalità di rendicontazione entro il 15 gennaio 2026, che non sono requisiti
  di accesso.
