note:
- 'La domanda è rivolta ai soggetti erogatori di servizi al lavoro e di corsi di formazione (enti), che chiedono l''ammissione
  all''elenco: non è un bando a cui le persone fanno domanda.'
- I destinatari finali dei servizi sono persone con disabilità iscritte alle liste della L. n. 68/99, ma la pagina non dice
  come la persona ottiene il voucher né altri requisiti a suo carico.
- Apertura e chiusura si riferiscono agli sportelli mensili per gli enti (dal 1° al 10° giorno di ogni mese, da febbraio a
  dicembre 2026, fino al 10/12/2026); il rilascio dei voucher va dal 01/03/2026 al 31/05/2027.
