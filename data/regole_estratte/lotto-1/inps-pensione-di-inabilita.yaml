id: inps-pensione-di-inabilita
titolo: Pensione di inabilità
ente: INPS
link: https://www.inps.it/it/it/dettaglio-scheda.it.schede-servizio-strumento.schede-servizi.pensione-di-inabilit--50297.pensione-di-inabilit-.html
apertura: null
chiusura: null
fonte: scheda INPS, estratta con LLM (Claude Code, claude-opus-5-5), non rivista
pubblico: persone
ultimo_controllo: '2026-11-18'
requisiti:
- campo: disabile
  operatore: vero
  fonte: scheda INPS, Domanda
  citazione: a causa di infermità o difetto fisico o mentale
- non_modellabile: 'Assoluta e permanente impossibilità di svolgere qualsiasi attività lavorativa, valutata dalla Commissione
    Medica Legale dell''INPS: il vocabolario ha solo disabilità e percentuale di invalidità.'
  fonte: scheda INPS, Domanda
  citazione: La pensione di inabilità viene concessa in presenza di assoluta e permanente impossibilità di svolgere qualsiasi
    attività lavorativa
- non_modellabile: 'Almeno 260 contributi settimanali (cinque anni), di cui 156 nel quinquennio precedente la domanda, come
    lavoratore dipendente, autonomo o iscritto alla Gestione Separata: il campo disponibile conta solo le settimane degli
    ultimi 4 anni.'
  fonte: scheda INPS, Domanda
  citazione: di almeno 260 contributi settimanali (cinque anni di contribuzione) di cui 156 (tre anni di contribuzione) nel
    quinquennio precedente la data di presentazione della domanda
- non_modellabile: 'Cessazione di qualsiasi attività lavorativa, cancellazione da elenchi anagrafici degli operai agricoli,
    elenchi dei lavoratori autonomi e albi professionali, rinuncia ai trattamenti di disoccupazione e sostitutivi della retribuzione:
    mancano i campi.'
  fonte: scheda INPS, Domanda
  citazione: la cessazione di qualsiasi tipo di attività lavorativa;
note:
- La pensione privilegiata di inabilità, per i soli iscritti all'AGO dei lavoratori dipendenti con inabilità dovuta al servizio,
  è una variante con condizioni proprie, non modellata come requisito separato.
