id: inps-pensione-di-vecchiaia
titolo: Pensione di vecchiaia
ente: INPS
link: https://www.inps.it/it/it/dettaglio-scheda.it.schede-servizio-strumento.schede-servizi.pensione-di-vecchiaia.html
apertura: null
chiusura: null
fonte: scheda INPS, estratta con LLM (Claude Code, claude-opus-5-5), non rivista
pubblico: persone
ultimo_controllo: '2026-11-18'
requisiti:
- non_modellabile: 'Iscrizione all''Assicurazione Generale Obbligatoria (FPLD o gestioni speciali dei lavoratori autonomi),
    alla Gestione Separata o alle forme esclusive e sostitutive dell''AGO: manca il campo.'
  fonte: scheda INPS, A chi è rivolto
  citazione: agli iscritti alla Gestione Separata e ai lavoratori iscritti alle forme assicurative esclusive e sostitutive
- almeno_uno_di:
  - tutti_di:
    - campo: eta
      operatore: '>='
      valore: 67
      citazione: requisito anagrafico di 67 anni per il 2026
    - non_modellabile: 'Almeno 20 anni di contributi (15 in deroga per alcune categorie ex d.lgs. 503/1992); per chi ha contributi
        solo dal 1996 anche importo della pensione pari all''assegno sociale: manca il campo sugli anni di contribuzione.'
    citazione: requisito contributivo di almeno 20 anni
  - tutti_di:
    - campo: eta
      operatore: '>='
      valore: 71
    - non_modellabile: 'Primo accredito contributivo dal 1° gennaio 1996 e almeno cinque anni di contribuzione effettiva:
        manca il campo.'
    citazione: al compimento dei 71 anni di età per il 2026
  - tutti_di:
    - campo: percentuale_invalidita
      operatore: '>='
      valore: 80
    - campo: eta
      operatore: '>='
      valore: 56
    - non_modellabile: 'Lavoratori dipendenti iscritti all''AGO con invalidità riconosciuta dall''INPS: età di 56 anni per
        le donne e 61 per gli uomini nel 2026, con finestra mobile di 12 mesi; manca il sesso e il requisito contributivo.'
    citazione: donne 56 anni, uomini 61 anni per il 2026
  - tutti_di:
    - campo: eta
      operatore: '>='
      valore: 66
    - non_modellabile: 'Addetti ad attività gravose o particolarmente faticose e pesanti: 66 anni e 7 mesi (o 67 anni) con
        almeno 30 anni di contributi; mancano i campi su mansioni e contributi e l''età in mesi.'
    citazione: requisito anagrafico di 66 anni e 7 mesi di età
  fonte: scheda INPS, Domanda
  citazione: è necessario essere in possesso dei seguenti requisiti contributivi e anagrafici
- non_modellabile: 'Cessazione del rapporto di lavoro dipendente (non richiesta per autonomi e parasubordinati): è una condizione
    alla decorrenza che il vocabolario non distingue.'
  fonte: scheda INPS, Domanda
  citazione: è richiesta la cessazione del rapporto di lavoro dipendente
note:
- I requisiti anagrafici sono quelli del 2026; salgono a 67 anni e un mese nel 2027 e 67 anni e 3 mesi nel 2028.
- 'Le soglie di età 56 e 66 nei percorsi per invalidi e lavori gravosi sono solo minimi necessari: il resto del requisito
  resta da verificare.'
