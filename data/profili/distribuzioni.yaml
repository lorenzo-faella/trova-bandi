# Distribuzioni per generare imprese fittizie (pipeline/profili.py).
# Sono APPROSSIMAZIONI dichiarate, non dati ufficiali: servono a far somigliare la popolazione sintetica
# a quella reale abbastanza da misurare il questionario. Da sostituire con il registro ISTAT ASIA.

# Forma del soggetto (somma 1).
forma:
  impresa: 0.86
  professionista: 0.08
  da_costituire: 0.03
  cooperativa: 0.02
  consorzio: 0.005
  rete: 0.005

# Caratteristiche indipendenti tra loro. Fonte indicativa: Unioncamere (imprese femminili ~22%,
# giovanili ~8%), registro startup innovative (~14.000 su ~5 milioni di imprese).
caratteristiche:
  femminile: 0.22
  giovanile: 0.08
  innovativa: 0.003

# Solo per impresa, cooperativa, consorzio, rete. Fonte: ISTAT, struttura delle imprese (ordine di grandezza).
dimensione:
  Microimpresa: 0.95
  Piccola Impresa: 0.043
  Media Impresa: 0.006
  Grande Impresa: 0.001

# Proxy: popolazione residente in milioni (ISTAT, arrotondata). Il comune è poi scelto uniformemente
# tra i comuni ISTAT della regione: sovrastima i comuni piccoli.
regione:
  Lombardia: 10.0
  Lazio: 5.7
  Campania: 5.6
  Veneto: 4.85
  Sicilia: 4.8
  Emilia-Romagna: 4.45
  Piemonte: 4.25
  Puglia: 3.9
  Toscana: 3.65
  Calabria: 1.85
  Sardegna: 1.55
  Liguria: 1.5
  Marche: 1.5
  Abruzzo: 1.25
  Friuli-Venezia Giulia: 1.2
  Trentino-Alto Adige/Südtirol: 1.1
  Umbria: 0.85
  Basilicata: 0.55
  Molise: 0.3
  Valle d'Aosta/Vallée d'Aoste: 0.12

# Pesi dei settori (vengono normalizzati) e divisioni ATECO di ciascuno.
# La corrispondenza settore -> divisioni l'abbiamo scritta noi: il portale non la pubblica.
settori:
  Commercio: {peso: 0.24, divisioni: ["45", "46", "47"]}
  Altri servizi: {peso: 0.20, divisioni: ["64", "66", "68", "69", "70", "71", "73", "74", "77", "78", "81", "82", "85", "95", "96"]}
  Edilizia: {peso: 0.13, divisioni: ["41", "42", "43"]}
  Agricoltura, silvicoltura e pesca: {peso: 0.12, divisioni: ["01", "02", "03"]}
  Ristorazione: {peso: 0.06, divisioni: ["56"]}
  ICT: {peso: 0.03, divisioni: ["58", "61", "62", "63"]}
  Servizi di trasporto: {peso: 0.03, divisioni: ["49", "50", "51", "52", "53"]}
  Salute: {peso: 0.02, divisioni: ["86", "87", "88"]}
  Cultura: {peso: 0.02, divisioni: ["59", "60", "90", "91"]}
  Agroalimentare: {peso: 0.015, divisioni: ["10", "11"]}
  Moda e Tessile: {peso: 0.015, divisioni: ["13", "14", "15"]}
  Metallurgia: {peso: 0.015, divisioni: ["24", "25"]}
  Alberghiero: {peso: 0.01, divisioni: ["55"]}
  Turismo: {peso: 0.01, divisioni: ["79"]}
  Mobili, Legno e Carta: {peso: 0.01, divisioni: ["16", "17", "18", "31"]}
  Meccanica: {peso: 0.01, divisioni: ["28", "33"]}
  Fornitura Energia, Acqua e gestione Rifiuti: {peso: 0.007, divisioni: ["35", "36", "37", "38", "39"]}
  Chimica e Farmaceutica: {peso: 0.005, divisioni: ["19", "20", "21", "22"]}
  Elettronica: {peso: 0.005, divisioni: ["26", "27"]}
  Autoveicoli e altri mezzi di trasporto: {peso: 0.003, divisioni: ["29", "30"]}

# Quota di imprese artigiane (Confartigianato: ~1,3 milioni su ~5): aggiungono il settore "Artigianato".
artigiana: 0.25

# Probabilità che la sede sia in ciascun ambito, indipendenti tra loro e dalla regione.
# Semplificazione forte: in realtà dipendono dal comune (vedi docs/decisioni.md).
ambiti:
  Aree interne: 0.25
  Zone sismiche: 0.10
  ZES: 0.15
  Emergenza climatica: 0.05
  Zone franche: 0.01
