# Profili di esempio (docs/contesto.md, idea 2; decisione 104): con un clic la demo riempie il questionario e mostra gli
# esiti. Sono esempi inventati, non casi reali. I campi sono quelli di data/domande_persone.yaml; il primo componente del
# nucleo è chi fa domanda ("Tu"). Ogni profilo risponde a tutto il questionario, e `conferme` sono le sue risposte vere
# alle verifiche finali (decisione 93): per questo alcuni aiuti risultano subito "ti spetta". Le chiavi sono
# "<id della regola>#<indice del requisito>". Un profilo con `ramo: imprese` apre il ramo delle imprese.
# `faccina` e `colore` servono al grafico dei percorsi della pagina iniziale.
# Si controllano in tests/test_web.py (risposte valide, nessuna domanda aperta, conferme ancora valide, esiti diversi).
